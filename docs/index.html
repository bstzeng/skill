X\nbelt app run falai/flux-dev-lora --input '{\"prompt\": \"a cat astronaut in space\"}'\n```\n\n\n## 可用模型\n\n| 模型 | App ID | 最適合 |\n|------|--------|--------|\n| **GPT-Image-2** | `openai/gpt-image-2` | 文字轉圖片、編輯、局部重繪 |\n| FLUX Dev LoRA | `falai/flux-dev-lora` | 高品質，可自訂風格 |\n| FLUX.2 Klein LoRA | `falai/flux-2-klein-lora` | 快速，支援 LoRA（4B/9B） |\n| **P-Image** | `pruna/p-image` | 快速、經濟，多種長寬比 |\n| **P-Image-LoRA** | `pruna/p-image-lora` | 快速，內建 LoRA 風格 |\n| **P-Image-Edit** | `pruna/p-image-edit` | 快速圖片編輯 |\n| Gemini 3 Pro | `google/gemini-3-pro-image-preview` | Google 最新模型 |\n| Gemini 2.5 Flash | `google/gemini-2-5-flash-image` | 快速的 Google 模型 |\n| Grok Imagine | `xai/grok-imagine-image` | xAI 的模型，多種長寬比 |\n| Seedream 4.5 | `bytedance/seedream-4-5` | 2K–4K 電影級品質 |\n| Seedream 4.0 | `bytedance/seedream-4-0` | 高品質 2K–4K |\n| Seedream 3.0 | `bytedance/seedream-3-0-t2i` | 精準的文字渲染 |\n| Reve | `falai/reve` | 自然語言編輯、文字渲染 |\n| ImagineArt 1.5 Pro | `falai/imagine-art-1-5-pro-preview` | 超高擬真 4K |\n| FLUX Klein 4B | `pruna/flux-klein-4b` | 超便宜（每張 $0.0001） |\n| Topaz Upscaler | `falai/topaz-image-upscaler` | 專業級放大 |\n\n## 瀏覽所有圖片應用\n\n```bash\nbelt app list --category image\n```\n\n## 範例\n\n### GPT-Image-2\n\n```bash\nbelt app run openai/gpt-image-2 --input '{\n  \"prompt\": \"professional product photo of sneakers, studio lighting\",\n  \"quality\": \"high\"\n}'\n```\n\n### GPT-Image-2 編輯\n\n```bash\nbelt app run openai/gpt-image-2 --input '{\n  \"prompt\": \"change the background to a beach at sunset\",\n  \"images\": [\"https://your-image.jpg\"]\n}'\n```\n\n### 用 FLUX 做文字轉圖片\n\n```bash\nbelt app run falai/flux-dev-lora --input '{\n  \"prompt\": \"professional product photo of a coffee mug, studio lighting\"\n}'\n```\n\n### 用 FLUX Klein 快速生成\n\n```bash\nbelt app run falai/flux-2-klein-lora --input '{\"prompt\": \"sunset over mountains\"}'\n```\n\n### Google Gemini 3 Pro\n\n```bash\nbelt app run google/gemini-3-pro-image-preview --input '{\n  \"prompt\": \"photorealistic landscape with mountains and lake\"\n}'\n```\n\n### Grok Imagine\n\n```bash\nbelt app run xai/grok-imagine-image --input '{\n  \"prompt\": \"cyberpunk city at night\",\n  \"aspect_ratio\": \"16:9\"\n}'\n```\n\n### Reve（含文字渲染）\n\n```bash\nbelt app run falai/reve --input '{\n  \"prompt\": \"A poster that says HELLO WORLD in bold letters\"\n}'\n```\n\n### Seedream 4.5（4K 品質）\n\n```bash\nbelt app run bytedance/seedream-4-5 --input '{\n  \"prompt\": \"cinematic portrait of a woman, golden hour lighting\"\n}'\n```\n\n### 圖片放大\n\n```bash\nbelt app run falai/topaz-image-upscaler --input '{\"image_url\": \"https://...\"}'\n```\n\n### 拼接多張圖片\n\n```bash\nbelt app run infsh/stitch-images --input '{\n  \"images\": [\"https://img1.jpg\", \"https://img2.jpg\"],\n  \"direction\": \"horizontal\"\n}'\n```\n\n## 相關技能\n\n```bash\n# Full platform skill (all apps)\nnpx skills add inference-sh/skills@infsh-cli\n\n# Pruna P-Image (fast & economical)\nnpx skills add inference-sh/skills@p-image\n\n# GPT-Image-2 (OpenAI)\nnpx skills add inference-sh/skills@gpt-image\n\n# FLUX-specific skill\nnpx skills add inference-sh/skills@flux-image\n\n# Upscaling & enhancement\nnpx skills add inference-sh/skills@image-upscaling\n\n# Background removal\nnpx skills add inference-sh/skills@background-removal\n\n# Video generation\nnpx skills add inference-sh/skills@ai-video-generation\n\n# AI avatars from images\nnpx skills add inference-sh/skills@ai-avatar-video\n```\n\n瀏覽所有應用：`belt app list`\n\n## 文件\n\n- [執行應用](https://inference.sh/docs/apps/running) - 如何透過 CLI 執行應用\n- [圖片生成範例](https://inference.sh/docs/examples/image-generation) - 完整的圖片生成指南\n- [應用總覽](https://inference.sh/docs/apps/overview) - 了解應用生態系"}, {"rank": 19, "slug": "teach", "title": "個人家教", "category": "溝通與學習", "tags": ["學習", "教學", "間隔重複", "知識管理", "Matt Pocock"], "summary": "讓代理在目前資料夾建立一個跨多次對話的「教學工作區」：記錄你的學習動機（MISSION.md）、蒐集可信資源、產出精美的 HTML 單元課程與速查表，並依學習紀錄判斷你的近側發展區，循序漸進地教你任何新技能或概念。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill teach`\n- 建一個空資料夾，在裡面輸入 `/teach 我想學 Rust 的所有權概念`（或瑜伽、樂理……任何主題）\n- 第一次會先問你「為什麼想學」寫成 MISSION.md；之後每次 `/teach` 都會接續進度\n- 課程含測驗與即時回饋，並推薦可加入的社群以累積實戰智慧", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/productivity/teach/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/productivity/teach/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/teach", "skillssh_rank": 27, "installs": 882982, "license": "MIT", "redistributable": true, "description_en": "Teach the user a new skill or concept, within this workspace.", "description_zh": "在此工作區內教導使用者一項新技能或概念。", "original": "---\nname: teach\ndescription: Teach the user a new skill or concept, within this workspace.\ndisable-model-invocation: true\nargument-hint: \"What would you like to learn about?\"\n---\n\nThe user has asked you to teach them something. This is a stateful request - they intend to learn the topic over multiple sessions.\n\n## Teaching Workspace\n\nTreat the current directory as a teaching workspace. Workspace paths (`./lessons/` and the rest) resolve from the directory `/teach` was run in; only the `*-FORMAT.md` links resolve from this skill's folder. The state of their learning is captured in this directory in several files:\n\n- `MISSION.md`: A document capturing the _reason_ the user is interested in the topic. This should be used to ground all teaching. Use the format in [MISSION-FORMAT.md](./MISSION-FORMAT.md).\n- `./reference/*.html`: A directory of reference materials. These are the compressed learnings from the lessons - cheat sheets, reference algorithms, syntax, yoga poses, glossaries. They are the raw units of learning. They should be beautiful documents which print out well, and are designed for quick reference.\n- `RESOURCES.md`: A list of resources which can be explored to ground your teaching in contextual knowledge, or to acquire knowledge and wisdom. Use the format in [RESOURCES-FORMAT.md](./RESOURCES-FORMAT.md).\n- `./learning-records/*.md`: A directory of learning records, which capture what the user has learned. These are loosely equivalent to architectural decision records in software development - they capture non-obvious lessons and key insights that may need to be revised later, or drive future sessions. These should be used to calculate the zone of proximal development. They are titled `0001-<dash-case-name>.md`, where the number increments each time. Use the format in [LEARNING-RECORD-FORMAT.md](./LEARNING-RECORD-FORMAT.md).\n- `./lessons/*.html`: A directory of lessons. A **lesson** is a single, self-contained HTML output that teaches one tightly-scoped thing tied to the mission. This is the primary unit of teaching in this workspace.\n- `./assets/*`: Reusable **components** shared across lessons. See [Assets](#assets).\n- `NOTES.md`: A scratchpad for you to jot down user preferences, or working notes.\n\n## Philosophy\n\nTo learn at a deep level, the user needs three things:\n\n- **Knowledge**, captured from high-quality, high-trust resources\n- **Skills**, acquired through highly-relevant interactive lessons devised by you, based on the knowledge\n- **Wisdom**, which comes from interacting with other learners and practitioners\n\nBefore the `RESOURCES.md` is well-populated, your focus should be to find high-quality resources which will help the user acquire knowledge. Never trust your parametric knowledge.\n\nSome topics may require more skills than knowledge. Learning more about theoretical physics might be more knowledge-based. For yoga, more skills-based.\n\n### Fluency vs Storage Strength\n\nYou should be careful to split between two types of learning:\n\n- **Fluency strength**: in-the-moment retrieval of knowledge\n- **Storage strength**: long-term retention of knowledge\n\nFluency can give the user an illusory sense of mastery, but storage strength is the real goal. Try to design lessons which build long-term retention by desirable difficulty:\n\n- Using retrieval practice (recall from memory)\n- Spacing (distributing practice over time)\n- Interleaving (mixing up different but related topics in practice - for skills practice only)\n\n## Lessons\n\nA lesson is the main thing you produce: the unit in which knowledge and skills reach the user. Each lesson is one self-contained HTML file, saved to `./lessons/` and titled `0001-<dash-case-name>.html` where the number increments each time.\n\nA lesson should be **beautiful**, with clean, readable typography and layout, since the user will return to these later to review. Think Tufte.\n\nThe lesson should be short, and completable very quickly. Learners' working memory is very small, and we need to stay within it. But each lesson should give the user a single tangible win that they can build on. It should be directly tied to the mission, and should be in the user's zone of proximal development.\n\nIf possible, open the lesson file for the user by running a CLI command.\n\nEach lesson should link via HTML anchors to other lessons and reference documents.\n\nEach lesson should recommend a primary source for the user to read or watch. This should be the most high-quality, high-trust resource you found on the topic.\n\nEach lesson should contain a reminder to ask followup questions to the agent. The agent is their teacher, and can assist with anything that's unclear.\n\n## Assets\n\nLessons are built from reusable **components**, stored in `./assets/`: stylesheets, quiz widgets, simulators, diagram helpers, and anything else a second lesson could reuse.\n\nReuse is the default, not the exception. Before authoring a lesson, read `./assets/` and build from the components already there. When a lesson needs something new and reusable, write it as a component in `./assets/` and link to it; never inline code a future lesson would duplicate.\n\nA shared stylesheet is the first component every workspace earns: every lesson links it, so the lessons look like one consistent course rather than a pile of one-offs. As the workspace grows, so should the component library.\n\n## The Mission\n\nEvery lesson should be tied into the mission - the reason that the user is interested in learning about the topic.\n\nIf the user is unclear about the mission, or the `MISSION.md` is not populated, your first job should be to question the user on why they want to learn this.\n\nFailing to understand the mission will mean knowledge acquisition is not grounded in real-world goals. Lessons will feel too abstract. You will have no way of judging what the user should do next.\n\nMissions may change as the user develops more skills and knowledge. This is normal - make sure to update the `MISSION.md` and add a learning record to capture the change. Confirm with the user before changing the mission.\n\n## Zone Of Proximal Development\n\nEach lesson, the user should always feel as if they are being challenged 'just enough'.\n\nThe user may specify an exact thing they want to learn. If they don't, figure out their zone of proximal development by:\n\n- Reading their `learning-records`\n- Figuring out the right thing to teach them based on their mission\n- Teach the most relevant thing that fits in their zone of proximal development\n\n## Knowledge\n\nLessons should be designed around a skill the user is going to learn. The knowledge in the lesson should be only what's required to acquire that skill. You teach the knowledge first, then get the user to practice the skills via an interactive feedback loop.\n\nKnowledge should first be gathered from trusted resources. Use `RESOURCES.md` to keep track of them. Lessons should be littered with citations - links to external resources to back up any claim made. This increases the trustworthiness of the lesson.\n\nFor acquiring knowledge, difficulty is the enemy. It eats working memory you need for understanding.\n\n## Skills\n\nIf knowledge is all about acquisition, skills are about durability and flexibility. Make the knowledge stick.\n\nFor skill acquisition, difficulty is the tool. Effortful retrieval is what builds storage strength. Skills should be taught through interactive lessons. There are several tools at your disposal:\n\n- Interactive lessons, using quizzes and light in-browser tasks\n- Lessons which guide the user through a list of real-world steps to take (for instance, yoga poses)\n\nEach of these should be based on a **feedback loop**, where the user receives feedback on their performance. This feedback loop should be as tight as possible, giving feedback immediately - and ideally automatically.\n\nFor quizzes, each answer should be exactly the same number of words (and characters, if possible). Vary which position holds the correct answer across questions. Don't give the user any clues about the answer through formatting or order.\n\n## Acquiring Wisdom\n\nWisdom comes from true real-world interaction - testing your skills outside the learning environment.\n\nWhen the user asks a question that appears to require wisdom, your default posture should be to attempt to answer - but to ultimately delegate to a **community**.\n\nA community is a place (online or offline) where the user can test their skills in the real world. This might be a forum, a subreddit, a real-world class (budget permitting) or a local interest group.\n\nYou should attempt to find high-reputation communities the user can join. If the user expresses a preference that they don't want to join a community, respect it.\n\n## Reference Documents\n\nWhile creating lessons, you should also create reference documents. Lessons can reference these documents - they are useful for tracking raw units of knowledge useful across lessons.\n\nLessons will rarely be revisited later - reference documents will be. They should be the compressed essence of the lesson, in a format designed for quick reference.\n\nSome learning topics lend themselves to reference:\n\n- Syntax and code snippets for programming\n- Algorithms and flowcharts for processes\n- Yoga poses and sequences for yoga\n- Exercises and routines for fitness\n- Glossaries for any topic with its own nomenclature\n\nGlossaries, in particular, are an essential reference. Once one is created, it should be adhered to in every lesson.\n\n## `NOTES.md`\n\nThe user will sometimes express preferences of how they want to be taught, or things you should keep in mind. This is the place to record those preferences, so you can refer back to them when designing lessons or working with the user.\n", "translation": "---\nname: teach\ndescription: 在此工作區內教導使用者一項新技能或概念。\ndisable-model-invocation: true\nargument-hint: \"你想學什麼？\"\n---\n\n使用者請你教他們某樣東西。這是一個有狀態的請求——他們打算在多個 session 中學習這個主題。\n\n## 教學工作區\n\n把目前目錄視為教學工作區。工作區路徑（`./lessons/` 及其他）以執行 `/teach` 的目錄為基準解析；只有 `*-FORMAT.md` 連結以本技能的資料夾為基準解析。他們的學習狀態以數個檔案記錄在此目錄中：\n\n- `MISSION.md`：記錄使用者對這個主題感興趣之*原因*的文件。所有教學都應以此為基礎。格式見 [MISSION-FORMAT.md](./MISSION-FORMAT.md)。\n- `./reference/*.html`：參考資料目錄。這些是從課程中壓縮出來的學習成果——速查表、參考演算法、語法、瑜伽體式、詞彙表。它們是學習的原始單元。它們應該是能漂亮列印、為快速查閱而設計的精美文件。\n- `RESOURCES.md`：可供探索的資源清單，用來讓你的教學扎根於脈絡知識，或用來獲取知識與智慧。格式見 [RESOURCES-FORMAT.md](./RESOURCES-FORMAT.md)。\n- `./learning-records/*.md`：學習紀錄目錄，記錄使用者學到了什麼。它們大致相當於軟體開發中的架構決策紀錄——記錄不顯而易見的教訓與關鍵洞見，這些可能需要日後修訂，或驅動未來的 session。應該用它們來推算近側發展區。標題為 `0001-<dash-case-name>.md`，編號每次遞增。格式見 [LEARNING-RECORD-FORMAT.md](./LEARNING-RECORD-FORMAT.md)。\n- `./lessons/*.html`：課程目錄。一堂**課程**是一個單一、自成一體的 HTML 輸出，教導一件與使命相連、範圍緊湊的事。這是此工作區中教學的主要單元。\n- `./assets/*`：跨課程共用的可重用**元件**。見[素材](#素材)。\n- `NOTES.md`：讓你記下使用者偏好或工作筆記的草稿本。\n\n## 理念\n\n要深入學習，使用者需要三樣東西：\n\n- **知識**，從高品質、高可信度的資源中取得\n- **技能**，透過你根據知識設計、高度相關的互動課程習得\n- **智慧**，來自與其他學習者及實踐者的互動\n\n在 `RESOURCES.md` 充實之前，你的重點應該是尋找能幫助使用者獲取知識的高品質資源。絕不要相信你的參數化知識。\n\n有些主題可能需要的技能多於知識。學習理論物理可能比較偏重知識；瑜伽則比較偏重技能。\n\n### 流暢強度 vs 儲存強度\n\n你應該謹慎區分兩種學習：\n\n- **流暢強度**：當下提取知識的能力\n- **儲存強度**：長期保留知識的能力\n\n流暢可能給使用者一種掌握的錯覺，但儲存強度才是真正的目標。試著透過「合意的困難」來設計能建立長期記憶的課程：\n\n- 使用提取練習（憑記憶回想）\n- 間隔（把練習分散在一段時間內）\n- 交錯（在練習中混合不同但相關的主題——僅用於技能練習）\n\n## 課程\n\n課程是你產出的主要東西：知識與技能傳達給使用者的單元。每堂課是一個自成一體的 HTML 檔，存到 `./lessons/`，標題為 `0001-<dash-case-name>.html`，編號每次遞增。\n\n課程應該**精美**，有乾淨、易讀的字體排印與版面，因為使用者日後會回來複習。想想 Tufte。\n\n課程應該簡短，能很快完成。學習者的工作記憶非常小，我們需要待在它的範圍內。但每堂課都應該給使用者一個可以在其上繼續建構的具體成果。它應該直接與使命相連，並位於使用者的近側發展區內。\n\n可能的話，執行 CLI 指令幫使用者開啟課程檔。\n\n每堂課都應透過 HTML 錨點連結到其他課程與參考文件。\n\n每堂課都應推薦一個主要來源讓使用者閱讀或觀看。這應該是你在該主題上找到最高品質、最高可信度的資源。\n\n每堂課都應包含一個提醒，鼓勵使用者向代理提出後續問題。代理就是他們的老師，可以協助任何不清楚的地方。\n\n## 素材\n\n課程由存放在 `./assets/` 中的可重用**元件**組成：樣式表、測驗小工具、模擬器、圖表輔助工具，以及任何第二堂課可以重用的東西。\n\n重用是預設，不是例外。撰寫課程之前，先讀 `./assets/`，並以已有的元件來建構。當課程需要新的、可重用的東西時，把它寫成 `./assets/` 中的元件並連結它；絕不要內嵌未來課程會重複的程式碼。\n\n共用樣式表是每個工作區第一個獲得的元件：每堂課都連結它，讓課程看起來像一門一致的課程，而不是一堆零散的單次作品。隨著工作區成長，元件庫也應該成長。\n\n## 使命（Mission）\n\n每堂課都應與使命相連——也就是使用者有興趣學習這個主題的原因。\n\n如果使用者對使命不清楚，或 `MISSION.md` 尚未填寫，你的首要任務就是詢問使用者為什麼想學這個。\n\n不了解使命，意味著知識獲取沒有扎根於真實世界的目標。課程會感覺太抽象。你將無從判斷使用者下一步該做什麼。\n\n隨著使用者發展出更多技能與知識，使命可能會改變。這是正常的——務必更新 `MISSION.md` 並新增一筆學習紀錄來記錄這個變化。改變使命前先與使用者確認。\n\n## 近側發展區\n\n每堂課，使用者都應該一直感覺受到「剛剛好」的挑戰。\n\n使用者可能會指定他們想學的確切內容。如果沒有，就透過以下方式找出他們的近側發展區：\n\n- 閱讀他們的 `learning-records`\n- 根據他們的使命判斷該教他們的正確內容\n- 教導最相關、且符合其近側發展區的內容\n\n## 知識\n\n課程應圍繞使用者將要學習的一項技能來設計。課程中的知識應該只包含習得該技能所需的部分。先教知識，然後讓使用者透過互動回饋循環練習技能。\n\n知識應該先從可信的資源中蒐集。用 `RESOURCES.md` 追蹤它們。課程中應該處處有引用——連結到外部資源以支持所做的任何主張。這能提高課程的可信度。\n\n對於獲取知識，困難是敵人。它會吃掉你理解所需的工作記憶。\n\n## 技能\n\n如果知識講的是獲取，技能講的就是耐久與靈活。讓知識留下來。\n\n對於技能習得，困難是工具。費力的提取正是建立儲存強度的方式。技能應該透過互動課程來教。你有幾種工具可用：\n\n- 使用測驗與瀏覽器內簡單任務的互動課程\n- 引導使用者完成一系列真實世界步驟的課程（例如瑜伽體式）\n\n這些都應該建立在**回饋循環**之上，讓使用者收到關於其表現的回饋。這個回饋循環應該盡可能緊湊，立即給予回饋——最好是自動的。\n\n對於測驗，每個選項的字數應該完全相同（可能的話字元數也相同）。在不同題目間變換正確答案的位置。不要透過格式或順序給使用者任何關於答案的線索。\n\n## 獲取智慧\n\n智慧來自真正的真實世界互動——在學習環境之外測試你的技能。\n\n當使用者問了一個似乎需要智慧的問題時，你的預設姿態應該是嘗試回答——但最終委託給一個**社群**。\n\n社群是一個使用者可以在真實世界中測試技能的地方（線上或線下）。可能是論壇、subreddit、實體課程（預算允許的話）或在地的興趣團體。\n\n你應該嘗試找到使用者可以加入的高聲譽社群。如果使用者表示不想加入社群，尊重這個偏好。\n\n## 參考文件\n\n在建立課程的同時，你也應該建立參考文件。課程可以引用這些文件——它們有助於追蹤跨課程有用的原始知識單元。\n\n課程日後很少會被重新造訪——參考文件則會。它們應該是課程壓縮後的精華，以為快速查閱而設計的格式呈現。\n\n有些學習主題很適合做成參考：\n\n- 程式設計的語法與程式碼片段\n- 流程的演算法與流程圖\n- 瑜伽的體式與序列\n- 健身的動作與課表\n- 任何有自己術語體系之主題的詞彙表\n\n尤其是詞彙表，是必備的參考。一旦建立，每堂課都應遵循它。\n\n## `NOTES.md`\n\n使用者有時會表達他們希望如何被教導的偏好，或你應該記住的事情。這裡就是記錄這些偏好的地方，讓你在設計課程或與使用者合作時可以回頭參考。"}, {"rank": 20, "slug": "diagnosing-bugs", "title": "疑難 Bug 診斷", "category": "程式品質與除錯", "tags": ["除錯", "效能", "重現", "回歸測試", "Matt Pocock"], "summary": "一套處理棘手 bug 與效能退化的六階段紀律：先建立「緊湊、會變紅」的回饋循環 → 重現並最小化 → 提出 3–5 個可證偽假設 → 一次改一個變數做插樁 → 先寫回歸測試再修 → 清理除錯痕跡。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill diagnosing-bugs`\n- 說「diagnose」「debug this」，或回報「某某壞了／一直報錯／變很慢」即會觸發\n- 代理沒有能重現 bug 的指令前不會開始猜原因；會把排序後的假設清單給你看，方便你用領域知識快速排除\n- 所有輸出中的機密資訊會自動以 `<REDACTED>` 遮蔽", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/engineering/diagnosing-bugs/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/diagnosing-bugs", "skillssh_rank": 29, "installs": 858093, "license": "MIT", "redistributable": true, "description_en": "Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.", "description_zh": "針對困難 bug 與效能退化的診斷循環。當使用者說「diagnose」/「debug this」，或回報某東西壞了/拋出錯誤/失敗/很慢時使用。", "original": "---\nname: diagnosing-bugs\ndescription: Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.\n---\n\n# Diagnosing Bugs\n\nA discipline for hard bugs. Skip phases only when explicitly justified.\n\nWhen exploring the codebase, read `GLOSSARY.md` (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching.\n\n## Redact\n\nThis skill has you show commands, outputs and captured artifacts. **Redact every secret first**: write `<REDACTED>` in its place. Build loops against env vars, so the credential stays in the environment rather than in what you show. Captured artifacts carry auth headers: quote only the lines that carry the signal.\n\nIf the redacted output is not enough to diagnose the bug, say so and ask the user.\n\n## Phase 1: Build a feedback loop\n\n**This is the skill.** Everything else is mechanical. If you have a **tight** pass/fail signal for the bug (one that goes red on _this_ bug), you will find the cause; bisection, hypothesis-testing, and instrumentation all just consume it. If you don't have one, no amount of staring at code will save you.\n\nSpend disproportionate effort here. **Be aggressive. Be creative. Refuse to give up.**\n\n### Ways to construct one, in roughly this order\n\n1. **Failing test** at whatever seam reaches the bug: unit, integration, e2e.\n2. **Curl / HTTP script** against a running dev server.\n3. **CLI invocation** with a fixture input, diffing stdout against a known-good snapshot.\n4. **Headless browser script** (Playwright / Puppeteer) that drives the UI and asserts on DOM/console/network.\n5. **Replay a captured trace.** Save a real network request / payload / event log to disk; replay it through the code path in isolation.\n6. **Throwaway harness.** Spin up a minimal subset of the system (one service, mocked deps) that exercises the bug code path with a single function call.\n7. **Property / fuzz loop.** If the bug is \"sometimes wrong output\", run 1000 random inputs and look for the failure mode.\n8. **Bisection harness.** If the bug appeared between two known states (commit, dataset, version), automate \"boot at state X, check, repeat\" so you can `git bisect run` it.\n9. **Differential loop.** Run the same input through old-version vs new-version (or two configs) and diff outputs.\n10. **HITL bash script.** Last resort. If a human must click, drive _them_ with `scripts/hitl-loop.template.sh` so the loop is still structured. Captured output feeds back to you.\n\nBuild the right feedback loop, and the bug is 90% fixed.\n\n### Tighten the loop\n\nTreat the loop as a product. Once you have _a_ loop, **tighten** it:\n\n- Can I make it faster? (Cache setup, skip unrelated init, narrow the test scope.)\n- Can I make the signal sharper? (Assert on the specific symptom, not \"didn't crash\".)\n- Can I make it more deterministic? (Pin time, seed RNG, isolate filesystem, freeze network.)\n\nA 30-second flaky loop is barely better than no loop; a 2-second deterministic one is tight, a debugging superpower.\n\n### Non-deterministic bugs\n\nThe goal is not a clean repro but a **higher reproduction rate**. Loop the trigger 100×, parallelise, add stress, narrow timing windows, inject sleeps. A 50%-flake bug is debuggable; 1% is not, so keep raising the rate until it's debuggable.\n\n### When you genuinely cannot build a loop\n\nStop and say so explicitly. List what you tried. Ask the user for: (a) access to whatever environment reproduces it, (b) a redacted captured artifact (HAR file, log dump, core dump, screen recording with timestamps), or (c) permission to add temporary production instrumentation. Do **not** proceed to hypothesise without a loop.\n\n### Completion criterion: a tight loop that goes red\n\nPhase 1 is done when the loop is **tight** and **red-capable**: you can name **one command** (a script path, a test invocation, a curl) that you have **already run at least once** (show the invocation and its output, redacted), and that is:\n\n- [ ] **Red-capable**: it drives the actual bug code path and asserts the **user's exact symptom**, so it can go red on this bug and green once fixed. Not \"runs without erroring\"; it must be able to _catch this specific bug_.\n- [ ] **Deterministic**: same verdict every run (flaky bugs: a pinned, high reproduction rate, per above).\n- [ ] **Fast**: seconds, not minutes.\n- [ ] **Agent-runnable**: you can run it unattended; a human in the loop only via `scripts/hitl-loop.template.sh`.\n\nIf you catch yourself reading code to build a theory before this command exists, **stop: jumping straight to a hypothesis is the exact failure this skill prevents.** No red-capable command, no Phase 2.\n\n## Phase 2: Reproduce + minimise\n\nRun the loop. Watch it go red as the bug appears.\n\nConfirm:\n\n- [ ] The loop produces the failure mode the **user** described, not a different failure that happens to be nearby. Wrong bug = wrong fix.\n- [ ] The failure is reproducible across multiple runs (or, for non-deterministic bugs, reproducible at a high enough rate to debug against).\n- [ ] You have captured the exact symptom (error message, wrong output, slow timing) so later phases can verify the fix actually addresses it.\n\n### Minimise\n\nOnce it's red, shrink the repro to the **smallest scenario that still goes red**. Cut inputs, callers, config, data, and steps **one at a time**, re-running the loop after each cut, and keep only what's load-bearing for the failure.\n\nWhy bother: a minimal repro shrinks the hypothesis space in Phase 3 (fewer moving parts left to suspect) and becomes the clean regression test in Phase 5.\n\nDone when **every remaining element is load-bearing**: removing any one of them makes the loop go green.\n\nDo not proceed until you have reproduced **and** minimised.\n\n## Phase 3: Hypothesise\n\nGenerate **3–5 ranked hypotheses** before testing any of them. Single-hypothesis generation anchors on the first plausible idea.\n\nEach hypothesis must be **falsifiable**: state the prediction it makes.\n\n> Format: \"If <X> is the cause, then <changing Y> will make the bug disappear / <changing Z> will make it worse.\"\n\nIf you cannot state the prediction, the hypothesis is a vibe: discard or sharpen it.\n\n**Show the ranked list to the user before testing.** They often have domain knowledge that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses they've already ruled out. Cheap checkpoint, big time saver. Don't block on it; proceed with your ranking if the user is AFK.\n\n## Phase 4: Instrument\n\nEach probe must map to a specific prediction from Phase 3. **Change one variable at a time.**\n\nTool preference:\n\n1. **Debugger / REPL inspection** if the env supports it. One breakpoint beats ten logs.\n2. **Targeted logs** at the boundaries that distinguish hypotheses.\n3. Never \"log everything and grep\".\n\n**Tag every debug log** with a unique prefix, e.g. `[DEBUG-a4f2]`. Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs die.\n\n**Perf branch.** For performance regressions, logs are usually wrong. Instead: establish a baseline measurement (timing harness, `performance.now()`, profiler, query plan), then bisect. Measure first, fix second.\n\n## Phase 5: Fix + regression test\n\nWrite the regression test **before the fix**, but only if there is a **correct seam** for it.\n\nA correct seam is one where the test exercises the **real bug pattern** as it occurs at the call site. If the only available seam is too shallow (single-caller test when the bug needs multiple callers, unit test that can't replicate the chain that triggered the bug), a regression test there gives false confidence.\n\n**If no correct seam exists, that itself is the finding.** Note it. The codebase architecture is preventing the bug from being locked down. Flag this for the next phase.\n\nIf a correct seam exists:\n\n1. Turn the minimised repro into a failing test at that seam.\n2. Watch it fail. If you forced the red by mutating code or a fixture, `diff` against a pristine copy to prove the mutation landed before you trust it.\n3. Apply the fix.\n4. Watch it pass.\n5. Re-run the Phase 1 feedback loop against the original (un-minimised) scenario.\n\n## Phase 6: Cleanup\n\nRequired before declaring done:\n\n- [ ] Original repro no longer reproduces (re-run the Phase 1 loop)\n- [ ] Regression test passes (or absence of seam is documented)\n- [ ] All `[DEBUG-...]` instrumentation removed (`grep` the prefix)\n- [ ] Throwaway prototypes deleted (or moved to a clearly-marked debug location)\n- [ ] The hypothesis that turned out correct is stated in the commit / PR message, so the next debugger learns\n", "translation": "---\nname: diagnosing-bugs\ndescription: 針對困難 bug 與效能退化的診斷循環。當使用者說「diagnose」/「debug this」，或回報某東西壞了/拋出錯誤/失敗/很慢時使用。\n---\n\n# 診斷 Bug\n\n一套處理困難 bug 的紀律。只有在有明確理由時才略過某些階段。\n\n探索程式碼庫時，閱讀 `GLOSSARY.md`（如果有）以對相關模組建立清楚的心智模型，並檢查你所碰觸區域的 ADR。\n\n## 遮蔽\n\n本技能會讓你展示指令、輸出與擷取的產出物。**先遮蔽每一個機密**：在其位置寫上 `<REDACTED>`。以環境變數建立循環，讓憑證留在環境中，而不是出現在你展示的內容裡。擷取的產出物會帶有驗證標頭：只引用帶有訊號的那幾行。\n\n如果遮蔽後的輸出不足以診斷 bug，就說明並詢問使用者。\n\n## 第一階段：建立回饋循環\n\n**這就是這項技能本身。** 其他一切都是機械性的。如果你對這個 bug 有一個**緊湊**的通過/失敗訊號（一個會因*這個* bug 變紅的訊號），你就會找到原因；二分搜尋、假設驗證與插樁全都只是在消耗它。如果你沒有，盯著程式碼看再久也救不了你。\n\n在這裡投入不成比例的心力。**要積極。要有創意。拒絕放棄。**\n\n### 建立方式，大致依此順序\n\n1. **失敗的測試**，放在任何能觸及 bug 的接縫上：單元、整合、e2e。\n2. 對執行中的開發伺服器使用 **Curl / HTTP 腳本**。\n3. 用固定輸入進行 **CLI 呼叫**，將 stdout 與已知正確的快照做 diff。\n4. **無頭瀏覽器腳本**（Playwright / Puppeteer），驅動 UI 並對 DOM/console/網路做斷言。\n5. **重播擷取的追蹤。** 把真實的網路請求 / 承載 / 事件日誌存到磁碟；在隔離狀態下讓它重新走過該程式路徑。\n6. **拋棄式測試框架。** 啟動系統的最小子集（一個服務、mock 掉的相依），用單一函式呼叫觸發 bug 的程式路徑。\n7. **屬性 / 模糊測試循環。** 如果 bug 是「有時輸出錯誤」，就跑 1000 個隨機輸入並尋找失敗模式。\n8. **二分搜尋框架。** 如果 bug 出現在兩個已知狀態之間（commit、資料集、版本），就把「在狀態 X 啟動、檢查、重複」自動化，讓你可以 `git bisect run`。\n9. **差異比對循環。** 讓同一個輸入分別通過舊版與新版（或兩種設定），並 diff 輸出。\n10. **真人參與（HITL）的 bash 腳本。** 最後手段。如果必須由人點擊，就用 `scripts/hitl-loop.template.sh` 來驅動*他們*，讓循環仍然有結構。擷取的輸出會回饋給你。\n\n建對回饋循環，bug 就已修好 90%。\n\n### 讓循環更緊湊\n\n把循環當成一個產品。一旦你有了*某個*循環，就**收緊**它：\n\n- 能讓它更快嗎？（快取設定、略過無關的初始化、縮小測試範圍。）\n- 能讓訊號更銳利嗎？（對特定症狀做斷言，而不是「沒有崩潰」。）\n- 能讓它更具決定性嗎？（固定時間、設定亂數種子、隔離檔案系統、凍結網路。）\n\n30 秒又不穩定的循環只比沒有循環好一點點；2 秒且具決定性的循環才叫緊湊，是除錯的超能力。\n\n### 非決定性的 bug\n\n目標不是乾淨的重現，而是**更高的重現率**。把觸發條件循環 100 次、平行化、加壓、縮小時間窗口、注入 sleep。50% 機率出現的 bug 可以除錯；1% 的不行，所以要持續提高重現率直到可以除錯為止。\n\n### 當你真的無法建立循環時\n\n停下來並明確說明。列出你嘗試過的方法。請使用者提供：(a) 能重現它的任何環境的存取權，(b) 遮蔽過的擷取產出物（HAR 檔、日誌傾印、core dump、附時間戳記的螢幕錄影），或 (c) 加入暫時性正式環境插樁的許可。**不要**在沒有循環的情況下就開始提出假設。\n\n### 完成條件：一個會變紅的緊湊循環\n\n當循環**緊湊**且**能變紅**時，第一階段就完成了：你能說出**一個指令**（腳本路徑、測試呼叫、curl），而且你**已經至少執行過一次**（展示呼叫與其輸出，需遮蔽），並且它：\n\n- [ ] **能變紅**：它驅動實際的 bug 程式路徑，並對**使用者所描述的確切症狀**做斷言，因此能在這個 bug 上變紅、修好後變綠。不是「執行時沒出錯」；它必須能*抓到這個特定的 bug*。\n- [ ] **具決定性**：每次執行判定都相同（不穩定的 bug：依上述，有固定且高的重現率）。\n- [ ] **快速**：幾秒，而不是幾分鐘。\n- [ ] **代理可執行**：你可以在無人看管下執行它；真人參與只能透過 `scripts/hitl-loop.template.sh`。\n\n如果你發現自己在這個指令存在之前就在讀程式碼建立理論，**停下來：直接跳到假設，正是本技能要防止的失敗。** 沒有能變紅的指令，就沒有第二階段。\n\n## 第二階段：重現＋最小化\n\n執行循環。看著它在 bug 出現時變紅。\n\n確認：\n\n- [ ] 循環產生的是**使用者**描述的失敗模式，而不是恰好在附近的另一個失敗。錯的 bug = 錯的修正。\n- [ ] 失敗在多次執行中都可重現（或者，對於非決定性的 bug，重現率高到足以進行除錯）。\n- [ ] 你已擷取確切的症狀（錯誤訊息、錯誤輸出、緩慢的時間），讓後續階段能驗證修正確實解決了它。\n\n### 最小化\n\n一旦變紅，就把重現縮小到**仍會變紅的最小情境**。**一次一個**地刪減輸入、呼叫者、設定、資料與步驟，每次刪減後都重新執行循環，只保留對失敗具關鍵作用的部分。\n\n為什麼要這麼做：最小重現能縮小第三階段的假設空間（剩下更少可疑的活動部件），並成為第五階段乾淨的回歸測試。\n\n當**每個剩下的元素都具關鍵作用**時就完成了：移除其中任何一個都會讓循環變綠。\n\n在完成重現**與**最小化之前不要繼續。\n\n## 第三階段：提出假設\n\n在驗證任何假設之前，先產生 **3–5 個排序過的假設**。只產生單一假設會讓你錨定在第一個看似合理的想法上。\n\n每個假設都必須**可證偽**：說明它所做的預測。\n\n> 格式：「如果 <X> 是原因，那麼 <改變 Y> 會讓 bug 消失 / <改變 Z> 會讓它更嚴重。」\n\n如果你說不出預測，那個假設只是一種感覺：捨棄或把它磨利。\n\n**在驗證之前，把排序清單給使用者看。** 他們常有能立刻重新排序的領域知識（「我們剛部署了跟 #3 有關的變更」），或知道哪些假設已經被排除了。便宜的檢查點，省下大量時間。不要因此卡住；如果使用者不在，就照你的排序繼續。\n\n## 第四階段：插樁\n\n每個探針都必須對應到第三階段的一個特定預測。**一次只改變一個變數。**\n\n工具偏好：\n\n1. 若環境支援，使用**除錯器 / REPL 檢查**。一個中斷點勝過十行日誌。\n2. 在能區分假設的邊界上放置**針對性日誌**。\n3. 絕不「什麼都記錄然後 grep」。\n\n**為每一行除錯日誌加上標籤**，使用唯一的前綴，例如 `[DEBUG-a4f2]`。最後清理時只需一次 grep。沒加標籤的日誌會殘留；加了標籤的會被清掉。\n\n**效能分支。** 對於效能退化，日誌通常是錯的工具。改為：建立基準量測（計時框架、`performance.now()`、profiler、查詢計畫），然後二分搜尋。先量測，後修正。\n\n## 第五階段：修正＋回歸測試\n\n**在修正之前**先寫回歸測試，但前提是有一個**正確的接縫**可以放它。\n\n正確的接縫是指測試能演練在呼叫點上實際發生的**真實 bug 模式**。如果唯一可用的接縫太淺（bug 需要多個呼叫者時卻只有單一呼叫者的測試、無法複製觸發 bug 之呼叫鏈的單元測試），在那裡寫回歸測試只會帶來虛假的信心。\n\n**如果沒有正確的接縫，這本身就是一項發現。** 記下它。程式碼庫的架構正在阻止這個 bug 被鎖住。為下一階段標記這一點。\n\n如果有正確的接縫：\n\n1. 把最小化的重現轉成該接縫上一個失敗的測試。\n2. 看著它失敗。如果你是透過修改程式碼或測試資料來強制它變紅，先與原始副本做 `diff`，證明修改確實生效，再相信它。\n3. 套用修正。\n4. 看著它通過。\n5. 對原始（未最小化的）情境重新執行第一階段的回饋循環。\n\n## 第六階段：清理\n\n宣告完成前必須：\n\n- [ ] 原始重現不再重現（重新執行第一階段的循環）\n- [ ] 回歸測試通過（或已記錄缺少接縫的情況）\n- [ ] 所有 `[DEBUG-...]` 插樁都已移除（`grep` 該前綴）\n- [ ] 拋棄式原型已刪除（或移到明確標示的除錯位置）\n- [ ] 最終證實正確的假設已寫在 commit / PR 訊息中，讓下一個除錯者學到經驗"}, {"rank": 21, "slug": "vercel-react-best-practices", "title": "React 效能最佳實踐", "category": "前端與設計", "tags": ["React", "Next.js", "效能優化", "Vercel"], "summary": "Vercel 工程團隊維護的 React / Next.js 效能優化指南：8 大類共 70 條規則，依影響程度排序（消除請求瀑布、縮小 bundle、伺服器端效能、重新渲染優化等），撰寫、審查或重構 React 程式時自動套用。", "usage": "- 安裝：`npx skills add https://github.com/vercel-labs/agent-skills --skill vercel-react-best-practices`\n- 撰寫或審查 React 元件、Next.js 頁面、資料抓取時自動觸發；也可直接說「用 Vercel 最佳實踐檢查這個頁面的效能」\n- 每條規則在 `rules/<規則名>.md` 有錯誤/正確範例；完整版見 `AGENTS.md`", "sites": ["Skills.sh"], "repo": "vercel-labs/agent-skills", "path": "skills/react-best-practices/SKILL.md", "github_url": "https://github.com/vercel-labs/agent-skills/blob/main/skills/react-best-practices/SKILL.md", "skillssh_url": "https://skills.sh/vercel-labs/agent-skills/vercel-react-best-practices", "skillssh_rank": 30, "installs": 849482, "license": "MIT", "redistributable": true, "description_en": "React and Next.js performance optimization guidelines from Vercel Engineering. This skill should be used when writing, reviewing, or refactoring React/Next.js code to ensure optimal performance patterns. Triggers on tasks involving React components, Next.js pages, data fetching, bundle optimization, or performance improvements.", "description_zh": "來自 Vercel 工程團隊的 React 與 Next.js 效能優化指南。撰寫、審查或重構 React/Next.js 程式碼時應使用本技能，以確保採用最佳效能模式。涉及 React 元件、Next.js 頁面、資料抓取、bundle 優化或效能改進的任務會觸發。", "original": "---\nname: vercel-react-best-practices\ndescription: React and Next.js performance optimization guidelines from Vercel Engineering. This skill should be used when writing, reviewing, or refactoring React/Next.js code to ensure optimal performance patterns. Triggers on tasks involving React components, Next.js pages, data fetching, bundle optimization, or performance improvements.\nlicense: MIT\nmetadata:\n  author: vercel\n  version: \"1.0.0\"\n---\n\n# Vercel React Best Practices\n\nComprehensive performance optimization guide for React and Next.js applications, maintained by Vercel. Contains 70 rules across 8 categories, prioritized by impact to guide automated refactoring and code generation.\n\n## When to Apply\n\nReference these guidelines when:\n- Writing new React components or Next.js pages\n- Implementing data fetching (client or server-side)\n- Reviewing code for performance issues\n- Refactoring existing React/Next.js code\n- Optimizing bundle size or load times\n\n## Rule Categories by Priority\n\n| Priority | Category | Impact | Prefix |\n|----------|----------|--------|--------|\n| 1 | Eliminating Waterfalls | CRITICAL | `async-` |\n| 2 | Bundle Size Optimization | CRITICAL | `bundle-` |\n| 3 | Server-Side Performance | HIGH | `server-` |\n| 4 | Client-Side Data Fetching | MEDIUM-HIGH | `client-` |\n| 5 | Re-render Optimization | MEDIUM | `rerender-` |\n| 6 | Rendering Performance | MEDIUM | `rendering-` |\n| 7 | JavaScript Performance | LOW-MEDIUM | `js-` |\n| 8 | Advanced Patterns | LOW | `advanced-` |\n\n## Quick Reference\n\n### 1. Eliminating Waterfalls (CRITICAL)\n\n- `async-cheap-condition-before-await` - Check cheap sync conditions before awaiting flags or remote values\n- `async-defer-await` - Move await into branches where actually used\n- `async-parallel` - Use Promise.all() for independent operations\n- `async-dependencies` - Use better-all for partial dependencies\n- `async-api-routes` - Start promises early, await late in API routes\n- `async-suspense-boundaries` - Use Suspense to stream content\n\n### 2. Bundle Size Optimization (CRITICAL)\n\n- `bundle-barrel-imports` - Import directly, avoid barrel files\n- `bundle-analyzable-paths` - Prefer statically analyzable import and file-system paths to avoid broad bundles and traces\n- `bundle-dynamic-imports` - Use next/dynamic for heavy components\n- `bundle-defer-third-party` - Load analytics/logging after hydration\n- `bundle-conditional` - Load modules only when feature is activated\n- `bundle-preload` - Preload on hover/focus for perceived speed\n\n### 3. Server-Side Performance (HIGH)\n\n- `server-auth-actions` - Authenticate server actions like API routes\n- `server-cache-react` - Use React.cache() for per-request deduplication\n- `server-cache-lru` - Use LRU cache for cross-request caching\n- `server-dedup-props` - Avoid duplicate serialization in RSC props\n- `server-hoist-static-io` - Hoist static I/O (fonts, logos) to module level\n- `server-no-shared-module-state` - Avoid module-level mutable request state in RSC/SSR\n- `server-serialization` - Minimize data passed to client components\n- `server-parallel-fetching` - Restructure components to parallelize fetches\n- `server-parallel-nested-fetching` - Chain nested fetches per item in Promise.all\n- `server-after-nonblocking` - Use after() for non-blocking operations\n\n### 4. Client-Side Data Fetching (MEDIUM-HIGH)\n\n- `client-swr-dedup` - Use SWR for automatic request deduplication\n- `client-event-listeners` - Deduplicate global event listeners\n- `client-passive-event-listeners` - Use passive listeners for scroll\n- `client-localstorage-schema` - Version and minimize localStorage data\n\n### 5. Re-render Optimization (MEDIUM)\n\n- `rerender-defer-reads` - Don't subscribe to state only used in callbacks\n- `rerender-memo` - Extract expensive work into memoized components\n- `rerender-memo-with-default-value` - Hoist default non-primitive props\n- `rerender-dependencies` - Use primitive dependencies in effects\n- `rerender-derived-state` - Subscribe to derived booleans, not raw values\n- `rerender-derived-state-no-effect` - Derive state during render, not effects\n- `rerender-functional-setstate` - Use functional setState for stable callbacks\n- `rerender-lazy-state-init` - Pass function to useState for expensive values\n- `rerender-simple-expression-in-memo` - Avoid memo for simple primitives\n- `rerender-split-combined-hooks` - Split hooks with independent dependencies\n- `rerender-move-effect-to-event` - Put interaction logic in event handlers\n- `rerender-transitions` - Use startTransition for non-urgent updates\n- `rerender-use-deferred-value` - Defer expensive renders to keep input responsive\n- `rerender-use-ref-transient-values` - Use refs for transient frequent values\n- `rerender-no-inline-components` - Don't define components inside components\n\n### 6. Rendering Performance (MEDIUM)\n\n- `rendering-animate-svg-wrapper` - Animate div wrapper, not SVG element\n- `rendering-content-visibility` - Use content-visibility for long lists\n- `rendering-hoist-jsx` - Extract static JSX outside components\n- `rendering-svg-precision` - Reduce SVG coordinate precision\n- `rendering-hydration-no-flicker` - Use inline script for client-only data\n- `rendering-hydration-suppress-warning` - Suppress expected mismatches\n- `rendering-activity` - Use Activity component for show/hide\n- `rendering-conditional-render` - Use ternary, not && for conditionals\n- `rendering-usetransition-loading` - Prefer useTransition for loading state\n- `rendering-resource-hints` - Use React DOM resource hints for preloading\n- `rendering-script-defer-async` - Use defer or async on script tags\n\n### 7. JavaScript Performance (LOW-MEDIUM)\n\n- `js-batch-dom-css` - Group CSS changes via classes or cssText\n- `js-index-maps` - Build Map for repeated lookups\n- `js-cache-property-access` - Cache object properties in loops\n- `js-cache-function-results` - Cache function results in module-level Map\n- `js-cache-storage` - Cache localStorage/sessionStorage reads\n- `js-combine-iterations` - Combine multiple filter/map into one loop\n- `js-length-check-first` - Check array length before expensive comparison\n- `js-early-exit` - Return early from functions\n- `js-hoist-regexp` - Hoist RegExp creation outside loops\n- `js-min-max-loop` - Use loop for min/max instead of sort\n- `js-set-map-lookups` - Use Set/Map for O(1) lookups\n- `js-tosorted-immutable` - Use toSorted() for immutability\n- `js-flatmap-filter` - Use flatMap to map and filter in one pass\n- `js-request-idle-callback` - Defer non-critical work to browser idle time\n\n### 8. Advanced Patterns (LOW)\n\n- `advanced-effect-event-deps` - Don't put `useEffectEvent` results in effect deps\n- `advanced-event-handler-refs` - Store event handlers in refs\n- `advanced-init-once` - Initialize app once per app load\n- `advanced-use-latest` - useLatest for stable callback refs\n\n## How to Use\n\nRead individual rule files for detailed explanations and code examples:\n\n```\nrules/async-parallel.md\nrules/bundle-barrel-imports.md\n```\n\nEach rule file contains:\n- Brief explanation of why it matters\n- Incorrect code example with explanation\n- Correct code example with explanation\n- Additional context and references\n\n## Full Compiled Document\n\nFor the complete guide with all rules expanded: `AGENTS.md`\n", "translation": "---\nname: vercel-react-best-practices\ndescription: 來自 Vercel 工程團隊的 React 與 Next.js 效能優化指南。撰寫、審查或重構 React/Next.js 程式碼時應使用本技能，以確保採用最佳效能模式。涉及 React 元件、Next.js 頁面、資料抓取、bundle 優化或效能改進的任務會觸發。\nlicense: MIT\nmetadata:\n  author: vercel\n  version: \"1.0.0\"\n---\n\n# Vercel React 最佳實踐\n\n由 Vercel 維護、針對 React 與 Next.js 應用程式的完整效能優化指南。包含 8 個類別共 70 條規則，依影響程度排定優先順序，用於引導自動化重構與程式碼生成。\n\n## 何時套用\n\n在以下情況參考這些指南：\n- 撰寫新的 React 元件或 Next.js 頁面\n- 實作資料抓取（客戶端或伺服器端）\n- 審查程式碼的效能問題\n- 重構既有的 React/Next.js 程式碼\n- 優化 bundle 大小或載入時間\n\n## 依優先順序排列的規則類別\n\n| 優先序 | 類別 | 影響 | 前綴 |\n|--------|------|------|------|\n| 1 | 消除瀑布式請求 | 關鍵 | `async-` |\n| 2 | Bundle 大小優化 | 關鍵 | `bundle-` |\n| 3 | 伺服器端效能 | 高 | `server-` |\n| 4 | 客戶端資料抓取 | 中高 | `client-` |\n| 5 | 重新渲染優化 | 中 | `rerender-` |\n| 6 | 渲染效能 | 中 | `rendering-` |\n| 7 | JavaScript 效能 | 中低 | `js-` |\n| 8 | 進階模式 | 低 | `advanced-` |\n\n## 快速參考\n\n### 1. 消除瀑布式請求（關鍵）\n\n- `async-cheap-condition-before-await` - 在 await 旗標或遠端值之前，先檢查便宜的同步條件\n- `async-defer-await` - 把 await 移到真正用到它的分支中\n- `async-parallel` - 對彼此獨立的操作使用 Promise.all()\n- `async-dependencies` - 對部分相依的情況使用 better-all\n- `async-api-routes` - 在 API 路由中提早啟動 promise、延後 await\n- `async-suspense-boundaries` - 使用 Suspense 串流內容\n\n### 2. Bundle 大小優化（關鍵）\n\n- `bundle-barrel-imports` - 直接匯入，避免 barrel 檔案\n- `bundle-analyzable-paths` - 優先使用可靜態分析的 import 與檔案系統路徑，避免過大的 bundle 與追蹤\n- `bundle-dynamic-imports` - 對笨重的元件使用 next/dynamic\n- `bundle-defer-third-party` - 在 hydration 之後才載入分析/日誌工具\n- `bundle-conditional` - 只在功能啟用時才載入模組\n- `bundle-preload` - 在 hover/focus 時預先載入，提升感知速度\n\n### 3. 伺服器端效能（高）\n\n- `server-auth-actions` - 像 API 路由一樣驗證 server action\n- `server-cache-react` - 使用 React.cache() 做單次請求內的去重\n- `server-cache-lru` - 使用 LRU 快取做跨請求快取\n- `server-dedup-props` - 避免 RSC props 中的重複序列化\n- `server-hoist-static-io` - 把靜態 I/O（字型、Logo）提升到模組層級\n- `server-no-shared-module-state` - 避免在 RSC/SSR 中使用模組層級的可變請求狀態\n- `server-serialization` - 盡量減少傳給客戶端元件的資料\n- `server-parallel-fetching` - 重組元件以平行化資料抓取\n- `server-parallel-nested-fetching` - 在 Promise.all 中為每個項目串接巢狀抓取\n- `server-after-nonblocking` - 使用 after() 執行非阻塞操作\n\n### 4. 客戶端資料抓取（中高）\n\n- `client-swr-dedup` - 使用 SWR 自動去除重複請求\n- `client-event-listeners` - 去除重複的全域事件監聽器\n- `client-passive-event-listeners` - 捲動事件使用 passive 監聽器\n- `client-localstorage-schema` - 為 localStorage 資料加上版本並精簡內容\n\n### 5. 重新渲染優化（中）\n\n- `rerender-defer-reads` - 不要訂閱只在回呼中使用的狀態\n- `rerender-memo` - 把昂貴的工作抽到 memo 化的元件中\n- `rerender-memo-with-default-value` - 把非基本型別的預設 props 提升到外部\n- `rerender-dependencies` - 在 effect 中使用基本型別的相依\n- `rerender-derived-state` - 訂閱衍生出的布林值，而不是原始值\n- `rerender-derived-state-no-effect` - 在渲染期間推導狀態，而不是在 effect 中\n- `rerender-functional-setstate` - 使用函式形式的 setState 以取得穩定的回呼\n- `rerender-lazy-state-init` - 對昂貴的值傳函式給 useState\n- `rerender-simple-expression-in-memo` - 簡單的基本型別不要用 memo\n- `rerender-split-combined-hooks` - 拆分相依彼此獨立的 hook\n- `rerender-move-effect-to-event` - 把互動邏輯放在事件處理器中\n- `rerender-transitions` - 對不緊急的更新使用 startTransition\n- `rerender-use-deferred-value` - 延後昂貴的渲染，讓輸入保持即時回應\n- `rerender-use-ref-transient-values` - 對短暫且頻繁變動的值使用 ref\n- `rerender-no-inline-components` - 不要在元件內部定義元件\n\n### 6. 渲染效能（中）\n\n- `rendering-animate-svg-wrapper` - 動畫外層 div，而不是 SVG 元素\n- `rendering-content-visibility` - 長清單使用 content-visibility\n- `rendering-hoist-jsx` - 把靜態 JSX 抽到元件外部\n- `rendering-svg-precision` - 降低 SVG 座標精度\n- `rendering-hydration-no-flicker` - 對僅限客戶端的資料使用內嵌腳本\n- `rendering-hydration-suppress-warning` - 壓下預期中的不一致警告\n- `rendering-activity` - 使用 Activity 元件處理顯示/隱藏\n- `rendering-conditional-render` - 條件渲染用三元運算子，而不是 &&\n- `rendering-usetransition-loading` - 載入狀態優先使用 useTransition\n- `rendering-resource-hints` - 使用 React DOM 資源提示進行預先載入\n- `rendering-script-defer-async` - 在 script 標籤上使用 defer 或 async\n\n### 7. JavaScript 效能（中低）\n\n- `js-batch-dom-css` - 透過 class 或 cssText 批次變更 CSS\n- `js-index-maps` - 為重複查找建立 Map\n- `js-cache-property-access` - 在迴圈中快取物件屬性\n- `js-cache-function-results` - 在模組層級的 Map 中快取函式結果\n- `js-cache-storage` - 快取 localStorage/sessionStorage 的讀取\n- `js-combine-iterations` - 把多個 filter/map 合併成一個迴圈\n- `js-length-check-first` - 在昂貴的比較之前先檢查陣列長度\n- `js-early-exit` - 提早從函式返回\n- `js-hoist-regexp` - 把 RegExp 的建立提升到迴圈外\n- `js-min-max-loop` - 用迴圈找最小/最大值，而不是排序\n- `js-set-map-lookups` - 使用 Set/Map 進行 O(1) 查找\n- `js-tosorted-immutable` - 使用 toSorted() 保持不可變性\n- `js-flatmap-filter` - 使用 flatMap 一次完成 map 與 filter\n- `js-request-idle-callback` - 把非關鍵工作延到瀏覽器閒置時間\n\n### 8. 進階模式（低）\n\n- `advanced-effect-event-deps` - 不要把 `useEffectEvent` 的結果放進 effect 相依\n- `advanced-event-handler-refs` - 把事件處理器存在 ref 中\n- `advanced-init-once` - 每次應用程式載入只初始化一次\n- `advanced-use-latest` - 用 useLatest 取得穩定的回呼參照\n\n## 如何使用\n\n閱讀個別的規則檔以取得詳細說明與程式碼範例：\n\n```\nrules/async-parallel.md\nrules/bundle-barrel-imports.md\n```\n\n每個規則檔包含：\n- 簡短說明為什麼它重要\n- 錯誤的程式碼範例及說明\n- 正確的程式碼範例及說明\n- 額外的脈絡與參考資料\n\n## 完整彙編文件\n\n所有規則完整展開的指南：`AGENTS.md`"}, {"rank": 22, "slug": "lark-doc", "title": "飛書雲文件操作", "category": "文件與辦公", "tags": ["飛書", "Lark", "雲文件", "Wiki", "lark-cli"], "summary": "飛書（Lark）官方 CLI 技能：讀取、建立、編輯飛書雲文件（Docx / Wiki），插入或下載圖片附件、操作畫板與思維筆記。原文為簡體中文，此處轉為繁體。", "usage": "- 安裝：`npx skills add https://github.com/larksuite/cli --skill lark-doc`（需同時安裝 lark-shared 與 `lark-cli`）\n- 貼上飛書文件 URL 並說「幫我摘要這份文件」「在這份文件末尾補一段」\n- 建議所有文件操作加上 `--as user` 以使用者身分執行\n- 搜尋文件、匯入匯出、權限管理請改用 lark-drive", "sites": ["Skills.sh"], "repo": "larksuite/cli", "path": "skills/lark-doc/SKILL.md", "github_url": "https://github.com/larksuite/cli/blob/main/skills/lark-doc/SKILL.md", "skillssh_url": "https://skills.sh/larksuite/cli/lark-doc", "skillssh_rank": 124, "installs": 481181, "license": "MIT", "redistributable": true, "description_en": "飞书云文档（Docx / Wiki）内容操作：读取、创建、编辑文档，插入或下载图片附件，以及操作思维笔记。用户提供文档 URL/token（包括 doubao.com 的 /docx/、/wiki/）时使用；按 URL 路径/token 而非域名路由；`/page/<token>` 是妙搭应用，非飞书云文档。文档内嵌资源按读取参考中的统一规则分流。独立评论操作走 lark-drive；随正文读取评论使用 docs +fetch。表格或 Base 内部数据操作不在本 skill。", "description_zh": "飛書雲文件（Docx / Wiki）內容操作：讀取、建立、編輯文件，插入或下載圖片附件，以及操作思維筆記。使用者提供文件 URL/token（包括 doubao.com 的 /docx/、/wiki/）時使用；依 URL 路徑/token 而非網域來路由；`/page/<token>` 是妙搭應用，不是飛書雲文件。文件內嵌資源依讀取參考中的統一規則分流。獨立的評論操作走 lark-drive；隨正文讀取評論使用 docs +fetch。表格或 Base 內部的資料操作不在本 skill 範圍。", "original": "---\nname: lark-doc\ndescription: \"飞书云文档（Docx / Wiki）内容操作：读取、创建、编辑文档，插入或下载图片附件，以及操作思维笔记。用户提供文档 URL/token（包括 doubao.com 的 /docx/、/wiki/）时使用；按 URL 路径/token 而非域名路由；`/page/<token>` 是妙搭应用，非飞书云文档。文档内嵌资源按读取参考中的统一规则分流。独立评论操作走 lark-drive；随正文读取评论使用 docs +fetch。表格或 Base 内部数据操作不在本 skill。\"\nmetadata:\n  requires:\n    bins: [\"lark-cli\"]\n    skills: [\"lark-shared\"]\n  cliHelp: \"lark-cli docs --help;lark-cli mindnotes --help\"\n---\n\n# docs\n\n## 场景与 Shortcut 路由\n\n**CRITICAL：先判断场景，再读取该场景的参考文件；不要在任务开始时一次性读取全部参考文件。每个文件只在首次进入对应阶段时读取一次。**\n\n**身份：文档操作推荐显式指定 `--as user`。**\n\n**本地文件引用统一遵循文件访问权限：CWD 内优先使用 `@./相对路径`，其他目录使用 `@绝对路径`。XML 内的相对资源路径先查 CWD；仅文件不存在时再查源 XML 文件所在目录，同名文件以 CWD 为准。内联内容、stdin、在线文档没有源文件目录，不执行回退。**\n\n### 文档内容\n\n- **读取 / 摘要 — [`+fetch`](references/lark-doc-fetch.md)**：先读参考再获取文档。\n- **从零创作 — [`创建工作流`](references/lark-doc-create-workflow.md)**：先完整执行创建工作流，**简单任务不是跳过的理由**；\n- **导入 / 空文档 — [`+create`](references/lark-doc-create.md)**：仅创建空文档或原样导入用户提供的完整内容时，跳过创建工作流。\n- **编辑 / block 直达链接 — [`+update`](references/lark-doc-update.md)**：语义改写、润色、重组、补写或排版均按 update 参考完成。\n\n### 辅助能力\n\n- **草稿初始化、解析与统计 — [`+script`](references/lark-doc-script.md)**：支持解析文档 URL / token 与本地 XML，统计字数并返回字符诊断；不支持 Markdown 输入。\n- **历史版本 — [`+history-list` / `+history-revert` / `+history-revert-status`](references/lark-doc-history.md)**：查询、回滚文档历史版本或检查回滚任务状态。\n\n### 资源、画板与思维笔记\n\n- **插入本地素材 — [`+media-insert`](references/lark-doc-media-insert.md)**：在文末插入本地图片或文件。\n- **预览素材 — [`+media-preview`](references/lark-doc-media-preview.md)**：预览文档或评论中的图片、附件或素材。\n- **下载素材 — [`+media-download`](references/lark-doc-media-download.md)**：下载文档中的图片、附件、素材或画板缩略图。\n- **Docx 封面 — [`+resource-download` / `+resource-update` / `+resource-delete`](references/lark-doc-resource-cover.md)**：下载、更新或删除 Docx 封面。\n- **画板 — [`画板工作流`](references/lark-doc-whiteboard.md)**：创建或更新画板时先读取工作流；更新已有画板必须复用现有 token，禁止新建空白画板；使用 [`whiteboard +update`](../lark-whiteboard/references/lark-whiteboard-update.md) 写入。\n- **思维笔记 — `mindnotes`**：已有思维笔记走 [`思维笔记链路`](references/lark-doc-mindnote.md)；新建思维笔记走 [`lark-doc-whiteboard`](references/lark-doc-whiteboard.md)。\n\n### 认证与 Scope\n\n执行 Shortcut 时，不预读 [`lark-shared`](../lark-shared/SKILL.md) 或预跑 `auth status --verify`；仅遇到未认证、token / 身份或 scope 错误时读取该 Skill，修复后重试。认证、身份或 scope 管理请求则直接使用该 Skill。\n\n## 不在本 Skill 范围\n\n- **Drive 文件级操作**：找文档、导入导出、云空间文件上传 / 下载 / 权限管理 → [`lark-drive`](../lark-drive/SKILL.md)。复制文档、创建副本或另存为副本时，按其指引使用 `lark-cli drive files copy`；不要用 `docs +fetch` + `docs +create` 重建正文。\n- **独立评论操作**：添加、分页查看、回复评论或增删 reaction → [`lark-drive`](../lark-drive/SKILL.md)；只需紧凑评论上下文时，直接使用默认 JSON 响应的 `docs +fetch`。\n", "translation": "---\nname: lark-doc\ndescription: \"飛書雲文件（Docx / Wiki）內容操作：讀取、建立、編輯文件，插入或下載圖片附件，以及操作思維筆記。使用者提供文件 URL/token（包括 doubao.com 的 /docx/、/wiki/）時使用；依 URL 路徑/token 而非網域來路由；`/page/<token>` 是妙搭應用，不是飛書雲文件。文件內嵌資源依讀取參考中的統一規則分流。獨立的評論操作走 lark-drive；隨正文讀取評論使用 docs +fetch。表格或 Base 內部的資料操作不在本 skill 範圍。\"\nmetadata:\n  requires:\n    bins: [\"lark-cli\"]\n    skills: [\"lark-shared\"]\n  cliHelp: \"lark-cli docs --help;lark-cli mindnotes --help\"\n---\n\n# docs\n\n## 情境與 Shortcut 路由\n\n**CRITICAL：先判斷情境，再讀取該情境的參考檔案；不要在任務一開始就一次讀取全部參考檔案。每個檔案只在第一次進入對應階段時讀取一次。**\n\n**身分：文件操作建議明確指定 `--as user`。**\n\n**本機檔案引用一律遵循檔案存取權限：CWD 內優先使用 `@./相對路徑`，其他目錄使用 `@絕對路徑`。XML 內的相對資源路徑先查 CWD；只有檔案不存在時才查來源 XML 檔所在目錄，同名檔案以 CWD 為準。內嵌內容、stdin、線上文件沒有來源檔目錄，不執行回退。**\n\n### 文件內容\n\n- **讀取 / 摘要 — [`+fetch`](references/lark-doc-fetch.md)**：先讀參考再取得文件。\n- **從零創作 — [`建立工作流`](references/lark-doc-create-workflow.md)**：先完整執行建立工作流，**簡單任務不是跳過的理由**；\n- **匯入 / 空白文件 — [`+create`](references/lark-doc-create.md)**：只有在建立空白文件或原樣匯入使用者提供的完整內容時，才跳過建立工作流。\n- **編輯 / block 直達連結 — [`+update`](references/lark-doc-update.md)**：語意改寫、潤飾、重組、補寫或排版都依 update 參考完成。\n\n### 輔助能力\n\n- **草稿初始化、解析與統計 — [`+script`](references/lark-doc-script.md)**：支援解析文件 URL / token 與本機 XML，統計字數並回傳字元診斷；不支援 Markdown 輸入。\n- **歷史版本 — [`+history-list` / `+history-revert` / `+history-revert-status`](references/lark-doc-history.md)**：查詢、回復文件歷史版本，或檢查回復任務狀態。\n\n### 資源、畫板與思維筆記\n\n- **插入本機素材 — [`+media-insert`](references/lark-doc-media-insert.md)**：在文末插入本機圖片或檔案。\n- **預覽素材 — [`+media-preview`](references/lark-doc-media-preview.md)**：預覽文件或評論中的圖片、附件或素材。\n- **下載素材 — [`+media-download`](references/lark-doc-media-download.md)**：下載文件中的圖片、附件、素材或畫板縮圖。\n- **Docx 封面 — [`+resource-download` / `+resource-update` / `+resource-delete`](references/lark-doc-resource-cover.md)**：下載、更新或刪除 Docx 封面。\n- **畫板 — [`畫板工作流`](references/lark-doc-whiteboard.md)**：建立或更新畫板時先讀取工作流；更新既有畫板必須重用現有 token，禁止新建空白畫板；使用 [`whiteboard +update`](../lark-whiteboard/references/lark-whiteboard-update.md) 寫入。\n- **思維筆記 — `mindnotes`**：既有思維筆記走 [`思維筆記流程`](references/lark-doc-mindnote.md)；新建思維筆記走 [`lark-doc-whiteboard`](references/lark-doc-whiteboard.md)。\n\n### 認證與 Scope\n\n執行 Shortcut 時，不預先讀取 [`lark-shared`](../lark-shared/SKILL.md) 或預先執行 `auth status --verify`；只有遇到未認證、token / 身分或 scope 錯誤時才讀取該 Skill，修復後重試。認證、身分或 scope 管理的請求則直接使用該 Skill。\n\n## 不在本 Skill 範圍\n\n- **Drive 檔案層級操作**：找文件、匯入匯出、雲端空間檔案上傳 / 下載 / 權限管理 → [`lark-drive`](../lark-drive/SKILL.md)。複製文件、建立副本或另存為副本時，依其指引使用 `lark-cli drive files copy`；不要用 `docs +fetch` + `docs +create` 重建正文。\n- **獨立評論操作**：新增、分頁檢視、回覆評論或增刪 reaction → [`lark-drive`](../lark-drive/SKILL.md)；只需要精簡的評論脈絡時，直接使用預設 JSON 回應的 `docs +fetch`。"}, {"rank": 23, "slug": "lark-base", "title": "飛書多維表格", "category": "文件與辦公", "tags": ["飛書", "Lark", "多維表格", "Bitable", "自動化流程", "lark-cli"], "summary": "飛書（Lark）官方 CLI 技能：操作多維表格（Base / Bitable）——建表、欄位、記錄、檢視、統計、公式/lookup、表單、儀表板、應用模式頁面與元件、Workspace、自動化流程、角色權限與模板中心。原文為簡體中文，此處以 OpenCC 轉為台灣繁體。", "usage": "- 安裝：`npx skills add https://github.com/larksuite/cli --skill lark-base`（需 `lark-cli` 與 lark-shared）\n- 貼上 `/base/` 連結並說「幫我統計這張表上週的新增筆數」「新增一個『負責人』欄位」「建一個新進員工資料收集表單」\n- 建議一律以 `--as user` 身分操作；大量寫入每批最多 200 筆、同一張表需序列寫入\n- 匯入匯出 Excel/CSV 請改用 lark-drive", "sites": ["Skills.sh"], "repo": "larksuite/cli", "path": "skills/lark-base/SKILL.md", "github_url": "https://github.com/larksuite/cli/blob/main/skills/lark-base/SKILL.md", "skillssh_url": "https://skills.sh/larksuite/cli/lark-base", "skillssh_rank": 129, "installs": 478672, "license": "MIT", "redistributable": true, "description_en": "飞书多维表格（Base）操作：建表、字段、记录、视图、统计、公式/lookup、表单、仪表盘、应用模式（BaseApp/AppMode 页面与组件）、Workspace 目录、workflow、角色权限、模板中心（多维表格模板分类/列表/搜索）；遇到 Base/多维表格/bitable、BaseApp/AppMode、/base/ 或 /app/ 链接时使用。BaseApp 不走 lark-apps；文件导入/导出转 lark-drive，认证/授权转 lark-shared。", "description_zh": "飛書多維表格（Base）操作：建表、欄位、記錄、檢視、統計、公式/lookup、表單、儀表盤、應用模式（BaseApp/AppMode 頁面與元件）、Workspace 目錄、workflow、角色許可權、模板中心（多維表格模板分類/列表/搜尋）；遇到 Base/多維表格/bitable、BaseApp/AppMode、/base/ 或 /app/ 連結時使用。BaseApp 不走 lark-apps；檔案匯入/匯出轉 lark-drive，認證/授權轉 lark-shared。", "original": "---\nname: lark-base\nversion: 1.2.23\ndescription: \"飞书多维表格（Base）操作：建表、字段、记录、视图、统计、公式/lookup、表单、仪表盘、应用模式（BaseApp/AppMode 页面与组件）、Workspace 目录、workflow、角色权限、模板中心（多维表格模板分类/列表/搜索）；遇到 Base/多维表格/bitable、BaseApp/AppMode、/base/ 或 /app/ 链接时使用。BaseApp 不走 lark-apps；文件导入/导出转 lark-drive，认证/授权转 lark-shared。\"\nmetadata:\n  requires:\n    bins: [\"lark-cli\"]\n  cliHelp: \"lark-cli base --help\"\n---\n\n# Base\n\n普通 Base 是数据容器，由一棵 Base Block 资源树和 Base 级配置组成。`folder`、`table`、`docx`、`dashboard`、`workflow` 都是 Block 类型；Advanced Permission / Role 是 Base 级配置，不属于 Block。Table 是其中承载业务数据的核心 Block。Workspace 是组织 Base 与 BaseApp 的外层容器；BaseApp（AppMode）通过 Page 和组件组织 Base 数据，不是 Base 的别名。\n\n## 身份选择（优先）\n\n操作 Base 优先使用 `--as user`；用户明确要求应用身份时使用 `--as bot`。权限失败按 `lark-shared` 以原身份修复 scope 或资源 ACL；只有用户明确同意更换操作者时才切换身份。\n\n## 进入前必做：解析目标实体\n\n开始操作前先确定 `base_token` 和目标实体类型；上下文已提供 `<bitable>` / `<base_refer>` 标签及资源 ID 时直接使用。其余情况按意图选择入口：\n\n1. **URL 或分享链接：** `lark-cli base +url-resolve --url '<url>' --as user`。Base URL 根据返回的 `resource_type` / `block_type` 及 `table_id`、`view_id`、`record_id`、`dashboard_id`、`workflow_id`、`docx_token`、`share_token` 等坐标进入对应模块；BaseApp `/app/` URL 返回 `app_token`，并在链接携带时返回 `workspace_token` 和 `page_id`。实体类型以解析结果为准。\n2. **Base 标题或关键词：** `lark-cli base +title-resolve --title '<keyword>' --as user`。单一结果直接取得 `base_token`；多个候选结合标题、所有者和更新时间消歧，仍无法唯一确定时请用户选择。随后按下方 Base Block 资源模型定位目标实体。\n3. **已有 Base 候选列表：** 用户要列出已有 Base 候选，且需要按最近访问、owner、创建人、时间、类型等维度筛选/排序时，转 `lark-cli drive +search --doc-types bitable --as user`。按标题/关键词定位单个 Base 仍用 `+title-resolve`。常见候选列表命令：\n   - 最近访问：`lark-cli drive +search --doc-types bitable --sort open_time --opened-since 3m --page-size 20 --as user`\n   - 只列我拥有的：加 `--mine`；如果要列“我创建的”，用 `--created-by-me`。\n   - 从候选项拿到 URL 或 token 后，再用 `+url-resolve` 或 `+base-get` 进入 Base 业务命令。\n4. **BaseApp：** 优先使用真实 `/app/` URL；已有 `workspace_token` 时可用 `+workspace-entity-list --type baseapp` 定位。两者都没有时请用户补充应用链接或 Workspace，不按名称全局猜测 `app_token`。\n\n**读取 Base：** Base 信息用 `+base-get`，资源目录按下方 Base Block 资源模型读取。\n\n**写入 Base：** 创建新 Base 使用一次 `+base-create --name <base-name> --table-name <table-name> --fields '<field-array>'` 同时创建 Base、首表和 fields；`+base-copy` 复制整个 Base；Base 内资源统一按下方 Block 生命周期管理。\n\n## Base 模板中心\n\n模板中心是公开的 Base 模板库，不是用户云空间里的已有 Base。用户想用现成模板创建新 Base，且没有指向已有对象的锚点（没有 Base URL、没有“我的/最近访问的表”、没有具体已存在的 Base 名）时，可读取 [lark-base-template-center.md](references/lark-base-template-center.md) 查找模板中心模板；`+template-categories` 列出公开模板分类，`+template-list` 按分类列出公开模板，`+template-search` 按业务关键词搜索公开模板。\n\n## Base Block 资源模型\n\n```text\nBase\n├── Base Block 资源树\n│   ├── Table Block\n│   │   ├── Field schema\n│   │   ├── Records / CellValue\n│   │   ├── Views\n│   │   └── Forms / Questions\n│   ├── Dashboard Block（布局容器）\n│   │   └── Dashboard 内部 Blocks（图表、指标卡、文本）\n│   ├── Workflow Block\n│   │   └── Workflow definition（title、status、steps 执行图）\n│   ├── Docx Block → docx_token / lark-doc\n│   └── Folder Block → 子 Block\n└── Base 级配置\n    └── Advanced Permission / Roles\n```\n\n每个 Base Block 都有 `id`、`type`、可修改的 `name`、所在 Folder 的 `parent_id`，并在同级目录中具有顺序。`+base-block-list` 是统一发现入口；`+base-block-create` 创建 Block，`+base-block-rename` 修改名称，`+base-block-move` 通过 `--parent-id` 调整目录并通过 `--before-id` / `--after-id` 调整顺序，`+base-block-delete` 删除 Block。类型专属内容再由对应模块命令处理。\n\n创建时已经明确类型专属初始内容，可直接使用对应构造命令一次完成：Table 用 `+table-create --fields`，Dashboard 用 `+dashboard-create` 设置主题，Workflow 用 `+workflow-create --json` 提交完整定义；Folder 和 Docx 使用 `+base-block-create`。\n\nBlock 的 `id` 按类型直接作为对应模块坐标：\n\n| Block type | 模块坐标与内部内容 |\n|---|---|\n| `table` | `id` 即 `table_id`；内部包含 Field、Record、View 和 Form |\n| `dashboard` | `id` 即 `dashboard_id`；内部包含图表、指标卡和文本等 Dashboard 组件 |\n| `workflow` | `id` 即 `workflow_id`；内部包含 title、status 和 steps 执行图 |\n| `docx` | Block 另带 `docx_token`；正文由 `lark-doc` 处理 |\n| `folder` | `id` 是目录 Block ID，也可作为 `--parent-id`；只组织子 Block |\n\n## Table Block（The Core）\n\nTable 本身是 Base Block，也是 Base 的核心数据存储层；Field、Record、View 和 Form 是 Table 内部对象，不是 Base Block。业务数据查询、写入、关联、统计和分析都从 Table 开始。先用 `+table-list` 定位 Table；字段名和目标已知的普通读取可直接进入 Record 命令，只有写入、筛选或关联等依赖字段类型/schema 的任务才补 `+field-list`。多表的 `+field-list` 可以并发执行。基础的 Record / CellValue 读写直接按下方路径；reference 只承载高级分析、完整协议和边界细节。\n\n**读取 Table：** `+table-list` 定位表，`+table-get` 读取详情。Table 专属复制使用 `+table-copy`，异步状态用 `+table-copy-status`；schema 和 records 由下方内部对象操作。\n\nTable 下的大多数更新通过异步链路生效，接口成功返回后立即读取可能暂时看不到最新状态。优先以写入成功响应作为操作结果；任务必须确认最终状态时，先完成本轮相关变更，再统一读取验收，避免逐项写后立即读回。\n\n### Field\n\nField 定义列 schema。`field_id` 是稳定列标识，`name` 是可修改的展示名称；Formula、Lookup、Link、Select 等属于 Field 类型或能力。\n\n**读取 Field：** `+field-list` / `+field-get` / `+field-search-options`。**写入 Field：** 已有 Table 中创建多个字段时，优先向一次 `+field-create --json` 传字段对象数组；单字段更新和删除用 `+field-update` / `+field-delete`。创建和更新分别读取 [field-create](references/lark-base-field-create.md) / [field-update](references/lark-base-field-update.md)，由命令文档继续路由 Field JSON、Formula 和 Lookup 协议。`字段插件` 用于扩展基础字段能力：按同一行其他字段内容触发 LLM 生成，并写回已有目标字段；当前已确认目标字段支持文本、单选、数字，配置或触发前先读 [field-extension](references/lark-base-field-extension.md)。\n\n### Record\n\nRecord 是 Table 中的一行数据，包含该记录在各个 Field 下的 CellValue。系统 `record_id` 是表内稳定、非空且唯一的主键，Table 的主字段只是展示字段。\n\n#### 1. 读取记录或单元格\n\n- 已知若干个 `record_id`：`+record-get --record-id <id1> --record-id <id2>`\n- 关键词搜索：`+record-search --keyword <text> --search-field <field>`；至少指定一个搜索字段。\n- 其余读取：`+record-list`；结构化条件和排序分别用 `--filter-json` / `--sort-json`。\n\n行数较大、需要服务端谓词下推时，`--filter-json` 使用 tuple condition；最常用的筛选与完整日期范围写法：\n\n```jsonc\n{\n  \"logic\": \"and\", // 全部条件成立；任一条件成立改为 \"or\"\n  \"conditions\": [\n    [\"状态\", \"intersects\", [\"进行中\", \"暂停\"]], // Select 命中任一选项\n    [\"标题\", \"intersects\", \"urgent\"], // 文本包含\n    [\"备注\", \"non_empty\"], // 非空；判断为空改用 \"empty\"，两者都不传 value\n    [\"金额\", \">=\", 100], // 数字比较；支持 ==、!=、>、>=、<、<=\n    [\"关联项目\", \"intersects\", [{ \"id\": \"recxxx\" }]], // Link 包含目标记录\n    [\"业务日期\", \"==\", \"ExactDate(2026-08-07)\"], // 具体一天：按 Base 时区匹配 2026-08-07 当天\n    [\"发生时间\", \">\", \"ExactDate(2024-01-31 23:59:59.999)\"], // 日期不支持 >=；用 > 前一天最后一毫秒表达含当天的下界\n    [\"发生时间\", \"<\", \"ExactDate(2024-03-01 00:00:00)\"] // 2024 年 2 月范围上界：小于 3 月 1 日零点\n  ]\n}\n```\n\n完整操作符和各字段取值结构读取 [Filter 条件结构](references/lark-base-filter-condition.md)。\n\n所有读取都重复传 `--field-id` 做最小字段投影，并统一写入 NDJSON artifact：`--format ndjson --output <path>.ndjson`。每行是一条 Record JSON，stdout 摘要包含 `records_count` 和 `has_more` 用于分页判断。\n\n```bash\n# Example: 行数较大时先筛选 Status 包含 Doing 的记录，再导出 20 条作为局部预览\nlark-cli base +record-list \\\n  --base-token <base_token> --table-id <table_id> \\\n  --filter-json '{\"logic\":\"and\",\"conditions\":[[\"Status\",\"intersects\",[\"Doing\"]]]}' \\\n  --field-id Name --field-id Status --field-id Score --limit 20 \\\n  --format ndjson --output ./records-preview.ndjson --as user\n\nPREVIEW_ROWS=5\nhead -n \"$PREVIEW_ROWS\" ./records-preview.ndjson\ntail -n \"$PREVIEW_ROWS\" ./records-preview.ndjson\n```\n\n预计记录数少于 500 行时，建议不做谓词下推，直接拉取到本地用 jq 或 Python 处理；行数较大时可用 `--filter-json` 下推可表达的条件，正则、派生等无法下推的条件继续在本地处理。\n\n```bash\n# jq：对服务端筛选结果追加名称格式筛选，再投影必要字段\njq -c 'select((.Name // \"\") | test(\"^Task-[0-9]+$\")) | {record_id, Name}' ./records-preview.ndjson\n\n# Python：按行读取并做简单汇总\npython3 - <<'PY'\nimport json\n\nwith open(\"records-preview.ndjson\", encoding=\"utf-8\") as stream:\n    rows = (json.loads(line) for line in stream if line.strip())\n    print(sum((row.get(\"Score\") or 0) for row in rows))\nPY\n```\n\n`--limit` 的缺省值是 2000，最大值是 2000，通常无需手动指定 limit 参数；支持 `--offset` 参数；只有 `has_more=false` 且查询范围符合问题时，才能当作完整结果。大表完整读取、View 范围读取、复杂 JOIN、集合/多值、时序、语义或专业统计分析时，读取 [Record 查询与分析 SOP](references/lark-base-record-query-and-analysis-sop.md)。\n\n#### 2. 新增记录或更新记录单元格\n\n一条 Record 是 `{字段名或 field_id: CellValue}`，常见 CellValue：\n\n```jsonc\n{\n  \"标题\": \"Created from shortcut\", // text: string\n  \"待确认\": \"请 <at user_id=ou_123/> 确认\", // text(plain): 人员提及；实际 open_id 用 lark-contact 查询；不发送通知\n  \"官网\": \"[官网](https://example.com)\", // text(url): 裸 URL 或 Markdown link\n  \"联系电话\": \"13800000000\", // text(phone): 合法电话号码字符串\n  \"邮箱\": \"owner@example.com\", // text(email): 合法邮箱字符串\n  \"单选\": [\"Todo\"], // select: array<string>；单选时数组最多一个值；\n  \"标签\": [\"高优\", \"外部依赖\"], // 多选 select: array<string>；必须是当前字段存在的选项；\n  \"工时\": 8, // number: double，不经过格式化的纯数字\n  \"带时区时间\": \"2026-03-24T10:00:00+08:00\", // datetime：带时区，遵循传入的时区\n  \"不带时区时间\": \"2026-03-24 10:00\", // datetime：不带时区，自动按当前 Base 时区转换\n  \"毫秒时间戳\": 1774317600000, // datetime：也支持 Unix 毫秒时间戳\n  \"已完成\": false, // checkbox: boolean\n  \"负责人\": [{ \"id\": \"ou_123\" }], // user(multiple=false): 数组最多一个元素\n  \"协作人\": [{ \"id\": \"ou_123\" }, { \"id\": \"ou_456\" }], // user(multiple=true): 数组可包含多个元素\n  \"群聊\": [{ \"id\": \"oc_123\" }, { \"id\": \"oc_456\" }], // group_chat(multiple=true)\n  \"关联任务\": [{ \"id\": \"rec456\" }], // link: array<{id}>，record_id 来自目标表\n  \"坐标\": { \"lng\": 116.397428, \"lat\": 39.90923 }, // location: {lng,lat}\n  \"清空\": null, // 清空单元格，传 null\n  \"清空数组\": [] // 清空数组类单元格，空数组和 null 都可以\n}\n```\n\n附件使用专用 shortcut 上传、下载或移除。created_at, updated_at, created_by, updated_by, auto_number, formula, lookup 类型字段只读，若误写入单元格会返回 `ignored_fields` 表示这些字段被静默过滤，其余字段正常写入。\n\n```bash\n# 新增：成功时返回 record_id_list\nlark-cli base +record-batch-create \\\n  --base-token <base_token> --table-id <table_id> \\\n  --json '{\"create_records\":[{\"Name\":\"Task A\",\"Status\":[\"Todo\"]},{\"Name\":\"Task B\",\"Score\":20}]}' --as user\n\n# 更新：每条记录只提交要改变的字段\nlark-cli base +record-batch-update \\\n  --base-token <base_token> --table-id <table_id> \\\n  --json '{\"update_records\":{\"<record_id_a>\":{\"Status\":[\"Done\"]},\"<record_id_b>\":{\"Score\":100}}}' --as user\n```\n\n大 payload 可用脚本生成 json 后用 `--json @file.json`。单批最多 200 条，超过后分批，同一 Table 串行写入；并行可能触发 `1254291` 并发冲突错误。\n\n#### 3. 其他 Record 操作\n\n- `+record-delete --base-token <base_token> --table-id <table_id> --record-id <id1> --record-id <id2>` 删除若干个记录\n- `+record-share-link-create --base-token <base_token> --table-id <table_id> --record-id <id1> --record-id <id2>` 创建记录分享链接\n- `+record-history-list` 查询单条记录的变更事件，读取 [历史记录协议](references/lark-base-record-history-list.md)\n- 附件必须使用 `+record-upload-attachment` / `+record-download-attachment` / `+record-remove-attachment` 操作。\n\n### View\n\nView 共享 Table 的底层记录；没有特殊展示需求时优先使用 `grid`。读取已有视图用 `+view-list` / `+view-get`。\n\n**所有 View 编辑前必读 [View 类型与生命周期](references/lark-base-view.md)**，包括创建、改名、配置修改（筛选、排序、分组、字段显隐、时间条、卡片）和删除。视图选型、适用配置及完整操作示例统一在该 reference 中。\n\n### Form\n\nForm 依附于 Table，以 Field 作为题目，每次有效提交会创建一条 Record，适合信息收集、外部填写、条件题目和附件提交。\n\n1. **读取 Table 中的表单配置：** 使用 `+form-list` / `+form-get` 读取表单，使用 `+form-questions-list` 读取题目配置；这些命令使用表单所属的 `base_token + table_id`。\n2. **创建或修改 Table 中的表单配置：** 使用 `+form-create` / `+form-update` / `+form-delete` 管理表单；题目由 Table Field 承载，question ID 对应 `field_id`，创建和更新分别读取 [questions create](references/lark-base-form-questions-create.md) / [questions update](references/lark-base-form-questions-update.md)，删除使用 `+form-questions-delete`。\n3. **调整表单题目显隐和顺序：** Form 在 `visible_fields` 接口中作为 View，`form_id` 传给 `--view-id`。用 `+view-get-visible-fields` 读取当前可见题目，再用 `+view-set-visible-fields` 提交最终需要展示的完整有序题目 ID 列表；省略当前可见题目会隐藏它，加入已有隐藏 Form 成员会重新展示，空列表会隐藏全部题目。目标只能包含已有 Form 成员；仍显示题目的 `visible_rule` 只能引用位于它之前的可见题目。\n4. **管理表单分享：** 使用 `+form-share-get` / `+form-share-update` 管理启停、访问范围和匿名/登录要求；更新前先读取现状，每次只修改一个字段，布尔值显式传 `true` 或 `false`。\n5. **填写分享表单并提交：** 对表单分享链接使用 `+url-resolve` 取得 `share_token`，按 [Form detail](references/lark-base-form-detail.md) 执行 `+form-detail` 读取真实题目、必填项和显示条件，再按 [Form submit](references/lark-base-form-submit.md) 构造字段与附件并执行 `+form-submit`。\n\n表单题目和字段的关系：\n\n- `+form-questions-create` 支持两种形态：新建字段题目需要 `title` + `type`；已有字段题目需要 `use_existing_field:true` + `field_id`。已有字段题目只是把该字段加入表单，不创建新字段，也不改变已有记录数据；不要给该形态携带 `type`、`style`、`options` 等字段定义属性。\n- 创建问题前先 `+form-questions-list`。若目标标题已经存在，除非用户明确要求同名独立问题，否则优先用 `+form-questions-update` 修改题目配置，不要先创建同名问题再删除旧问题。\n- `+form-questions-delete` 是高风险写操作。默认会删除承载问题的底层 Field 及该字段所有记录数据；只想把题目移出表单并保留字段/数据时必须传 `--keep-field`。保留字段后可用 `+form-questions-create --questions '[{\"use_existing_field\":true,\"field_id\":\"<field_id>\"}]'` 加回表单。\n\n## Dashboard Block\n\nDashboard Block 是 Base Block 树中的仪表盘容器，负责承载页面主题、布局和内部组件集合，本身不表示某一项图表数据。使用 `+dashboard-list` 定位容器，`+dashboard-get` 读取容器信息，`+dashboard-update` 修改主题，`+dashboard-arrange` 统一编排内部组件布局。\n\n**管理 Dashboard 分享：** 使用 `+dashboard-share-get` / `+dashboard-share-update` 管理启停、访问范围和返回源 Base 入口；更新前先读取现状，每次只修改一个字段，显式 `false` 会被保留。\n\n容器内部的图表、指标卡和文本等组件在 Dashboard API 中也称为 Block，但不属于 Base Block 树。内部 Block 分为三条操作路径：\n\n1. **读取配置：** `+dashboard-block-list` / `+dashboard-block-get` 读取组件类型、布局和 `data_config`；文本组件的正文也属于配置。\n2. **写入配置：** `+dashboard-block-create` / `+dashboard-block-update` / `+dashboard-block-delete` 管理组件，`data_config` 定义数据源、维度、指标、聚合或文本内容。\n3. **读取内容：** `+dashboard-block-get-data` 读取图表、指标卡等数据组件的计算结果。\n\n操作内部 Block 前先读 [Dashboard](references/lark-base-dashboard.md)，由该入口继续路由组件配置和结果协议。\n\n## 应用模式与 Workspace 心智模型\n\nWorkspace 是组织 Base 和 BaseApp 的空间容器；BaseApp 创建时必须归属一个 Workspace。BaseApp 用 Page 组织界面，每个 Page 包含图表、列表或富文本组件；组件通过 `data_config` 引用 Base 数据，但不会改变 Base、Table、Field 和 Record 的归属关系。Workspace 负责资源归属，App 负责页面和组件，Base 负责数据。\n\n1. **Workspace：** 使用 `+workspace-create`、`+workspace-entity-list` 和 `+workspace-move-in` 创建目录、列出其中的 Base/BaseApp 或移入资源。\n2. **应用：** 使用 `+app-create` / `+app-get`；应用查询和创建依赖真实 `app_token` / `workspace_token`。\n3. **页面：** 使用 `+app-page-list/get/create/rename/delete` 管理 Page。\n4. **组件：** 使用 `+app-block-list/get/create/update` 读写组件配置，使用 `+app-block-get-data` 读取组件计算结果。\n\nBaseApp、Workspace、Page 或组件任务开始前完整读取 [应用模式与 Workspace](references/lark-base-app.md)；构造组件 `data_config` 时继续读取 [应用组件配置](references/lark-base-app-block-data-config.md)。BaseApp 不走 `lark-apps`。当前不支持 BaseApp 复制、Page 完整复制、页面图标以及从 Workspace 移出资源；遇到这些目标按 reference 的能力边界处理，不以新建空对象或 Drive 移动冒充。\n\n- BaseApp（应用模式）中的 Page 和组件使用 `app_token` / `page_id` / `block_id`，表、字段和记录仍使用组件所引用 Base 的 `base_token`；不要混用 token 或把 BaseApp 当作 Base 的别名。\n- 复用现有 BaseApp block 的 `data_config` 只能作为结构模板，首次 Create/Update 前仍要逐项对齐用户显式要求；用户要求排序时必须显式写 `group_by[].sort.order` 或顶层 `sort.order`，不能用旧配置省略的方向或当前 `get-data` 结果顺序代替。\n- 应用页面的 block 与仪表盘 block 是同一套底层实体，但 ID 体系不通用；按当前模块 reference 选择命令和配置协议。\n\n## Workflow Block\n\nWorkflow 本身是 Base Block，其内部是一张由 `next` / `children` 连接的 steps 执行图；触发器、动作、条件分支和循环都是 step 类型。它适合定时执行、Record 新增或变更联动、消息通知、记录读写和跨系统调用。Workflow 分为三条操作路径：\n\n1. **读取配置：** `+workflow-list` 定位流程，`+workflow-get` 读取 `title`、`status` 和完整 `steps` 执行图。\n2. **写入配置：** `+workflow-create` 创建完整定义，`+workflow-update` 更新完整定义；构造或修改配置前读取 [Workflow](references/lark-base-workflow.md)，由该入口继续路由 step 类型和 schema。\n3. **运行状态控制：** `+workflow-enable` / `+workflow-disable` 启用或停用已有 Workflow，不修改 steps 执行图。\n\n## Advanced Permission（AdvPerm）\n\nAdvPerm 为 Base 开启细粒度权限模式；Role 在此基础上配置 Base、Table、View、Field、Record、Dashboard 和 Docx 等资源的访问能力，适合按团队或职责限制可见范围、编辑能力、复制下载和数据访问规则。\n\n**读取 AdvPerm：** `+base-get` 查看 `is_advanced`，`+role-list` / `+role-get` 查看角色。**写入 AdvPerm：** `+advperm-enable` / `+advperm-disable` 启停高级权限，`+role-create` / `+role-update` / `+role-delete` 管理角色。先读 [权限与角色](references/lark-base-advanced-permission-and-role.md)，由该入口继续路由权限 JSON 协议。\n\n## Docx Block\n\nDocx Block 是组织在 Base 目录中的飞书文档资源，适合把说明、方案和报告与数据表、仪表盘及流程放在同一 Base 中；正文仍使用标准 Docx 数据模型。\n\n从 Base Block 资源目录按 `--type docx` 定位文档并取得 `docx_token`；正文读取、创建与编辑使用 `lark-doc`。\n\n## Folder Block\n\nFolder Block 只承担 Base 目录分组和层级组织。用 `+base-block-list --parent-id <folder_block_id>` 读取直接子项。\n\n## 通用执行契约\n\n- Update 先确认命令是完整替换还是 delta：完整替换使用可信当前配置做 read-modify-write，delta 只提交目标变更。\n- 优先用写入返回确认结果；返回不足以确认或任务明确要求核验时再读回目标。\n- 命令具有 confirmation gate 时，确认目标和影响后使用 `--yes`。\n\n## 不在本 Skill 范围\n\n- 认证、初始化、scope、身份切换和授权恢复 → `lark-shared`\n- Excel、CSV、`.base` 等本地文件与 Base 之间的导入/导出转 `lark-drive`；在线复制走 `+base-copy`\n- Base 内嵌 Docx 的正文编辑 → `lark-doc`；电子表格内容操作 → `lark-sheets`\n", "translation": "---\nname: lark-base\nversion: 1.2.23\ndescription: \"飛書多維表格（Base）操作：建表、欄位、記錄、檢視、統計、公式/lookup、表單、儀表盤、應用模式（BaseApp/AppMode 頁面與元件）、Workspace 目錄、workflow、角色許可權、模板中心（多維表格模板分類/列表/搜尋）；遇到 Base/多維表格/bitable、BaseApp/AppMode、/base/ 或 /app/ 連結時使用。BaseApp 不走 lark-apps；檔案匯入/匯出轉 lark-drive，認證/授權轉 lark-shared。\"\nmetadata:\n  requires:\n    bins: [\"lark-cli\"]\n  cliHelp: \"lark-cli base --help\"\n---\n\n# Base\n\n普通 Base 是資料容器，由一棵 Base Block 資源樹和 Base 級配置組成。`folder`、`table`、`docx`、`dashboard`、`workflow` 都是 Block 型別；Advanced Permission / Role 是 Base 級配置，不屬於 Block。Table 是其中承載業務資料的核心 Block。Workspace 是組織 Base 與 BaseApp 的外層容器；BaseApp（AppMode）透過 Page 和元件組織 Base 資料，不是 Base 的別名。\n\n## 身份選擇（優先）\n\n操作 Base 優先使用 `--as user`；使用者明確要求應用身份時使用 `--as bot`。許可權失敗按 `lark-shared` 以原身份修復 scope 或資源 ACL；只有使用者明確同意更換操作者時才切換身份。\n\n## 進入前必做：解析目標實體\n\n開始操作前先確定 `base_token` 和目標實體型別；上下文已提供 `<bitable>` / `<base_refer>` 標籤及資源 ID 時直接使用。其餘情況按意圖選擇入口：\n\n1. **URL 或分享連結：** `lark-cli base +url-resolve --url '<url>' --as user`。Base URL 根據返回的 `resource_type` / `block_type` 及 `table_id`、`view_id`、`record_id`、`dashboard_id`、`workflow_id`、`docx_token`、`share_token` 等座標進入對應模組；BaseApp `/app/` URL 返回 `app_token`，並在連結攜帶時返回 `workspace_token` 和 `page_id`。實體型別以解析結果為準。\n2. **Base 標題或關鍵詞：** `lark-cli base +title-resolve --title '<keyword>' --as user`。單一結果直接取得 `base_token`；多個候選結合標題、所有者和更新時間消歧，仍無法唯一確定時請使用者選擇。隨後按下方 Base Block 資源模型定位目標實體。\n3. **已有 Base 候選列表：** 使用者要列出已有 Base 候選，且需要按最近訪問、owner、建立人、時間、型別等維度篩選/排序時，轉 `lark-cli drive +search --doc-types bitable --as user`。按標題/關鍵詞定位單個 Base 仍用 `+title-resolve`。常見候選列表命令：\n   - 最近訪問：`lark-cli drive +search --doc-types bitable --sort open_time --opened-since 3m --page-size 20 --as user`\n   - 只列我擁有的：加 `--mine`；如果要列“我建立的”，用 `--created-by-me`。\n   - 從候選項拿到 URL 或 token 後，再用 `+url-resolve` 或 `+base-get` 進入 Base 業務命令。\n4. **BaseApp：** 優先使用真實 `/app/` URL；已有 `workspace_token` 時可用 `+workspace-entity-list --type baseapp` 定位。兩者都沒有時請使用者補充應用連結或 Workspace，不按名稱全域性猜測 `app_token`。\n\n**讀取 Base：** Base 資訊用 `+base-get`，資源目錄按下方 Base Block 資源模型讀取。\n\n**寫入 Base：** 建立新 Base 使用一次 `+base-create --name <base-name> --table-name <table-name> --fields '<field-array>'` 同時建立 Base、首表和 fields；`+base-copy` 複製整個 Base；Base 內資源統一按下方 Block 生命週期管理。\n\n## Base 模板中心\n\n模板中心是公開的 Base 模板庫，不是使用者雲空間裡的已有 Base。使用者想用現成模板建立新 Base，且沒有指向已有物件的錨點（沒有 Base URL、沒有“我的/最近訪問的表”、沒有具體已存在的 Base 名）時，可讀取 [lark-base-template-center.md](references/lark-base-template-center.md) 查詢模板中心模板；`+template-categories` 列出公開模板分類，`+template-list` 按分類列出公開模板，`+template-search` 按業務關鍵詞搜尋公開模板。\n\n## Base Block 資源模型\n\n```text\nBase\n├── Base Block 资源树\n│   ├── Table Block\n│   │   ├── Field schema\n│   │   ├── Records / CellValue\n│   │   ├── Views\n│   │   └── Forms / Questions\n│   ├── Dashboard Block（布局容器）\n│   │   └── Dashboard 内部 Blocks（图表、指标卡、文本）\n│   ├── Workflow Block\n│   │   └── Workflow definition（title、status、steps 执行图）\n│   ├── Docx Block → docx_token / lark-doc\n│   └── Folder Block → 子 Block\n└── Base 级配置\n    └── Advanced Permission / Roles\n```\n\n每個 Base Block 都有 `id`、`type`、可修改的 `name`、所在 Folder 的 `parent_id`，並在同級目錄中具有順序。`+base-block-list` 是統一發現入口；`+base-block-create` 建立 Block，`+base-block-rename` 修改名稱，`+base-block-move` 透過 `--parent-id` 調整目錄並透過 `--before-id` / `--after-id` 調整順序，`+base-block-delete` 刪除 Block。型別專屬內容再由對應模組命令處理。\n\n建立時已經明確型別專屬初始內容，可直接使用對應構造命令一次完成：Table 用 `+table-create --fields`，Dashboard 用 `+dashboard-create` 設定主題，Workflow 用 `+workflow-create --json` 提交完整定義；Folder 和 Docx 使用 `+base-block-create`。\n\nBlock 的 `id` 按型別直接作為對應模組座標：\n\n| Block type | 模組座標與內部內容 |\n|---|---|\n| `table` | `id` 即 `table_id`；內部包含 Field、Record、View 和 Form |\n| `dashboard` | `id` 即 `dashboard_id`；內部包含圖表、指標卡和文字等 Dashboard 元件 |\n| `workflow` | `id` 即 `workflow_id`；內部包含 title、status 和 steps 執行圖 |\n| `docx` | Block 另帶 `docx_token`；正文由 `lark-doc` 處理 |\n| `folder` | `id` 是目錄 Block ID，也可作為 `--parent-id`；只組織子 Block |\n\n## Table Block（The Core）\n\nTable 本身是 Base Block，也是 Base 的核心資料儲存層；Field、Record、View 和 Form 是 Table 內部物件，不是 Base Block。業務資料查詢、寫入、關聯、統計和分析都從 Table 開始。先用 `+table-list` 定位 Table；欄位名和目標已知的普通讀取可直接進入 Record 命令，只有寫入、篩選或關聯等依賴欄位型別/schema 的任務才補 `+field-list`。多表的 `+field-list` 可以併發執行。基礎的 Record / CellValue 讀寫直接按下方路徑；reference 只承載高階分析、完整協議和邊界細節。\n\n**讀取 Table：** `+table-list` 定位表，`+table-get` 讀取詳情。Table 專屬複製使用 `+table-copy`，非同步狀態用 `+table-copy-status`；schema 和 records 由下方內部物件操作。\n\nTable 下的大多數更新透過非同步鏈路生效，介面成功返回後立即讀取可能暫時看不到最新狀態。優先以寫入成功響應作為操作結果；任務必須確認最終狀態時，先完成本輪相關變更，再統一讀取驗收，避免逐項寫後立即讀回。\n\n### Field\n\nField 定義列 schema。`field_id` 是穩定列標識，`name` 是可修改的展示名稱；Formula、Lookup、Link、Select 等屬於 Field 型別或能力。\n\n**讀取 Field：** `+field-list` / `+field-get` / `+field-search-options`。**寫入 Field：** 已有 Table 中建立多個欄位時，優先向一次 `+field-create --json` 傳欄位物件陣列；單欄位更新和刪除用 `+field-update` / `+field-delete`。建立和更新分別讀取 [field-create](references/lark-base-field-create.md) / [field-update](references/lark-base-field-update.md)，由命令文件繼續路由 Field JSON、Formula 和 Lookup 協議。`欄位外掛` 用於擴充套件基礎欄位能力：按同一行其他欄位內容觸發 LLM 生成，並寫回已有目標欄位；當前已確認目標欄位支援文字、單選、數字，配置或觸發前先讀 [field-extension](references/lark-base-field-extension.md)。\n\n### Record\n\nRecord 是 Table 中的一行資料，包含該記錄在各個 Field 下的 CellValue。系統 `record_id` 是表內穩定、非空且唯一的主鍵，Table 的主欄位只是展示欄位。\n\n#### 1. 讀取記錄或單元格\n\n- 已知若干個 `record_id`：`+record-get --record-id <id1> --record-id <id2>`\n- 關鍵詞搜尋：`+record-search --keyword <text> --search-field <field>`；至少指定一個搜尋欄位。\n- 其餘讀取：`+record-list`；結構化條件和排序分別用 `--filter-json` / `--sort-json`。\n\n行數較大、需要服務端謂詞下推時，`--filter-json` 使用 tuple condition；最常用的篩選與完整日期範圍寫法：\n\n```jsonc\n{\n  \"logic\": \"and\", // 全部条件成立；任一条件成立改为 \"or\"\n  \"conditions\": [\n    [\"状态\", \"intersects\", [\"进行中\", \"暂停\"]], // Select 命中任一选项\n    [\"标题\", \"intersects\", \"urgent\"], // 文本包含\n    [\"备注\", \"non_empty\"], // 非空；判断为空改用 \"empty\"，两者都不传 value\n    [\"金额\", \">=\", 100], // 数字比较；支持 ==、!=、>、>=、<、<=\n    [\"关联项目\", \"intersects\", [{ \"id\": \"recxxx\" }]], // Link 包含目标记录\n    [\"业务日期\", \"==\", \"ExactDate(2026-08-07)\"], // 具体一天：按 Base 时区匹配 2026-08-07 当天\n    [\"发生时间\", \">\", \"ExactDate(2024-01-31 23:59:59.999)\"], // 日期不支持 >=；用 > 前一天最后一毫秒表达含当天的下界\n    [\"发生时间\", \"<\", \"ExactDate(2024-03-01 00:00:00)\"] // 2024 年 2 月范围上界：小于 3 月 1 日零点\n  ]\n}\n```\n\n完整運算子和各欄位取值結構讀取 [Filter 條件結構](references/lark-base-filter-condition.md)。\n\n所有讀取都重複傳 `--field-id` 做最小欄位投影，並統一寫入 NDJSON artifact：`--format ndjson --output <path>.ndjson`。每行是一條 Record JSON，stdout 摘要包含 `records_count` 和 `has_more` 用於分頁判斷。\n\n```bash\n# Example: 行数较大时先筛选 Status 包含 Doing 的记录，再导出 20 条作为局部预览\nlark-cli base +record-list \\\n  --base-token <base_token> --table-id <table_id> \\\n  --filter-json '{\"logic\":\"and\",\"conditions\":[[\"Status\",\"intersects\",[\"Doing\"]]]}' \\\n  --field-id Name --field-id Status --field-id Score --limit 20 \\\n  --format ndjson --output ./records-preview.ndjson --as user\n\nPREVIEW_ROWS=5\nhead -n \"$PREVIEW_ROWS\" ./records-preview.ndjson\ntail -n \"$PREVIEW_ROWS\" ./records-preview.ndjson\n```\n\n預計記錄數少於 500 行時，建議不做謂詞下推，直接拉取到本地用 jq 或 Python 處理；行數較大時可用 `--filter-json` 下推可表達的條件，正則、派生等無法下推的條件繼續在本地處理。\n\n```bash\n# jq：对服务端筛选结果追加名称格式筛选，再投影必要字段\njq -c 'select((.Name // \"\") | test(\"^Task-[0-9]+$\")) | {record_id, Name}' ./records-preview.ndjson\n\n# Python：按行读取并做简单汇总\npython3 - <<'PY'\nimport json\n\nwith open(\"records-preview.ndjson\", encoding=\"utf-8\") as stream:\n    rows = (json.loads(line) for line in stream if line.strip())\n    print(sum((row.get(\"Score\") or 0) for row in rows))\nPY\n```\n\n`--limit` 的預設值是 2000，最大值是 2000，通常無需手動指定 limit 引數；支援 `--offset` 引數；只有 `has_more=false` 且查詢範圍符合問題時，才能當作完整結果。大表完整讀取、View 範圍讀取、複雜 JOIN、集合/多值、時序、語義或專業統計分析時，讀取 [Record 查詢與分析 SOP](references/lark-base-record-query-and-analysis-sop.md)。\n\n#### 2. 新增記錄或更新記錄單元格\n\n一條 Record 是 `{欄位名或 field_id: CellValue}`，常見 CellValue：\n\n```jsonc\n{\n  \"标题\": \"Created from shortcut\", // text: string\n  \"待确认\": \"请 <at user_id=ou_123/> 确认\", // text(plain): 人员提及；实际 open_id 用 lark-contact 查询；不发送通知\n  \"官网\": \"[官网](https://example.com)\", // text(url): 裸 URL 或 Markdown link\n  \"联系电话\": \"13800000000\", // text(phone): 合法电话号码字符串\n  \"邮箱\": \"owner@example.com\", // text(email): 合法邮箱字符串\n  \"单选\": [\"Todo\"], // select: array<string>；单选时数组最多一个值；\n  \"标签\": [\"高优\", \"外部依赖\"], // 多选 select: array<string>；必须是当前字段存在的选项；\n  \"工时\": 8, // number: double，不经过格式化的纯数字\n  \"带时区时间\": \"2026-03-24T10:00:00+08:00\", // datetime：带时区，遵循传入的时区\n  \"不带时区时间\": \"2026-03-24 10:00\", // datetime：不带时区，自动按当前 Base 时区转换\n  \"毫秒时间戳\": 1774317600000, // datetime：也支持 Unix 毫秒时间戳\n  \"已完成\": false, // checkbox: boolean\n  \"负责人\": [{ \"id\": \"ou_123\" }], // user(multiple=false): 数组最多一个元素\n  \"协作人\": [{ \"id\": \"ou_123\" }, { \"id\": \"ou_456\" }], // user(multiple=true): 数组可包含多个元素\n  \"群聊\": [{ \"id\": \"oc_123\" }, { \"id\": \"oc_456\" }], // group_chat(multiple=true)\n  \"关联任务\": [{ \"id\": \"rec456\" }], // link: array<{id}>，record_id 来自目标表\n  \"坐标\": { \"lng\": 116.397428, \"lat\": 39.90923 }, // location: {lng,lat}\n  \"清空\": null, // 清空单元格，传 null\n  \"清空数组\": [] // 清空数组类单元格，空数组和 null 都可以\n}\n```\n\n附件使用專用 shortcut 上傳、下載或移除。created_at, updated_at, created_by, updated_by, auto_number, formula, lookup 型別欄位只讀，若誤寫入單元格會返回 `ignored_fields` 表示這些欄位被靜默過濾，其餘欄位正常寫入。\n\n```bash\n# 新增：成功时返回 record_id_list\nlark-cli base +record-batch-create \\\n  --base-token <base_token> --table-id <table_id> \\\n  --json '{\"create_records\":[{\"Name\":\"Task A\",\"Status\":[\"Todo\"]},{\"Name\":\"Task B\",\"Score\":20}]}' --as user\n\n# 更新：每条记录只提交要改变的字段\nlark-cli base +record-batch-update \\\n  --base-token <base_token> --table-id <table_id> \\\n  --json '{\"update_records\":{\"<record_id_a>\":{\"Status\":[\"Done\"]},\"<record_id_b>\":{\"Score\":100}}}' --as user\n```\n\n大 payload 可用指令碼生成 json 後用 `--json @file.json`。單批最多 200 條，超過後分批，同一 Table 序列寫入；並行可能觸發 `1254291` 併發衝突錯誤。\n\n#### 3. 其他 Record 操作\n\n- `+record-delete --base-token <base_token> --table-id <table_id> --record-id <id1> --record-id <id2>` 刪除若干個記錄\n- `+record-share-link-create --base-token <base_token> --table-id <table_id> --record-id <id1> --record-id <id2>` 建立記錄分享連結\n- `+record-history-list` 查詢單條記錄的變更事件，讀取 [歷史記錄協議](references/lark-base-record-history-list.md)\n- 附件必須使用 `+record-upload-attachment` / `+record-download-attachment` / `+record-remove-attachment` 操作。\n\n### View\n\nView 共享 Table 的底層記錄；沒有特殊展示需求時優先使用 `grid`。讀取已有檢視用 `+view-list` / `+view-get`。\n\n**所有 View 編輯前必讀 [View 型別與生命週期](references/lark-base-view.md)**，包括建立、改名、配置修改（篩選、排序、分組、欄位顯隱、時間條、卡片）和刪除。檢視選型、適用配置及完整操作示例統一在該 reference 中。\n\n### Form\n\nForm 依附於 Table，以 Field 作

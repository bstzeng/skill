<script id="data" type="application/json">{"updated": "2026-10-29", "method": "Skills.sh 全站安裝排行（取自 LinklyAI/best-skills 每日鏡像）去重後取前段，同系列（飛書 lark-*、HyperFrames）最多收 2–3 個，再以 Anthropic 官方、OpenAI Codex 官方與 Awesome Claude 精選清單中的代表作補足 50 個。", "skills": [{"rank": 1, "slug": "find-skills", "title": "技能搜尋器", "category": "技能管理", "tags": ["技能搜尋", "套件管理", "skills CLI", "入門必裝"], "summary": "當你問「有沒有能做 X 的 skill」時，幫你在開放的 Agent Skills 生態系中搜尋、評估品質並安裝合適的 skill。是 skills.sh 上安裝數最多的 skill。", "usage": "- 安裝：`npx skills add https://github.com/vercel-labs/skills --skill find-skills`\n- 直接用自然語言詢問代理：「有沒有幫我寫 changelog 的 skill？」\n- 代理會先查 skills.sh 排行榜，再執行 `npx skills find <關鍵字>`，依安裝數、來源信譽、GitHub 星數篩選後推薦\n- 你同意後，代理會執行 `npx skills add <owner/repo@skill> -g -y` 幫你安裝", "sites": ["Skills.sh"], "repo": "vercel-labs/skills", "path": "skills/find-skills/SKILL.md", "github_url": "https://github.com/vercel-labs/skills/blob/main/skills/find-skills/SKILL.md", "skillssh_url": "https://skills.sh/vercel-labs/skills/find-skills", "skillssh_rank": 1, "installs": 4096323, "license": "MIT", "redistributable": true, "description_en": "Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionality that might exist as an installable skill.", "description_zh": "當使用者問「我要怎麼做 X」「幫我找一個做 X 的 skill」「有沒有能……的 skill」，或表示想擴充能力時，協助使用者探索並安裝代理技能（agent skills）。當使用者在尋找可能以可安裝 skill 形式存在的功能時，就應使用本技能。", "original": "---\nname: find-skills\ndescription: Helps users discover and install agent skills when they ask questions like \"how do I do X\", \"find a skill for X\", \"is there a skill that can...\", or express interest in extending capabilities. This skill should be used when the user is looking for functionality that might exist as an installable skill.\n---\n\n# Find Skills\n\nThis skill helps you discover and install skills from the open agent skills ecosystem.\n\n## When to Use This Skill\n\nUse this skill when the user:\n\n- Asks \"how do I do X\" where X might be a common task with an existing skill\n- Says \"find a skill for X\" or \"is there a skill for X\"\n- Asks \"can you do X\" where X is a specialized capability\n- Expresses interest in extending agent capabilities\n- Wants to search for tools, templates, or workflows\n- Mentions they wish they had help with a specific domain (design, testing, deployment, etc.)\n\n## What is the Skills CLI?\n\nThe Skills CLI (`npx skills`) is the package manager for the open agent skills ecosystem. Skills are modular packages that extend agent capabilities with specialized knowledge, workflows, and tools.\n\n**Key commands:**\n\n- `npx skills find [query] [--owner <owner>]` - Search for skills interactively or by keyword, optionally scoped to a GitHub owner\n- `npx skills add <package>` - Install a skill from GitHub or other sources\n- `npx skills update` - Update all installed skills\n\n**Browse skills at:** https://skills.sh/\n\n## How to Help Users Find Skills\n\n### Step 1: Understand What They Need\n\nWhen a user asks for help with something, identify:\n\n1. The domain (e.g., React, testing, design, deployment)\n2. The specific task (e.g., writing tests, creating animations, reviewing PRs)\n3. Whether this is a common enough task that a skill likely exists\n\n### Step 2: Check the Leaderboard First\n\nBefore running a CLI search, check the [skills.sh leaderboard](https://skills.sh/) to see if a well-known skill already exists for the domain. The leaderboard ranks skills by total installs, surfacing the most popular and battle-tested options.\n\nFor example, top skills for web development include:\n- `vercel-labs/agent-skills` — React, Next.js, web design (100K+ installs each)\n- `anthropics/skills` — Frontend design, document processing (100K+ installs)\n\n### Step 3: Search for Skills\n\nIf the leaderboard doesn't cover the user's need, run the find command:\n\n```bash\nnpx skills find [query] [--owner <owner>]\n```\n\nFor example:\n\n- User asks \"how do I make my React app faster?\" → `npx skills find react performance`\n- User asks \"can you help me with PR reviews?\" → `npx skills find pr review`\n- User asks \"I need to create a changelog\" → `npx skills find changelog`\n\n### Step 4: Verify Quality Before Recommending\n\n**Do not recommend a skill based solely on search results.** Always verify:\n\n1. **Install count** — Prefer skills with 1K+ installs. Be cautious with anything under 100.\n2. **Source reputation** — Official sources (`vercel-labs`, `anthropics`, `microsoft`) are more trustworthy than unknown authors.\n3. **GitHub stars** — Check the source repository. A skill from a repo with <100 stars should be treated with skepticism.\n\n### Step 5: Present Options to the User\n\nWhen you find relevant skills, present them to the user with:\n\n1. The skill name and what it does\n2. The install count and source\n3. The install command they can run\n4. A link to learn more at skills.sh\n\nExample response:\n\n```\nI found a skill that might help! The \"react-best-practices\" skill provides\nReact and Next.js performance optimization guidelines from Vercel Engineering.\n(185K installs)\n\nTo install it:\nnpx skills add vercel-labs/agent-skills@react-best-practices\n\nLearn more: https://skills.sh/vercel-labs/agent-skills/react-best-practices\n```\n\n### Step 6: Offer to Install\n\nIf the user wants to proceed, you can install the skill for them:\n\n```bash\nnpx skills add <owner/repo@skill> -g -y\n```\n\nThe `-g` flag installs globally (user-level) and `-y` skips confirmation prompts.\n\n## Common Skill Categories\n\nWhen searching, consider these common categories:\n\n| Category        | Example Queries                          |\n| --------------- | ---------------------------------------- |\n| Web Development | react, nextjs, typescript, css, tailwind |\n| Testing         | testing, jest, playwright, e2e           |\n| DevOps          | deploy, docker, kubernetes, ci-cd        |\n| Documentation   | docs, readme, changelog, api-docs        |\n| Code Quality    | review, lint, refactor, best-practices   |\n| Design          | ui, ux, design-system, accessibility     |\n| Productivity    | workflow, automation, git                |\n\n## Tips for Effective Searches\n\n1. **Use specific keywords**: \"react testing\" is better than just \"testing\"\n2. **Try alternative terms**: If \"deploy\" doesn't work, try \"deployment\" or \"ci-cd\"\n3. **Check popular sources**: Many skills come from `vercel-labs/agent-skills` or `ComposioHQ/awesome-claude-skills`\n\n## When No Skills Are Found\n\nIf no relevant skills exist:\n\n1. Acknowledge that no existing skill was found\n2. Offer to help with the task directly using your general capabilities\n3. Suggest the user could create their own skill with `npx skills init`\n\nExample:\n\n```\nI searched for skills related to \"xyz\" but didn't find any matches.\nI can still help you with this task directly! Would you like me to proceed?\n\nIf this is something you do often, you could create your own skill:\nnpx skills init my-xyz-skill\n```\n", "translation": "---\nname: find-skills\ndescription: 當使用者問「我要怎麼做 X」「幫我找一個做 X 的 skill」「有沒有能……的 skill」，或表示想擴充能力時，協助使用者探索並安裝代理技能（agent skills）。當使用者在尋找可能以可安裝 skill 形式存在的功能時，就應使用本技能。\n---\n\n# 尋找技能（Find Skills）\n\n本技能協助你從開放的代理技能生態系中探索並安裝技能。\n\n## 何時使用本技能\n\n當使用者有以下情況時使用本技能：\n\n- 問「我要怎麼做 X」，而 X 可能是已有現成 skill 的常見任務\n- 說「幫我找一個做 X 的 skill」或「有沒有做 X 的 skill」\n- 問「你能不能做 X」，而 X 是一項專門能力\n- 表示有興趣擴充代理的能力\n- 想搜尋工具、範本或工作流程\n- 提到希望在某個特定領域（設計、測試、部署等）得到協助\n\n## 什麼是 Skills CLI？\n\nSkills CLI（`npx skills`）是開放代理技能生態系的套件管理器。Skill 是模組化的套件，透過專門知識、工作流程與工具來擴充代理的能力。\n\n**主要指令：**\n\n- `npx skills find [query] [--owner <owner>]` — 以互動方式或關鍵字搜尋技能，可選擇限定某個 GitHub 擁有者\n- `npx skills add <package>` — 從 GitHub 或其他來源安裝技能\n- `npx skills update` — 更新所有已安裝的技能\n\n**瀏覽技能：** https://skills.sh/\n\n## 如何協助使用者尋找技能\n\n### 步驟 1：了解他們需要什麼\n\n當使用者請求協助時，先辨識：\n\n1. 領域（例如 React、測試、設計、部署）\n2. 具體任務（例如撰寫測試、製作動畫、審查 PR）\n3. 這是否是夠常見、很可能已有 skill 的任務\n\n### 步驟 2：先看排行榜\n\n在執行 CLI 搜尋之前，先查看 [skills.sh 排行榜](https://skills.sh/)，確認該領域是否已有知名的 skill。排行榜依總安裝數排序，會呈現最熱門、最經得起考驗的選項。\n\n例如網頁開發的熱門技能包括：\n- `vercel-labs/agent-skills` — React、Next.js、網頁設計（每個都超過 10 萬次安裝）\n- `anthropics/skills` — 前端設計、文件處理（超過 10 萬次安裝）\n\n### 步驟 3：搜尋技能\n\n如果排行榜沒有涵蓋使用者的需求，就執行 find 指令：\n\n```bash\nnpx skills find [query] [--owner <owner>]\n```\n\n例如：\n\n- 使用者問「怎麼讓我的 React app 更快？」→ `npx skills find react performance`\n- 使用者問「你能幫我做 PR 審查嗎？」→ `npx skills find pr review`\n- 使用者問「我需要建立 changelog」→ `npx skills find changelog`\n\n### 步驟 4：推薦前先驗證品質\n\n**不要只根據搜尋結果就推薦技能。** 一定要驗證：\n\n1. **安裝數** — 優先選擇安裝數 1K 以上的技能，低於 100 的要謹慎。\n2. **來源信譽** — 官方來源（`vercel-labs`、`anthropics`、`microsoft`）比不知名作者更可信。\n3. **GitHub 星數** — 查看來源儲存庫。星數低於 100 的 repo 所提供的技能應抱持懷疑。\n\n### 步驟 5：向使用者呈現選項\n\n找到相關技能時，向使用者呈現：\n\n1. 技能名稱與功能\n2. 安裝數與來源\n3. 可以執行的安裝指令\n4. 到 skills.sh 了解更多的連結\n\n回覆範例：\n\n```\nI found a skill that might help! The \"react-best-practices\" skill provides\nReact and Next.js performance optimization guidelines from Vercel Engineering.\n(185K installs)\n\nTo install it:\nnpx skills add vercel-labs/agent-skills@react-best-practices\n\nLearn more: https://skills.sh/vercel-labs/agent-skills/react-best-practices\n```\n\n### 步驟 6：主動提議安裝\n\n如果使用者想繼續，你可以幫他們安裝：\n\n```bash\nnpx skills add <owner/repo@skill> -g -y\n```\n\n`-g` 旗標代表全域（使用者層級）安裝，`-y` 則略過確認提示。\n\n## 常見技能類別\n\n搜尋時可參考以下常見類別：\n\n| 類別       | 搜尋關鍵字範例                           |\n| ---------- | ---------------------------------------- |\n| 網頁開發   | react, nextjs, typescript, css, tailwind |\n| 測試       | testing, jest, playwright, e2e           |\n| DevOps     | deploy, docker, kubernetes, ci-cd        |\n| 文件       | docs, readme, changelog, api-docs        |\n| 程式碼品質 | review, lint, refactor, best-practices   |\n| 設計       | ui, ux, design-system, accessibility     |\n| 生產力     | workflow, automation, git                |\n\n## 有效搜尋的技巧\n\n1. **使用具體關鍵字**：「react testing」比單純「testing」好\n2. **嘗試替代詞彙**：如果「deploy」找不到，試試「deployment」或「ci-cd」\n3. **查看熱門來源**：許多技能來自 `vercel-labs/agent-skills` 或 `ComposioHQ/awesome-claude-skills`\n\n## 找不到技能時\n\n如果沒有相關技能：\n\n1. 承認沒有找到現成的技能\n2. 主動提議直接用你的通用能力協助完成任務\n3. 建議使用者可以用 `npx skills init` 建立自己的技能\n\n範例：\n\n```\nI searched for skills related to \"xyz\" but didn't find any matches.\nI can still help you with this task directly! Would you like me to proceed?\n\nIf this is something you do often, you could create your own skill:\nnpx skills init my-xyz-skill\n```"}, {"rank": 2, "slug": "grill-me", "title": "拷問式訪談", "category": "需求與規劃", "tags": ["需求釐清", "設計審查", "訪談", "Matt Pocock"], "summary": "以毫不留情的連續追問，幫你把計畫或設計方案磨得更銳利。本身只是一個入口，實際呼叫 grilling 技能執行。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill grill-me`（建議同時安裝 grilling）\n- 這個 skill 設定為 `disable-model-invocation`，只能由你手動輸入 `/grill-me` 觸發\n- 適合在動工前，先把一份計畫、PRD 或架構想法丟給代理，讓它一題一題逼問直到所有決策都講清楚", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/productivity/grill-me/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/productivity/grill-me/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/grill-me", "skillssh_rank": 2, "installs": 1454486, "license": "MIT", "redistributable": true, "description_en": "A relentless interview to sharpen a plan or design.", "description_zh": "毫不留情的訪談，用來把計畫或設計磨得更銳利。", "original": "---\nname: grill-me\ndescription: A relentless interview to sharpen a plan or design.\ndisable-model-invocation: true\n---\n\nCall the Skill tool with \"grilling\".\n", "translation": "---\nname: grill-me\ndescription: 毫不留情的訪談，用來把計畫或設計磨得更銳利。\ndisable-model-invocation: true\n---\n\n用「grilling」呼叫 Skill 工具。"}, {"rank": 3, "slug": "hyperframes-cli", "title": "HyperFrames 指令工具", "category": "影片與多媒體", "tags": ["影片製作", "CLI", "渲染", "時間軸編輯", "HeyGen", "HyperFrames"], "summary": "HeyGen 開源的 HyperFrames（用 HTML 渲染影片）CLI 使用指南，依工作分類：建立專案、檢查、看影格、編輯時間軸、預覽、本機或雲端渲染、發布、專案歷史，以及建置/渲染失敗時的排除方法。", "usage": "- 安裝：`npx skills add https://github.com/heygen-com/hyperframes --skill hyperframes-cli`（建議與 hyperframes 一起裝）\n- 需要 Node.js 22+ 與 FFmpeg\n- 工作循環：`lint` → `check --json` 修完所有錯誤 → `snapshot` 看截圖 → `preview --background` 給你預覽 → 你核准後 `render --quality delivery`\n- 時間軸修改可先加 `--plan` 預覽，每次修改都能 `history undo`", "sites": ["Skills.sh"], "repo": "heygen-com/hyperframes", "path": "skills/hyperframes-cli/SKILL.md", "github_url": "https://github.com/heygen-com/hyperframes/blob/main/skills/hyperframes-cli/SKILL.md", "skillssh_url": "https://skills.sh/heygen-com/hyperframes/hyperframes-cli", "skillssh_rank": 3, "installs": 1306005, "license": "Apache-2.0", "redistributable": true, "description_en": "The HyperFrames CLI by job - scaffold, check, look at frames, edit the timeline, preview, render locally or in the cloud, publish, project history - plus reading its JSON and recovering from build or render failures.", "description_zh": "依工作分類的 HyperFrames CLI——建立骨架、檢查、查看影格、編輯時間軸、預覽、本機或雲端渲染、發布、專案歷史——以及讀取其 JSON 輸出與從建置或渲染失敗中恢復。", "original": "---\nname: hyperframes-cli\ndescription: The HyperFrames CLI by job - scaffold, check, look at frames, edit the timeline, preview, render locally or in the cloud, publish, project history - plus reading its JSON and recovering from build or render failures.\n---\n\n**Plugin installs:** Before setup or freshness commands, follow [plugin execution rules](../hyperframes/references/plugin-installation.md) when this skill is inside a HyperFrames plugin.\n\n# HyperFrames CLI\n\nRun `npx hyperframes <command>` unless the project gives a wrapper; then use the wrapper. It needs Node.js 22+ and FFmpeg. Every command has `--help`; most take `--json`, and a failure prints `✗ …`, a `Fix:` line and exits non-zero.\n\n## Commands by job\n\n| Job | Commands |\n| --- | --- |\n| Start | `init <dir>` (blank; `--example <name>` only when asked), `capture <url>` |\n| Read a project | `info`, `compositions`, `timeline --json`, `docs <topic>` |\n| Check it | `lint` while writing; `check --json` as the gate (lint, runtime, layout, contrast) |\n| Look at it | `snapshot` (`--at <t,…>`, `--range START,END`, `--composition <id>`, `--zoom`, `--angle`, `--against <video>`), `keyframes`, `compare`, `audio` |\n| Edit the timeline | `timeline` with `move`, `trim`, `split`, `set`, `duplicate`, `delete`, `apply`, `undo`, `ids` |\n| Reuse | `catalog`, `add` (`/hyperframes-registry`) |\n| Media and sound | `media-treatment`, `grade-compare`, `remove-background`, `tts`, `transcribe`, `beats`, `normalize-audio` (`/media-use`) |\n| Show and ship | `preview`, `present` (`/slideshow`), `render`, `publish`, `cloud`, `lambda`, `cloudrun` |\n| Desktop app | `open`, `catch-up` |\n| Upkeep | `doctor`, `browser`, `upgrade`, `skills`, `usage`, `clean`, `feedback` |\n\n`validate`, `inspect` and `layout` are deprecated aliases of `check`; `events` is telemetry for skills' own scripts. Don't run them.\n\n## The loop\n\n1. Write, then `npx hyperframes lint` after the first pass and after structural changes.\n2. `npx hyperframes check --json` and fix every error. While a lint error remains the layout and contrast audits don't run; \"0 samples\" means nothing was checked. Contrast failures carry a `suggestedColor`. A finding at a single sample (an entrance in flight) is info; a 3 s+ video with no visible change fails `sweep_static`.\n3. `npx hyperframes snapshot` and read the PNGs (under `.hyperframes/artifacts/snapshots/`): that is how you see the video. With sub-compositions, snapshot a midpoint of every scene; tiny unstyled content or a missing hero is a mount defect (`../hyperframes/references/format.md`).\n4. `npx hyperframes preview --background`, check the URL answers 200, give the person the project URL and wait, unless they asked for the file or for no stops. Passing checks alone is not a reason to render.\n5. When it is time to render (step 4): `npx hyperframes render --quality looks --output out.mp4` (`draft` while iterating, `delivery` for the final). Confirm the file is non-empty and its `ffprobe` duration matches the root `data-duration`, then look at decoded frames.\n\n\"This element\" or the current selection: `npx hyperframes preview --context --json --context-fields selection`; `no-selection` means ask them to click it.\n\n## Edit the timeline\n\nThese are the edits Studio itself makes, so the result stays in Studio's shape.\n\n- `timeline --json` lists clips with absolute `absStart`/`absEnd`, owning `file` and the `#id` ref the edit commands take (`timeline ids` stamps missing ids).\n- `timeline move|trim|split|set|duplicate|delete <ref> … --plan --json` previews one edit; run it again without `--plan`. `--start`, `--end`, `--duration` set one edge or the length.\n- An edit is refused when the clip would overlap a neighbour (`--overwrite`, or move the neighbour first) or end past its composition: raise the root's `data-duration` first. No command changes `data-duration`.\n- Several edits at once: a JSON file such as `[{\"verb\": \"move\", \"ref\": \"#outro\", \"time\": \"9\"}]`, then `timeline apply plan.json --json`. Each run prints a `receipt`; save it and `timeline undo receipt.json` reverts it.\n\n<!-- history (trial): remove this block together with the command -->\n\n## Project history\n\nEvery write is kept and can be undone. At the start of a turn, `npx hyperframes history begin --who <you> --label \"<plan>\"`, then `history --since mine --who <you>` to see what the person changed; build on their edits. A check failed or they say it got worse: `history undo --who <you>`, never hand-edit back. End the turn with `history end`.\n\n<!-- /history (trial) -->\n\n## Render where\n\n| Need | Command |\n| --- | --- |\n| Local | `render --quality looks --output out.mp4` (`draft`, `delivery`) |\n| Reproducible container | `render --docker --strict --output out.mp4` |\n| Batch from variables | `render --batch rows.json --output \"renders/{name}.mp4\"` |\n| Hosted, no local Chrome or FFmpeg | `cloud render` (`references/cloud.md`) |\n| Your own AWS or GCP | `lambda render`, `cloudrun render` (`references/lambda.md`, `references/cloudrun.md`) |\n\nA 30 s film renders in a minute or two: run it in the foreground. Detach only a render longer than your tool's timeout (`HYPERFRAMES_RENDER_DETACHED=1`, its own group, output to a log) and wait with `until grep -qE 'Render (complete|failed)' render.log; do sleep 5; done`, never `pgrep -f`, which matches its own loop and waits until the tool times out.\n\nAfter a verified render, send one `feedback --rating`, plus a report for anything the person asked for that HyperFrames can't do, unless telemetry is off: `references/feedback.md`.\n\n## When a command fails\n\n| Symptom | Fix |\n| --- | --- |\n| Chrome missing or won't start | `npx hyperframes browser ensure`; `doctor --json` always exits 0, gate on `.ok` |\n| A heavy page isn't ready in time | Raise `--timeout` on `check` or `snapshot` |\n| Unusual codec looks blank | Keep `--proxy` on (the default) |\n| Render slow on Linux | The summary's second line says `screenshot` + `software gpu`: the slow path |\n| `capture` fails or writes `BLOCKED.md` | Take nothing from its partial files; retry into a new `-o` folder |\n| Disk tight | `clean --dry-run`, then `clean`; never delete `.hyperframes` (it holds history) |\n\n## References\n\nRead the row before running its command.\n\n| Commands | Read |\n| --- | --- |\n| `init`, `capture`, `skills` | `references/init-and-scaffold.md` |\n| `lint`, `check`, motion sidecars, `snapshot` | `references/lint-validate-inspect.md` |\n| `compare`, `grade-compare`, `render --batch` | `references/compare-and-batch.md` |\n| `beats` | `references/beats.md` |\n| `preview`, `play`, `render`, `publish`, Studio context | `references/preview-render.md` |\n| `doctor`, `browser` | `references/doctor-browser.md` |\n| `auth`, `cloud`, template variables | `references/cloud.md` |\n| `lambda`, `cloudrun` | `references/lambda.md`, `references/cloudrun.md` |\n| `info`, `upgrade`, `compositions`, `timeline`, `docs`, `usage`, telemetry | `references/upgrade-info-misc.md` |\n| `--strict` flags, run ids, `clean`, shader lint, JSON paths | `references/conventions.md` |\n| `keyframes` | `../hyperframes/references/motion.md` (Seeing motion) |\n", "translation": "---\nname: hyperframes-cli\ndescription: 依工作分類的 HyperFrames CLI——建立骨架、檢查、查看影格、編輯時間軸、預覽、本機或雲端渲染、發布、專案歷史——以及讀取其 JSON 輸出與從建置或渲染失敗中恢復。\n---\n\n**外掛安裝：** 當本技能位於 HyperFrames 外掛中時，在執行設定或更新指令之前，請遵循[外掛執行規則](../hyperframes/references/plugin-installation.md)。\n\n# HyperFrames CLI\n\n執行 `npx hyperframes <command>`，除非專案提供了包裝指令；那就用包裝指令。需要 Node.js 22+ 與 FFmpeg。每個指令都有 `--help`；大多數接受 `--json`，失敗時會印出 `✗ …` 與一行 `Fix:`，並以非零狀態碼結束。\n\n## 依工作分類的指令\n\n| 工作 | 指令 |\n| --- | --- |\n| 開始 | `init <dir>`（空白專案；只有被要求時才用 `--example <name>`）、`capture <url>` |\n| 讀取專案 | `info`、`compositions`、`timeline --json`、`docs <topic>` |\n| 檢查 | 撰寫時用 `lint`；以 `check --json` 作為關卡（lint、執行期、版面、對比） |\n| 查看 | `snapshot`（`--at <t,…>`、`--range START,END`、`--composition <id>`、`--zoom`、`--angle`、`--against <video>`）、`keyframes`、`compare`、`audio` |\n| 編輯時間軸 | `timeline` 搭配 `move`、`trim`、`split`、`set`、`duplicate`、`delete`、`apply`、`undo`、`ids` |\n| 重用 | `catalog`、`add`（`/hyperframes-registry`） |\n| 媒體與聲音 | `media-treatment`、`grade-compare`、`remove-background`、`tts`、`transcribe`、`beats`、`normalize-audio`（`/media-use`） |\n| 展示與交付 | `preview`、`present`（`/slideshow`）、`render`、`publish`、`cloud`、`lambda`、`cloudrun` |\n| 桌面應用程式 | `open`、`catch-up` |\n| 維護 | `doctor`、`browser`、`upgrade`、`skills`、`usage`、`clean`、`feedback` |\n\n`validate`、`inspect` 與 `layout` 是 `check` 已棄用的別名；`events` 是給技能自身腳本用的遙測。不要執行它們。\n\n## 工作循環\n\n1. 撰寫，然後在第一輪之後與結構變更之後執行 `npx hyperframes lint`。\n2. 執行 `npx hyperframes check --json` 並修正每一個錯誤。只要還有 lint 錯誤，版面與對比稽核就不會執行；「0 samples」代表什麼都沒檢查到。對比失敗會附帶 `suggestedColor`。只出現在單一取樣點的發現（進場動畫進行中）屬於資訊；3 秒以上卻沒有可見變化的影片會讓 `sweep_static` 失敗。\n3. 執行 `npx hyperframes snapshot` 並閱讀 PNG（在 `.hyperframes/artifacts/snapshots/` 下）：這就是你「看」影片的方式。有子合成時，為每個場景的中點拍快照；極小又沒有樣式的內容或缺少主視覺，代表掛載有缺陷（`../hyperframes/references/format.md`）。\n4. 執行 `npx hyperframes preview --background`，確認該 URL 回應 200，把專案 URL 交給使用者並等待，除非他們要求直接給檔案或不要中途停下。光是檢查通過並不是渲染的理由。\n5. 到了要渲染的時候（步驟 4）：`npx hyperframes render --quality looks --output out.mp4`（反覆修改時用 `draft`，最終版用 `delivery`）。確認檔案不是空的、其 `ffprobe` 長度與根層級的 `data-duration` 相符，然後查看解碼後的影格。\n\n「這個元素」或目前的選取：`npx hyperframes preview --context --json --context-fields selection`；`no-selection` 代表要請他們點選它。\n\n## 編輯時間軸\n\n這些就是 Studio 本身會做的編輯，所以結果會維持 Studio 的格式。\n\n- `timeline --json` 列出各片段的絕對 `absStart`/`absEnd`、所屬的 `file`，以及編輯指令接受的 `#id` 參照（`timeline ids` 會補上缺少的 id）。\n- `timeline move|trim|split|set|duplicate|delete <ref> … --plan --json` 預覽一次編輯；再去掉 `--plan` 執行一次。`--start`、`--end`、`--duration` 設定某一邊或長度。\n- 如果片段會與相鄰片段重疊（使用 `--overwrite`，或先移動相鄰片段），或結束時間超過其合成，編輯會被拒絕：先調高根層級的 `data-duration`。沒有任何指令會更改 `data-duration`。\n- 一次多項編輯：寫一個 JSON 檔，例如 `[{\"verb\": \"move\", \"ref\": \"#outro\", \"time\": \"9\"}]`，然後執行 `timeline apply plan.json --json`。每次執行都會印出一份 `receipt`；保存它，用 `timeline undo receipt.json` 即可還原。\n\n<!-- history (trial): remove this block together with the command -->\n\n## 專案歷史\n\n每次寫入都會被保留並可復原。在每一輪開始時執行 `npx hyperframes history begin --who <you> --label \"<plan>\"`，然後用 `history --since mine --who <you>` 查看使用者改了什麼；在他們的修改之上繼續。檢查失敗或他們說變差了：執行 `history undo --who <you>`，絕不手動改回去。以 `history end` 結束這一輪。\n\n<!-- /history (trial) -->\n\n## 在哪裡渲染\n\n| 需求 | 指令 |\n| --- | --- |\n| 本機 | `render --quality looks --output out.mp4`（`draft`、`delivery`） |\n| 可重現的容器 | `render --docker --strict --output out.mp4` |\n| 依變數批次渲染 | `render --batch rows.json --output \"renders/{name}.mp4\"` |\n| 雲端託管，本機不需 Chrome 或 FFmpeg | `cloud render`（`references/cloud.md`） |\n| 你自己的 AWS 或 GCP | `lambda render`、`cloudrun render`（`references/lambda.md`、`references/cloudrun.md`） |\n\n30 秒的影片一兩分鐘就能渲染完：在前景執行。只有渲染時間超過你工具的逾時限制時才分離執行（`HYPERFRAMES_RENDER_DETACHED=1`、獨立的程序群組、輸出到日誌），並用 `until grep -qE 'Render (complete|failed)' render.log; do sleep 5; done` 等待；絕不用 `pgrep -f`，它會匹配到自己的迴圈，一直等到工具逾時。\n\n渲染驗證完成後，送出一次 `feedback --rating`，並針對使用者要求但 HyperFrames 做不到的事送出回報，除非遙測已關閉：`references/feedback.md`。\n\n## 指令失敗時\n\n| 症狀 | 修正 |\n| --- | --- |\n| 找不到 Chrome 或無法啟動 | `npx hyperframes browser ensure`；`doctor --json` 一律以 0 結束，請以 `.ok` 判斷 |\n| 很重的頁面來不及準備好 | 調高 `check` 或 `snapshot` 的 `--timeout` |\n| 少見的編碼看起來一片空白 | 保持 `--proxy` 開啟（預設值） |\n| 在 Linux 上渲染很慢 | 摘要第二行顯示 `screenshot` + `software gpu`：那是慢速路徑 |\n| `capture` 失敗或寫出 `BLOCKED.md` | 不要採用它的任何部分檔案；改用新的 `-o` 資料夾重試 |\n| 磁碟空間緊張 | 先 `clean --dry-run`，再 `clean`；絕不刪除 `.hyperframes`（裡面存有歷史） |\n\n## 參考資料\n\n執行某指令前先閱讀該列對應的文件。\n\n| 指令 | 閱讀 |\n| --- | --- |\n| `init`、`capture`、`skills` | `references/init-and-scaffold.md` |\n| `lint`、`check`、motion sidecar、`snapshot` | `references/lint-validate-inspect.md` |\n| `compare`、`grade-compare`、`render --batch` | `references/compare-and-batch.md` |\n| `beats` | `references/beats.md` |\n| `preview`、`play`、`render`、`publish`、Studio 脈絡 | `references/preview-render.md` |\n| `doctor`、`browser` | `references/doctor-browser.md` |\n| `auth`、`cloud`、模板變數 | `references/cloud.md` |\n| `lambda`、`cloudrun` | `references/lambda.md`、`references/cloudrun.md` |\n| `info`、`upgrade`、`compositions`、`timeline`、`docs`、`usage`、遙測 | `references/upgrade-info-misc.md` |\n| `--strict` 旗標、run id、`clean`、shader lint、JSON 路徑 | `references/conventions.md` |\n| `keyframes` | `../hyperframes/references/motion.md`（觀察動態） |"}, {"rank": 4, "slug": "agent-browser", "title": "AI 代理瀏覽器", "category": "瀏覽器與測試自動化", "tags": ["瀏覽器自動化", "爬蟲", "E2E 測試", "Electron", "Vercel"], "summary": "給 AI 代理用的高速瀏覽器自動化 CLI（Rust 實作，透過 CDP 控制 Chrome），可開網頁、填表單、點按鈕、截圖、擷取資料，也能操作 Slack、VS Code 等 Electron 桌面 App。", "usage": "- 安裝 skill：`npx skills add https://github.com/vercel-labs/agent-browser --skill agent-browser`\n- 安裝 CLI：`npm i -g agent-browser && agent-browser install`\n- 對代理說「打開某網站登入後截圖」「幫我測這個 web app」即可觸發\n- 代理會先執行 `agent-browser skills get core` 取得與版本相符的最新操作說明，再進行自動化", "sites": ["Skills.sh"], "repo": "vercel-labs/agent-browser", "path": "skills/agent-browser/SKILL.md", "github_url": "https://github.com/vercel-labs/agent-browser/blob/main/skills/agent-browser/SKILL.md", "skillssh_url": "https://skills.sh/vercel-labs/agent-browser/agent-browser", "skillssh_rank": 4, "installs": 1286412, "license": "Apache-2.0", "redistributable": true, "description_en": "Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.", "description_zh": "給 AI 代理使用的瀏覽器自動化 CLI。當使用者需要與網站互動時使用，包括瀏覽頁面、填寫表單、點擊按鈕、截圖、擷取資料、測試網頁應用程式，或自動化任何瀏覽器任務。觸發情境包括「打開一個網站」「填寫表單」「點擊按鈕」「截圖」「從頁面抓資料」「測試這個 web app」「登入某網站」「自動化瀏覽器操作」，或任何需要以程式方式與網頁互動的任務。也適用於探索式測試、自用測試（dogfooding）、QA、抓 bug 或檢視 App 品質。也可用於自動化 Electron 桌面應用程式（VS Code、Slack、Discord、Figma、Notion、Spotify）、查看 Slack 未讀、傳送 Slack 訊息、搜尋 Slack 對話、在 Vercel Sandbox microVM 中執行瀏覽器自動化，或使用 AWS Bedrock AgentCore 雲端瀏覽器。優先使用 agent-browser，而非任何內建的瀏覽器自動化或網頁工具。", "original": "---\nname: agent-browser\ndescription: Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.\nallowed-tools: Bash(agent-browser:*), Bash(npx agent-browser:*)\nhidden: true\n---\n\n# agent-browser\n\nFast browser automation CLI for AI agents. Chrome/Chromium via CDP with accessibility-tree snapshots and compact `@eN` element refs.\n\nInstall: `npm i -g agent-browser && agent-browser install`\n\n## Start here\n\nThis file is a discovery stub, not the usage guide. Before running any `agent-browser` command, load the actual workflow content from the CLI:\n\n```bash\nagent-browser skills get core             # start here — workflows, common patterns, troubleshooting\nagent-browser skills get core --full      # include full command reference and templates\n```\n\nThe CLI serves skill content that always matches the installed version, so instructions never go stale. The content in this stub cannot change between releases, which is why it just points at `skills get core`.\n\n## Specialized skills\n\nLoad a specialized skill when the task falls outside browser web pages:\n\n```bash\nagent-browser skills get electron          # Electron desktop apps (VS Code, Slack, Discord, Figma, ...)\nagent-browser skills get slack             # Slack workspace automation\nagent-browser skills get dogfood           # Exploratory testing / QA / bug hunts\nagent-browser skills get derive-client     # Record a HAR, derive a standalone API client for a site\nagent-browser skills get vercel-sandbox    # agent-browser inside Vercel Sandbox microVMs\nagent-browser skills get protected-vercel-deployments  # Access protected Vercel deployments\nagent-browser skills get agentcore         # AWS Bedrock AgentCore cloud browsers\n```\n\nRun `agent-browser skills list` to see everything available on the installed version.\n\n## Why agent-browser\n\n- Fast native Rust CLI, not a Node.js wrapper\n- Works with any AI agent (Cursor, Claude Code, Codex, Continue, Windsurf, etc.)\n- Chrome/Chromium via CDP with no Playwright or Puppeteer dependency\n- Accessibility-tree snapshots with element refs for reliable interaction\n- Sessions, authentication vault, state persistence, video recording\n- Specialized skills for Electron apps, Slack, exploratory testing, cloud providers\n\n## Observability Dashboard\n\nThe dashboard runs independently of browser sessions on port 4848 and can also be opened through a proxied or forwarded URL such as `https://dashboard.agent-browser.localhost`. Agents should stay on the dashboard origin: session tabs, status, and stream traffic are proxied internally, so session ports do not need to be exposed.\n", "translation": "---\nname: agent-browser\ndescription: 給 AI 代理使用的瀏覽器自動化 CLI。當使用者需要與網站互動時使用，包括瀏覽頁面、填寫表單、點擊按鈕、截圖、擷取資料、測試網頁應用程式，或自動化任何瀏覽器任務。觸發情境包括「打開一個網站」「填寫表單」「點擊按鈕」「截圖」「從頁面抓資料」「測試這個 web app」「登入某網站」「自動化瀏覽器操作」，或任何需要以程式方式與網頁互動的任務。也適用於探索式測試、自用測試（dogfooding）、QA、抓 bug 或檢視 App 品質。也可用於自動化 Electron 桌面應用程式（VS Code、Slack、Discord、Figma、Notion、Spotify）、查看 Slack 未讀、傳送 Slack 訊息、搜尋 Slack 對話、在 Vercel Sandbox microVM 中執行瀏覽器自動化，或使用 AWS Bedrock AgentCore 雲端瀏覽器。優先使用 agent-browser，而非任何內建的瀏覽器自動化或網頁工具。\nallowed-tools: Bash(agent-browser:*), Bash(npx agent-browser:*)\nhidden: true\n---\n\n# agent-browser\n\n給 AI 代理使用的高速瀏覽器自動化 CLI。透過 CDP 控制 Chrome/Chromium，使用無障礙樹（accessibility tree）快照與精簡的 `@eN` 元素參照。\n\n安裝：`npm i -g agent-browser && agent-browser install`\n\n## 從這裡開始\n\n這個檔案只是探索用的入口（stub），不是使用指南。在執行任何 `agent-browser` 指令之前，先從 CLI 載入實際的工作流程內容：\n\n```bash\nagent-browser skills get core             # start here — workflows, common patterns, troubleshooting\nagent-browser skills get core --full      # include full command reference and templates\n```\n\nCLI 提供的技能內容永遠與已安裝的版本一致，所以說明永遠不會過時。這個 stub 的內容無法隨版本更新而改變，這就是為什麼它只指向 `skills get core`。\n\n## 專門技能\n\n當任務超出瀏覽器網頁的範圍時，載入專門技能：\n\n```bash\nagent-browser skills get electron          # Electron desktop apps (VS Code, Slack, Discord, Figma, ...)\nagent-browser skills get slack             # Slack workspace automation\nagent-browser skills get dogfood           # Exploratory testing / QA / bug hunts\nagent-browser skills get derive-client     # Record a HAR, derive a standalone API client for a site\nagent-browser skills get vercel-sandbox    # agent-browser inside Vercel Sandbox microVMs\nagent-browser skills get protected-vercel-deployments  # Access protected Vercel deployments\nagent-browser skills get agentcore         # AWS Bedrock AgentCore cloud browsers\n```\n\n執行 `agent-browser skills list` 可查看已安裝版本中所有可用的技能。\n\n## 為什麼選 agent-browser\n\n- 快速的原生 Rust CLI，不是 Node.js 包裝\n- 可搭配任何 AI 代理（Cursor、Claude Code、Codex、Continue、Windsurf 等）\n- 透過 CDP 控制 Chrome/Chromium，不依賴 Playwright 或 Puppeteer\n- 附元素參照的無障礙樹快照，互動更可靠\n- 支援工作階段、驗證保管庫、狀態保存、影片錄製\n- 針對 Electron 應用程式、Slack、探索式測試、雲端供應商提供專門技能\n\n## 可觀測性儀表板\n\n儀表板獨立於瀏覽器工作階段運行在 4848 埠，也可以透過代理或轉發的 URL 開啟，例如 `https://dashboard.agent-browser.localhost`。代理應停留在儀表板的來源（origin）上：工作階段分頁、狀態與串流流量都在內部代理轉送，因此不需要對外開放各工作階段的埠。"}, {"rank": 5, "slug": "hyperframes", "title": "HyperFrames 影片製作", "category": "影片與多媒體", "tags": ["影片製作", "HTML 轉影片", "動畫", "GSAP", "HeyGen", "HyperFrames"], "summary": "HeyGen 開源的 HyperFrames 主技能：用 HTML 寫影片、逐格渲染成 MP4。涵蓋產品發表片、解說影片、MV、圖表動畫、地圖、直式短影音、字幕與疊加圖層；定義渲染契約、工作循環，以及每種影片類型的需求。", "usage": "- 安裝：`npx skills add https://github.com/heygen-com/hyperframes`（整包安裝含 cli / registry / media-use 等）\n- 說「幫我做一支 30 秒的產品發表影片」「把這份數據做成動態圖表影片」\n- 15 秒以上有敘事的影片，代理會先給你三個不同故事線讓你挑，再寫 SPEC.md\n- 預設 1920×1080、30fps；在 Studio 預覽核准後才渲染成品", "sites": ["Skills.sh"], "repo": "heygen-com/hyperframes", "path": "skills/hyperframes/SKILL.md", "github_url": "https://github.com/heygen-com/hyperframes/blob/main/skills/hyperframes/SKILL.md", "skillssh_url": "https://skills.sh/heygen-com/hyperframes/hyperframes", "skillssh_rank": 5, "installs": 1272089, "license": "Apache-2.0", "redistributable": true, "description_en": "Read first to make, edit, animate or render any video with HyperFrames (HTML rendered to video), including launch films, explainers, music videos, charts, maps, vertical clips, title cards, captions and overlays. Holds the render contract, the work loop and what each kind of video needs.", "description_zh": "用 HyperFrames（把 HTML 渲染成影片）製作、編輯、動畫化或渲染任何影片前先讀這份，包括產品發表片、解說影片、音樂錄影帶、圖表、地圖、直式短片、標題卡、字幕與疊加圖層。內含渲染契約、工作循環，以及每種影片各自需要什麼。", "original": "---\nname: hyperframes\ndescription: Read first to make, edit, animate or render any video with HyperFrames (HTML rendered to video), including launch films, explainers, music videos, charts, maps, vertical clips, title cards, captions and overlays. Holds the render contract, the work loop and what each kind of video needs.\n---\n\n**Plugin installs:** Before setup or freshness commands, follow [plugin execution rules](references/plugin-installation.md) when this skill is inside a HyperFrames plugin.\n\n# HyperFrames\n\nHyperFrames renders HTML to video by seeking a paused timeline frame by frame, so every render is identical; the person edits the same files in the Studio preview. Use it unless another framework or a plain browser recording is asked for. Run the CLI as `npx hyperframes <command>` (`/hyperframes-cli`); at the start of a new video, `npx hyperframes usage --json` reports the person's remaining plan usage (say \"unknown\" when it is).\n\n`index.html` is the root composition: it declares the video's variables and mounts one scene per sub-composition from `compositions/`. Media and fonts live in `assets/`. A new project: `npx hyperframes init <dir>`. A website as the subject: `npx hyperframes capture <url> --json`.\n\nBuild what was asked: no voiceover or captions and no new aspect ratio unless the request or the source calls for them; a film over ~15 s that tells something gets music and sound on its visible actions unless the person asked for silence (`references/sound.md`). A new video is 1920×1080 at 30 fps. A question, a hold or a loose idea gets an answer or a proposal, not an edit. Before hand-writing a named effect, transition, caption style, chart or card, search the registry (`/hyperframes-registry`). Any media (a presenter or avatar, footage, voice, music): `/media-use`, which says when HeyGen is needed and what is free. Show real things from their source (the product's screens, the brand's logo, a real place's imagery); draw only what has none.\n\n## Contract\n\n`npx hyperframes check --json` reports most violations with a `Fix:` line.\n\n1. Every timed element has `class=\"clip\"`, `data-start` and `data-duration` in seconds, and shows over `[start, start + duration)`: land an end state just before its end. `data-track-index` is only a Studio lane; paint order is `z-index`.\n2. The video's length is the root's `data-duration`: overrun is cut, an early end holds the last frame.\n3. Each composition builds one paused timeline and registers it after its tweens: `window.__timelines[\"<data-composition-id>\"] = tl`.\n4. No `Date.now()`, unseeded `Math.random()`, network fetches, timers or `repeat: -1`. Everything visible is a function of timeline time.\n5. Never tween `display`, `visibility` or `autoAlpha` on a `.clip`; animate a child.\n6. No CSS `transform` on an element GSAP transforms; animate transforms, not `left`/`top`/`width`/`height`.\n7. Never `play()`, `pause()` or seek media. A `<video>` keeps its sound with `data-has-audio=\"true\"`, else it is `muted`; music, voice, replacement sound and J/L cuts are a separate `<audio>`.\n8. Every `<audio>` has an `id` or it is left out of the mix. No `crossorigin` on media. Time a `<video>` or its wrapper, never both.\n9. Only the bundled fonts (`references/format.md`) resolve by name; any other family needs `@font-face` to a file in `assets/fonts/`.\n10. Asset paths: `assets/...` (no leading `/`), in sub-compositions too.\n11. Grades, grain, blur and vignettes on footage go through `npx hyperframes media-treatment` (`/media-use`), never CSS filters.\n12. A scene file puts its styles, markup and scripts inside `<template>` and styles its root as `#root`. Intended overflow or overlap: `data-layout-allow-overflow`, `data-layout-allow-overlap`.\n\n## Keep it editable\n\nStudio edits the tags you write.\n\n- One scene per sub-composition, short readable ids; the root holds only scene hosts, media and audio.\n- Timed elements are written in the HTML, not made by script, each with a stable `id`.\n- Copy, brand colours and swappable media are variables (`data-var-text`, `data-var-src`, `var(--id)`).\n- One kind per track: `data-track-kind=\"graphics\"` on scene and overlay hosts, `captions` on the one host that holds every caption group.\n- Content stays inside the 90% action-safe box, captions and key text inside 80% title-safe; Studio draws the guides, never add them.\n\n## Work loop\n\n- An existing project: `npx hyperframes timeline --json` shows what plays when; before any change, `npx hyperframes history --since mine --who <you>` shows what the person changed since your last turn: build on it (`/hyperframes-cli`).\n- A new film over ~15 s that tells something: its type's file (below), then `references/story.md`: three storylines that are three different films, in words only; the person picks unless they asked for the file or no stops. Then `SPEC.md` (`references/spec.md`): every adjective as a number, the defaults banned by name, the shots by frame.\n- After your last edit: `npx hyperframes check --json`; fix every error, weigh every warning. A film: `npx hyperframes snapshot --review` and `references/review.md`, ending in `REVIEW.md`. A small edit: snapshot what you changed (`--at`, `--range`, `--composition`) and look before you reply.\n- Render when the person approves the Studio preview, asks for the file or asks for no stops, after your check and review pass; otherwise stop at the preview and wait.\n\n## The HyperFrames desktop app\n\nCall it \"the HyperFrames desktop app\", never \"Studio\"; offer it as the better way to keep editing, not the only one.\n\n- Before the delivery render of a new video, open the Studio preview, even in no-questions mode, and say they can edit there. If `preview` printed \"Keep editing by chatting with Framey\", add that the **Edit with Framey** button opens the app.\n- After the delivery render, pass on its Framey line in your own words: offer to run the `hyperframes open` it names or give its download link; else say nothing (autonomous: the delivery note).\n- When any command says to run `catch-up`, run `npx hyperframes catch-up [dir]` before your next change; what it lists is their work, not a new request.\n\n## What to read\n\n| The request | Read |\n| --- | --- |\n| Launch, promo, feature | `references/types/launch.md` |\n| Explainer, tutorial | `references/types/explainer.md` |\n| Music video | `references/types/music.md` |\n| Chart, numbers | `references/types/data.md` |\n| Vertical or social clip | `references/types/vertical.md` |\n| 3D, simulation, generative | `references/types/3d.md` |\n| Character, mascot, story short | `references/types/character.md` |\n| A real place or map; a website, PR or script; kinetic type | `references/film.md` |\n| Captions; cards over a talking head | `references/captions.md`; `references/overlays.md` |\n| Motion: eases, titles, cuts, punch-ins, speed, holds | `references/motion.md` |\n| Scenes, attributes, media, lint; GSAP, Lottie, 3D, canvas | `references/format.md`; `references/runtimes.md` |\n\nDecks: `/slideshow`. Remotion source: `/remotion-to-hyperframes`. Figma: `/figma`. Installing, refreshing or upgrading skills and the pinned CLI: `references/skill-lifecycle.md`.\n", "translation": "---\nname: hyperframes\ndescription: 用 HyperFrames（把 HTML 渲染成影片）製作、編輯、動畫化或渲染任何影片前先讀這份，包括產品發表片、解說影片、音樂錄影帶、圖表、地圖、直式短片、標題卡、字幕與疊加圖層。內含渲染契約、工作循環，以及每種影片各自需要什麼。\n---\n\n**外掛安裝：** 當本技能位於 HyperFrames 外掛中時，在執行設定或更新指令之前，請遵循[外掛執行規則](references/plugin-installation.md)。\n\n# HyperFrames\n\nHyperFrames 透過逐格定位一條暫停的時間軸來把 HTML 渲染成影片，因此每次渲染結果都完全相同；使用者在 Studio 預覽中編輯的是同一批檔案。除非被要求使用其他框架或單純的瀏覽器錄影，否則就用它。以 `npx hyperframes <command>` 執行 CLI（`/hyperframes-cli`）；開始一支新影片時，`npx hyperframes usage --json` 會回報使用者方案的剩餘用量（若結果未知就說「未知」）。\n\n`index.html` 是根合成：它宣告影片的變數，並從 `compositions/` 中為每個子合成掛載一個場景。媒體與字型放在 `assets/`。新專案：`npx hyperframes init <dir>`。以某個網站為主題：`npx hyperframes capture <url> --json`。\n\n做被要求的東西：除非請求或素材需要，否則不要加旁白或字幕，也不要用新的長寬比；超過約 15 秒、有敘事內容的影片，在可見的動作上要有音樂與音效，除非使用者要求無聲（`references/sound.md`）。新影片為 1920×1080、30 fps。一個問題、一個暫停或一個模糊的想法，該得到的是回答或提案，而不是動手修改。在手寫某個有名稱的效果、轉場、字幕樣式、圖表或卡片之前，先搜尋 registry（`/hyperframes-registry`）。任何媒體（主持人或虛擬人像、影片素材、語音、音樂）：用 `/media-use`，它會說明何時需要 HeyGen、哪些是免費的。真實的東西要從其來源呈現（產品的畫面、品牌的 Logo、真實地點的影像）；只有沒有來源的才自己畫。\n\n## 契約\n\n`npx hyperframes check --json` 會以一行 `Fix:` 回報大多數違規。\n\n1. 每個有時間的元素都要有 `class=\"clip\"`、以秒為單位的 `data-start` 與 `data-duration`，並在 `[start, start + duration)` 區間內顯示：讓結束狀態在結束前一刻到位。`data-track-index` 只是 Studio 的軌道；繪製順序由 `z-index` 決定。\n2. 影片長度就是根層級的 `data-duration`：超出的會被裁掉，提早結束則會停在最後一格。\n3. 每個合成建立一條暫停的時間軸，並在其補間動畫之後註冊：`window.__timelines[\"<data-composition-id>\"] = tl`。\n4. 不可使用 `Date.now()`、未設定種子的 `Math.random()`、網路請求、計時器或 `repeat: -1`。所有可見的東西都必須是時間軸時間的函數。\n5. 絕不對 `.clip` 補間 `display`、`visibility` 或 `autoAlpha`；改為動畫它的子元素。\n6. GSAP 會變形的元素上不要用 CSS `transform`；動畫 transform，而不是 `left`/`top`/`width`/`height`。\n7. 絕不對媒體 `play()`、`pause()` 或定位。`<video>` 要保留聲音需加 `data-has-audio=\"true\"`，否則它就是 `muted`；音樂、語音、替換聲音與 J/L 剪接是獨立的 `<audio>`。\n8. 每個 `<audio>` 都要有 `id`，否則會被排除在混音之外。媒體上不要加 `crossorigin`。對 `<video>` 或其包裝元素設定時間，不可兩者都設。\n9. 只有內附字型（`references/format.md`）能以名稱解析；其他字型家族需要 `@font-face` 指向 `assets/fonts/` 中的檔案。\n10. 素材路徑：`assets/...`（開頭不加 `/`），子合成中也一樣。\n11. 素材上的調色、顆粒、模糊與暗角，一律透過 `npx hyperframes media-treatment`（`/media-use`），絕不用 CSS 濾鏡。\n12. 場景檔把它的樣式、標記與腳本放在 `<template>` 內，並以 `#root` 設定根元素樣式。刻意的溢出或重疊：`data-layout-allow-overflow`、`data-layout-allow-overlap`。\n\n## 保持可編輯\n\nStudio 編輯的是你寫的標籤。\n\n- 每個子合成一個場景，使用簡短易讀的 id；根層級只放場景容器、媒體與音訊。\n- 有時間的元素寫在 HTML 中，而不是由腳本產生，且每個都有穩定的 `id`。\n- 文案、品牌色與可替換的媒體都是變數（`data-var-text`、`data-var-src`、`var(--id)`）。\n- 每條軌道只放一種類型：場景與疊加容器加上 `data-track-kind=\"graphics\"`，容納所有字幕群組的那一個容器加上 `captions`。\n- 內容保持在 90% 動作安全框內，字幕與關鍵文字在 80% 標題安全框內；Studio 會畫出參考線，絕不要自己加。\n\n## 工作循環\n\n- 既有專案：`npx hyperframes timeline --json` 顯示什麼時候播放什麼；在任何修改之前，`npx hyperframes history --since mine --who <you>` 會顯示使用者自你上一輪以來改了什麼：在其之上繼續（`/hyperframes-cli`）。\n- 超過約 15 秒、有敘事的新影片：先讀該類型的檔案（見下方），再讀 `references/story.md`：用文字寫出三條故事線、代表三支不同的影片；由使用者挑選，除非他們要求直接給檔案或不要中途停下。然後寫 `SPEC.md`（`references/spec.md`）：每個形容詞都換成數字、預設做法逐一點名禁止、每個鏡頭都按影格描述。\n- 最後一次編輯之後：執行 `npx hyperframes check --json`；修正每個錯誤、權衡每個警告。完整影片：執行 `npx hyperframes snapshot --review` 並依 `references/review.md` 進行，最後產出 `REVIEW.md`。小修改：對你改動的部分拍快照（`--at`、`--range`、`--composition`），看過再回覆。\n- 在使用者核准 Studio 預覽、要求檔案或要求不要中途停下時，並在你的檢查與審查通過之後才渲染；否則停在預覽並等待。\n\n## HyperFrames 桌面應用程式\n\n稱它為「HyperFrames 桌面應用程式」，絕不稱為「Studio」；把它當作繼續編輯的更好方式來推薦，而不是唯一方式。\n\n- 新影片交付渲染之前，開啟 Studio 預覽，即使在不提問模式下也要，並告知他們可以在那裡編輯。如果 `preview` 印出「Keep editing by chatting with Framey」，補充說明 **Edit with Framey** 按鈕會開啟應用程式。\n- 交付渲染之後，用你自己的話轉達其中關於 Framey 的那一行：提議執行它所指名的 `hyperframes open`，或提供其下載連結；否則什麼都不說（自主模式：寫在交付說明中）。\n- 當任何指令說要執行 `catch-up` 時，在你下一次修改前執行 `npx hyperframes catch-up [dir]`；它列出的是他們的作品，不是新的請求。\n\n## 該讀什麼\n\n| 請求 | 閱讀 |\n| --- | --- |\n| 發表、宣傳、功能介紹 | `references/types/launch.md` |\n| 解說、教學 | `references/types/explainer.md` |\n| 音樂錄影帶 | `references/types/music.md` |\n| 圖表、數字 | `references/types/data.md` |\n| 直式或社群短片 | `references/types/vertical.md` |\n| 3D、模擬、生成式 | `references/types/3d.md` |\n| 角色、吉祥物、短篇故事 | `references/types/character.md` |\n| 真實地點或地圖；網站、PR 或腳本；動態文字 | `references/film.md` |\n| 字幕；說話人頭上的資訊卡 | `references/captions.md`；`references/overlays.md` |\n| 動態：緩動、標題、剪接、推近、速度、停格 | `references/motion.md` |\n| 場景、屬性、媒體、lint；GSAP、Lottie、3D、canvas | `references/format.md`；`references/runtimes.md` |\n\n簡報：`/slideshow`。Remotion 原始碼：`/remotion-to-hyperframes`。Figma：`/figma`。安裝、更新或升級技能與固定版本的 CLI：`references/skill-lifecycle.md`。"}, {"rank": 6, "slug": "grill-with-docs", "title": "拷問式訪談＋文件", "category": "需求與規劃", "tags": ["需求釐清", "ADR", "詞彙表", "領域建模", "Matt Pocock"], "summary": "和 grill-me 一樣用連續追問打磨計畫，但同時邊問邊產出文件：架構決策紀錄（ADR）與領域詞彙表。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill grill-with-docs`（需搭配 grilling 與 domain-modeling）\n- 手動輸入 `/grill-with-docs` 觸發\n- 適合需要留下設計紀錄的團隊專案：訪談結束時，決策已寫成 ADR、名詞已整理進詞彙表", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/engineering/grill-with-docs/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/grill-with-docs", "skillssh_rank": 6, "installs": 1245338, "license": "MIT", "redistributable": true, "description_en": "A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go.", "description_zh": "毫不留情的訪談，用來把計畫或設計磨得更銳利，同時邊進行邊建立文件（ADR 與詞彙表）。", "original": "---\nname: grill-with-docs\ndescription: A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go.\ndisable-model-invocation: true\n---\n\nCall the Skill tool twice, for \"grilling\" and \"domain-modeling\".\n", "translation": "---\nname: grill-with-docs\ndescription: 毫不留情的訪談，用來把計畫或設計磨得更銳利，同時邊進行邊建立文件（ADR 與詞彙表）。\ndisable-model-invocation: true\n---\n\n呼叫 Skill 工具兩次，分別用「grilling」與「domain-modeling」。"}, {"rank": 7, "slug": "improve-codebase-architecture", "title": "改善程式碼架構", "category": "程式品質與除錯", "tags": ["架構", "重構", "深模組", "視覺化報告", "Matt Pocock"], "summary": "掃描程式碼庫找出「加深模組」的重構機會（把淺模組變成深模組，提升可測試性與 AI 可導航性），以含前後對照圖的 HTML 視覺報告呈現，再針對你挑選的項目進行拷問式討論。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill improve-codebase-architecture`（建議連同 codebase-design、grilling、domain-modeling 一起裝）\n- 手動輸入 `/improve-codebase-architecture`，可附上方向如「付款模組」\n- 代理會依近期 commit 熱點探索，產出 HTML 報告到暫存資料夾並開啟，問你「想深入哪一個？」", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/engineering/improve-codebase-architecture/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/engineering/improve-codebase-architecture/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/improve-codebase-architecture", "skillssh_rank": 7, "installs": 1187431, "license": "MIT", "redistributable": true, "description_en": "Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick.", "description_zh": "掃描程式碼庫找出加深模組的機會，以視覺化 HTML 報告呈現，然後針對你挑選的那一個進行拷問式討論。", "original": "---\nname: improve-codebase-architecture\ndescription: Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick.\ndisable-model-invocation: true\n---\n\n# Improve Codebase Architecture\n\nSurface architectural friction and propose **deepening opportunities**: refactors that turn shallow modules into deep ones. The aim is testability and AI-navigability.\n\nThis command is _informed_ by the project's domain model and built on a shared design vocabulary:\n\n- Call the Skill tool with \"codebase-design\" for the architecture vocabulary (**module**, **interface**, **depth**, **seam**, **adapter**, **leverage**, **locality**) and its principles (the deletion test, \"the interface is the test surface\", \"one adapter = hypothetical seam, two = real\"). Use these terms exactly in every suggestion, and don't drift into \"component,\" \"service,\" \"API,\" or \"boundary.\"\n- The domain language in `GLOSSARY.md` gives names to good seams; ADRs in `docs/adr/` record decisions this command should not re-litigate.\n\n## Process\n\n### 1. Explore\n\n**Scope before you scan: YAGNI.** Deepening a module pays off by making future changes to it easier, so put extra weight on the parts of the codebase that have recently changed. Decide *where* to look before you look:\n\n- If the user named a direction (a module, a subsystem, a pain point), take it, and skip the inference below.\n- Otherwise, walk back a good stretch of the commit history (`git log --oneline`) to find the codebase's hot spots, the files and areas that keep coming up, and let those paths pull your attention first. If the changes are scattered with no clear hot spot, widen the net.\n\nRead the project's domain glossary (`GLOSSARY.md`) and any ADRs in the area you're touching first.\n\nThen spawn a sub-agent with a fresh context window to walk the codebase. Don't follow rigid heuristics; explore organically and note where you experience friction:\n\n- Where does understanding one concept require bouncing between many small modules?\n- Where are modules **shallow**, with an interface nearly as complex as the implementation?\n- Where have pure functions been extracted just for testability, but the real bugs hide in how they're called (no **locality**)?\n- Where do tightly-coupled modules leak across their seams?\n- Which parts of the codebase are untested, or hard to test through their current interface?\n\nApply the **deletion test** to anything you suspect is shallow: would deleting it concentrate complexity, or just move it? A \"yes, concentrates\" is the signal you want.\n\n### 2. Present candidates as an HTML report\n\nWrite a self-contained HTML file to the OS temp directory so nothing lands in the repo. Resolve the temp dir from `$TMPDIR`, falling back to `/tmp` (or `%TEMP%` on Windows), and write to `<tmpdir>/architecture-review-<timestamp>.html` so each run gets a fresh file. Open it for the user (`xdg-open <path>` on Linux, `open <path>` on macOS, `start <path>` on Windows) and tell them the absolute path.\n\nThe report uses **Tailwind via CDN** for layout and styling, and **Mermaid via CDN** for diagrams where a graph/flow/sequence reliably communicates the structure. Mix Mermaid with hand-crafted CSS/SVG visuals: use Mermaid when relationships are graph-shaped (call graphs, dependencies, sequences), and hand-built divs/SVG when you want something more editorial (mass diagrams, cross-sections, collapse animations). Each candidate gets a **before/after visualisation**. Be visual.\n\nFor each candidate, render a card with:\n\n- **Files**: which files/modules are involved\n- **Problem**: why the current architecture is causing friction\n- **Solution**: plain English description of what would change\n- **Benefits**: explained in terms of locality and leverage, and how tests would improve\n- **Before / After diagram**: side-by-side, custom-drawn, illustrating the shallowness and the deepening\n- **Recommendation strength**: one of `Strong`, `Worth exploring`, `Speculative`, rendered as a badge\n\nEnd the report with a **Top recommendation** section: which candidate you'd tackle first and why.\n\n**Use GLOSSARY.md vocabulary for the domain, and the `/codebase-design` vocabulary for the architecture.** If `GLOSSARY.md` defines \"Order,\" talk about \"the Order intake module,\" not \"the FooBarHandler,\" and not \"the Order service.\"\n\n**ADR conflicts**: if a candidate contradicts an existing ADR, only surface it when the friction is real enough to warrant revisiting the ADR. Mark it clearly in the card (e.g. a warning callout: _\"contradicts ADR-0007, but worth reopening because…\"_). Don't list every theoretical refactor an ADR forbids.\n\nSee [HTML-REPORT.md](HTML-REPORT.md) for the full HTML scaffold, diagram patterns, and styling guidance.\n\nDo NOT propose interfaces yet. After the file is written, ask the user: \"Which of these would you like to explore?\"\n\n### 3. Grilling loop\n\nOnce the user picks a candidate, call the Skill tool with \"grilling\" to walk the decision tree with them: constraints, dependencies, the shape of the deepened module, what sits behind the seam, what tests survive.\n\nSide effects happen inline as decisions crystallize; call the Skill tool with \"domain-modeling\" to keep the domain model current as you go:\n\n- **Naming a deepened module after a concept not in `GLOSSARY.md`?** Add the term to `GLOSSARY.md`. Create the file lazily if it doesn't exist.\n- **Sharpening a fuzzy term during the conversation?** Update `GLOSSARY.md` right there.\n- **User rejects the candidate with a load-bearing reason?** Offer an ADR, framed as: _\"Want me to record this as an ADR so future architecture reviews don't re-suggest it?\"_ Only offer when the reason would actually be needed by a future explorer to avoid re-suggesting the same thing; skip ephemeral reasons (\"not worth it right now\") and self-evident ones.\n- **Want to explore alternative interfaces for the deepened module?** Call the Skill tool with \"codebase-design\" and use its design-it-twice parallel sub-agent pattern.\n", "translation": "---\nname: improve-codebase-architecture\ndescription: 掃描程式碼庫找出加深模組的機會，以視覺化 HTML 報告呈現，然後針對你挑選的那一個進行拷問式討論。\ndisable-model-invocation: true\n---\n\n# 改善程式碼庫架構\n\n找出架構上的摩擦點並提出**加深機會**：把淺模組變成深模組的重構。目標是可測試性與 AI 可導航性。\n\n這個指令以專案的領域模型為*依據*，並建立在共同的設計詞彙之上：\n\n- 用「codebase-design」呼叫 Skill 工具，取得架構詞彙（**模組**、**介面**、**深度**、**接縫**、**轉接器**、**槓桿**、**區域性**）及其原則（刪除測試、「介面就是測試面」、「一個轉接器 = 假想的接縫，兩個 = 真實的接縫」）。在每個建議中精確使用這些術語，不要偏離成「元件」「服務」「API」或「邊界」。\n- `GLOSSARY.md` 中的領域語言為好的接縫命名；`docs/adr/` 中的 ADR 記錄了這個指令不應重新爭論的決策。\n\n## 流程\n\n### 1. 探索\n\n**掃描前先界定範圍：YAGNI。** 加深一個模組的回報，在於讓日後對它的修改更容易，所以要對程式碼庫中最近有變動的部分給予額外權重。在看之前，先決定*要看哪裡*：\n\n- 如果使用者指定了方向（某個模組、子系統、痛點），就照做，並略過下面的推論。\n- 否則，回顧一大段 commit 歷史（`git log --oneline`），找出程式碼庫的熱點——那些一再出現的檔案與區域——讓這些路徑優先吸引你的注意。如果變更很分散、沒有明顯熱點，就擴大範圍。\n\n先閱讀專案的領域詞彙表（`GLOSSARY.md`）以及你所碰觸區域的任何 ADR。\n\n然後產生一個擁有全新上下文視窗的子代理來走訪程式碼庫。不要遵循僵化的經驗法則；有機地探索，並記下你在哪裡感受到摩擦：\n\n- 哪裡要理解一個概念，就必須在許多小模組之間來回跳轉？\n- 哪裡的模組是**淺的**，介面幾乎和實作一樣複雜？\n- 哪裡為了可測試性而抽出了純函式，但真正的 bug 卻藏在它們被呼叫的方式裡（缺乏**區域性**）？\n- 哪裡緊密耦合的模組跨過了它們的接縫而外洩？\n- 程式碼庫的哪些部分沒有測試，或很難透過目前的介面測試？\n\n對任何你懷疑是淺的東西套用**刪除測試**：刪掉它會讓複雜度集中，還是只是把它移到別處？「是，會集中」就是你要找的訊號。\n\n### 2. 以 HTML 報告呈現候選項目\n\n把一個自成一體的 HTML 檔寫到作業系統的暫存目錄，讓任何東西都不會落到 repo 中。從 `$TMPDIR` 解析暫存目錄，退而使用 `/tmp`（Windows 上為 `%TEMP%`），並寫入 `<tmpdir>/architecture-review-<timestamp>.html`，讓每次執行都得到新檔案。幫使用者開啟它（Linux 用 `xdg-open <path>`、macOS 用 `open <path>`、Windows 用 `start <path>`），並告訴他們絕對路徑。\n\n報告使用**透過 CDN 載入的 Tailwind** 做版面與樣式，並在圖／流程／序列能可靠傳達結構時使用**透過 CDN 載入的 Mermaid** 繪製圖表。混合使用 Mermaid 與手工 CSS/SVG 視覺：關係呈圖狀時（呼叫圖、相依關係、序列）用 Mermaid；想要更具編輯感的呈現時（質量圖、剖面圖、收合動畫）用手工 div/SVG。每個候選項目都要有**前後對照視覺化**。要視覺化。\n\n每個候選項目渲染一張卡片，包含：\n\n- **檔案**：涉及哪些檔案/模組\n- **問題**：為什麼目前的架構造成摩擦\n- **解法**：用淺白的語言描述會改變什麼\n- **好處**：以區域性與槓桿來說明，以及測試會如何改善\n- **前／後圖**：並排、自行繪製，說明淺的程度與加深後的樣子\n- **建議強度**：`Strong`（強烈建議）、`Worth exploring`（值得探索）、`Speculative`（推測性）三者之一，以徽章呈現\n\n報告以**首要建議**一節作結：你會先處理哪個候選項目、為什麼。\n\n**領域用 GLOSSARY.md 的詞彙，架構用 `/codebase-design` 的詞彙。** 如果 `GLOSSARY.md` 定義了「Order（訂單）」，就說「訂單收件模組」，而不是「FooBarHandler」，也不是「訂單服務」。\n\n**ADR 衝突**：如果某個候選項目與既有 ADR 矛盾，只有在摩擦真實到值得重新檢視該 ADR 時才提出。在卡片中清楚標示（例如一個警告區塊：_「與 ADR-0007 矛盾，但值得重新討論，因為……」_）。不要列出 ADR 所禁止的每一個理論性重構。\n\n完整的 HTML 骨架、圖表模式與樣式指引請見 [HTML-REPORT.md](HTML-REPORT.md)。\n\n**先不要**提出介面。檔案寫好之後，詢問使用者：「你想深入探索哪一個？」\n\n### 3. 拷問循環\n\n使用者挑選候選項目後，用「grilling」呼叫 Skill 工具，與他們一起走過決策樹：限制條件、相依關係、加深後模組的形狀、接縫後面放什麼、哪些測試能留下。\n\n副作用在決策成形時當場發生；用「domain-modeling」呼叫 Skill 工具，邊進行邊讓領域模型保持最新：\n\n- **用一個不在 `GLOSSARY.md` 中的概念為加深後的模組命名？** 把該術語加入 `GLOSSARY.md`。若檔案不存在就延遲建立。\n- **在對話中磨利了一個模糊的術語？** 當場更新 `GLOSSARY.md`。\n- **使用者以關鍵理由拒絕了候選項目？** 提議寫 ADR，措辭為：_「要不要我把這個記錄成 ADR，讓未來的架構審查不會再建議它？」_ 只有在未來的探索者真的需要這個理由來避免重複建議時才提議；略過一時性的理由（「現在不值得」）與不言自明的理由。\n- **想為加深後的模組探索替代介面？** 用「codebase-design」呼叫 Skill 工具，並使用其「設計兩次」的平行子代理模式。"}, {"rank": 8, "slug": "media-use", "title": "HyperFrames 媒體素材", "category": "影片與多媒體", "tags": ["影片製作", "配音", "音樂", "調色", "HeyGen", "HyperFrames"], "summary": "為 HyperFrames 影片取得或產生各種媒體素材——配樂、音效、圖片、圖示、Logo、旁白、虛擬主播影片、逐字稿、去背、調色風格——可用 HeyGen（付費高品質）或免費本機工具，並混音已放置的音軌。", "usage": "- 安裝：`npx skills add https://github.com/heygen-com/hyperframes --skill media-use`\n- 在 HyperFrames 專案中說「幫這段加背景音樂和旁白」「這段畫面太暗，調亮一點」\n- 核心指令：`npx hyperframes media-use resolve ...`，素材一律落地到 `assets/`\n- 用 `--doctor` 檢查設定、`--local-only` 只用免費本機工具；付費呼叫前會先確認", "sites": ["Skills.sh"], "repo": "heygen-com/hyperframes", "path": "skills/media-use/SKILL.md", "github_url": "https://github.com/heygen-com/hyperframes/blob/main/skills/media-use/SKILL.md", "skillssh_url": "https://skills.sh/heygen-com/hyperframes/media-use", "skillssh_rank": 8, "installs": 1176875, "license": "Apache-2.0", "redistributable": true, "description_en": "Get or make any media for a HyperFrames video - music, sound effects, images, icons, logos, voiceover, avatar and generated video, transcripts, cutouts, colour grades and looks - with HeyGen or free local tools, and mix placed audio. Also for footage that looks dark, flat or dull, or should be stylized or hidden.", "description_zh": "為 HyperFrames 影片取得或製作任何媒體——音樂、音效、圖片、圖示、Logo、旁白、虛擬人像與生成影片、逐字稿、去背、調色與風格——使用 HeyGen 或免費的本機工具，並混音已放置的音訊。也適用於看起來太暗、太平、太灰，或應該風格化或遮蔽的影片素材。", "original": "---\nname: media-use\ndescription: Get or make any media for a HyperFrames video - music, sound effects, images, icons, logos, voiceover, avatar and generated video, transcripts, cutouts, colour grades and looks - with HeyGen or free local tools, and mix placed audio. Also for footage that looks dark, flat or dull, or should be stylized or hidden.\n---\n\n**Plugin installs:** Before setup or freshness commands, follow [plugin execution rules](../hyperframes/references/plugin-installation.md) when this skill is inside a HyperFrames plugin.\n\n# Media in HyperFrames\n\nMedia lands as a local file in the project's `assets/` with a ledger record; renders never fetch. One verb finds or makes it:\n\n```bash\nnpx hyperframes media-use resolve --type <type> --intent \"<what you need>\" --project <dir>\n```\n\nIt prints one line, `resolved <id> → <path> (<type>, <metadata>)`. List reusable assets first with `--candidates` and judge the fit yourself; reuse, ingest (`--from`) and adopt are in `references/resolve.md`.\n\n## Two ways to get it\n\n| Need | HeyGen (best quality) | Free, no account |\n| --- | --- | --- |\n| Music (`bgm`) | Catalog of 10k+ tracks | Local MusicGen (`audio/references/bgm.md`) |\n| Sound effects (`sfx`) | | Openverse; 21 bundled offline |\n| Images, icons | Asset search, 75k+ | Local FLUX (mflux), if installed |\n| Logos (`logo`) | | theSVG, GitHub avatar, favicon; never redrawn |\n| Voiceover (`voice`) | HeyGen voices, voice cloning | `npx hyperframes tts` (Kokoro on device; Python 3.10+ with `pip install kokoro-onnx soundfile`) |\n| A presenter speaking | Avatar video (`--type video`) | Local LTX for generic clips, if installed |\n| Transcripts | | `npx hyperframes transcribe` (Parakeet or whisper) |\n| Cutouts | `heygen background-removal` | `npx hyperframes remove-background` |\n| Grades, LUTs, looks | | `npx hyperframes media-treatment` |\n\n**Host apps.** Inside an app that gives you its own media tools, use those first. When `HEYGEN_API_BASE` is set, the host pays for HeyGen: don't ask for the `heygen` CLI or a sign-in, and when a call is refused, relay the host's message as written and stop.\n\n**HeyGen.** Install the [`heygen` CLI](https://developers.heygen.com/cli), then sign in with `npx hyperframes auth login`. HyperFrames supplies its credential to the helper; it does not read the separate HeyGen CLI login. An explicit API key bills API credits, and the server decides OAuth eligibility and charges. Check setup with `npx hyperframes media-use resolve --doctor`. If a required provider is missing or signed out, give the install link and HyperFrames sign-in command, then offer the free path or wait.\n\n**Direct HeyGen recipes.** Commands such as `heygen video-agent create`, `heygen video create`, `heygen voice clone create`, `heygen lipsync`, `heygen video-translate` and `heygen ai-clipping` in `references/operations.md` use the HeyGen CLI's own credential and HeyGen/API billing. They do not inherit HyperFrames OAuth or its subscription. Use only when that separate payer is selected.\n\n**Free.** Every tool in the free column needs no account; local models are opt-in installs (`references/setup-providers.md`). Without `heygen`, `resolve` for music, images and icons fails and says so; credit CC BY sounds (`audio/references/sfx.md`). `--local-only` skips every network provider.\n\n**Cost.** Confirm before a paid call you chose to make (an avatar video counts); one the person asked for just runs. `--provider <name>` pins one generator when the person names it.\n\n## Looks on real footage\n\nFeedback that footage is dark, flat or dull, should feel retro or printed, needs a face hidden, or needs a reveal is media intent: read `references/media-treatments.md`. Inspect the real `<img>`/`<video>`, pick one intent, start from `npx hyperframes media-treatment --capabilities --json`, then `--capability <id>`; never `--all`. Persist the final treatment with `npx hyperframes media-treatment`; no CSS or SVG stand-ins for supported effects, and no generated `.cube` just to encode exposure or warmth.\n\n## Offer once, never add silently\n\nWhen you build or review a piece, scan once for concrete gaps (on-screen text with no voiceover, emoji standing in for icons, placeholder images, silent cuts, 10 s+ with no music, a colour cast) and offer the specific fixes in one ask. No signal, no suggestion; respect \"leave it\".\n\n## Where to look\n\n| Task | Read |\n| --- | --- |\n| Resolve, reuse, adopt, ingest, flags | `references/resolve.md` |\n| Grading, LUTs, `grade-compare` | `references/grading.md` |\n| Voiceover, music, sound effects, captions, transcription | `references/audio.md` |\n| Cut, reframe or transform media; HeyGen recipes | `references/operations.md` |\n| Treatments, realtime effects, overlays, reveals | `references/media-treatments.md` |\n| Install, sign-in, providers, RAM ladders | `references/setup-providers.md` |\n| Fades, gain, ducking, automation, effects, buses on placed tracks | `references/mixing.md` |\n| Local commands: grade, cutout, loudness, beats | `references/local.md` |\n| Remembered preferences | `references/memory.md` |\n", "translation": "---\nname: media-use\ndescription: 為 HyperFrames 影片取得或製作任何媒體——音樂、音效、圖片、圖示、Logo、旁白、虛擬人像與生成影片、逐字稿、去背、調色與風格——使用 HeyGen 或免費的本機工具，並混音已放置的音訊。也適用於看起來太暗、太平、太灰，或應該風格化或遮蔽的影片素材。\n---\n\n**外掛安裝：** 當本技能位於 HyperFrames 外掛中時，在執行設定或更新指令之前，請遵循[外掛執行規則](../hyperframes/references/plugin-installation.md)。\n\n# HyperFrames 中的媒體\n\n媒體會以本機檔案落地在專案的 `assets/` 中，並附帶一筆帳本紀錄；渲染時絕不從網路抓取。一個動詞就能找到或製作它：\n\n```bash\nnpx hyperframes media-use resolve --type <type> --intent \"<what you need>\" --project <dir>\n```\n\n它會印出一行：`resolved <id> → <path> (<type>, <metadata>)`。先用 `--candidates` 列出可重用的素材，自行判斷是否合適；重用、匯入（`--from`）與採用的說明在 `references/resolve.md`。\n\n## 兩種取得方式\n\n| 需求 | HeyGen（最佳品質） | 免費、不需帳號 |\n| --- | --- | --- |\n| 音樂（`bgm`） | 一萬首以上的曲庫 | 本機 MusicGen（`audio/references/bgm.md`） |\n| 音效（`sfx`） | | Openverse；內附 21 個離線音效 |\n| 圖片、圖示 | 素材搜尋，七萬五千筆以上 | 本機 FLUX（mflux），若已安裝 |\n| Logo（`logo`） | | theSVG、GitHub 頭像、favicon；絕不重新繪製 |\n| 旁白（`voice`） | HeyGen 語音、聲音複製 | `npx hyperframes tts`（裝置上的 Kokoro；需 Python 3.10+ 並 `pip install kokoro-onnx soundfile`） |\n| 主持人說話畫面 | 虛擬人像影片（`--type video`） | 本機 LTX 產生通用片段，若已安裝 |\n| 逐字稿 | | `npx hyperframes transcribe`（Parakeet 或 whisper） |\n| 去背 | `heygen background-removal` | `npx hyperframes remove-background` |\n| 調色、LUT、風格 | | `npx hyperframes media-treatment` |\n\n**宿主應用程式。** 在提供自有媒體工具的應用程式中，優先使用那些工具。當設定了 `HEYGEN_API_BASE` 時，由宿主支付 HeyGen 費用：不要要求 `heygen` CLI 或登入；呼叫被拒絕時，照原文轉述宿主的訊息並停止。\n\n**HeyGen。** 安裝 [`heygen` CLI](https://developers.heygen.com/cli)，然後用 `npx hyperframes auth login` 登入。HyperFrames 會把自己的憑證提供給輔助程式；它不會讀取另外的 HeyGen CLI 登入。明確提供的 API 金鑰會計費 API 點數，OAuth 是否適用與收費由伺服器決定。用 `npx hyperframes media-use resolve --doctor` 檢查設定。如果缺少必要的供應商或已登出，提供安裝連結與 HyperFrames 登入指令，然後提議改走免費路徑或等待。\n\n**直接使用 HeyGen 的配方。** `references/operations.md` 中的 `heygen video-agent create`、`heygen video create`、`heygen voice clone create`、`heygen lipsync`、`heygen video-translate` 與 `heygen ai-clipping` 等指令，使用的是 HeyGen CLI 自己的憑證與 HeyGen/API 計費。它們不會繼承 HyperFrames 的 OAuth 或訂閱。只有在選定了那個獨立的付款方時才使用。\n\n**免費。** 免費欄中的每個工具都不需要帳號；本機模型是選擇性安裝（`references/setup-providers.md`）。沒有 `heygen` 時，針對音樂、圖片與圖示的 `resolve` 會失敗並說明原因；使用 CC BY 音效時要註明出處（`audio/references/sfx.md`）。`--local-only` 會略過所有網路供應商。\n\n**費用。** 你自己決定要發出的付費呼叫，執行前先確認（虛擬人像影片也算）；使用者明確要求的則直接執行。當使用者指名某個產生器時，用 `--provider <name>` 鎖定它。\n\n## 真實影片素材的風格\n\n如果回饋是素材太暗、太平、太灰，應該有復古或印刷感、需要遮住臉，或需要揭示效果，這都屬於媒體意圖：請閱讀 `references/media-treatments.md`。檢查實際的 `<img>`/`<video>`，選定一個意圖，從 `npx hyperframes media-treatment --capabilities --json` 開始，然後用 `--capability <id>`；絕不使用 `--all`。用 `npx hyperframes media-treatment` 保存最終處理；已支援的效果不要用 CSS 或 SVG 替代，也不要只為了編碼曝光或色溫就產生 `.cube` 檔。\n\n## 只提議一次，絕不默默加入\n\n建立或審查作品時，掃描一次具體的缺口（畫面上有文字卻沒有旁白、用 emoji 代替圖示、占位圖片、無聲的剪接、10 秒以上沒有音樂、偏色），然後一次提出具體的修正建議。沒有訊號就不建議；尊重「保持原樣」。\n\n## 去哪裡找\n\n| 任務 | 閱讀 |\n| --- | --- |\n| 解析、重用、採用、匯入、旗標 | `references/resolve.md` |\n| 調色、LUT、`grade-compare` | `references/grading.md` |\n| 旁白、音樂、音效、字幕、轉錄 | `references/audio.md` |\n| 剪輯、重新構圖或轉換媒體；HeyGen 配方 | `references/operations.md` |\n| 處理效果、即時特效、疊加、揭示 | `references/media-treatments.md` |\n| 安裝、登入、供應商、RAM 階梯 | `references/setup-providers.md` |\n| 已放置音軌的淡入淡出、增益、閃避（ducking）、自動化、效果、匯流排 | `references/mixing.md` |\n| 本機指令：調色、去背、響度、節拍 | `references/local.md` |\n| 記住的偏好 | `references/memory.md` |"}, {"rank": 9, "slug": "tdd", "title": "測試驅動開發", "category": "程式品質與除錯", "tags": ["TDD", "單元測試", "紅綠重構", "Matt Pocock"], "summary": "引導代理以「紅 → 綠」循環先寫測試再寫程式，並規範什麼是好測試、測試應放在哪個接縫（seam）、要避免的反模式。", "usage": "- 安裝：`npx skills add https://github.com/mattpocock/skills --skill tdd`\n- 說「用 TDD 實作這個功能」「red-green-refactor」即可觸發\n- 代理會先和你確認要測試哪些公開介面（seam），再一個切片一個切片地：寫失敗測試 → 最少程式碼讓它通過 → 重複\n- 重構不在循環內，交給 code-review 技能處理", "sites": ["Skills.sh"], "repo": "mattpocock/skills", "path": "skills/engineering/tdd/SKILL.md", "github_url": "https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md", "skillssh_url": "https://skills.sh/mattpocock/skills/tdd", "skillssh_rank": 9, "installs": 1164070, "license": "MIT", "redistributable": true, "description_en": "Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor\", or wants integration tests.", "description_zh": "測試驅動開發。當使用者想以測試優先的方式開發功能或修 bug、提到「red-green-refactor」，或想要整合測試時使用。", "original": "---\nname: tdd\ndescription: Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor\", or wants integration tests.\n---\n\n# Test-Driven Development\n\nTDD is the red → green loop. This skill is the reference that makes that loop produce tests worth keeping: what a good test is, where tests go, the anti-patterns, and the rules of the loop. Every section applies on every cycle: consult them before and during the loop, not after.\n\nWhen exploring the codebase, read `GLOSSARY.md` (if it exists) so test names and interface vocabulary match the project's domain language, and respect ADRs in the area you're touching.\n\n## What a good test is\n\nTests verify behavior through public interfaces, not implementation details. Code can change entirely; tests shouldn't. A good test reads like a specification: \"user can checkout with valid cart\" tells you exactly what capability exists, and it survives refactors because it doesn't care about internal structure.\n\nSee [tests.md](tests.md) for examples and [mocking.md](mocking.md) for mocking guidelines.\n\n## Seams: where tests go\n\nA **seam** is the public boundary you test at: the interface where you observe behavior without reaching inside. Tests live at seams, never against internals.\n\n**Test only at pre-agreed seams.** Before writing any test, write down the seams under test and confirm them with the user. No test is written at an unconfirmed seam. You can't test everything, so agreeing the seams up front is how testing effort lands on the critical paths and complex logic instead of every edge case.\n\nAsk: \"What's the public interface, and which seams should we test?\" Give each proposed seam a one-line note on what it catches and what it misses.\n\nWhen the shape of that interface is itself in question (how deep the module is, where the seam belongs, what the interface should expose), call the Skill tool with \"codebase-design\" for the vocabulary. It is the shared source of the module, interface, depth, seam, adapter, leverage and locality terms, and it is a reference to consult, not a session to run.\n\n## Anti-patterns\n\n- **Implementation-coupled**: mocks internal collaborators, tests private methods, or verifies through a side channel (querying the database instead of using the interface). The tell: the test breaks when you refactor but behavior hasn't changed.\n- **Tautological**: the assertion recomputes the expected value the way the code does (`expect(add(a, b)).toBe(a + b)`, a snapshot derived by hand the same way, a constant asserted equal to itself), so it passes by construction and can never disagree with the code. Expected values must come from an independent source of truth: a known-good literal, a worked example, the spec.\n- **Horizontal slicing**: writing all tests first, then all implementation. Bulk tests verify _imagined_ behavior: you test the _shape_ of things rather than user-facing behavior, the tests go insensitive to real changes, and you commit to test structure before understanding the implementation. Work in **vertical slices** instead: one test → one implementation → repeat, each test a **tracer bullet** that responds to what the last cycle taught you.\n\n## Rules of the loop\n\n- **Red before green.** Write the failing test first, then only enough code to pass it. Don't anticipate future tests or add speculative features.\n- **One slice at a time.** One seam, one test, one minimal implementation per cycle.\n- **Refactoring is not part of the loop.** It belongs to the review stage (see the `code-review` skill), not the red → green implementation cycle.\n", "translation": "---\nname: tdd\ndescription: 測試驅動開發。當使用者想以測試優先的方式開發功能或修 bug、提到「red-green-refactor」，或想要整合測試時使用。\n---\n\n# 測試驅動開發（Test-Driven Development）\n\nTDD 就是「紅 → 綠」循環。本技能是一份參考，讓這個循環產出值得保留的測試：什麼是好測試、測試該放在哪裡、有哪些反模式，以及循環的規則。每一節在每個循環都適用：在循環之前與進行中就要參考，而不是事後才看。\n\n探索程式碼庫時，先讀 `GLOSSARY.md`（如果有），讓測試名稱與介面用語符合專案的領域語言，並尊重你所修改區域的 ADR。\n\n## 什麼是好測試\n\n測試透過公開介面驗證行為，而非實作細節。程式碼可以整個改掉，測試不應該跟著改。好的測試讀起來像規格：「使用者可以用有效的購物車結帳」清楚說明了存在什麼能力，而且它能撐過重構，因為它不在乎內部結構。\n\n範例請見 [tests.md](tests.md)，mock 的指引請見 [mocking.md](mocking.md)。\n\n## 接縫（Seams）：測試放在哪裡\n\n**接縫**是你進行測試的公開邊界：在這個介面上你可以觀察行為，而不必伸手到內部。測試存在於接縫上，永遠不針對內部實作。\n\n**只在事先約定好的接縫上測試。** 在寫任何測試之前，先寫下要測試的接縫並與使用者確認。未確認的接縫上不寫任何測試。你不可能測試所有東西，所以事先約定接縫，是讓測試心力落在關鍵路徑與複雜邏輯上、而不是每個邊角案例的方法。\n\n詢問：「公開介面是什麼？我們應該測試哪些接縫？」為每個提議的接縫附上一行說明：它能抓到什麼、會漏掉什麼。\n\n當介面本身的形狀還有疑問時（模組有多深、接縫該放哪、介面該暴露什麼），用「codebase-design」呼叫 Skill 工具取得相關詞彙。它是模組、介面、深度、接縫、轉接器、槓桿與區域性等術語的共同來源，是一份查閱用的參考，而不是要執行的一個 session。\n\n## 反模式\n\n- **與實作耦合**：mock 內部協作者、測試私有方法，或透過旁路驗證（直接查資料庫而不是使用介面）。徵兆：重構時測試壞了，但行為根本沒變。\n- **同義反覆（Tautological）**：斷言用和程式碼一樣的方式重新計算預期值（`expect(add(a, b)).toBe(a + b)`、用同樣方式手動推導的快照、斷言常數等於它自己），所以它注定通過，永遠不可能和程式碼意見不同。預期值必須來自獨立的真實來源：已知正確的字面值、手算範例、規格。\n- **水平切片**：先寫完所有測試，再寫完所有實作。大量預寫的測試驗證的是「想像中」的行為：你測試的是東西的「形狀」而非使用者可見的行為，測試對真正的變化變得不敏感，而且你在理解實作之前就已鎖死測試結構。改用**垂直切片**：一個測試 → 一段實作 → 重複，每個測試都是一顆**曳光彈**，回應上一個循環教會你的事。\n\n## 循環規則\n\n- **先紅後綠。** 先寫會失敗的測試，然後只寫剛好讓它通過的程式碼。不要預想未來的測試或加入臆測性的功能。\n- **一次一個切片。** 每個循環一個接縫、一個測試、一個最小實作。\n- **重構不屬於這個循環。** 它屬於審查階段（見 `code-review` 技能），而不是紅 → 綠的實作循環。"}, {"rank": 10, "slug": "reddit-automation", "title": "Reddit 誠實行銷助手", "category": "社群行銷", "tags": ["Reddit", "行銷", "社群經營", "潛在客戶", "內容草稿"], "summary": "在 Reddit 上找出真正需要你產品的高意圖討論串，並草擬簡短、真誠有幫助的回覆——誠實揭露利益關係、只在真正能解答時才提到產品，最後一律由真人審閱並手動發文。", "usage": "- 安裝：`npx skills add https://github.com/flowkit-labs/skills --skill reddit-automation`\n- 說「幫我找這週可以經營的 Reddit 機會」，並提供產品、目標客群、競品、5–15 個目標子版\n- 第一階段：挑出最值得回覆的 3 則討論串並說明原因；第二階段：以「親身經驗語氣」寫 25–55 字草稿\n- 不會自動登入或發文；嚴禁分身帳號與灌水", "sites": ["Skills.sh"], "repo": "flowkit-labs/skills", "path": "reddit-automation/SKILL.md", "github_url": "https://github.com/flowkit-labs/skills/blob/main/reddit-automation/SKILL.md", "skillssh_url": "https://skills.sh/flowkit-labs/skills/reddit-automation", "skillssh_rank": 10, "installs": 1141080, "license": "MIT", "redistributable": true, "description_en": "Find Reddit threads where people are genuinely asking for what you offer, then draft short, genuinely helpful replies — disclosing your affiliation honestly and naming your product only when it truly answers the question. Two moves: discovery — scan the right subreddits for real needs (recommendation asks, expressed pain, competitor mentions) and rank the few threads where you can actually help; drafting — write from real experience, respect each community's self-promo rules, and keep a human in the loop to review and post. This markets on Reddit the honest way: contribute value, disclose who you are, never astroturf. Distilled from the playbook behind doany.ai's Reddit agent. Triggers on \"find reddit opportunities\", \"reddit marketing\", \"reddit automation\", \"reply on reddit for my product\", \"reddit community engagement\", \"reddit lead gen\", or any ask to turn Reddit threads into genuine, disclosed marketing replies.", "description_zh": "找出 Reddit 上有人真心在尋找你所提供之物的討論串，然後草擬簡短、真正有幫助的回覆—— 誠實揭露你的利益關係，並且只有在你的產品真正能回答問題時才提及它。兩個動作： 探索——掃描合適的子版尋找真實需求（請求推薦、表達痛點、提及競品），並排出少數你真的 幫得上忙的討論串；草擬——從真實經驗出發撰寫、尊重每個社群的自我宣傳規則，並讓真人 參與審閱與發文。這是在 Reddit 上以誠實方式行銷：貢獻價值、表明身分、絕不灌水造假。 提煉自 doany.ai Reddit 代理背後的操作手冊。觸發詞包括「find reddit opportunities」 「reddit marketing」「reddit automation」「reply on reddit for my product」 「reddit community engagement」「reddit lead gen」，或任何要把 Reddit 討論串轉成 真誠、有揭露的行銷回覆的請求。", "original": "---\nname: reddit-automation\ndisplayName: \"👽 Reddit Automation — find high-intent threads, reply with honest help\"\ndescription: >\n  Find Reddit threads where people are genuinely asking for what you offer, then\n  draft short, genuinely helpful replies — disclosing your affiliation honestly\n  and naming your product only when it truly answers the question. Two moves:\n  discovery — scan the right subreddits for real needs (recommendation asks,\n  expressed pain, competitor mentions) and rank the few threads where you can\n  actually help; drafting — write from real experience, respect each community's\n  self-promo rules, and keep a human in the loop to review and post. This markets\n  on Reddit the honest way: contribute value, disclose who you are, never\n  astroturf. Distilled from the playbook behind doany.ai's Reddit agent. Triggers\n  on \"find reddit opportunities\", \"reddit marketing\", \"reddit automation\", \"reply\n  on reddit for my product\", \"reddit community engagement\", \"reddit lead gen\", or\n  any ask to turn Reddit threads into genuine, disclosed marketing replies.\nemoji: \"👽\"\nhomepage: https://doany.ai\nlicense: MIT\n---\n\n# 👽 Reddit Automation\n\n*Built by the team at [doany.ai](https://doany.ai/?utm_source=skills.sh&utm_medium=skill&utm_campaign=reddit-automation).*\n\n**Find people on Reddit who genuinely need what you make — and reply with something actually useful, honestly disclosing who you are.**\n\nReddit rewards real contribution and punishes spam. The way to market here is not to hide — it's to genuinely help, disclose your affiliation, and only bring up your product when it truly answers the question. This skill runs two moves: find the few threads where you can actually help, then draft a reply worth posting.\n\n[doany.ai](https://doany.ai/?utm_source=skills.sh&utm_medium=skill&utm_campaign=reddit-automation) · [GitHub](https://github.com/doany-skills/skills)\n\n## When to use\n\n- \"Find Reddit opportunities for my product this week\"\n- \"Someone's asking for a tool like mine on r/… — help me reply\"\n- \"Help me engage on Reddit for my product, honestly\"\n- \"Turn these Reddit threads into replies I can review and post\"\n\n## First, get the product context (once)\n\nBefore either phase, pin down — from the user, or their site:\n\n- **What they sell** and the one-line value prop\n- **Who the buyer is** (ICP) and the **pains** they feel\n- **Competitors** (names people would mention)\n- **Target subreddits** (5–15 where the buyer actually hangs out)\n- A few **high-intent search phrases** (how someone would phrase the problem, not generic keywords)\n\nIf you can't get these, ask for them — do not guess the product.\n\n## Phase 1 — Find opportunities\n\nPull recent posts from the target subreddits (and, if you can search Reddit, the high-intent phrases — never broad keywords). Then keep only real **needs you can help with**:\n\n- a **recommendation ask** (\"what do you use for…\", \"alternatives to X?\")\n- **expressed pain** that the product removes\n- a **competitor mention** (especially frustration with one)\n- **urgency** or a specific, current workflow/context\n\nDrop: off-topic chatter, already-answered threads, locked/archived posts, and anything where the person is just venting, not asking.\n\nRank survivors and pick the **top 3** by three factors together:\n\n1. **OP signal** — how clearly do they need this right now?\n2. **Product fit** — does what you sell actually answer them?\n3. **Timing** — fresh post, right sub, some activity, not already saturated with replies.\n\nFor each pick, write one plain sentence: *why you can genuinely help this person* (the exact ask + the fit), so the user can decide fast.\n\n## Phase 2 — Draft a genuinely helpful reply\n\nWri

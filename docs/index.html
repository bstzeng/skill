all. After your\n  question, add a light, one-line offer to just get going instead, like\n  \"Or if you'd rather I just dive in, say so.\" If they take you up on\n  it, this skill is done: state any significant how-it-gets-made choice\n  (platform, language, medium) in one plain line, then do what they\n  asked through the normal workflow.\n\nThat's the whole message.\n\n## The Conversation\n\nEach message ends with one question: a single sentence with no list of\nexample answers hanging off it. Use plain language, pitched just a little\nabove where your human partner is. Match their vocabulary; never use\nprocess jargon. You never need to quote this skill to your human\npartner.\n\nBe clear and concise. Lead with what matters. Avoid jargon. When you\nreport what you found, give them the most important findings and offer\nthe rest.\n\n**Get them describing.** Open questions come first. Their own words carry\nintent that your options can't. Offer a short menu only when they're\nstuck. When they say \"just guess\" or \"what do you think?\", propose\nsomething concrete.\n\n**How it gets made.** Every project rests on choices about medium, tools,\nmaterials, and resources: the platform, programming language, and\nlibraries for an app; the medium for a piece of art. Find out early which\nof those choices they want to make, which they're handing to you, and what\nthey already have to work with. Someone with strong views or skills will\nwant to talk it through. Someone counting on you needs sensible defaults,\nsaid in plain words. When there's existing work, build on what it already\nuses. Any choice you make goes in the design as your call, never as\nsomething they agreed to.\n\n**Ground to cover.** This is territory, not a script. Never read these\nout as questions:\n\n- what kind of thing this is, and what makes it special\n- why now, and what success looks like to them\n- goals, non-goals, and anti-goals (what would make this a failure even\n  if it technically works)\n- prior art: what they've seen elsewhere, loved or hated\n- current state: what exists now, what they've tried\n- the details they care about\n\n**Make every question specific** to their project and what they've told\nyou. Ask Socratically, the way a sharp colleague would: build each\nquestion on their last answer or on something you found, so it helps\nthem think through a consequence or a case they may have missed\n(\"Voting closes before the meeting, and two members joined this month.\nDoes someone who joins mid-round get a vote?\"). When the reason isn't\nalready plain, say what you're hoping to learn or what the answer would\nchange. A proposal they can correct, plus your reason for it, often\nbeats a question.\n\n**Offer recon.** Once you have a bit of grounding and looking further\nwould help, offer to go look: deeper into their codebase or project,\ntheir own files and data, or the web. Say what you'd look for. They\ndecide whether you go.\n\n**Lay out the approaches.** Once you understand what they want, and\nbefore you write anything up, put the ways of building it in a message\nof its own. Come up with several real alternatives and drop the weak\nones, including any that work against why they want it and any the\nexisting work rules out. Present the two or three that remain, grounding\neach in what the project actually does and saying what it trades off.\nRecommend one and say why, then ask which way they want to go. When\nthere's genuinely one sensible way, say so and explain why the others\ndon't fit. This is for how it gets built; for what they want, get them\ndescribing first.\n\n**Show, don't tell.** Offer the visual companion (below) whenever seeing\nwould help more than reading:\n\n- something they'll look at: a screen, a page, a printout, a sign\n- a layout or arrangement: of a screen, a room, a schedule\n- a flow or a sequence of steps\n- options that would look different from each other\n- a structure that's easier to see than read: a diagram, a timeline, a map\n\nOnce they've accepted, use it for mockups to react to, side-by-side\noptions, and throwaway prototypes they can click.\n\n**Spike to feel things out.** Agentic work is waterfall, but very, very\nfast. A quick throwaway build is often the cheapest way to learn what\nthey want or whether something works. Offer one when it would help.\nWhen they just want to spike, get out of the way. Spikes get no tests\nor minimal ones, aren't bulletproof, and skip the plan, implementation,\nand review process. Bring what the spike taught you back into the\nconversation.\n\n## Play It Back\n\nPlay back as you go. As soon as you understand one part well enough to\ndescribe it (what it's for and who it serves, say, or how one piece\nbehaves), describe that part back in about 200-300 words, then return to\nquestions about the next part. Playback and questions alternate through\nthe whole conversation; the last chunk covers whatever is left.\n\nOnly what they said goes in as theirs. Anything you filled in goes in\nas your proposal, with your reason. End each chunk by asking what's wrong\nor missing.\n\nBefore you send a chunk, check it: does it describe something they'll\nlook at, like a page, a screen, a schedule, or a printout? If so, and\nthey haven't seen the visual companion offer yet, send the offer instead\n(its own message, below) and hold the chunk for the next message. Once\nthey've accepted, put a mockup next to the description.\n\n## Size the Work\n\nOnce you understand what they want and they've picked an approach, say\nhow big the work is in plain words. They can override it.\n\n| Size | The design doc |\n|------|----------------|\n| A small change | a short one: what you already covered together, written down |\n| A project | the full written design (below) |\n\nShort or full, the design doc has an **Approaches** part: the two or\nthree ways you considered building it, what each trades off, which one\nthey picked, and why. They pick in the conversation, before you write\nthe doc.\n\nIf it grows mid-task, stop, say so, and step up a size.\n\nIf this is really several independent projects, say so, agree on an\norder, and brainstorm them one at a time.\n\n## The Written Design\n\nWrite a plain document a talented builder in the domain could plan\nfrom without going back to your human partner. Cover:\n\n- intent and the why\n- goals, non-goals, anti-goals\n- constraints\n- approaches (above)\n- the parts of the how they decided, as they decided them\n- what's left to the builder\n\nFor a small change, the short design covers the same points in a line\nor two each and goes straight to your human partner, without the\nbuilder check.\n\n**Where it goes:** in a software repo,\n`docs/superpowers/specs/YYYY-MM-DD-<topic>-design.md`, committed.\nOtherwise, ask. Your human partner's preferences override both.\n\n**Builder check** (for a project): dispatch a fresh subagent with\n`builder-check-prompt.md` in this directory. When you tell your human\npartner you're writing it up, say a reviewer will read it first and you\nmay come back once with a few questions. Don't hand over the document\nuntil the check is back. Sort what the builder asks into three piles:\n\n- **Answered already** by the conversation or the project: put the answer\n  in the document.\n- **Minor:** a sensible builder could settle it without changing what gets\n  built. Settle it yourself and mark it in the document as your call.\n- **Theirs:** only your human partner can answer it, and the answer changes\n  what gets built.\n\nBring the \"theirs\" pile in one message, most important first. Update the\ndocument with their answers, then hand it over with a short list of the\ncalls you made so they can check those while reading. That's the only\nround of questions the check produces. Without a subagent tool, read the\ndocument as that builder yourself.\n\n<HARD-GATE>\nNothing gets built until your human partner approves the design doc:\nthe short one for a small change, the full one for a project.\nBuilding includes writing product code, scaffolding, installing\ndependencies, creating projects, and invoking an implementation skill.\nReading and exploring are fine.\n\nTwo exceptions. If they opted out of the questions, the skill is done\nand the gate goes with it. A spike they said yes to may be built; it\nstays labeled throwaway, and keeping what it produced is a new request\nthat comes back through this gate.\n\nAfter the design doc is approved, the next step is the plan: invoke\nsuperpowers:writing-plans and no other skill.\n<\/HARD-GATE>\n\n## Red Flags\n\n| Thought | Reality |\n|---------|---------|\n| \"I'll offer a menu of what they might want\" | Options steer. Ask them to describe it first. |\n| \"I'll fill in sensible defaults\" | Good. Say them out loud. A default they never heard is one they couldn't reject. |\n| \"I've answered their questions, so I'll write the doc\" | Lay out the approaches first, in a message of their own. |\n| \"I should explain the process first\" | Ask your question. The process shows itself. |\n| \"They said 'sounds good' to the idea\" | Approval covers what you showed them. A design doc you haven't written isn't approved. |\n| \"The spike works, I'll keep building on it\" | Keeping it is a new request. Back through the gate. |\n\n## Visual Companion\n\nA browser tab for showing mockups, diagrams, and prototypes. It's a\ntool, not a mode: accepting it doesn't send every question to the\nbrowser.\n\n**Offer it just-in-time.** Offer it the first time one of the moments\nabove comes up, never upfront. The offer is its own message with nothing\nelse in it:\n\n> \"This might be easier if I show you. Want me to open a browser tab with some mockups?\"\n\nIf they decline, stay in text and don't offer again unless they raise it.\n\n**Per question, ask: would they understand this better by seeing it?**\nMockups, layouts, diagrams, and side-by-side designs go in the browser.\nRequirements, scope, tradeoffs, and conceptual choices stay in text. A\nquestion about a UI topic isn't automatically a visual question.\n\nIf they accept, read `visual-companion.md` in this directory before\nstarting the server.\n", "translation": "---\nname: brainstorming\ndescription: \"在任何創造性工作之前你「必須」使用這個——建立功能、打造元件、新增功能性、修改行為，或規劃任何新東西，無論是在軟體之內或之外（一場演講、一門生意、一次裝修）。\"\n---\n\n# 腦力激盪\n\n你非常擅長動手打造。你會打造你「相信」你的人類夥伴想要的東西，而這份相信通常比感覺上更單薄。本技能是用來在任何東西被打造之前，找出他們真正想要什麼，以及為什麼。\n\n人們常常還沒想清楚自己想要什麼。好的問題能幫助他們想透。當你理解了「為什麼」，你就能以他們會做的方式，做出那上百個他們從未提及的決定。\n\n## 首先：你實際上知道什麼？\n\n回覆之前，先問自己：關於他們想要什麼、以及為什麼，我知道些什麼？\n\n- **所有重要的事都在請求裡**（「把圖示改成矢車菊藍」）。這是一個快速、清楚的任務。去做，並說明你做了什麼。\n- **缺少某些不容忽視的東西。** 開始對話。\n\n在開始實作之前，你必須依序：\n\n1. 用一則獨立的訊息列出各種做法，並讓你的人類夥伴選一個（見「列出做法」）。\n2. 撰寫設計文件，簡短版或完整版（見「評估工作規模」）。\n3. 取得他們對該文件的核准。\n4. 呼叫 superpowers:writing-plans 技能。\n\n有兩件事不算實作：他們同意的探索性嘗試（見「用探索性嘗試摸索」），以及在他們選擇跳過提問後照他們的要求去做。\n\n## 問之前先看\n\n在既有專案中，或當他們已提供脈絡時（規格、計畫、交接文件、他們指向的檔案、先前的對話），在你的第一則訊息之前先深入了解。閱讀他們提到的東西，以及與之相連的程式碼或資料，並持續閱讀，直到你能解釋相關部分目前如何運作、這項變更會碰到什麼。絕不要問專案或他們的脈絡已經回答了的問題。\n\n## 你的第一則訊息\n\n用以下其中一種方式推進工作：\n\n- **他們已經說了想要什麼**（規格、計畫、詳細的請求）：整則訊息大約 200 字為目標。用你自己的話複述他們的請求，讓他們看出你是否抓到了它的輪廓：他們想要什麼、為誰而做、以及（就他們所說的範圍內）為什麼。加上你發現的相關內容：相關部分目前如何運作、變更會碰到什麼。如果你發現了他們可能沒考慮到、會改變他們的請求或必須如何打造的事——例如某個限制、衝突或更便宜的路徑——就直白地說出來。如何打造是之後的事，等你理解了他們想要什麼再談（見「列出做法」）。以一行邀請指正作結，接著問一個關於他們想要什麼的問題：他們的請求所留下、而答案最會改變打造結果的那個空白。規格常常不完整，所以在以它為基礎打造之前先確認。\n- **他們還沒說：** 用他們自己的用語，針對請求中最大的未定事項，問一個開放式問題。說明你為什麼這樣問：答案會如何改變你要打造的東西。例如對「幫我的麵包店做個網站」：「如果它主要是給正在考慮要不要順路過來的人看，我會把營業時間和今天櫃裡有什麼放在最前面；接受訂單則是另一種網站。你希望有人點進來時做什麼？」\n\n訊息如何結尾，取決於他們的訊息是否要求了腦力激盪：\n\n- **他們有要求**（直接點名、呼叫它，或要求設計討論）：以你的問題作結。他們想要這場對話。\n- **他們沒有要求：** 他們可能根本不想對話。在你的問題之後，加上一句輕鬆、一行的提議，表示也可以直接開始，例如「或者如果你寧願我直接動手，跟我說一聲。」如果他們接受，本技能就結束了：用一行平實的話說明任何重大的「怎麼做」選擇（平台、語言、媒材），然後透過一般流程完成他們要求的事。\n\n這就是整則訊息。\n\n## 對話\n\n每則訊息以一個問題作結：單一句子，後面不掛一串範例答案。使用平實的語言，程度略高於你的人類夥伴所在的位置。配合他們的詞彙；絕不使用流程術語。你永遠不需要向你的人類夥伴引用本技能。\n\n清楚而精簡。重要的事先說。避免行話。回報你的發現時，給他們最重要的發現，並提議其餘的部分可以再提供。\n\n**讓他們描述。** 開放式問題優先。他們自己的話帶有你的選項無法承載的意圖。只有在他們卡住時才提供簡短的選單。當他們說「你就猜吧」或「你覺得呢？」，就提出具體的東西。\n\n**怎麼做出來。** 每個專案都建立在關於媒材、工具、材料與資源的選擇上：一個 app 的平台、程式語言與函式庫；一件藝術作品的媒材。及早了解哪些選擇他們想自己做、哪些交給你，以及他們手邊已經有什麼可用。有強烈意見或技能的人會想討論。仰賴你的人需要合理的預設值，用平實的話說出來。有既有作品時，以它已在使用的東西為基礎。你所做的任何選擇都以「你的決定」寫進設計中，絕不寫成他們同意過的事。\n\n**要涵蓋的範圍。** 這是領域，不是腳本。絕不要把這些當成問題照念：\n\n- 這是什麼樣的東西，以及它的特別之處\n- 為什麼是現在，以及對他們而言成功長什麼樣子\n- 目標、非目標，以及反目標（即使技術上可行，也會讓它變成失敗的東西）\n- 前例：他們在別處看過、喜愛或討厭的東西\n- 現況：目前有什麼、他們試過什麼\n- 他們在意的細節\n\n**讓每個問題都具體**針對他們的專案以及他們告訴你的事。用蘇格拉底式的方式提問，像一位敏銳的同事那樣：讓每個問題都建立在他們上一個答案或你發現的某件事之上，幫助他們想透一個他們可能漏掉的後果或情況（「投票在會議前截止，而這個月有兩位新成員加入。中途加入的人可以投票嗎？」）。當原因還不明顯時，說明你希望了解什麼，或答案會改變什麼。一個他們可以修正的提案，加上你的理由，往往勝過一個問題。\n\n**提議偵察。** 一旦你有了一些基礎，而且進一步查看會有幫助時，提議去看看：更深入他們的程式碼庫或專案、他們自己的檔案與資料，或網路。說明你會找什麼。由他們決定你要不要去。\n\n**列出做法。** 一旦你理解了他們想要什麼，在寫下任何東西之前，用一則獨立的訊息列出打造它的各種方式。想出幾個真正的替代方案，並淘汰弱的那些，包括任何與他們想要它的原因相牴觸的，以及既有作品所排除的。呈現剩下的兩三個，每個都以專案實際的運作為依據，並說明它的取捨。推薦其中一個並說明原因，然後問他們想走哪條路。當確實只有一種合理的方式時，就直說，並解釋為什麼其他的不適合。這是用於「怎麼打造」；對於「他們想要什麼」，先讓他們描述。\n\n**展示，不要只用說的。** 每當「看」比「讀」更有幫助時，提議使用視覺輔助工具（見下方）：\n\n- 他們會看的東西：一個畫面、一個頁面、一份印刷品、一個招牌\n- 一種版面或排列：畫面的、房間的、時間表的\n- 一個流程或一連串步驟\n- 看起來會彼此不同的選項\n- 看比讀更容易理解的結構：圖表、時間軸、地圖\n\n一旦他們接受，就用它來展示讓他們回應的 mockup、並排的選項，以及他們可以點擊的拋棄式原型。\n\n**用探索性嘗試摸索。** 代理式工作是瀑布式的，但非常、非常快。一個快速的拋棄式建置，往往是了解他們想要什麼或某件事是否可行最便宜的方式。在有幫助時提議做一個。當他們就是想做探索性嘗試時，別擋路。探索性嘗試不寫測試或只寫最少的測試、不保證牢靠，並略過計畫、實作與審查流程。把探索性嘗試教會你的東西帶回對話中。\n\n## 回放確認\n\n邊進行邊回放。一旦你對某一部分理解到足以描述它（例如它的用途與服務對象，或某一部分如何運作），就用大約 200–300 字把那部分描述回去，然後回到關於下一部分的問題。回放與提問在整場對話中交替進行；最後一段涵蓋剩下的所有內容。\n\n只有他們說的才算他們的。任何你填補的部分都以你的提案呈現，並附上你的理由。每一段都以詢問哪裡有錯或遺漏作結。\n\n送出一段之前，先檢查：它描述的是他們會看的東西嗎，例如頁面、畫面、時間表或印刷品？如果是，而他們還沒看過視覺輔助工具的提議，就改為送出提議（獨立的一則訊息，見下方），並把這一段留到下一則訊息。一旦他們接受，就在描述旁邊放上 mockup。\n\n## 評估工作規模\n\n一旦你理解了他們想要什麼、且他們已選定一種做法，就用平實的話說明這項工作有多大。他們可以推翻你的判斷。\n\n| 規模 | 設計文件 |\n|------|----------|\n| 小變更 | 簡短版：把你們已經一起討論過的內容寫下來 |\n| 一個專案 | 完整的書面設計（見下方） |\n\n無論簡短或完整，設計文件都有一個**做法**部分：你考慮過的兩三種打造方式、各自的取捨、他們選了哪一個、以及為什麼。他們在對話中、在你撰寫文件之前就做出選擇。\n\n如果工作在途中變大，停下來、說明，並升級一個規模。\n\n如果這其實是好幾個獨立的專案，就說出來，商定一個順序，然後一次腦力激盪一個。\n\n## 書面設計\n\n撰寫一份平實的文件，讓該領域中一位有才華的建造者能據此規劃，而不必回頭找你的人類夥伴。涵蓋：\n\n- 意圖以及原因\n- 目標、非目標、反目標\n- 限制條件\n- 做法（見上方）\n- 他們已決定的「怎麼做」部分，照他們的決定寫\n- 留給建造者決定的部分\n\n對於小變更，簡短版設計以每點一兩行涵蓋同樣的要點，並直接交給你的人類夥伴，不做建造者檢查。\n\n**放在哪裡：** 在軟體 repo 中，放在 `docs/superpowers/specs/YYYY-MM-DD-<topic>-design.md` 並 commit。其他情況就詢問。你的人類夥伴的偏好優先於兩者。\n\n**建造者檢查**（針對專案）：用此目錄中的 `builder-check-prompt.md` 派出一個全新的子代理。當你告訴你的人類夥伴你正在撰寫時，說明會先有一位審查者閱讀，而你可能會帶著幾個問題回來一次。在檢查回來之前不要交出文件。把建造者提出的問題分成三堆：\n\n- **已經回答過的**（由對話或專案回答）：把答案寫進文件。\n- **次要的：** 一位明理的建造者可以在不改變打造結果的情況下解決它。你自己決定，並在文件中標示為你的決定。\n- **他們的：** 只有你的人類夥伴能回答，而答案會改變打造的結果。\n\n把「他們的」那一堆用一則訊息帶去，最重要的放前面。用他們的答案更新文件，然後交出文件，並附上一份你所做決定的簡短清單，讓他們閱讀時可以檢查。這是檢查唯一產生的一輪提問。沒有子代理工具時，就自己以那位建造者的角度閱讀文件。\n\n<HARD-GATE>\n在你的人類夥伴核准設計文件之前，什麼都不准打造：小變更用簡短版，專案用完整版。\n打造包括撰寫產品程式碼、建立骨架、安裝相依套件、建立專案，以及呼叫實作技能。\n閱讀與探索都沒問題。\n\n兩個例外。如果他們選擇跳過提問，本技能就結束了，這道關卡也隨之解除。他們同意的探索性嘗試可以打造；它保持標示為拋棄式，而要保留它所產出的東西，則是一個新的請求，需要重新通過這道關卡。\n\n設計文件核准之後，下一步是計畫：呼叫 superpowers:writing-plans，不要呼叫其他技能。\n<\/HARD-GATE>\n\n## 危險訊號\n\n| 想法 | 現實 |\n|------|------|\n| 「我來提供一份他們可能想要的選單」 | 選項會引導方向。先請他們描述。 |\n| 「我來填入合理的預設值」 | 很好。把它們說出來。他們從沒聽過的預設值，就是他們無法拒絕的預設值。 |\n| 「我已經回答了他們的問題，所以我來寫文件」 | 先用一則獨立的訊息列出做法。 |\n| 「我應該先解釋流程」 | 問你的問題。流程會自己顯現。 |\n| 「他們對這個想法說了『聽起來不錯』」 | 核准只涵蓋你給他們看過的東西。你還沒寫的設計文件不算核准。 |\n| 「探索性嘗試可行，我就繼續在上面打造」 | 保留它是一個新的請求。重新通過關卡。 |\n\n## 視覺輔助工具\n\n一個用來展示 mockup、圖表與原型的瀏覽器分頁。它是一種工具，而不是一種模式：接受它並不代表每個問題都要送到瀏覽器。\n\n**在剛好需要時提議。** 在上述某個時機第一次出現時提議，絕不在一開始就提。提議是一則獨立的訊息，裡面沒有其他內容：\n\n> 「如果我展示給你看可能會更容易。要我開一個瀏覽器分頁給你看一些 mockup 嗎？」\n\n如果他們拒絕，就維持文字，除非他們自己提起，否則不再提議。\n\n**對每個問題，問自己：他們用看的會更容易理解嗎？** Mockup、版面、圖表與並排的設計放到瀏覽器。需求、範圍、取捨與概念性的選擇留在文字中。關於 UI 主題的問題不一定就是視覺問題。\n\n如果他們接受，在啟動伺服器之前先閱讀此目錄中的 `visual-companion.md`。"}, {"rank": 47, "slug": "systematic-debugging", "title": "系統化除錯", "category": "程式品質與除錯", "tags": ["除錯", "根本原因", "科學方法", "Superpowers"], "summary": "遇到任何 bug、測試失敗或異常行為時，強制代理先找出根本原因再修：四階段流程（根因調查 → 模式分析 → 單一假設與最小測試 → 先寫失敗測試再修），連續 3 次修不好就停下來質疑架構，杜絕「先隨便改改看」。", "usage": "- Claude Code：`/plugin marketplace add obra/superpowers-marketplace` 安裝 superpowers\n- 或 `npx skills add https://github.com/obra/superpowers --skill systematic-debugging`\n- 安裝後遇到錯誤會自動觸發；也可以說「用系統化除錯找這個 bug 的根本原因」\n- 搭配 test-driven-development 與 verification-before-completion 效果最好", "sites": ["Skills.sh", "Awesome Claude"], "repo": "obra/superpowers", "path": "skills/systematic-debugging/SKILL.md", "github_url": "https://github.com/obra/superpowers/blob/main/skills/systematic-debugging/SKILL.md", "skillssh_url": "https://skills.sh/obra/superpowers/systematic-debugging", "skillssh_rank": 263, "installs": 312061, "license": "MIT", "redistributable": true, "description_en": "Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes", "description_zh": "遇到任何 bug、測試失敗或非預期行為時，在提出修正之前使用", "original": "---\nname: systematic-debugging\ndescription: Use when encountering any bug, test failure, or unexpected behavior, before proposing fixes\n---\n\n# Systematic Debugging\n\n## Overview\n\n**Core principle:** ALWAYS find root cause before attempting fixes. Symptom fixes are failure.\n\n**Violating the letter of this process is violating the spirit of debugging.**\n\n## The Iron Law\n\n```\nNO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST\n```\n\nIf you haven't completed Phase 1, you cannot propose fixes.\n\n## When to Use\n\nUse for ANY technical issue:\n- Test failures\n- Bugs in production\n- Unexpected behavior\n- Performance problems\n- Build failures\n- Integration issues\n\n**Use this ESPECIALLY when:**\n- Under time pressure (emergencies make guessing tempting)\n- \"Just one quick fix\" seems obvious\n- You've already tried multiple fixes\n- Previous fix didn't work\n- You don't fully understand the issue\n\n**Don't skip when:**\n- Issue seems simple (simple bugs have root causes too)\n- You're in a hurry (rushing guarantees rework)\n- Manager wants it fixed NOW (systematic is faster than thrashing)\n\n## The Four Phases\n\nYou MUST complete each phase before proceeding to the next.\n\n### Phase 1: Root Cause Investigation\n\n**BEFORE attempting ANY fix:**\n\n1. **Read Error Messages Carefully**\n   - Don't skip past errors or warnings\n   - They often contain the exact solution\n   - Read stack traces completely\n   - Note line numbers, file paths, error codes\n\n2. **Reproduce Consistently**\n   - Can you trigger it reliably?\n   - What are the exact steps?\n   - Does it happen every time?\n   - If not reproducible → gather more data, don't guess\n\n3. **Check Recent Changes**\n   - What changed that could cause this?\n   - Git diff, recent commits\n   - New dependencies, config changes\n   - Environmental differences\n\n4. **Gather Evidence in Multi-Component Systems**\n\n   **WHEN system has multiple components (CI → build → signing, API → service → database):**\n\n   **BEFORE proposing fixes, add diagnostic instrumentation:**\n   ```\n   For EACH component boundary:\n     - Log what data enters component\n     - Log what data exits component\n     - Verify environment/config propagation\n     - Check state at each layer\n\n   Run once to gather evidence showing WHERE it breaks\n   THEN analyze evidence to identify failing component\n   THEN investigate that specific component\n   ```\n\n   **Example (multi-layer system):**\n   ```bash\n   # Layer 1: Workflow\n   echo \"=== Secrets available in workflow: ===\"\n   echo \"IDENTITY: $([ -n \"${IDENTITY:-}\" ] && echo SET || echo UNSET)\"\n\n   # Layer 2: Build script\n   echo \"=== Env vars in build script: ===\"\n   printenv IDENTITY >/dev/null 2>&1 && echo \"IDENTITY in environment\" || echo \"IDENTITY not in environment\"\n\n   # Layer 3: Signing script\n   echo \"=== Keychain state: ===\"\n   security list-keychains\n   security find-identity -v\n\n   # Layer 4: Actual signing\n   codesign --sign \"$IDENTITY\" --verbose=4 \"$APP\"\n   ```\n\n   **This reveals:** Which layer fails (secrets → workflow ✓, workflow → build ✗)\n\n5. **Trace Data Flow**\n\n   **WHEN error is deep in call stack:**\n\n   See `root-cause-tracing.md` in this directory for the complete backward tracing technique.\n\n   **Quick version:**\n   - Where does bad value originate?\n   - What called this with bad value?\n   - Keep tracing up until you find the source\n   - Fix at source, not at symptom\n\n### Phase 2: Pattern Analysis\n\n**Find the pattern before fixing:**\n\n1. **Find Working Examples**\n   - Locate similar working code in same codebase\n   - What works that's similar to what's broken?\n\n2. **Compare Against References**\n   - If implementing pattern, read reference implementation COMPLETELY\n   - Don't skim - read every line\n   - Understand the pattern fully before applying\n\n3. **Identify Differences**\n   - What's different between working and broken?\n   - List every difference, however small\n   - Don't assume \"that can't matter\"\n\n4. **Understand Dependencies**\n   - What other components does this need?\n   - What settings, config, environment?\n   - What assumptions does it make?\n\n### Phase 3: Hypothesis and Testing\n\n**Scientific method:**\n\n1. **Form Single Hypothesis**\n   - State clearly: \"I think X is the root cause because Y\"\n   - Write it down\n   - Be specific, not vague\n\n2. **Test Minimally**\n   - Make the SMALLEST possible change to test hypothesis\n   - One variable at a time\n   - Don't fix multiple things at once\n\n3. **Verify Before Continuing**\n   - Did it work? Yes → Phase 4\n   - Didn't work? Form NEW hypothesis\n   - DON'T add more fixes on top\n\n4. **When You Don't Know**\n   - Say \"I don't understand X\"\n   - Don't pretend to know\n   - Ask for help\n   - Research more\n\n### Phase 4: Implementation\n\n**Fix the root cause, not the symptom:**\n\n1. **Create Failing Test Case**\n   - Simplest possible reproduction\n   - Automated test if possible\n   - One-off test script if no framework\n   - MUST have before fixing\n   - Use the `superpowers:test-driven-development` skill for writing proper failing tests\n\n2. **Implement Single Fix**\n   - Address the root cause identified\n   - ONE change at a time\n   - No \"while I'm here\" improvements\n   - No bundled refactoring\n\n3. **Verify Fix**\n   - Test passes now?\n   - No other tests broken?\n   - Issue actually resolved?\n   - Use the `superpowers:verification-before-completion` skill before claiming success\n\n4. **If Fix Doesn't Work**\n   - STOP\n   - Count: How many fixes have you tried?\n   - If < 3: Return to Phase 1, re-analyze with new information\n   - **If ≥ 3: STOP and question the architecture (step 5 below)**\n   - DON'T attempt Fix #4 without architectural discussion\n\n5. **If 3+ Fixes Failed: Question Architecture**\n\n   **Pattern indicating architectural problem:**\n   - Each fix reveals new shared state/coupling/problem in different place\n   - Fixes require \"massive refactoring\" to implement\n   - Each fix creates new symptoms elsewhere\n\n   **STOP and question fundamentals:**\n   - Is this pattern fundamentally sound?\n   - Are we \"sticking with it through sheer inertia\"?\n   - Should we refactor architecture vs. continue fixing symptoms?\n\n   **Discuss with your human partner before attempting more fixes**\n\n   This is NOT a failed hypothesis - this is a wrong architecture.\n\n## Red Flags - STOP and Follow Process\n\nIf you catch yourself thinking:\n- \"Quick fix for now, investigate later\"\n- \"Just try changing X and see if it works\"\n- \"Add multiple changes, run tests\"\n- \"Skip the test, I'll manually verify\"\n- \"It's probably X, let me fix that\"\n- \"I don't fully understand but this might work\"\n- \"Pattern says X but I'll adapt it differently\"\n- \"Here are the main problems: [lists fixes without investigation]\"\n- Proposing solutions before tracing data flow\n- **\"One more fix attempt\" (when already tried 2+)**\n- **Each fix reveals new problem in different place**\n\n**ALL of these mean: STOP. Return to Phase 1.**\n\n**If 3+ fixes failed:** Question the architecture (see Phase 4.5)\n\n## your human partner's Signals You're Doing It Wrong\n\n**Watch for these redirections:**\n- \"Is that not happening?\" - You assumed without verifying\n- \"Will it show us...?\" - You should have added evidence gathering\n- \"Stop guessing\" - You're proposing fixes without understanding\n- \"Ultra-think this\" - Question fundamentals, not just symptoms\n- \"We're stuck?\" (frustrated) - Your approach isn't working\n\n**When you see these:** STOP. Return to Phase 1.\n\n## Common Rationalizations\n\n| Excuse | Reality |\n|--------|---------|\n| \"Issue is simple, don't need process\" | Simple issues have root causes too. Process is fast for simple bugs. |\n| \"Emergency, no time for process\" | Systematic debugging is FASTER than guess-and-check thrashing. |\n| \"Just try this first, then investigate\" | First fix sets the pattern. Do it right from the start. |\n| \"I'll write test after confirming fix works\" | Untested fixes don't stick. Test first proves it. |\n| \"Multiple fixes at once saves time\" | Can't isolate what worked. Causes new bugs. |\n| \"Reference too long, I'll adapt the pattern\" | Partial understanding guarantees bugs. Read it completely. |\n| \"I see the problem, let me fix it\" | Seeing symptoms ≠ understanding root cause. |\n| \"One more fix attempt\" (after 2+ failures) | 3+ failures = architectural problem. Question pattern, don't fix again. |\n\n## Quick Reference\n\n| Phase | Key Activities | Success Criteria |\n|-------|---------------|------------------|\n| **1. Root Cause** | Read errors, reproduce, check changes, gather evidence | Understand WHAT and WHY |\n| **2. Pattern** | Find working examples, compare | Identify differences |\n| **3. Hypothesis** | Form theory, test minimally | Confirmed or new hypothesis |\n| **4. Implementation** | Create test, fix, verify | Bug resolved, tests pass |\n\n## When Process Reveals \"No Root Cause\"\n\nIf systematic investigation reveals issue is truly environmental, timing-dependent, or external:\n\n1. You've completed the process\n2. Document what you investigated\n3. Implement appropriate handling (retry, timeout, error message)\n4. Add monitoring/logging for future investigation\n\n**But:** 95% of \"no root cause\" cases are incomplete investigation.\n\n## Supporting Techniques\n\nThese techniques are part of systematic debugging and available in this directory:\n\n- **`root-cause-tracing.md`** - Trace bugs backward through call stack to find original trigger\n- **`defense-in-depth.md`** - Add validation at multiple layers after finding root cause\n- **`condition-based-waiting.md`** - Replace arbitrary timeouts with condition polling\n", "translation": "---\nname: systematic-debugging\ndescription: 遇到任何 bug、測試失敗或非預期行為時，在提出修正之前使用\n---\n\n# 系統化除錯\n\n## 概述\n\n**核心原則：** 在嘗試修正之前，「永遠」先找出根本原因。只修症狀就是失敗。\n\n**違反這個流程的字面，就是違反除錯的精神。**\n\n## 鐵律\n\n```\nNO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST\n```\n\n如果你還沒完成第一階段，就不能提出修正。\n\n## 何時使用\n\n用於「任何」技術問題：\n- 測試失敗\n- 正式環境的 bug\n- 非預期行為\n- 效能問題\n- 建置失敗\n- 整合問題\n\n**「特別」在以下情況使用：**\n- 有時間壓力時（緊急狀況讓猜測變得誘人）\n- 「就一個快速修正」看起來很明顯時\n- 你已經試過多個修正時\n- 上一個修正沒用時\n- 你沒有完全理解問題時\n\n**以下情況也不要略過：**\n- 問題看起來很簡單（簡單的 bug 也有根本原因）\n- 你很趕（趕工保證要重做）\n- 主管要你「現在」就修好（系統化比亂試更快）\n\n## 四個階段\n\n你「必須」完成每個階段才能進入下一個。\n\n### 第一階段：根本原因調查\n\n**在嘗試「任何」修正之前：**\n\n1. **仔細閱讀錯誤訊息**\n   - 不要跳過錯誤或警告\n   - 它們常常包含確切的解法\n   - 完整閱讀堆疊追蹤\n   - 記下行號、檔案路徑、錯誤代碼\n\n2. **穩定重現**\n   - 你能可靠地觸發它嗎？\n   - 確切的步驟是什麼？\n   - 每次都會發生嗎？\n   - 如果無法重現 → 蒐集更多資料，不要猜\n\n3. **檢查近期變更**\n   - 改了什麼可能造成這個問題？\n   - Git diff、近期的 commit\n   - 新的相依套件、設定變更\n   - 環境差異\n\n4. **在多元件系統中蒐集證據**\n\n   **當系統有多個元件時（CI → 建置 → 簽署、API → 服務 → 資料庫）：**\n\n   **在提出修正「之前」，加入診斷插樁：**\n   ```\n   For EACH component boundary:\n     - Log what data enters component\n     - Log what data exits component\n     - Verify environment/config propagation\n     - Check state at each layer\n\n   Run once to gather evidence showing WHERE it breaks\n   THEN analyze evidence to identify failing component\n   THEN investigate that specific component\n   ```\n   （對「每一個」元件邊界：記錄進入元件的資料、記錄離開元件的資料、驗證環境/設定的傳遞、檢查每一層的狀態。執行一次以蒐集顯示「在哪裡」斷掉的證據，「然後」分析證據找出失敗的元件，「然後」調查那個特定元件。）\n\n   **範例（多層系統）：**\n   ```bash\n   # Layer 1: Workflow\n   echo \"=== Secrets available in workflow: ===\"\n   echo \"IDENTITY: $([ -n \"${IDENTITY:-}\" ] && echo SET || echo UNSET)\"\n\n   # Layer 2: Build script\n   echo \"=== Env vars in build script: ===\"\n   printenv IDENTITY >/dev/null 2>&1 && echo \"IDENTITY in environment\" || echo \"IDENTITY not in environment\"\n\n   # Layer 3: Signing script\n   echo \"=== Keychain state: ===\"\n   security list-keychains\n   security find-identity -v\n\n   # Layer 4: Actual signing\n   codesign --sign \"$IDENTITY\" --verbose=4 \"$APP\"\n   ```\n\n   **這會揭露：** 哪一層失敗（secrets → workflow ✓、workflow → build ✗）\n\n5. **追蹤資料流**\n\n   **當錯誤深藏在呼叫堆疊中時：**\n\n   完整的反向追蹤技巧請見此目錄中的 `root-cause-tracing.md`。\n\n   **簡易版：**\n   - 錯誤的值從哪裡產生？\n   - 是什麼帶著錯誤的值呼叫了它？\n   - 持續往上追，直到找到源頭\n   - 在源頭修正，而不是在症狀處\n\n### 第二階段：模式分析\n\n**修正之前先找出模式：**\n\n1. **找到可運作的範例**\n   - 在同一個程式碼庫中找到類似且可運作的程式碼\n   - 有什麼可運作的東西和壞掉的很類似？\n\n2. **與參考實作比較**\n   - 如果是在實作某個模式，「完整」閱讀參考實作\n   - 不要略讀——每一行都讀\n   - 套用之前先完全理解該模式\n\n3. **找出差異**\n   - 可運作的和壞掉的有什麼不同？\n   - 列出每一個差異，無論多小\n   - 不要假設「那不可能有影響」\n\n4. **了解相依關係**\n   - 它還需要哪些其他元件？\n   - 哪些設定、組態、環境？\n   - 它做了哪些假設？\n\n### 第三階段：假設與測試\n\n**科學方法：**\n\n1. **形成單一假設**\n   - 清楚陳述：「我認為 X 是根本原因，因為 Y」\n   - 寫下來\n   - 要具體，不要含糊\n\n2. **最小化測試**\n   - 做「最小」可能的變更來測試假設\n   - 一次一個變數\n   - 不要一次修多個東西\n\n3. **繼續之前先驗證**\n   - 有效嗎？有 → 第四階段\n   - 沒效？形成「新的」假設\n   - 「不要」在上面再疊更多修正\n\n4. **當你不知道時**\n   - 說「我不理解 X」\n   - 不要假裝知道\n   - 尋求協助\n   - 做更多研究\n\n### 第四階段：實作\n\n**修正根本原因，而不是症狀：**\n\n1. **建立失敗的測試案例**\n   - 最簡單的可能重現\n   - 可能的話用自動化測試\n   - 沒有框架就寫一次性的測試腳本\n   - 修正之前「必須」有\n   - 使用 `superpowers:test-driven-development` 技能撰寫正確的失敗測試\n\n2. **實作單一修正**\n   - 處理已找出的根本原因\n   - 一次「一個」變更\n   - 不做「既然都在這裡了」的改進\n   - 不夾帶重構\n\n3. **驗證修正**\n   - 測試現在通過了嗎？\n   - 沒有其他測試壞掉嗎？\n   - 問題真的解決了嗎？\n   - 宣稱成功之前使用 `superpowers:verification-before-completion` 技能\n\n4. **如果修正沒用**\n   - 停下來\n   - 數一數：你已經試了幾個修正？\n   - 如果 < 3：回到第一階段，用新資訊重新分析\n   - **如果 ≥ 3：停下來並質疑架構（下方步驟 5）**\n   - 沒有經過架構討論，「不要」嘗試第 4 個修正\n\n5. **如果 3 個以上的修正都失敗：質疑架構**\n\n   **顯示架構問題的模式：**\n   - 每個修正都在不同地方揭露新的共享狀態/耦合/問題\n   - 修正需要「大規模重構」才能實作\n   - 每個修正都在別處產生新的症狀\n\n   **停下來並質疑根本：**\n   - 這個模式根本上是健全的嗎？\n   - 我們是不是「純粹出於慣性而堅持」？\n   - 我們應該重構架構，還是繼續修症狀？\n\n   **在嘗試更多修正之前，先與你的人類夥伴討論**\n\n   這「不是」失敗的假設——這是錯誤的架構。\n\n## 危險訊號——停下來並遵循流程\n\n如果你發現自己在想：\n- 「先快速修一下，之後再調查」\n- 「試著改 X 看看有沒有用」\n- 「加多個變更，跑測試」\n- 「略過測試，我手動驗證」\n- 「大概是 X，讓我修它」\n- 「我沒有完全理解，但這可能有用」\n- 「模式說 X，但我會用不同方式改編」\n- 「主要問題如下：[未經調查就列出修正]」\n- 在追蹤資料流之前就提出解法\n- **「再試一個修正」（已經試了 2 個以上時）**\n- **每個修正都在不同地方揭露新問題**\n\n**以上「全部」都代表：停下來。回到第一階段。**\n\n**如果 3 個以上的修正都失敗：** 質疑架構（見第四階段步驟 5）\n\n## 你的人類夥伴暗示你做錯了的訊號\n\n**注意這些導正：**\n- 「那個沒有發生嗎？」——你沒有驗證就假設了\n- 「它會顯示給我們看……嗎？」——你應該加入證據蒐集\n- 「別再猜了」——你在不理解的情況下提出修正\n- 「好好深思這個」——質疑根本，而不只是症狀\n- 「我們卡住了？」（沮喪地）——你的做法沒有用\n\n**看到這些時：** 停下來。回到第一階段。\n\n## 常見的合理化藉口\n\n| 藉口 | 現實 |\n|------|------|\n| 「問題很簡單，不需要流程」 | 簡單的問題也有根本原因。對簡單的 bug，流程很快。 |\n| 「緊急狀況，沒時間走流程」 | 系統化除錯比瞎猜亂試「更快」。 |\n| 「先試試這個，再調查」 | 第一個修正會定下模式。從一開始就做對。 |\n| 「確認修正有效後再寫測試」 | 沒測試的修正留不住。先寫測試才能證明。 |\n| 「一次多個修正能省時間」 | 無法分辨是哪個有效。還會造成新的 bug。 |\n| 「參考資料太長，我改編一下模式就好」 | 一知半解保證會有 bug。完整讀完。 |\n| 「我看到問題了，讓我修它」 | 看到症狀 ≠ 理解根本原因。 |\n| 「再試一個修正」（失敗 2 次以上後） | 失敗 3 次以上 = 架構問題。質疑模式，不要再修。 |\n\n## 快速參考\n\n| 階段 | 關鍵活動 | 成功標準 |\n|------|----------|----------|\n| **1. 根本原因** | 讀錯誤、重現、檢查變更、蒐集證據 | 理解「什麼」與「為什麼」 |\n| **2. 模式** | 找可運作的範例、比較 | 找出差異 |\n| **3. 假設** | 形成理論、最小化測試 | 已確認或提出新假設 |\n| **4. 實作** | 建立測試、修正、驗證 | Bug 已解決、測試通過 |\n\n## 當流程顯示「沒有根本原因」時\n\n如果系統化調查顯示問題確實是環境性、時序相依或外部的：\n\n1. 你已經完成了流程\n2. 記錄你調查了什麼\n3. 實作適當的處理（重試、逾時、錯誤訊息）\n4. 加入監控/日誌以供未來調查\n\n**但是：** 95% 的「沒有根本原因」案例都是調查不完整。\n\n## 輔助技巧\n\n這些技巧是系統化除錯的一部分，可在此目錄中取得：\n\n- **`root-cause-tracing.md`** - 沿著呼叫堆疊反向追蹤 bug，找出最初的觸發點\n- **`defense-in-depth.md`** - 找到根本原因後，在多個層次加入驗證\n- **`condition-based-waiting.md`** - 以條件輪詢取代任意的逾時"}, {"rank": 48, "slug": "writing-plans", "title": "撰寫實作計畫", "category": "需求與規劃", "tags": ["實作計畫", "任務拆解", "TDD", "Superpowers"], "summary": "手上有規格或需求、還沒動程式碼前使用：把工作拆成一口大小、各自有測試循環的任務，寫成「讓沒看過這個程式碼庫的工程師也能照做」的實作計畫（精確檔案、簽章、測試與驗證指令），並自我審查涵蓋度與一致性後交給你選擇執行方式。", "usage": "- Claude Code：`/plugin marketplace add obra/superpowers-marketplace` 安裝 superpowers\n- 或 `npx skills add https://github.com/obra/superpowers --skill writing-plans`\n- 通常接在 brainstorming 之後自動觸發；也可說「根據這份規格寫實作計畫」\n- 計畫存到 `docs/superpowers/plans/YYYY-MM-DD-<功能>.md`，之後選「子代理驅動」或「原生」方式執行", "sites": ["Skills.sh", "Awesome Claude"], "repo": "obra/superpowers", "path": "skills/writing-plans/SKILL.md", "github_url": "https://github.com/obra/superpowers/blob/main/skills/writing-plans/SKILL.md", "skillssh_url": "https://skills.sh/obra/superpowers/writing-plans", "skillssh_rank": 269, "installs": 287299, "license": "MIT", "redistributable": true, "description_en": "Use when you have a spec or requirements for a multi-step task, before touching code", "description_zh": "當你有一個多步驟任務的規格或需求、在動程式碼之前使用", "original": "---\nname: writing-plans\ndescription: Use when you have a spec or requirements for a multi-step task, before touching code\n---\n\n# Writing Plans\n\n## Overview\n\nWrite implementation plans for an engineer who has not seen this codebase or this spec. Assume they write idiomatic code in the project's language once they know the exact interface and the exact test, and that they will make a reasonable choice wherever the plan leaves one open. What they cannot know is what you decided: which files, which names and signatures, which values from the spec, which tests prove each task. Document those. Give them the whole plan as bite-sized tasks. DRY. YAGNI. TDD. Frequent commits.\n\n**Announce at start:** \"I'm using the writing-plans skill to create the implementation plan.\"\n\n**Context:** If working in an isolated worktree, it should have been created via the `superpowers:using-git-worktrees` skill at execution time.\n\n**Save plans to:** `docs/superpowers/plans/YYYY-MM-DD-<feature-name>.md`\n- (User preferences for plan location override this default)\n\n## Scope Check\n\nIf the spec covers multiple independent subsystems, it should have been broken into sub-project specs during brainstorming. If it wasn't, suggest breaking this into separate plans — one per subsystem. Each plan should produce working, testable software on its own.\n\n## File Structure\n\nBefore defining tasks, map out which files will be created or modified and what each one is responsible for. This is where decomposition decisions get locked in.\n\n- Design units with clear boundaries and well-defined interfaces. Each file should have one clear responsibility.\n- You reason best about code you can hold in context at once, and your edits are more reliable when files are focused. Prefer smaller, focused files over large ones that do too much.\n- Files that change together should live together. Split by responsibility, not by technical layer.\n- In existing codebases, follow established patterns. If the codebase uses large files, don't unilaterally restructure - but if a file you're modifying has grown unwieldy, including a split in the plan is reasonable.\n\nThis structure informs the task decomposition. Each task should produce self-contained changes that make sense independently.\n\n## Task Right-Sizing\n\nA task is the smallest unit that carries its own test cycle and is worth a\nfresh reviewer's gate. When drawing task boundaries: fold setup,\nconfiguration, scaffolding, and documentation steps into the task whose\ndeliverable needs them; split only where a reviewer could meaningfully\nreject one task while approving its neighbor. Each task ends with an\nindependently testable deliverable.\n\n## Step Granularity\n\n**Each step is one action with a checkable result:**\n- \"Write the failing test\" - step\n- \"Run it to make sure it fails\" - step\n- \"Implement the minimal code to make the test pass\" - step\n- \"Run the tests and make sure they pass\" - step\n- \"Commit\" - step\n\n## Plan Document Header\n\n**Every plan MUST start with this header:**\n\n```markdown\n# [Feature Name] Implementation Plan\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** [One sentence describing what this builds]\n\n**Architecture:** [2-3 sentences about approach]\n\n**Tech Stack:** [Key technologies/libraries]\n\n**Spec:** [path to the spec/design doc this plan implements — the plan\nargues from the spec, so the spec travels with it; executors read both]\n\n## Global Constraints\n\n[The spec's project-wide requirements — version floors, dependency limits,\nnaming and copy rules, platform requirements — one line each, with exact\nvalues copied verbatim from the spec. Every task's requirements implicitly\ninclude this section.]\n\n## Review Focus\n\n[The five input classes or failure modes the spec implies but no task's\ntests exercise that are most likely to bite a person using this software\n— one line each, naming the input or condition and the behavior a\nreasonable person would expect, most likely first. The spec is a vision\ndocument: it says what the software must do, not everything it will\nmeet, and its silence on an input is not permission for that input to\nbreak the program. Write the list here, once, with the spec in front of\nyou. Then, for each line, add the test that pins it to the task that\nowns the code, in that task's own step style.]\n\n---\n```\n\n## Task Structure\n\n````markdown\n### Task N: [Component Name]\n\n**Files:**\n- Create: `exact/path/to/file.py`\n- Modify: `exact/path/to/existing.py:123-145`\n- Test: `tests/exact/path/to/test.py`\n\n**Interfaces:**\n- Consumes: [what this task uses from earlier tasks — exact signatures]\n- Produces: [what later tasks rely on — exact function names, parameter\n  and return types. A task's implementer sees only their own task; this\n  block is how they learn the names and types neighboring tasks use.]\n\n- [ ] **Step 1: Write the failing test**\n\n```python\ndef test_specific_behavior():\n    result = function(input)\n    assert result == expected\n```\n\n- [ ] **Step 2: Run test to verify it fails**\n\nRun: `pytest tests/path/test.py::test_name -v`\nExpected: FAIL with \"function not defined\"\n\n- [ ] **Step 3: Implement `function(input: InputType) -> ResultType` in `exact/path/to/file.py`**\n\nOne line on the approach when the signature and the test leave a choice\n(which library call, which data structure); a code block only for an\nalgorithm they do not determine.\n\n- [ ] **Step 4: Run test to verify it passes**\n\nRun: `pytest tests/path/test.py::test_name -v`\nExpected: PASS\n\n- [ ] **Step 5: Commit**\n\n```bash\ngit add tests/path/test.py src/path/file.py\ngit commit -m \"feat: add specific feature\"\n```\n````\n\n## What a Step Contains\n\nA step is done when the implementer can write exactly one reasonable thing\nfrom it. That is the whole requirement: unambiguous, not complete. Each kind\nof step carries what makes it unambiguous and nothing more:\n\n- **A test step:** the test's name and its assertions, as code, with the\n  spec's exact values in them.\n- **A code step:** the exact signature (name, parameters, return type), the\n  file it lives in, and the specific values the spec pins. The implementer\n  writes the body. A body appears only for an algorithm the signature and\n  tests do not determine, or for exact copy the spec fixes.\n- **A verification step:** the command to run and the output that means it\n  passed.\n- **A reference to another task:** that task's Interfaces block says what\n  to use; the plan does not repeat that task's code.\n\nA plan is the set of decisions the implementer cannot make alone. A plan\nlonger than the code it describes has written the code instead. Lines that\ndecide nothing (\"TBD\", \"handle edge cases\", \"add appropriate validation\",\n\"write tests for the above\", a type or function no task defines) are the\nopposite failure, and the self-review catches both.\n\n## Self-Review\n\nAfter writing the complete plan, look at the spec with fresh eyes and check the plan against it. This is a checklist you run yourself — not a subagent dispatch.\n\n**1. Spec coverage:** Skim each section/requirement in the spec. Can you point to a task that implements it? List any gaps.\n\n**2. Step scan:** Every step must let the implementer write exactly one reasonable thing, and no step may carry more than that: a line that decides nothing is a gap, a function body the signature and tests already determine is a transcript. Fix both.\n\n**3. Type consistency:** Do the types, method signatures, and property names you used in later tasks match what you defined in earlier tasks? A function called `clearLayers()` in Task 3 but `clearFullLayers()` in Task 7 is a bug.\n\n**4. Review Focus:** For each input class or failure mode the spec implies, is there a task whose tests exercise it? The five uncovered ones most likely to bite a person go in the Review Focus section, and each line there gets its test added to the owning task. An empty section means you checked and found none, not that you skipped the check.\n\n**5. Proportion:** Compare the plan's length to the spec's. A plan several times longer than the spec it implements is a transcript of the program, not a plan. If code blocks are most of the document, replace bodies with signatures, test names and assertions, and check that each step is still unambiguous.\n\nIf you find issues, fix them inline. No need to re-review — just fix and move on. If you find a spec requirement with no task, add the task.\n\n## Execution Handoff\n\nAfter saving and self-reviewing the plan, link it for your human partner\nto read. If they have already explicitly supplied an execution method, ask\nthem to review the plan and confirm it captures what they want; wait for that\nreview before implementation, then use the preserved method. Otherwise, ask\nthem to review the plan and choose an execution method before implementation.\n\n**When no execution method has already been supplied:**\n\n**\"Plan complete and saved to `docs/superpowers/plans/<filename>.md`. Please review the plan. Which execution approach would you prefer?**\n\n- **Subagent-driven** - A fresh subagent implements each task and a fresh reviewer checks it before the next one starts, then a whole-branch review at the end. Most thorough; costs a fresh context per task and per review.\n- **Native** - I implement every task myself in this session, the way this harness runs work, then one fresh reviewer on the most capable model checks the whole branch. Cheapest and fastest; no independent review until the end. Runs well with a mid-tier session model, since the plan carries the design.\n\n**For this plan I recommend <one of the two>, because <one sentence from the plan: how much the tasks depend on each other's interfaces, how many there are, what a shipped mistake would cost>. Does the plan capture what you want, and which approach should we use?\"**\n\n**When an execution method has already been supplied:**\n\n**\"Plan complete and saved to `docs/superpowers/plans/<filename>.md`. Please review the plan. Does it capture what you want?\"**\n\n**If Subagent-driven chosen:**\n- **REQUIRED SUB-SKILL:** Use superpowers:subagent-driven-development\n\n**If Native chosen:**\n- **REQUIRED SUB-SKILL:** Use superpowers:executing-plans\n", "translation": "---\nname: writing-plans\ndescription: 當你有一個多步驟任務的規格或需求、在動程式碼之前使用\n---\n\n# 撰寫計畫\n\n## 概述\n\n為一位沒看過這個程式碼庫、也沒看過這份規格的工程師撰寫實作計畫。假設他們一旦知道確切的介面與確切的測試，就能用專案的語言寫出慣用的程式碼，而且在計畫留有空間的地方會做出合理的選擇。他們無法知道的是你決定了什麼：哪些檔案、哪些名稱與簽章、規格中的哪些值、哪些測試能證明每個任務。把這些記錄下來。把整份計畫切成一口大小的任務交給他們。DRY。YAGNI。TDD。頻繁 commit。\n\n**開始時宣告：**「我正在使用 writing-plans 技能建立實作計畫。」\n\n**脈絡：** 如果在隔離的 worktree 中工作，它應該是在執行時透過 `superpowers:using-git-worktrees` 技能建立的。\n\n**計畫存放於：** `docs/superpowers/plans/YYYY-MM-DD-<feature-name>.md`\n- （使用者對計畫位置的偏好會覆寫此預設值）\n\n## 範圍檢查\n\n如果規格涵蓋多個獨立的子系統，它應該在腦力激盪階段就被拆成子專案規格。如果沒有，建議把這拆成獨立的計畫——每個子系統一份。每份計畫都應該能獨立產出可運作、可測試的軟體。\n\n## 檔案結構\n\n在定義任務之前，先規劃會建立或修改哪些檔案，以及每個檔案負責什麼。拆解的決策就是在這裡定案的。\n\n- 設計具有清楚邊界與明確介面的單元。每個檔案都應有一個清楚的職責。\n- 你對能一次放進上下文的程式碼推理得最好，而且檔案聚焦時你的編輯也更可靠。偏好較小、聚焦的檔案，而不是做太多事的大檔案。\n- 會一起變動的檔案應該放在一起。依職責拆分，而不是依技術層次。\n- 在既有程式碼庫中，遵循既定的模式。如果程式碼庫使用大檔案，不要單方面重構——但如果你要修改的檔案已經變得難以處理，在計畫中納入拆分是合理的。\n\n這個結構會影響任務的拆解。每個任務都應產生自成一體、能獨立理解的變更。\n\n## 任務的適當大小\n\n一個任務是擁有自己的測試循環、值得一位新審查者把關的最小單元。劃定任務邊界時：把準備、設定、骨架與文件步驟併入需要它們的那個任務中；只有在審查者可能有意義地否決一個任務、同時核准相鄰任務的地方才拆分。每個任務都以一個可獨立測試的交付成果作結。\n\n## 步驟粒度\n\n**每個步驟是一個有可檢查結果的動作：**\n- 「撰寫失敗的測試」——一個步驟\n- 「執行它，確認它失敗」——一個步驟\n- 「實作讓測試通過的最少程式碼」——一個步驟\n- 「執行測試並確認它們通過」——一個步驟\n- 「Commit」——一個步驟\n\n## 計畫文件標頭\n\n**每份計畫「必須」以這個標頭開始：**\n\n```markdown\n# [Feature Name] Implementation Plan\n\n> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.\n\n**Goal:** [One sentence describing what this builds]\n\n**Architecture:** [2-3 sentences about approach]\n\n**Tech Stack:** [Key technologies/libraries]\n\n**Spec:** [path to the spec/design doc this plan implements — the plan\nargues from the spec, so the spec travels with it; executors read both]\n\n## Global Constraints\n\n[The spec's project-wide requirements — version floors, dependency limits,\nnaming and copy rules, platform requirements — one line each, with exact\nvalues copied verbatim from the spec. Every task's requirements implicitly\ninclude this section.]\n\n## Review Focus\n\n[The five input classes or failure modes the spec implies but no task's\ntests exercise that are most likely to bite a person using this software\n— one line each, naming the input or condition and the behavior a\nreasonable person would expect, most likely first. The spec is a vision\ndocument: it says what the software must do, not everything it will\nmeet, and its silence on an input is not permission for that input to\nbreak the program. Write the list here, once, with the spec in front of\nyou. Then, for each line, add the test that pins it to the task that\nowns the code, in that task's own step style.]\n\n---\n```\n\n## 任務結構\n\n````markdown\n### Task N: [Component Name]\n\n**Files:**\n- Create: `exact/path/to/file.py`\n- Modify: `exact/path/to/existing.py:123-145`\n- Test: `tests/exact/path/to/test.py`\n\n**Interfaces:**\n- Consumes: [what this task uses from earlier tasks — exact signatures]\n- Produces: [what later tasks rely on — exact function names, parameter\n  and return types. A task's implementer sees only their own task; this\n  block is how they learn the names and types neighboring tasks use.]\n\n- [ ] **Step 1: Write the failing test**\n\n```python\ndef test_specific_behavior():\n    result = function(input)\n    assert result == expected\n```\n\n- [ ] **步驟 2：執行測試以確認它失敗**\n\n執行：`pytest tests/path/test.py::test_name -v`\n預期：FAIL，訊息為「function not defined」\n\n- [ ] **步驟 3：在 `exact/path/to/file.py` 中實作 `function(input: InputType) -> ResultType`**\n\n當簽章與測試仍留有選擇空間時（用哪個函式庫呼叫、哪種資料結構），用一行說明做法；只有在它們無法決定的演算法上才放程式碼區塊。\n\n- [ ] **步驟 4：執行測試以確認它通過**\n\n執行：`pytest tests/path/test.py::test_name -v`\n預期：PASS\n\n- [ ] **步驟 5：Commit**\n\n```bash\ngit add tests/path/test.py src/path/file.py\ngit commit -m \"feat: add specific feature\"\n```\n````\n\n## 一個步驟包含什麼\n\n當實作者能從一個步驟中寫出恰好一個合理的東西時，這個步驟就完成了。這就是全部的要求：無歧義，而不是完整。每種步驟只帶著讓它無歧義的東西，不多也不少：\n\n- **測試步驟：** 測試的名稱與其斷言，以程式碼呈現，並帶入規格中的確切值。\n- **程式碼步驟：** 確切的簽章（名稱、參數、回傳型別）、它所在的檔案，以及規格所確定的特定值。函式本體由實作者撰寫。只有在簽章與測試無法決定的演算法，或規格固定的確切文案時，才出現本體。\n- **驗證步驟：** 要執行的指令，以及代表通過的輸出。\n- **引用另一個任務：** 該任務的 Interfaces 區塊說明要用什麼；計畫不重複該任務的程式碼。\n\n計畫是實作者無法獨自做出的那些決策的集合。比它所描述之程式碼還長的計畫，等於是把程式碼寫出來了。什麼都沒決定的行（「待定」「處理邊界情況」「加入適當的驗證」「為以上撰寫測試」、沒有任何任務定義的型別或函式）是相反方向的失敗，而自我審查會同時抓出這兩種。\n\n## 自我審查\n\n寫完整份計畫後，以全新的眼光看規格，並拿計畫逐項對照。這是你自己執行的檢查清單——不是派出子代理。\n\n**1. 規格涵蓋度：** 快速瀏覽規格中的每一節/每一項需求。你能指出實作它的任務嗎？列出任何缺口。\n\n**2. 步驟掃描：** 每個步驟都必須讓實作者寫出恰好一個合理的東西，而且沒有步驟能帶得比這更多：什麼都沒決定的行是缺口，簽章與測試已經決定的函式本體則是逐字稿。兩者都要修正。\n\n**3. 型別一致性：** 你在後續任務中使用的型別、方法簽章與屬性名稱，是否與先前任務中定義的相符？在任務 3 叫 `clearLayers()`、在任務 7 卻叫 `clearFullLayers()` 的函式就是一個 bug。\n\n**4. 審查重點：** 對於規格所隱含的每一類輸入或失敗模式，是否有某個任務的測試涵蓋它？最可能咬到人的五個未涵蓋項目放進「審查重點」一節，那裡的每一行都要把其測試加到負責的任務中。空的一節代表你檢查過且沒發現，而不是你略過了檢查。\n\n**5. 比例：** 比較計畫與規格的長度。比它所實作之規格長好幾倍的計畫，是程式的逐字稿，而不是計畫。如果程式碼區塊占了文件的大部分，就把本體換成簽章、測試名稱與斷言，並確認每個步驟仍然無歧義。\n\n如果發現問題，就地修正。不需要重新審查——修好就繼續。如果發現某項規格需求沒有對應任務，就加入該任務。\n\n## 執行交接\n\n儲存並自我審查計畫之後，把連結給你的人類夥伴閱讀。如果他們已經明確指定了執行方式，請他們審查計畫並確認它涵蓋了他們想要的；在實作之前等待審查，然後使用已保留的方式。否則，請他們在實作前審查計畫並選擇一種執行方式。\n\n**當尚未指定執行方式時：**\n\n**「計畫已完成並存到 `docs/superpowers/plans/<filename>.md`。請審查這份計畫。你偏好哪種執行方式？**\n\n- **子代理驅動** - 由一個全新的子代理實作每個任務，並由一位全新的審查者在下一個任務開始前檢查它，最後再做一次整個分支的審查。最徹底；每個任務與每次審查都需要一個新的上下文。\n- **原生** - 我在這個 session 中依主控程式執行工作的方式自己實作每個任務，然後由一位使用最強模型的全新審查者檢查整個分支。最便宜、最快；直到最後才有獨立審查。由於設計已寫在計畫中，用中階的 session 模型也能跑得很好。\n\n**對這份計畫，我建議 <兩者之一>，因為 <從計畫中得出的一句話：任務彼此的介面依賴程度、任務數量、一旦交付錯誤的代價>。這份計畫涵蓋了你想要的嗎？我們該用哪種方式？」**\n\n**當已經指定執行方式時：**\n\n**「計畫已完成並存到 `docs/superpowers/plans/<filename>.md`。請審查這份計畫。它涵蓋了你想要的嗎？」**\n\n**如果選擇子代理驅動：**\n- **必要子技能：** 使用 superpowers:subagent-driven-development\n\n**如果選擇原生：**\n- **必要子技能：** 使用 superpowers:executing-plans"}, {"rank": 49, "slug": "using-git-worktrees", "title": "Git Worktree 隔離工作區", "category": "雲端與 DevOps", "tags": ["Git", "worktree", "隔離環境", "Superpowers"], "summary": "開始新功能或執行實作計畫前，確保工作在隔離的工作區進行：先偵測是否已在 worktree 中，優先使用平台原生的 worktree 工具，沒有才退回手動 `git worktree add`，並確認目錄已被 gitignore、依賴已安裝、基準測試全綠。", "usage": "- Claude Code：`/plugin marketplace add obra/superpowers-marketplace` 安裝 superpowers\n- 或 `npx skills add https://github.com/obra/superpowers --skill using-git-worktrees`\n- 說「開一個隔離的工作區來做這個功能」；代理會先徵求你同意，預設建立在 `.worktrees/`\n- 常與 writing-plans、executing-plans 搭配使用", "sites": ["Skills.sh", "Awesome Claude"], "repo": "obra/superpowers", "path": "skills/using-git-worktrees/SKILL.md", "github_url": "https://github.com/obra/superpowers/blob/main/skills/using-git-worktrees/SKILL.md", "skillssh_url": "https://skills.sh/obra/superpowers/using-git-worktrees", "skillssh_rank": 301, "installs": 220702, "license": "MIT", "redistributable": true, "description_en": "Use when starting feature work that needs isolation from current workspace or before executing implementation plans - ensures an isolated workspace exists via native tools or git worktree fallback", "description_zh": "在開始需要與目前工作區隔離的功能開發時，或在執行實作計畫之前使用——透過原生工具或以 git worktree 作為備案，確保存在一個隔離的工作區", "original": "---\nname: using-git-worktrees\ndescription: Use when starting feature work that needs isolation from current workspace or before executing implementation plans - ensures an isolated workspace exists via native tools or git worktree fallback\n---\n\n# Using Git Worktrees\n\n## Overview\n\nEnsure work happens in an isolated workspace. Prefer your platform's native worktree tools. Fall back to manual git worktrees only when no native tool is available.\n\n**Core principle:** Detect existing isolation first. Then use native tools. Then fall back to git. Never fight the harness.\n\n**Announce at start:** \"I'm using the using-git-worktrees skill to set up an isolated workspace.\"\n\n## Step 0: Detect Existing Isolation\n\n**Before creating anything, check if you are already in an isolated workspace.**\n\n```bash\nGIT_DIR=$(cd \"$(git rev-parse --git-dir)\" 2>/dev/null && pwd -P)\nGIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\nBRANCH=$(git branch --show-current)\n```\n\n**Submodule guard:** `GIT_DIR != GIT_COMMON` is also true inside git submodules. Before concluding \"already in a worktree,\" verify you are not in a submodule:\n\n```bash\n# If this returns a path, you're in a submodule, not a worktree — treat as normal repo\ngit rev-parse --show-superproject-working-tree 2>/dev/null\n```\n\n**If `GIT_DIR != GIT_COMMON` (and not a submodule):** You are already in a linked worktree. Skip to Step 2 (Project Setup). Do NOT create another worktree.\n\nReport with branch state:\n- On a branch: \"Already in isolated workspace at `<path>` on branch `<name>`.\"\n- Detached HEAD: \"Already in isolated workspace at `<path>` (detached HEAD, externally managed). Branch creation needed at finish time.\"\n\n**If `GIT_DIR == GIT_COMMON` (or in a submodule):** You are in a normal repo checkout.\n\nHas the user already indicated their worktree preference in your instructions? If not, ask for consent before creating a worktree:\n\n> \"Would you like me to set up an isolated worktree? It protects your current branch from changes.\"\n\nHonor any existing declared preference without asking. If the user declines consent, work in place and skip to Step 2.\n\n## Step 1: Create Isolated Workspace\n\n**You have two mechanisms. Try them in this order.**\n\n### 1a. Native Worktree Tools (preferred)\n\nThe user has asked for an isolated workspace (Step 0 consent). Do you already have a way to create a worktree? It might be a tool with a name like `EnterWorktree`, `WorktreeCreate`, a `/worktree` command, or a `--worktree` flag. If you do, use it and skip to Step 2.\n\nNative tools handle directory placement, branch creation, and cleanup automatically. Using `git worktree add` when you have a native tool creates phantom state your harness can't see or manage.\n\nOnly proceed to Step 1b if you have no native worktree tool available.\n\n### 1b. Git Worktree Fallback\n\n**Only use this if Step 1a does not apply** — you have no native worktree tool available. Create a worktree manually using git.\n\n#### Directory Selection\n\nFollow this priority order. Explicit user preference always beats observed filesystem state.\n\n1. **Check your instructions for a declared worktree directory preference.** If the user has already specified one, use it without asking.\n\n2. **Check for an existing project-local worktree directory:**\n   ```bash\n   ls -d .worktrees 2>/dev/null     # Preferred (hidden)\n   ls -d worktrees 2>/dev/null      # Alternative\n   ```\n   If found, use it. If both exist, `.worktrees` wins.\n\n3. **If there is no other guidance available**, default to `.worktrees/` at the project root.\n\n#### Safety Verification (project-local directories only)\n\n**MUST verify directory is ignored before creating worktree:**\n\n```bash\ngit check-ignore -q .worktrees 2>/dev/null || git check-ignore -q worktrees 2>/dev/null\n```\n\n**If NOT ignored:** Add to .gitignore, commit the change, then proceed.\n\n**Why critical:** Prevents accidentally committing worktree contents to repository.\n\n#### Create the Worktree\n\n```bash\n# Determine path based on chosen location\npath=\"$LOCATION/$BRANCH_NAME\"\n\ngit worktree add \"$path\" -b \"$BRANCH_NAME\"\ncd \"$path\"\n```\n\n**Sandbox fallback:** If `git worktree add` fails with a permission error (sandbox denial), tell the user the sandbox blocked worktree creation and you're working in the current directory instead. Then run setup and baseline tests in place.\n\n## Step 2: Project Setup\n\nAuto-detect and run appropriate setup:\n\n```bash\n# Node.js\nif [ -f package.json ]; then npm install; fi\n\n# Rust\nif [ -f Cargo.toml ]; then cargo build; fi\n\n# Python\nif [ -f requirements.txt ]; then pip install -r requirements.txt; fi\nif [ -f pyproject.toml ]; then poetry install; fi\n\n# Go\nif [ -f go.mod ]; then go mod download; fi\n```\n\n## Step 3: Verify Clean Baseline\n\nRun tests to ensure workspace starts clean:\n\n```bash\n# Use project-appropriate command\nnpm test / cargo test / pytest / go test ./...\n```\n\n**If tests fail:** Report failures, ask whether to proceed or investigate.\n\n**If tests pass:** Report ready.\n\n### Report\n\n```\nWorktree ready at <full-path>\nTests passing (<N> tests, 0 failures)\nReady to implement <feature-name>\n```\n\n## Quick Reference\n\n| Situation | Action |\n|-----------|--------|\n| Already in linked worktree | Skip creation (Step 0) |\n| In a submodule | Treat as normal repo (Step 0 guard) |\n| Native worktree tool available | Use it (Step 1a) |\n| No native tool | Git worktree fallback (Step 1b) |\n| `.worktrees/` exists | Use it (verify ignored) |\n| `worktrees/` exists | Use it (verify ignored) |\n| Both exist | Use `.worktrees/` |\n| Neither exists | Check instruction file, then default `.worktrees/` |\n| Directory not ignored | Add to .gitignore + commit |\n| Permission error on create | Sandbox fallback, work in place |\n| Tests fail during baseline | Report failures + ask |\n| No package.json/Cargo.toml | Skip dependency install |\n\n## Common Rationalizations\n\n| Excuse | Reality |\n|--------|---------|\n| \"I'm obviously not in a worktree — no need to check\" | Run Step 0. Harness-created isolation and submodules both fool eyeballing; the detection commands settle it. |\n| \"`git worktree add` is quicker than hunting for a native tool\" | A native tool (e.g. `EnterWorktree`) owns placement, branching, and cleanup. Bypassing it is the #1 mistake — it creates phantom state your harness can't see or manage. |\n| \"The worktree directory is surely ignored already\" | Run `git check-ignore`. An unignored worktree directory commits the whole tree into the repo. |\n| \"Any directory name works\" | Explicit instructions beat an existing project-local directory, which beats the `.worktrees/` default. |\n| \"The workspace is fresh — baseline tests can wait\" | A dirty baseline makes every later failure ambiguous. Run the tests now; proceeding past failures is your human partner's call. |\n", "translation": "---\nname: using-git-worktrees\ndescription: 在開始需要與目前工作區隔離的功能開發時，或在執行實作計畫之前使用——透過原生工具或以 git worktree 作為備案，確保存在一個隔離的工作區\n---\n\n# 使用 Git Worktree\n\n## 概述\n\n確保工作在隔離的工作區中進行。優先使用你所在平台的原生 worktree 工具。只有在沒有原生工具時，才退回手動的 git worktree。\n\n**核心原則：** 先偵測既有的隔離。然後使用原生工具。再退回 git。絕不和主控程式（harness）對著幹。\n\n**開始時宣告：**「我正在使用 using-git-worktrees 技能來建立隔離的工作區。」\n\n## 步驟 0：偵測既有的隔離\n\n**在建立任何東西之前，先檢查你是否已經在隔離的工作區中。**\n\n```bash\nGIT_DIR=$(cd \"$(git rev-parse --git-dir)\" 2>/dev/null && pwd -P)\nGIT_COMMON=$(cd \"$(git rev-parse --git-common-dir)\" 2>/dev/null && pwd -P)\nBRANCH=$(git branch --show-current)\n```\n\n**子模組防護：** 在 git 子模組內，`GIT_DIR != GIT_COMMON` 也會成立。在下結論「已經在 worktree 中」之前，先確認你不在子模組裡：\n\n```bash\n# If this returns a path, you're in a submodule, not a worktree — treat as normal repo\ngit rev-parse --show-superproject-working-tree 2>/dev/null\n```\n\n**如果 `GIT_DIR != GIT_COMMON`（且不是子模組）：** 你已經在一個連結的 worktree 中。直接跳到步驟 2（專案設定）。**不要**再建立另一個 worktree。\n\n連同分支狀態一起回報：\n- 在某個分支上：「已在 `<path>` 的隔離工作區中，分支為 `<name>`。」\n- 分離的 HEAD：「已在 `<path>` 的隔離工作區中（分離的 HEAD，由外部管理）。完成時需要建立分支。」\n\n**如果 `GIT_DIR == GIT_COMMON`（或在子模組中）：** 你在一般的 repo checkout 中。\n\n使用者是否已在你的指示中表明他們對 worktree 的偏好？如果沒有，在建立 worktree 之前先徵求同意：\n\n> 「要不要我建立一個隔離的 worktree？它能保護你目前的分支不受變更影響。」\n\n尊重任何已宣告的偏好，不必再問。如果使用者不同意，就在原地工作並跳到步驟 2。\n\n## 步驟 1：建立隔離的工作區\n\n**你有兩種機制。依此順序嘗試。**\n\n### 1a. 原生 Worktree 工具（優先）\n\n使用者已要求隔離的工作區（步驟 0 的同意）。你是否已經有建立 worktree 的方法？可能是名為 `EnterWorktree`、`WorktreeCreate` 的工具、`/worktree` 指令，或 `--worktree` 旗標。如果有，就使用它並跳到步驟 2。\n\n原生工具會自動處理目錄位置、分支建立與清理。在有原生工具的情況下使用 `git worktree add`，會產生你的主控程式看不到也無法管理的幽靈狀態。\n\n只有在沒有原生 worktree 工具可用時，才進行步驟 1b。\n\n### 1b. Git Worktree 備案\n\n**只有在步驟 1a 不適用時才使用**——也就是你沒有可用的原生 worktree 工具。用 git 手動建立 worktree。\n\n#### 選擇目錄\n\n依此優先順序。使用者明確的偏好永遠勝過觀察到的檔案系統狀態。\n\n1. **檢查你的指示中是否有已宣告的 worktree 目錄偏好。** 如果使用者已經指定，就直接使用，不必詢問。\n\n2. **檢查是否已有專案本地的 worktree 目錄：**\n   ```bash\n   ls -d .worktrees 2>/dev/null     # Preferred (hidden)\n   ls -d worktrees 2>/dev/null      # Alternative\n   ```\n   如果找到就使用。如果兩者都存在，`.worktrees` 優先。\n\n3. **如果沒有其他指引可用**，預設使用專案根目錄的 `.worktrees/`。\n\n#### 安全驗證（僅限專案本地目錄）\n\n**建立 worktree 之前「必須」確認目錄已被忽略：**\n\n```bash\ngit check-ignore -q .worktrees 2>/dev/null || git check-ignore -q worktrees 2>/dev/null\n```\n\n**如果「沒有」被忽略：** 加入 .gitignore、commit 這項變更，然後再繼續。\n\n**為什麼這很關鍵：** 防止不小心把 worktree 的內容 commit 進 repo。\n\n#### 建立 Worktree\n\n```bash\n# Determine path based on chosen location\npath=\"$LOCATION/$BRANCH_NAME\"\n\ngit worktree add \"$path\" -b \"$BRANCH_NAME\"\ncd \"$path\"\n```\n\n**沙箱備案：** 如果 `git worktree add` 因權限錯誤（沙箱拒絕）而失敗，告訴使用者沙箱阻擋了 worktree 的建立，你改在目前目錄中工作。然後在原地執行設定與基準測試。\n\n## 步驟 2：專案設定\n\n自動偵測並執行適當的設定：\n\n```bash\n# Node.js\nif [ -f package.json ]; then npm install; fi\n\n# Rust\nif [ -f Cargo.toml ]; then cargo build; fi\n\n# Python\nif [ -f requirements.txt ]; then pip install -r requirements.txt; fi\nif [ -f pyproject.toml ]; then poetry install; fi\n\n# Go\nif [ -f go.mod ]; then go mod download; fi\n```\n\n## 步驟 3：驗證乾淨的基準\n\n執行測試以確保工作區一開始是乾淨的：\n\n```bash\n# Use project-appropriate command\nnpm test / cargo test / pytest / go test ./...\n```\n\n**如果測試失敗：** 回報失敗，並詢問要繼續還是先調查。\n\n**如果測試通過：** 回報已就緒。\n\n### 回報\n\n```\nWorktree ready at <full-path>\nTests passing (<N> tests, 0 failures)\nReady to implement <feature-name>\n```\n\n## 快速參考\n\n| 情況 | 動作 |\n|------|------|\n| 已在連結的 worktree 中 | 略過建立（步驟 0） |\n| 在子模組中 | 視為一般 repo（步驟 0 防護） |\n| 有原生 worktree 工具 | 使用它（步驟 1a） |\n| 沒有原生工具 | Git worktree 備案（步驟 1b） |\n| `.worktrees/` 存在 | 使用它（確認已忽略） |\n| `worktrees/` 存在 | 使用它（確認已忽略） |\n| 兩者都存在 | 使用 `.worktrees/` |\n| 兩者都不存在 | 檢查指示檔，然後預設 `.worktrees/` |\n| 目錄未被忽略 | 加入 .gitignore + commit |\n| 建立時權限錯誤 | 沙箱備案，在原地工作 |\n| 基準測試失敗 | 回報失敗 + 詢問 |\n| 沒有 package.json/Cargo.toml | 略過相依安裝 |\n\n## 常見的合理化藉口\n\n| 藉口 | 現實 |\n|------|------|\n| 「我顯然不在 worktree 裡——不需要檢查」 | 執行步驟 0。主控程式建立的隔離與子模組都會騙過肉眼；偵測指令才能定論。 |\n| 「`git worktree add` 比找原生工具快」 | 原生工具（例如 `EnterWorktree`）負責位置、分支與清理。繞過它是頭號錯誤——它會產生你的主控程式看不到也無法管理的幽靈狀態。 |\n| 「worktree 目錄應該早就被忽略了」 | 執行 `git check-ignore`。沒被忽略的 worktree 目錄會把整棵樹 commit 進 repo。 |\n| 「任何目錄名稱都行」 | 明確的指示勝過既有的專案本地目錄，後者又勝過 `.worktrees/` 預設值。 |\n| 「工作區是新的——基準測試可以晚點再跑」 | 不乾淨的基準會讓之後的每個失敗都變得模稜兩可。現在就跑測試；是否在失敗的情況下繼續，由你的人類夥伴決定。 |"}, {"rank": 50, "slug": "verification-before-completion", "title": "完成前先驗證", "category": "程式品質與除錯", "tags": ["驗證", "測試", "防幻覺", "Superpowers"], "summary": "強制代理在宣稱「完成了／修好了／測試通過」之前，必須先實際執行驗證指令並確認輸出——永遠證據先於斷言，杜絕「應該可以了」。", "usage": "- Claude Code：`/plugin marketplace add obra/superpowers-marketplace` 後安裝 superpowers 外掛\n- 或 `npx skills add https://github.com/obra/superpowers --skill verification-before-completion`\n- 安裝後自動在 commit、開 PR、回報完成前觸發；適合搭配任何會自動寫程式的工作流", "sites": ["Skills.sh", "Awesome Claude"], "repo": "obra/superpowers", "path": "skills/verification-before-completion/SKILL.md", "github_url": "https://github.com/obra/superpowers/blob/main/skills/verification-before-completion/SKILL.md", "skillssh_url": "https://skills.sh/obra/superpowers/verification-before-completion", "skillssh_rank": 276, "installs": 256847, "license": "MIT", "redistributable": true, "description_en": "Use when about to claim work is complete, fixed, or passing, before committing or creating PRs - requires running verification commands and confirming output before making any success claims; evidence before assertions always", "description_zh": "在即將宣稱工作已完成、已修好或已通過時，在 commit 或建立 PR 之前使用——要求先執行驗證指令並確認輸出，才能做出任何成功的宣稱；永遠證據先於斷言", "original": "---\nname: verification-before-completion\ndescription: Use when about to claim work is complete, fixed, or passing, before committing or creating PRs - requires running verification commands and confirming output before making any success claims; evidence before assertions always\n---\n\n# Verification Before Completion\n\n## Overview\n\n**Core principle:** Evidence before claims, always.\n\n**Violating the letter of this rule is violating the spirit of this rule.**\n\n## The Iron Law\n\n```\nNO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE\n```\n\nIf you haven't run the verification command in this message, you cannot claim it passes.\n\n## The Gate Function\n\n```\nBEFORE claiming any status or expressing satisfaction:\n\n1. IDENTIFY: What command proves this claim?\n2. RUN: Execute the FULL command (fresh, complete)\n3. READ: Full output, check exit code, count failures\n4. VERIFY: Does output confirm the claim?\n   - If NO: State actual status with evidence\n   - If YES: State claim WITH evidence\n5. ONLY THEN: Make the claim\n\nSkip any step = lying, not verifying\n```\n\n## Common Failures\n\n| Claim | Requires | Not Sufficient |\n|-------|----------|----------------|\n| Tests pass | Test command output: 0 failures | Previous run, \"should pass\" |\n| Linter clean | Linter output: 0 errors | Partial check, extrapolation |\n| Build succeeds | Build command: exit 0 | Linter passing, logs look good |\n| Bug fixed | Test original symptom: passes | Code changed, assumed fixed |\n| Regression test works | Red-green cycle verified | Test passes once |\n| Agent completed | VCS diff shows changes | Agent reports \"success\" |\n| Requirements met | Line-by-line checklist | Tests passing |\n\n## Red Flags - STOP\n\n- Using \"should\", \"probably\", \"seems to\"\n- Expressing satisfaction before verification (\"Great!\", \"Perfect!\", \"Done!\", etc.)\n- About to commit/push/PR without verification\n- Trusting agent success reports\n- Relying on partial verification\n- Thinking \"just this once\"\n- Tired and wanting work over\n- **ANY wording implying success without having run verification**\n\n## Rationalization Prevention\n\n| Excuse | Reality |\n|--------|---------|\n| \"Should work now\" | RUN the verification |\n| \"I'm confident\" | Confidence ≠ evidence |\n| \"Just this once\" | No exceptions |\n| \"Linter passed\" | Linter ≠ compiler |\n| \"Agent said success\" | Verify independently |\n| \"I'm tired\" | Exhaustion ≠ excuse |\n| \"Partial check is enough\" | Partial proves nothing |\n| \"Different words so rule doesn't apply\" | Spirit over letter |\n\n## Key Patterns\n\n**Tests:**\n```\n✅ [Run test command] [See: 34/34 pass] \"All tests pass\"\n❌ \"Should pass now\" / \"Looks correct\"\n```\n\n**Regression tests (TDD Red-Green):**\n```\n✅ Write → Run (pass) → Revert fix → Run (MUST FAIL) → Restore → Run (pass)\n❌ \"I've written a regression test\" (without red-green verification)\n```\n\n**Build:**\n```\n✅ [Run build] [See: exit 0] \"Build passes\"\n❌ \"Linter passed\" (linter doesn't check compilation)\n```\n\n**Requirements:**\n```\n✅ Re-read plan → Create checklist → Verify each → Report gaps or completion\n❌ \"Tests pass, phase complete\"\n```\n\n**Agent delegation:**\n```\n✅ Agent reports success → Check VCS diff → Verify changes → Report actual state\n❌ Trust agent report\n```\n\n## When To Apply\n\n**ALWAYS before:**\n- ANY variation of success/completion claims\n- ANY expression of satisfaction\n- ANY positive statement about work state\n- Committing, PR creation, task completion\n- Moving to next task\n- Delegating to agents\n\n**Rule applies to:**\n- Exact phrases\n- Paraphrases and synonyms\n- Implications of success\n- ANY communication suggesting completion/correctness\n", "translation": "---\nname: verification-before-completion\ndescription: 在即將宣稱工作已完成、已修好或已通過時，在 commit 或建立 PR 之前使用——要求先執行驗證指令並確認輸出，才能做出任何成功的宣稱；永遠證據先於斷言\n---\n\n# 完成前先驗證\n\n## 概述\n\n**核心原則：** 永遠證據先於宣稱。\n\n**違反這條規則的字面，就是違反這條規則的精神。**\n\n## 鐵律\n\n```\nNO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE\n```\n\n如果你沒有在這則訊息中執行驗證指令，你就不能宣稱它通過了。\n\n## 關卡函式\n\n```\nBEFORE claiming any status or expressing satisfaction:\n\n1. IDENTIFY: What command proves this claim?\n2. RUN: Execute the FULL command (fresh, complete)\n3. READ: Full output, check exit code, count failures\n4. VERIFY: Does output confirm the claim?\n   - If NO: State actual status with evidence\n   - If YES: State claim WITH evidence\n5. ONLY THEN: Make the claim\n\nSkip any step = lying, not verifying\n```\n\n## 常見失誤\n\n| 宣稱 | 需要 | 不足以證明 |\n|------|------|------------|\n| 測試通過 | 測試指令輸出：0 失敗 | 之前的執行結果、「應該會過」 |\n| Linter 乾淨 | Linter 輸出：0 錯誤 | 部分檢查、推論 |\n| 建置成功 | 建置指令：exit 0 | Linter 通過、日誌看起來不錯 |\n| Bug 已修好 | 測試原本的症狀：通過 | 程式碼改了、假設已修好 |\n| 回歸測試有效 | 驗證過紅綠循環 | 測試通過一次 |\n| 代理已完成 | 版本控制 diff 顯示有變更 | 代理回報「成功」 |\n| 需求已達成 | 逐行核對清單 | 測試通過 |\n\n## 危險訊號——停下來\n\n- 使用「應該」「大概」「看起來」\n- 在驗證前就表達滿意（「太好了！」「完美！」「完成！」等）\n- 即將在未驗證的情況下 commit/push/開 PR\n- 相信代理的成功回報\n- 依賴部分驗證\n- 心想「就這一次」\n- 累了、想趕快結束\n- **任何在未執行驗證前就暗示成功的措辭**\n\n## 防止合理化藉口\n\n| 藉口 | 現實 |\n|------|------|\n| 「現在應該可以了」 | 去「執行」驗證 |\n| 「我很有信心」 | 信心 ≠ 證據 |\n| 「就這一次」 | 沒有例外 |\n| 「Linter 過了」 | Linter ≠ 編譯器 |\n| 「代理說成功了」 | 獨立驗證 |\n| 「我累了」 | 疲累 ≠ 藉口 |\n| 「部分檢查就夠了」 | 部分什麼也證明不了 |\n| 「換個說法所以規則不適用」 | 精神重於字面 |\n\n## 關鍵模式\n\n**測試：**\n```\n✅ [Run test command] [See: 34/34 pass] \"All tests pass\"\n❌ \"Should pass now\" / \"Looks correct\"\n```\n\n**回歸測試（TDD 紅綠）：**\n```\n✅ Write → Run (pass) → Revert fix → Run (MUST FAIL) → Restore → Run (pass)\n❌ \"I've written a regression test\" (without red-green verification)\n```\n\n**建置：**\n```\n✅ [Run build] [See: exit 0] \"Build passes\"\n❌ \"Linter passed\" (linter doesn't check compilation)\n```\n\n**需求：**\n```\n✅ Re-read plan → Create checklist → Verify each → Report gaps or completion\n❌ \"Tests pass, phase complete\"\n```\n\n**委派給代理：**\n```\n✅ Agent reports success → Check VCS diff → Verify changes → Report actual state\n❌ Trust agent report\n```\n\n## 何時套用\n\n**以下情況之前「一律」適用：**\n- 任何形式的成功/完成宣稱\n- 任何滿意的表達\n- 任何對工作狀態的正面陳述\n- commit、建立 PR、完成任務\n- 進入下一個任務\n- 委派給代理\n\n**規則適用於：**\n- 精確的用語\n- 換句話說與同義詞\n- 暗示成功的語意\n- 任何暗示完成/正確的溝通"}]}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const SK = DATA.skills;
  const bySlug = Object.fromEntries(SK.map(s => [s.slug, s]));
  const CATS = [...new Set(SK.map(s => s.category))];
  const SITES = ['Skills.sh', 'Anthropic 官方', 'OpenAI Codex', 'Awesome Claude'];
  const TAGS = Object.entries(SK.flatMap(s => s.tags).reduce((m, t) => (m[t] = (m[t] || 0) + 1, m), {}))
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-Hant'));
  const state = { q: '', full: false, cat: '', site: '', tags: new Set(), sort: 'rank' };
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => n == null ? '—' : n >= 10000 ? (n / 10000).toFixed(n >= 1e6 ? 0 : 1) + ' 萬' : n.toLocaleString('zh-Hant');
  const installCmd = s => `npx skills add https://github.com/${s.repo} --skill ${s.slug}`;

  // Stats + method
  const withInst = SK.filter(s => s.installs).reduce((a, s) => a + s.installs, 0);
  document.getElementById('stats').innerHTML = [
    [SK.length, '個 Skills'], [CATS.length, '個分類'], [TAGS.length, '個標籤'],
    [fmt(withInst), 'Skills.sh 累計安裝'], [DATA.updated, '資料日期']
  ].map(([b, t]) => `<div><b>${esc(b)}</b><span>${esc(t)}</span></div>`).join('');
  document.getElementById('method').innerHTML = [
    DATA.method,
    'Skills.sh 與 SkillsMP、Skill Store 網站本身在收集環境中無法連線；Skills.sh 排行改用 GitHub 上每日更新的開放鏡像資料（LinklyAI/best-skills，CC BY 4.0），SkillsMP 與 Skill Store 暫未收錄。',
    '原文直接取自各 skill 的 GitHub 儲存庫 SKILL.md；翻譯為繁體中文，程式碼區塊保留原樣。飛書 lark-* 原文為簡體中文，以 OpenCC 轉為台灣繁體。',
    'Anthropic 的 docx、pdf、pptx、xlsx 為專有授權，Remotion 未標示授權：這 5 個只提供中文介紹與用法，原文請點來源連結閱讀。'
  ].map(t => `<li>${esc(t)}</li>`).join('');
  document.getElementById('foot').innerHTML = `資料整理於 ${esc(DATA.updated)}。各 skill 版權屬原作者，授權見各項目的「授權」欄。排名數字為本典藏的推薦順序；Skills.sh 排名與安裝數為全站歷史累計。`;

  function matches(s) {
    if (state.cat && s.category !== state.cat) return false;
    if (state.site && !s.sites.includes(state.site)) return false;
    for (const t of state.tags) if (!s.tags.includes(t)) return false;
    if (state.q) {
      const q = state.q.toLowerCase();
      const hay = [s.title, s.slug, s.summary, s.category, s.tags.join(' '), s.description_en, s.repo]
        .concat(state.full ? [s.translation, s.original, s.usage] : []).join('\n').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }
  function sorted(list) {
    const l = list.slice();
    if (state.sort === 'installs') l.sort((a, b) => (b.installs || 0) - (a.installs || 0) || a.rank - b.rank);
    else if (state.sort === 'cat') l.sort((a, b) => CATS.indexOf(a.category) - CATS.indexOf(b.category) || a.rank - b.rank);
    else if (state.sort === 'name') l.sort((a, b) => a.slug.localeCompare(b.slug));
    else l.sort((a, b) => a.rank - b.rank);
    return l;
  }
  const facet = (items, key, label) => `<div class="facet" role="group" aria-label="${label}">
      <button type="button" data-${key}="" aria-pressed="${!state[key]}"><span>全部</span><span class="n">${SK.length}</span></button>
      ${items.map(([v, n]) => `<button type="button" data-${key}="${esc(v)}" aria-pressed="${state[key] === v}"><span>${esc(v)}</span><span class="n">${n}</span></button>`).join('')}
    </div>`;

  function renderList() {
    document.getElementById('app').classList.remove('is-detail');
    const catCounts = CATS.map(c => [c, SK.filter(s => s.category === c).length]);
    const siteCounts = SITES.map(c => [c, SK.filter(s => s.sites.includes(c)).length]);
    view.innerHTML = `<div class="layout">
      <aside class="rail">
        <div class="search">
          <h2><label for="q">搜尋</label></h2>
          <input id="q" type="search" placeholder="名稱、標籤、用途…" value="${esc(state.q)}" autocomplete="off">
          <label class="full"><input id="full" type="checkbox" ${state.full ? 'checked' : ''}> 同時搜尋原文與翻譯全文</label>
        </div>
        <div><h2>分類</h2>${facet(catCounts, 'cat', '分類')}</div>
        <div><h2>收錄來源</h2>${facet(siteCounts, 'site', '收錄來源')}</div>
        <details class="tagbox" id="tagbox"><summary>標籤（${TAGS.length}）</summary><div class="tagcloud" id="tags">${TAGS.map(([t, n]) => `<button type="button" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}" title="${n} 個">${esc(t)}</button>`).join('')}</div></details>
        <button type="button" class="reset" id="reset">清除所有篩選</button>
      </aside>
      <section aria-label="Skill 清單">
        <div class="toolbar"><span class="count" id="count"></span>
          <label>排序 <select id="sort">
            <option value="rank">推薦順序</option><option value="installs">Skills.sh 安裝數</option>
            <option value="cat">分類</option><option value="name">英文名稱</option></select></label>
        </div>
        <ol class="cards" id="cards"></ol>
      </section></div>`;
    document.getElementById('sort').value = state.sort;
    if (matchMedia('(min-width: 861px)').matches || state.tags.size) document.getElementById('tagbox').open = true;
    renderCards();
    const q = document.getElementById('q');
    q.addEventListener('input', () => { state.q = q.value.trim(); renderCards(); });
    document.getElementById('full').addEventListener('change', e => { state.full = e.target.checked; renderCards(); });
    document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; renderCards(); });
    document.getElementById('reset').addEventListener('click', () => { Object.assign(state, { q: '', full: false, cat: '', site: '', tags: new Set() }); renderList(); });
    view.querySelectorAll('[data-cat],[data-site]').forEach(b => b.addEventListener('click', () => {
      const key = b.hasAttribute('data-cat') ? 'cat' : 'site';
      state[key] = b.dataset[key];
      view.querySelectorAll(`[data-${key}]`).forEach(x => x.setAttribute('aria-pressed', String(x.dataset[key] === state[key])));
      renderCards();
    }));
    view.querySelectorAll('[data-tag]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.tag;
      state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t);
      b.setAttribute('aria-pressed', String(state.tags.has(t)));
      renderCards();
    }));
  }

  function renderCards() {
    const list = sorted(SK.filter(matches));
    document.getElementById('count').textContent = `顯示 ${list.length} / ${SK.length} 個`;
    const ol = document.getElementById('cards');
    if (!list.length) { ol.innerHTML = `<li class="empty">沒有符合條件的 skill。試著減少標籤，或清除篩選。</li>`; return; }
    ol.innerHTML = list.map(s => `<li><a class="card" href="#s-${s.slug}">
        <span class="rk" aria-label="推薦第 ${s.rank} 名">${String(s.rank).padStart(2, '0')}</span>
        <h3>${esc(s.title)} <code>${esc(s.slug)}</code></h3>
        <span class="inst">${s.installs ? `<b>${fmt(s.installs)}</b><span>次安裝</span>` : `<span>未上榜</span>`}</span>
        <p>${esc(s.summary)}</p>
        <span class="chips"><span class="chip cat">${esc(s.category)}</span>${s.sites.map(x => `<span class="chip site">${esc(x)}</span>`).join('')}${s.tags.slice(0, 4).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</span>
      </a></li>`).join('');
  }

  function md(text, s) {
    if (!text) return '';
    let html;
    if (window.marked && window.DOMPurify) html = DOMPurify.sanitize(marked.parse(text, { gfm: true }));
    else html = `<pre>${esc(text)}</pre>`;
    const box = document.createElement('div');
    box.innerHTML = html;
    if (s) {
      const dir = `https://github.com/${s.repo}/blob/main/${s.path.replace(/SKILL\.md$/, '')}`;
      box.querySelectorAll('a[href]').forEach(a => {
        const h = a.getAttribute('href');
        if (!/^(https?:|#|mailto:)/i.test(h)) { try { a.href = new URL(h, dir).href; } catch (e) {} }
        if (!h.startsWith('#')) { a.target = '_blank'; a.rel = 'noopener'; }
      });
    }
    return box.innerHTML;
  }
  function split(text) {
    const m = text.match(/^---\n([\s\S]*?)\n---\n?/);
    return m ? [m[1], text.slice(m[0].length)] : ['', text];
  }
  function docHtml(text, s, label) {
    const [front, body] = split(text);
    const desc = label === '中文' ? s.description_zh : s.description_en;
    return (desc ? `<p class="trig"><b>觸發描述（description）</b>${esc(desc)}</p>` : '') + (front ? `<details class="front"><summary>${label}前置資料（frontmatter）</summary><div class="md"><pre><code>${esc(front)}</code></pre></div></details>` : '') +
      `<div class="md">${md(body, s)}</div>`;
  }

  function renderDetail(s) {
    document.getElementById('app').classList.add('is-detail');
    const idx = SK.indexOf(s);
    const prev = SK[idx - 1], next = SK[idx + 1];
    view.innerHTML = `<article class="detail">
      <a class="back" href="#">← 回到全部 Skills</a>
      <div class="dhead">
        <span class="kicker">推薦第 ${s.rank} 名 · ${esc(s.category)}</span>
        <h2>${esc(s.title)} <code>${esc(s.slug)}</code></h2>
        <p class="summary">${esc(s.summary)}</p>
        <span class="chips" style="display:flex;flex-wrap:wrap;gap:6px">${s.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</span>
      </div>
      <dl class="facts">
        <div><dt>收錄來源</dt><dd>${esc(s.sites.join('、'))}</dd></div>
        <div><dt>Skills.sh 安裝數</dt><dd>${s.installs ? s.installs.toLocaleString('zh-Hant') + ' 次' : '未在前 600 名'}</dd></div>
        <div><dt>Skills.sh 全站排名</dt><dd>${s.skillssh_rank ? '#' + s.skillssh_rank : '—'}</dd></div>
        <div><dt>儲存庫</dt><dd><a href="https://github.com/${esc(s.repo)}" target="_blank" rel="noopener">${esc(s.repo)}</a></dd></div>
        <div><dt>授權</dt><dd>${esc(s.license)}</dd></div>
        <div><dt>原始檔</dt><dd><a href="${esc(s.github_url)}" target="_blank" rel="noopener">SKILL.md</a>${s.skillssh_url ? ` · <a href="${esc(s.skillssh_url)}" target="_blank" rel="noopener">skills.sh 頁面</a>` : ''}</dd></div>
      </dl>
      <div class="install"><code id="cmd">${esc(installCmd(s))}</code><button type="button" class="btn" id="copy">複製安裝指令</button></div>
      <h3 class="section-h">用法</h3>
      <div class="usage md">${md(s.usage)}</div>
      ${s.redistributable ? `
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="t-zh" aria-selected="true" aria-controls="panel">中文翻譯</button>
        <button type="button" role="tab" id="t-en" aria-selected="false" aria-controls="panel">英文原文</button>
        <button type="button" role="tab" id="t-both" aria-selected="false" aria-controls="panel">中英對照</button>
      </div>
      <div class="panel" id="panel" role="tabpanel"></div>` : `
      <div class="notice"><strong>原文未轉載。</strong> 這個 skill 的授權（${esc(s.license)}）不允許重新散布，本典藏只提供上方的中文介紹與用法。完整原文請到 <a href="${esc(s.github_url)}" target="_blank" rel="noopener">GitHub 原始檔</a>閱讀。${s.description_en ? `<p class="desc-en">官方描述：${esc(s.description_en)}</p>` : ''}</div>`}
      <div class="install" style="margin-top:40px">
        ${prev ? `<a class="btn ghost" href="#s-${prev.slug}">← ${esc(prev.title)}</a>` : ''}
        ${next ? `<a class="btn ghost" href="#s-${next.slug}">${esc(next.title)} →</a>` : ''}
      </div>
    </article>`;
    document.getElementById('copy').addEventListener('click', () => copy(installCmd(s)));
    if (s.redistributable) {
      const panel = document.getElementById('panel');
      const show = which => {
        ['zh', 'en', 'both'].forEach(k => document.getElementById('t-' + k).setAttribute('aria-selected', String(k === which)));
        panel.innerHTML = which === 'zh' ? docHtml(s.translation, s, '中文')
          : which === 'en' ? docHtml(s.original, s, '原文')
          : `<div class="compare"><div><h4>中文翻譯</h4>${docHtml(s.translation, s, '中文')}</div><div><h4>英文原文</h4>${docHtml(s.original, s, '原文')}</div></div>`;
      };
      ['zh', 'en', 'both'].forEach(k => document.getElementById('t-' + k).addEventListener('click', () => show(k)));
      show('zh');
    }
    window.scrollTo(0, 0);
  }

  function copy(text) {
    const done = () => toast('已複製安裝指令');
    try {
      navigator.clipboard.writeText(text).then(done, () => selectCmd());
    } catch (e) { selectCmd(); }
  }
  function selectCmd() {
    const el = document.getElementById('cmd');
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('已選取指令，請按 Ctrl/⌘ + C 複製');
  }
  let tt;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2200);
  }

  let listScroll = 0;
  function route() {
    const h = location.hash.replace(/^#/, '');
    const s = h.startsWith('s-') && bySlug[h.slice(2)];
    if (s) { if (!document.getElementById('panel') && document.getElementById('cards')) listScroll = scrollY; renderDetail(s); }
    else { renderList(); window.scrollTo(0, listScroll); }
  }
  addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>

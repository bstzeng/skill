es.mjs` 在最終頁面上執行且沒有問題，而你讀了每一張表（桌面、手機、減少動態）。\n- 一個陌生人看第一屏五秒鐘，就能說出這是什麼、該做什麼。\n- 每個區塊都有標題；兩側邊距相符；頁面上沒有任何一段是空的。\n- 你最後一輪的評論已依 `references/critique.md` §4 的形式寫下。\n\n簡短地告訴使用者：發出的方向（名稱與種子）以及任何重抽與其原因；概念句與活的東西；你最後一輪評論的最終分數，以及仍有不足之處；每一張找來的圖片與片段，附其標題、創作者、授權與來源頁面（`assets.mjs --credits` 會印出清單），以及其出處在頁面上的位置；哪些內附照片與哪些繪圖是用來代替攝影的（以便替換）；以及任何上線前必須替換的範例內容。不要宣稱你沒有執行過的檢查。\n\n## 設計規範（House rules）\n\n無論方向為何，這些在每次建構中都成立。`inspect.mjs` 會量測它們。\n\n| 規則 | 改為 |\n| --- | --- |\n| **標題：在每種寬度下都不超過兩行。** 每個 `h1`–`h6`，以及第一屏的主要文字（不論其標籤為何）。 | 刪字。然後加寬行長。最後才調大小。 |\n| **第一屏要有清楚的標題**，放在頁面唯一的 `h1` 中，且每個區塊都有標題。 | 說明這是什麼：名稱加上它做什麼、產品加上它的用途、活動加上日期與地點。 |\n| **外邊距相等；沒有擠在一邊的區塊**而另一半螢幕是空的。 | 用遠端的某樣東西收合每一處空白：區塊的圖片、第二欄、清單、圖表。 |\n| **沒有空白段落**高於約半個螢幕。 | 正常的區塊間距。刻意的留白是一張擺放好的圖片或一片色塊，每頁一次。 |\n| **陳述是段落。** 以大字排版的引言句或引文，標記為 `<p>` 或 `<blockquote>`，維持陳述的大小（桌面 36px 以下、手機 24px），長度約 25 個英文單字、三行。 | 比那更大就是標題，適用兩行規則。在盲測中，評審把一個跨四行的 42px 句子讀成四行的標題。 |\n| **沒有眉標。** 標題上方沒有小標籤、主標題上方沒有膠囊徽章、沒有「New ·」小標。 | 把資訊放進標題或第一句，或者拿掉它。 |\n| **真正的程式碼區塊以外不用等寬字。** | 內文字體。數字需要對齊處用表格數字。 |\n| **沒有索引編號。** 沒有 01 / 02 / 03、沒有 (001)、沒有「步驟 2」。 | 以位置、大小或文字呈現順序。如果順序重要，用真正的 `<ol>`。 |\n| **沒有細線。** 沒有髮絲般的分隔線、沒有 1px 外框盒、沒有網格線、十字準線或裁切標記。 | 空間。背景色調的一階變化。尺度的改變。一個實心的形狀。 |\n| **沒有漸層。** 背景不用、按鈕不用、文字也不用。 | 平塗色彩，或真實的照片。照片上文字下方的中性遮罩是唯一例外。 |\n| **靜止的東西沒有陰影。** 沒有光暈。 | 表面之間的一階色調差。只有真正浮起的東西才有陰影：選單、對話框。 |\n| **沒有 AI 助理配色。** 沒有淡黃奶油底配陶土色或鏽色；沒有紫羅蘭或靛藍。 | 發出的配色。 |\n| **沒有微小的大寫字距加寬標籤。** | 以可讀的大小、句首大寫書寫。 |\n| **沒有頂部帶圖示的功能卡片，沒有一排相同的卡片。** | 發出的區塊藍圖。 |\n| **沒有玻璃擬態。** 沒有背景模糊面板、沒有浮動膠囊導覽。 | 一條平實的列：字標、幾個連結、一個動作。 |\n| **沒有 emoji、沒有漸層色團、沒有裝飾性形狀、沒有灰色長條的假儀表板。** | 一張真實的圖片、一個真實的介面片段，或者什麼都沒有。 |\n| **標題中沒有特別樣式的強調字**（斜體、襯線、上色、底線）。 | 一種字體、一種顏色。由文字本身承載強調。 |\n| **最多兩種字體，**通常一種。 | 發出的字體系統。 |\n\n有三處保有它們自己的慣例，檢查器不會干涉：`<pre>`/`<code>` 中的真正程式碼（等寬字在那裡是正確的）、真正的表格與表單欄位（它們可以有線條），以及根元素帶有 `data-ui` 屬性的真實介面片段（產品自己的邊框與選單；見 `references/imagery.md` §7）。\n\n老實說，為什麼是這些。有些是研究量測到的：在 247 個網站中，評審團評分 7.5 以上的網站使用圖示功能卡片的比例是 1%，而 6.5 以下的網站是 28%；膠囊徽章 14% 對 34%；漸層 22% 對 52%；陰影 24% 對 48%；微小字距大寫 16% 對 57%。另一些則是作者的品味，與目前的藝廊流行相反：等寬字標籤、索引編號與髮絲網格，在得獎網站上其實比在弱網站上*更*常見，這正是生成器模仿它們的原因，也是它們現在讀起來像戲服的原因。它們在這裡一律禁止，沒有例外。`references/tells.md` 保有附日期的登記清單。\n\n拿掉裝飾會留下空間。絕不要用另一種裝飾填滿它。用尺度（讓主要的東西更大）、用完整的內容、用為這個主題製作的圖片，或用一片平塗色彩填滿它。每頁最多刻意留白一次。\n\n## 工藝法則\n\n簡短版。數字除非標示為設計規範，否則都來自研究。\n\n**字體**\n- 兩到三種大小承擔可見的工作：一個非常大、一個小，中間什麼都沒有。研究網站的標題與內文比例中位數為 4.3；最好的遠遠超過（最大字級：頂尖網站中位數 8.4vw，弱網站 5.0vw）。\n- 展示字體：字距 -0.02 到 -0.05em，行高 0.85–1.05。內文：16–20px，行高 1.45–1.6，每行 45–75 個字元。\n- 一頁五種大小是上限。一個字體家族是常態（研究網站的三分之一）；兩個是上限。\n- 預設靠左對齊。最多一處置中。\n\n**空間**\n- 一套網格、一組緊湊的邊距（16–32px），處處使用；大的東西延伸到邊緣。整個頁面上的文字區塊共用兩到三條左緣。\n- 不對稱在網格之內，絕不在框架上：兩側外邊距相等，偏離中心的標題由網格遠端的某樣東西回應。\n- 區塊之間的間距明顯大於區塊內部的任何間距：桌面 120–240px（研究的中位數約 240）。\n- 每個區塊的構圖都與相鄰區塊不同；沒有一個是卡片網格。\n\n**色彩**\n- 一個底色、一個墨色、一個強調色。強調色出現在動作上，或許再加一樣東西。\n- 內文使用完整的墨色。以淡灰排版的頁面讀起來像未完成。\n- 表面以小小的一階色調區隔，絕不用線條或陰影。\n- 一個區塊可以改變整片底色。沒有東西會漸變成任何東西。\n\n**影像**\n- 一張主導的圖片勝過六張小圖。在評分最高的網站中，主視覺媒體有 68% 的時間覆蓋第一屏至少一半。\n- 相同的裁切比例、相同的處理、直角，除非方向另有指示（73% 的研究網站讓媒體保持直角）。\n- 沒有圖片勝過占位圖、圖示或抽象形狀。用心以其色彩為這個主題畫出的圖片，比兩者都好。找來並註明出處的它的世界的真實圖片，又更好。\n- 每一張找來的圖片都下載進專案、在頁面上註明出處，並列在報告中。沒有一張被呈現為客戶自己的。\n- 絕不讓任何東西疊在標題或陳述上方（檢查器會判定失敗）。\n\n**元件**\n- 按鈕：扁平、單一填色，要嘛直角、要嘛全圓，一次決定（頂尖網站：52% 直角、23% 膠囊；9–16px 的「柔和」圓角是弱網站的預設）。大多數強而有力的主視覺完全沒有按鈕，或只有一個。\n- 導覽：字標、三到五個平實的連結、一個動作。沒有導覽列外框。\n- 控制項以它的形式、標籤與位置說明如何使用它。當它似乎需要一句話說明如何操作時，重新設計控制項，而不是加上那句話。欄位接受什麼則是另一回事。先在能做到的地方移除限制：日期選擇器，或能接受任何常見格式的解析器。仍然存在的限制，例如密碼規則或檔案類型與大小，要在欄位旁保持可見，並以 `aria-describedby` 與其連結。\n- 頁尾是經過設計的收尾，而不是網站地圖：在大多數強網站上，名稱會以全寬回歸。\n\n## 特殊情況\n\n**既有的品牌或設計系統。** 傳入 `--keep palette,type`，把品牌的色彩與字體對應到各角色，只從發牌中取用構圖。設計規範仍然適用；如果品牌本身要求某個被禁止的手法（它的 Logo 放在漸層中、它的強調色是紫羅蘭），就保留品牌素材，在報告中說明，並只針對那條規則對檢查器傳入 `--allow <rule>`。\n\n**既有頁面或 App 畫面的重新設計、改造風格或審查。**\n\n1. **記錄改造前。** 照原樣執行專案，並把它檢查到它自己的資料夾（`inspect.mjs <url> --out .taste-skill/before`，App 畫面加上 `--app`），並 lint 其原始碼。閱讀程式碼：框架、樣式方法（Tailwind v3 或 v4、CSS modules、styled-components、純 CSS）、元件，以及必須保留的東西：路由、表單、資料、行為、品牌自己的素材。\n2. **審查到此為止。** 以 `references/critique.md` 評論改造前的截圖，搭配檢查器的量測列出發現，並指出最能改善頁面的三項變更。\n3. **保留技術棧、內容與有效的部分。** 不遷移框架或樣式函式庫；加入任何東西之前先檢查相依檔。改造風格會保留版面，並從發出的方向取用字體、色彩與元件（品牌固定的部分用 `--keep`）；重新設計則發出完整的方向，並在既有元件內依其藍圖重建區塊。無論哪種，都用頁面的真實內容從流程的步驟 2 開始。\n4. **工作順序，以最小風險換取最大效果：** 字體（字型與尺度）、色彩（一個底色、一個墨色、一個強調色）、框架（邊距、區塊節奏、第一屏的標題與每個區塊的標題）、狀態（懸停、焦點、載入、空白、錯誤），然後把罐頭元件（圖示卡片、膠囊徽章、漸層色團、卡片網格）替換成發出的藍圖。\n5. **證明它。** 再次檢查到 `.taste-skill/after`，在每種寬度下比較前後，點過先前可運作的每個連結、表單與選單，並把前後的量測並排報告。\n\n**一個元件或單一區塊，而不是整頁。** 除非沒有方向可以遵循，否則略過發牌。配合周圍的設計，套用設計規範與法則，並仍然檢查結果。\n\n**沒有結帳、沒有表單後端。** 當需求指名了真實目的地時，主要按鈕就導向它。否則它會開啟一封帶有寫好主旨與內文的電子郵件（填入訪客選擇的 `mailto:`），或者，對於商店，它指向 `#checkout`，並在報告中說明上線前必須接上。絕不偽造付款表單。\n\n**沒有 Chrome 或 Node 22。** 執行 `lint.mjs`（Node 18+），用你手邊的任何瀏覽器工具截圖，並評論那些截圖。在報告中說明檢查器無法執行。\n\n**沒有網路。** 如果 `assets.mjs` 連不到任何來源，就畫出圖片，並在報告中說明無法搜尋開放館藏。\n\n## 檔案\n\n| 檔案 | 何時閱讀 |\n| --- | --- |\n| `references/app-screens.md` | 任何儀表板、管理、設定或其他 App 畫面：它自己的流程、規則、token 與檢查。 |\n| `references/copy.md` | 撰寫論點與文案稿（步驟 2 與 5）。兩行計算。 |\n| `references/type.md` | 設定字體：字級階層、字距、行長、載入字型、搭配。 |\n| `references/colour.md` | 套用配色：角色、比例、色調階、深色頁面、對比。 |\n| `references/layout.md` | 網格、邊距、節奏、區塊多樣性、導覽、頁尾、手機構圖。 |\n| `references/imagery.md` | 選擇、尋找、註明出處、裁切與處理圖片；沒有圖片時怎麼辦。 |\n| `references/motion.md` | 步驟 9。預算、token、做法、減少動態。 |\n| `references/scenes.md` | 步驟 6，當方向表發出捲動場景時：把場景放到頁面上、填滿、調整、手機、檢查、目錄。 |\n| `references/critique.md` | 步驟 8。如何看、如何評分、先修什麼。 |\n| `references/tells.md` | 附日期的生成頁面破綻登記清單，以及每一項的替代方案。 |\n| `references/research.md` | 研究：方法、數字、最好與最差的網站做了什麼。引用它，不要猜。 |\n| `scripts/draw.mjs` | 發出並重新印出方向；`--photos`、`--site <id>` 取得更多參考；`--app` 改為發出 App 風格。 |\n| `scripts/assets.mjs` | 步驟 6：在開放館藏中搜尋主題世界的真實圖片；`--get` 連同出處一起下載，`--credits` 印出出處。 |\n| `scripts/lint.mjs` · `scripts/inspect.mjs` | 關卡。 |\n| `scripts/scenes.mjs` | 捲動場景的關卡：每個場景在其停留的 0–100% 處，桌面、手機、減少動態。 |\n| `assets/base.css` · `assets/base.js` | 可選用、用來建構的中性基礎。 |\n| `assets/scenes/` | 捲動場景：共用的舞台（`stage.js`、`stage.css`），以及資料庫中每個場景的 `.js`、`.css` 與 `demo/` 中的可運作示範頁。 |\n| `assets/app.css` · `assets/charts.js` | 給 App 畫面用：中性的外殼、面板、表格與控制項，以及依 App 規則繪製的小型 SVG 圖表。 |\n| `library/` | 發牌所讀取的資料：方向、主視覺、區塊、字體系統、配色、照片、研究網站、動態、捲動場景（`scenes.json`），以及 App 風格、外殼與畫面模式（`app.json`）。不要整份讀；使用腳本。 |"}, {"rank": 29, "slug": "caveman", "title": "原始人精簡模式", "category": "溝通與學習", "tags": ["省 Token", "精簡回覆", "寫作風格"], "summary": "讓代理切換成「聰明原始人」口吻：先給答案、刪掉所有客套廢話，但保留每一個技術事實，大幅節省輸出 token。直到你說「stop caveman」才關閉。", "usage": "- 安裝：`npx skills add https://github.com/juliusbrussee/caveman --skill caveman`\n- 輸入 `/caveman`、「caveman mode」、「be brief」、「less tokens」啟用\n- `/caveman status` 查看目前模式；說「stop caveman」或「normal mode」關閉\n- 安全警告、不可逆操作、寫入程式碼/commit/文件時會自動切回完整句子", "sites": ["Skills.sh"], "repo": "juliusbrussee/caveman", "path": "skills/caveman/SKILL.md", "github_url": "https://github.com/juliusbrussee/caveman/blob/main/skills/caveman/SKILL.md", "skillssh_url": "https://skills.sh/juliusbrussee/caveman/caveman", "skillssh_rank": 76, "installs": 598207, "license": "Apache-2.0", "redistributable": true, "description_en": "Terse caveman voice: answer first, fluff gone, every technical fact kept. Use for /caveman, \"caveman mode\", \"talk like caveman\", \"be brief\", \"less tokens\". Stays on until \"stop caveman\" or \"normal mode\".", "description_zh": "精簡的原始人口吻：答案先說、廢話刪光、每個技術事實都保留。 用於 /caveman、「caveman mode」、「talk like caveman」、「be brief」、 「less tokens」。持續開啟，直到「stop caveman」或「normal mode」。", "original": "---\nname: caveman\ndescription: >\n  Terse caveman voice: answer first, fluff gone, every technical fact kept.\n  Use for /caveman, \"caveman mode\", \"talk like caveman\", \"be brief\", \"less\n  tokens\". Stays on until \"stop caveman\" or \"normal mode\".\n---\n\n# caveman\n\nRespond terse like smart caveman. All technical substance stay. Only fluff die.\n\nCaveman is a voice, not broken grammar. Reader pays per token and reads in a terminal. Every word earns its place. Every fact survives.\n\n## Persistence\n\nEvery response, whole session, until user says \"stop caveman\" or \"normal mode\". Unsure if still on? It is. Confirm the switch-off in one line.\n\n`/caveman ultra` and `/caveman wenyan` are aliases: follow the `ultracave` or `megacave` skill instead of this one. `/caveman status` reports the mode and changes nothing. Relay the hook's `Caveman mode: <mode>` value when present. No hook value (host without hooks): report the mode you followed before this command, or `off` if caveman was turned off or never active, plus `(not tracked by this host)`. Example: `Caveman mode: caveman (not tracked by this host)`. Loading this skill to answer status is not activation. Never infer a mode from the configured default.\n\n## Why\n\n1. Every output token is billed and read. Filler costs twice.\n2. Code, commands, paths, numbers, errors are the payload. One changed character breaks them.\n3. Ceremony is expensive, grammar is cheap. \"Sure, I'd be happy to help\" is ten tokens. \"the\" is one.\n4. A dropped negation costs more than every token saved. Clarity beats compression.\n\n## Rules\n\n### 1. Answer first\n\nAnswer, then reason, then next step. Pattern: `[thing] [action] [reason]. [next step].`\n\nBad: \"Sure! I'd be happy to help. The issue you're experiencing is likely caused by...\"\nGood: \"Bug in auth middleware. Token expiry check use `<` not `<=`. Fix:\"\n\n### 2. Kill ceremony\n\nNo greeting, hedging, pleasantries, recap, or closer. No \"Sure!\", \"Let me\", \"I'll now\", \"Hope this helps\". No just/really/basically/actually/simply.\n\n### 3. Short word\n\n\"fix\" not \"implement a solution for\". Standard acronyms fine (DB, API, HTTP). Invented abbreviations not (cfg, impl, fn): same tokens, harder read. No arrows.\n\n### 4. Articles optional, meaning never\n\nDrop a/an/the when the sentence still reads in one pass. Fragments fine. Never drop not/never/no/only/except. Numbers and units exact.\n\nBad: \"Migration drop column backup first.\"\nGood: \"Back up first. Then run migration: it drops the column.\"\n\n### 5. One idea per sentence\n\nASD-STE100 is the floor: 20 words max, active voice, imperative for instructions, one term per thing, pronoun only with an obvious referent. Compression and clarity conflict? Clarity wins.\n\n### 6. Payload verbatim\n\nCode blocks unchanged. Commands, paths, API names exact. Errors quoted exact, shortest decisive line only. Code change shown in chat: changed lines plus 1-2 lines of context, not the whole file. Whole file only if the user asks, the file is new, or most of it changes. Existing comments in files you edit are payload too: never delete or shorten one you were not asked to change.\n\n### 7. Tool runs: bounded status\n\nNo text between routine calls. One line before a multi-step run, one line per phase change, one line with the result at the end. Otherwise text before a call only to clarify, warn, or disambiguate.\n\n### 8. User's language\n\nCompress the style, not the language. An explicit reply-language instruction wins. Never switch because of quoted text. Technical terms and errors stay verbatim. Particles and case markers are grammar, not filler.\n\n### 9. Never perform caveman\n\nNo \"caveman mode on\", no \"me think\", no \"Caveman:\" prefix, no normal answer plus caveman copy. No decorative tables or emoji. Never add a word to sound caveman. Caveman phrasing not shorter than plain? Use plain.\n\n## When to break the rules\n\nPlain prose, then resume:\n\n1. Security warning.\n2. Irreversible action. Confirm in full sentences first.\n3. Step order a fragment could scramble.\n4. User confused or repeats the question.\n5. Anything persisted outside chat: code, comments, commits, docs, issues, PRs, tickets, memory files, third-party messages. `/caveman-compress` exempt.\n6. Harness asks for a status line or confirmation. Give it. Harness decides *when* you speak, caveman decides *how*.\n7. You ask the user a question or offer options. Full sentences, so the answer comes back right first time.\n\n## Pre-send check\n\n1. First sentence announces what you will do? Delete.\n2. Last sentence recaps or offers help? Delete.\n3. Every not/never/no/only present? Every code span, path, number, error verbatim?\n4. Any sentence with two readings? Make it a full sentence.\n", "translation": "---\nname: caveman\ndescription: >\n  精簡的原始人口吻：答案先說、廢話刪光、每個技術事實都保留。\n  用於 /caveman、「caveman mode」、「talk like caveman」、「be brief」、\n  「less tokens」。持續開啟，直到「stop caveman」或「normal mode」。\n---\n\n# caveman（原始人模式）\n\n像聰明原始人一樣精簡回應。所有技術實質都留下。只有廢話死掉。\n\n原始人是一種口吻，不是破碎的文法。讀者按 token 付費，而且在終端機裡閱讀。每個字都要有存在的理由。每個事實都要存活。\n\n## 持續性\n\n每一則回應、整個 session，直到使用者說「stop caveman」或「normal mode」。不確定是否還開著？就是開著。用一行確認關閉。\n\n`/caveman ultra` 和 `/caveman wenyan` 是別名：改為遵循 `ultracave` 或 `megacave` 技能而非本技能。`/caveman status` 回報模式，不改變任何東西。有 hook 的 `Caveman mode: <mode>` 值時就轉述它。沒有 hook 值（主機不支援 hook）：回報這個指令之前你所遵循的模式，若原始人模式已關閉或從未啟用則回報 `off`，並加上 `(not tracked by this host)`。範例：`Caveman mode: caveman (not tracked by this host)`。為了回答 status 而載入本技能，不算啟用。絕不從設定的預設值推斷模式。\n\n## 為什麼\n\n1. 每個輸出 token 都被計費、被閱讀。贅字付兩次錢。\n2. 程式碼、指令、路徑、數字、錯誤訊息才是重點。改一個字元就壞掉。\n3. 客套很貴，文法很便宜。「Sure, I'd be happy to help」是十個 token，「the」只有一個。\n4. 漏掉一個否定詞的代價，比省下的所有 token 都大。清楚勝過壓縮。\n\n## 規則\n\n### 1. 答案先說\n\n先答案，再理由，再下一步。句型：`[東西] [動作] [原因]。[下一步]。`\n\n壞：「當然！我很樂意幫忙。你遇到的問題很可能是由……造成的」\n好：「Bug 在 auth middleware。Token 過期檢查用了 `<` 而非 `<=`。修法：」\n\n### 2. 砍掉客套\n\n不要問候、含糊其辭、寒暄、重述或結語。不要「當然！」「讓我來」「我現在會」「希望有幫助」。不要 just/really/basically/actually/simply（就/真的/基本上/其實/只要）。\n\n### 3. 用短詞\n\n說「修」，不說「為此實作一個解決方案」。標準縮寫可以（DB、API、HTTP）。自創縮寫不行（cfg、impl、fn）：token 數一樣，卻更難讀。不要用箭頭。\n\n### 4. 冠詞可省，意思不可省\n\n句子一次就能讀懂時，可以省略 a/an/the。片段句可以。絕不省略 not/never/no/only/except（不/絕不/沒有/只/除了）。數字與單位要精確。\n\n壞：「Migration 刪欄位備份先。」\n好：「先備份。然後執行 migration：它會刪除該欄位。」\n\n### 5. 一句一個想法\n\nASD-STE100 是底線：最多 20 字、主動語態、指示用祈使句、一個東西一個術語、只有在指涉對象明顯時才用代名詞。壓縮和清楚衝突？清楚贏。\n\n### 6. 重點內容一字不改\n\n程式碼區塊不改。指令、路徑、API 名稱要精確。錯誤訊息精確引用，只取最短、最關鍵的那一行。在對話中展示程式碼變更：變更的行加上 1–2 行上下文，而不是整個檔案。只有在使用者要求、檔案是新的，或大部分都改了時，才給整個檔案。你編輯的檔案中既有的註解也是重點內容：沒被要求修改的註解，絕不刪除或縮短。\n\n### 7. 工具執行：有限度的狀態回報\n\n例行呼叫之間不要有文字。多步驟執行前一行、每次階段轉換一行、最後結果一行。除此之外，只有為了釐清、警告或消除歧義才在呼叫前寫文字。\n\n### 8. 使用者的語言\n\n壓縮的是風格，不是語言。明確的回覆語言指示優先。絕不因為引用的文字而切換語言。技術術語與錯誤訊息一字不改。助詞與格標記是文法，不是贅字。\n\n### 9. 絕不「表演」原始人\n\n不要說「caveman mode on」、不要「me think」、不要「Caveman:」前綴、不要一般回答再加一份原始人版本。不要裝飾性的表格或 emoji。絕不為了聽起來像原始人而多加字。原始人說法沒有比一般說法短？就用一般說法。\n\n## 何時打破規則\n\n改用一般文句，之後再恢復：\n\n1. 安全警告。\n2. 不可逆的操作。先用完整句子確認。\n3. 片段句可能打亂的步驟順序。\n4. 使用者困惑或重複問同一個問題。\n5. 任何會保存在對話之外的東西：程式碼、註解、commit、文件、issue、PR、工單、記憶檔、給第三方的訊息。`/caveman-compress` 除外。\n6. 主控程式（harness）要求狀態列或確認時，照給。Harness 決定你「何時」說話，原始人決定你「如何」說話。\n7. 你要問使用者問題或提供選項時。用完整句子，讓答案第一次就正確回來。\n\n## 送出前檢查\n\n1. 第一句在宣告你要做什麼？刪掉。\n2. 最後一句在重述或提議幫忙？刪掉。\n3. 每個 not/never/no/only 都還在嗎？每個程式碼片段、路徑、數字、錯誤訊息都一字不改嗎？\n4. 有任何句子能有兩種讀法嗎？改成完整句子。"}, {"rank": 30, "slug": "microsoft-foundry", "title": "Microsoft Foundry AI 代理平台", "category": "雲端與 DevOps", "tags": ["Azure", "AI Foundry", "AI 代理", "模型部署", "微調", "Microsoft"], "summary": "Microsoft 官方技能：端到端建構、部署、評估、優化、微調與管理 Microsoft Foundry 上的 AI 代理、模型與資源。涵蓋 Prompt / Hosted / 託管 Copilot / 語音代理的完整開發生命週期、批次與持續評估、Agent Optimizer、模型部署與配額、RBAC 權限、VNet 網路隔離，以及 SFT/DPO/RFT 模型微調。", "usage": "- 安裝：`npx skills add https://github.com/microsoft/azure-skills --skill microsoft-foundry`（需 Azure CLI、azd 與 Azure MCP Server）\n- 說「在 Foundry 建一個新的 hosted agent 並部署測試」「幫我評估並優化這個代理的提示詞」「部署 gpt 模型時配額不足怎麼辦」\n- 載入後會先執行相依檢查腳本，並依任務讀取對應子技能（deploy、invoke、observe、finetuning、quota、rbac…）\n- 一般 Azure Functions / App Service 部署請改用 azure-deploy", "sites": ["Skills.sh"], "repo": "microsoft/azure-skills", "path": "skills/microsoft-foundry/SKILL.md", "github_url": "https://github.com/microsoft/azure-skills/blob/main/skills/microsoft-foundry/SKILL.md", "skillssh_url": "https://skills.sh/microsoft/azure-skills/microsoft-foundry", "skillssh_rank": 77, "installs": 581930, "license": "MIT", "redistributable": true, "description_en": "Build, deploy, evaluate, optimize, fine-tune, and manage Microsoft Foundry agents, models, and resources end to end. USE FOR: foundry, azd ai agent, azd provision/deploy, hosted agent scaffold/develop/run/deploy/troubleshoot, prompt agent, managed harness agent, Copilot harness, voice agent, create/update/invoke/evaluate agent, add tool to agent, agent insights, batch/continuous eval, continuous monitoring, agent CI/CD, optimize/improve prompt, optimize agent instructions, Agent Optimizer, dataset curation from traces, deploy model, model fine-tuning (SFT/DPO/RFT), Foundry project, RBAC, role assignment, permissions, quota, capacity, region, deployment failure, AI Services, create Foundry resource, knowledge index, customize deployment, onboard, availability, training-data, grader, distillation, large file upload. DO NOT USE FOR: Azure Functions, App Service, general Azure deploy (use azure-deploy), general Azure prep (use azure-prepare).", "description_zh": "端到端建構、部署、評估、優化、微調與管理 Microsoft Foundry 的代理、模型與資源。用於：foundry、azd ai agent、azd provision/deploy、hosted agent 建立骨架/開發/執行/部署/疑難排解、prompt agent、託管 harness 代理、Copilot harness、語音代理、建立/更新/呼叫/評估代理、為代理加入工具、代理洞察、批次/持續評估、持續監控、代理 CI/CD、優化/改進提示詞、優化代理指示、Agent Optimizer、從追蹤整理資料集、部署模型、模型微調（SFT/DPO/RFT）、Foundry 專案、RBAC、角色指派、權限、配額、容量、區域、部署失敗、AI Services、建立 Foundry 資源、知識索引、自訂部署、導入、可用性、訓練資料、評分器、蒸餾、大型檔案上傳。不要用於：Azure Functions、App Service、一般的 Azure 部署（使用 azure-deploy）、一般的 Azure 準備（使用 azure-prepare）。", "original": "---\nname: microsoft-foundry\ndescription: \"Build, deploy, evaluate, optimize, fine-tune, and manage Microsoft Foundry agents, models, and resources end to end. USE FOR: foundry, azd ai agent, azd provision/deploy, hosted agent scaffold/develop/run/deploy/troubleshoot, prompt agent, managed harness agent, Copilot harness, voice agent, create/update/invoke/evaluate agent, add tool to agent, agent insights, batch/continuous eval, continuous monitoring, agent CI/CD, optimize/improve prompt, optimize agent instructions, Agent Optimizer, dataset curation from traces, deploy model, model fine-tuning (SFT/DPO/RFT), Foundry project, RBAC, role assignment, permissions, quota, capacity, region, deployment failure, AI Services, create Foundry resource, knowledge index, customize deployment, onboard, availability, training-data, grader, distillation, large file upload. DO NOT USE FOR: Azure Functions, App Service, general Azure deploy (use azure-deploy), general Azure prep (use azure-prepare).\"\nlicense: MIT\nmetadata:\n  author: Microsoft\n  version: \"1.2.32\"\n---\n\n# Microsoft Foundry Skill\n\nThis skill helps developers work with Microsoft Foundry resources, covering model discovery and deployment, complete dev lifecycle of AI agent, evaluation workflows, and troubleshooting.\n\n## Pre-Execution Requirements\n\nFollow each applicable subsection below before starting its corresponding action or workflow.\n\n### Dependency Check and Setup\n\n**MANDATORY:** As the first step after this skill loads, run the dependency check and setup script below from this skill's root and wait for it to finish before continuing. The script checks first and installs only missing dependencies; it does not reinstall dependencies that are already available.\n\n**You MUST complete this check before reading or entering any sub-skill, workflow, or workflow-specific reference.**\n\n```bash\n./scripts/check-and-setup-dependencies.sh     # macOS / Linux\n./scripts/check-and-setup-dependencies.ps1    # Windows (pwsh)\n```\n\nStrictly follow the script output for subsequent actions.\n\n### Workflow Guidance\n\n**MANDATORY:** Before executing ANY workflow-specific steps, you MUST read the corresponding sub-skill document. Do not call workflow-specific MCP tools for a workflow without reading its skill document. This applies even if you already know the MCP tool parameters — the skill document contains required workflow steps, pre-checks, and validation logic that must be followed. This rule applies on every new user message that triggers a different workflow, even if the skill is already loaded.\n\n### Foundry MCP\n\n**MANDATORY:** Before using Foundry MCP operations, call the Azure MCP `foundry` tool and inspect the available Foundry MCP tools and related parameters. Treat this as the discovery/help step for MCP-based workflows.\n\n### azd\n\n**MANDATORY:** Before executing ANY azd command, you MUST read [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) and strictly follow the shared rules defined in it, especially the `AZURE_DEV_USER_AGENT` setting rules.\n\n## Sub-Skills\n\nThis skill includes specialized sub-skills for specific workflows. **When a sub-skill matches the task, strictly follow its workflow:**\n\n| Sub-Skill | When to Use | Reference |\n|-----------|-------------|-----------|\n| **deploy** | Deploy hosted agents to Foundry, smoke-test a deployment, create or update prompt agents, and manage agent versions and multi-environment deploys. | [deploy](foundry-agent/deploy/deploy.md) |\n| **cicd** | Set up a CI/CD deployment pipeline for a Foundry agent. | [cicd](foundry-agent/cicd/cicd.md) |\n| **invoke** | Send messages to an agent, single or multi-turn conversations | [invoke](foundry-agent/invoke/invoke.md) |\n| **routine** | Schedule or event-trigger Foundry agents with routines; use `azd` for CRUD, enable/disable, manual dispatch, and viewing past runs, or define routines in `azure.yaml`. | [routine](foundry-agent/routine/routine.md) |\n| **invocations-ws** | Build, deploy, and connect to custom Hosted agents that use developer-defined duplex real-time or media streams over `invocations_ws`. | [invocations-ws](foundry-agent/invocations-ws/invocations-ws.md) |\n| **observe** | Evaluate agent quality, run batch evals, analyze failures, optimize prompts, improve agent instructions, compare versions, set up CI/CD monitoring, and enable continuous production evaluation | [observe](foundry-agent/observe/observe.md) |\n| **insights** | Pull generated agent insights, evidence, and recommendations from an existing monitor; read-only retrieval, not a new analysis run | [insights](foundry-agent/insights/insights.md) |\n| **trace** | Query traces, analyze latency/failures, correlate eval results to specific responses via App Insights `customEvents` | [trace](foundry-agent/trace/trace.md) |\n| **troubleshoot** | View hosted agent logs, query telemetry, diagnose failures | [troubleshoot](foundry-agent/troubleshoot/troubleshoot.md) |\n| **validate** | Use only when the user explicitly asks to use this validation sub-skill or to validate Microsoft Foundry hosted-agent code against best practices. Never invoke it proactively or add it to another workflow. | [validate](foundry-agent/validate/validate.md) |\n| **create (quick start)** | Create a new hosted Foundry agent from scratch end-to-end — scaffold, provision or use an existing Foundry project, deploy, and smoke-test. Do not use for any work on existing code. For anything not covered by the quickstart, use **create**. | [create/quick-start-hosted.md](foundry-agent/create/quick-start-hosted.md) |\n| **create** | Use when the standard end-to-end happy path (quick start) doesn't fit. Create a new Foundry agent, update code of an existing agent, continue development of an existing agent, wire connections at scaffold time, use advanced setup or A2A (Agent2Agent), or recover from a failed quickstart run. | [create](foundry-agent/create/create-hosted.md) |\n| **create managed harness** | Create or continue developing a Prompt Agent that explicitly uses the Foundry-managed Copilot harness. Uses `azd` and `azure.yaml`, not the ordinary Prompt Agent MCP workflow. | [create-managed-harness](foundry-agent/create/create-managed-harness.md) |\n| **create voice** | Create, configure, or extend a Foundry Voice Agent, defaulting generic requests to managed Prompt Voice and supporting self-deployed Prompt Voice or two-agent Hosted Voice. | [create-voice](foundry-agent/create/create-voice.md) |\n| **agent-optimizer** | Make existing Python hosted-agent code optimization-ready, configure eval.yaml, run Agent Optimizer jobs, apply candidates locally, and deploy through azd after review. | [agent-optimizer](foundry-agent/agent-optimizer/agent-optimizer.md) |\n| **eval-datasets** | Harvest production traces into evaluation datasets, manage dataset versions and splits, track evaluation metrics over time, detect regressions, and maintain full lineage from trace to deployment. Use for: create dataset from traces, dataset versioning, evaluation trending, regression detection, dataset comparison, eval lineage. | [eval-datasets](foundry-agent/eval-datasets/eval-datasets.md) |\n| **project/create** | Creating a new Microsoft Foundry project for hosting agents and models. Use when onboarding to Foundry or setting up new infrastructure. | [project/create/create-foundry-project.md](project/create/create-foundry-project.md) |\n| **resource/create** | Creating Azure AI Services multi-service resource (Foundry resource) using Azure CLI. Use when manually provisioning AI Services resources with granular control. | [resource/create/create-foundry-resource.md](resource/create/create-foundry-resource.md) |\n| **private-network** | Answer questions about Foundry network isolation **and** deploy Foundry with VNet isolation (BYO VNet, Managed VNet, hybrid). Covers architecture concepts, template selection, deployment, and post-deployment validation. | [resource/private-network/private-network.md](resource/private-network/private-network.md) |\n| **models/deploy-model** | Unified model deployment with intelligent routing. Handles quick preset deployments, fully customized deployments (version/SKU/capacity/RAI), and capacity discovery across regions. Routes to sub-skills: `preset` (quick deploy), `customize` (full control), `capacity` (find availability). | [models/deploy-model/SKILL.md](models/deploy-model/SKILL.md) |\n| **quota** | Managing quotas and capacity for Microsoft Foundry resources. Use when checking quota usage, troubleshooting deployment failures due to insufficient quota, requesting quota increases, or planning capacity. | [quota/quota.md](quota/quota.md) |\n| **rbac** | Managing RBAC permissions, role assignments, managed identities, and service principals for Microsoft Foundry resources. Use for access control, auditing permissions, and CI/CD setup. | [rbac/rbac.md](rbac/rbac.md) |\n| **finetuning** | Fine-tune models on Microsoft Foundry — SFT distillation, DPO preference optimization, RFT with graders and tool calling. Dataset preparation, grader calibration, training, checkpoint selection, deployment, evaluation. Use for: fine-tune, SFT, DPO, RFT, training data, grader, distillation, fine-tuned model, large file upload. | [finetuning/SKILL.md](finetuning/SKILL.md) |\n| **azd-guidance** | Provide shared azd knowledge and guidance for managing Foundry agents. Read this first for any workflows related to azd. | [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) |\n\n> 💡 **Tip:** For a complete onboarding flow: `project/create` (public) or `private-network` (VNet isolation) → `models/deploy-model` → agent workflows (`create` → `deploy` → `invoke`).\n\n> 💡 **Fine-Tuning:** Use `finetuning` for all model customization — SFT distillation, DPO preference optimization, and RFT with graders. Includes quickstart, grader calibration, and training curve analysis.\n\n> 💡 **Model Deployment:** Use `models/deploy-model` for all deployment scenarios — it intelligently routes between quick preset deployment, customized deployment with full control, and capacity discovery across regions.\n\n> 💡 **Prompt Optimization:** For requests like \"optimize my prompt\" or \"improve my agent instructions,\" load [observe](foundry-agent/observe/observe.md) and use the `prompt_optimize` MCP tool through that eval-driven workflow.\n\n## Infrastructure Lifecycle\n\nMatch user intent to the correct infrastructure workflow.\n\n| User Intent | Workflow |\n|-------------|---------|\n| \"Create Foundry\" / \"Set up Foundry\" (ambiguous) | Use `AskUserQuestion`: (a) just an AI Services resource, (b) a project with public access, or (c) a project with network isolation? Route: (a) → [resource/create](resource/create/create-foundry-resource.md), (b) → [project/create](project/create/create-foundry-project.md), (c) → [private-network](resource/private-network/private-network.md) |\n| Set up Foundry with VNet isolation | [private-network](resource/private-network/private-network.md) |\n| Create a Foundry project (public) | [project/create](project/create/create-foundry-project.md) |\n| Create a bare Foundry resource | [resource/create](resource/create/create-foundry-resource.md) |\n\n## Agent Development Lifecycle\n\nMatch user intent to the correct agent workflow. Read each sub-skill in order before executing.\n\n| User Intent | Workflow (read in order) |\n|-------------|------------------------|\n| Create or develop a Voice Agent (Prompt Voice or Hosted Voice) | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create-voice](foundry-agent/create/create-voice.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| Create or develop an explicitly requested Managed Harness Agent / Copilot harness agent | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create-managed-harness](foundry-agent/create/create-managed-harness.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| Create a new hosted agent end-to-end (scaffold + deploy + test) | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [quick-start-hosted](foundry-agent/create/quick-start-hosted.md) (self-contained end-to-end) |\n| Anything beyond the standard quickstart (existing code, migration, re-hosting, deployment customization, scaffold-time connections, A2A (Agent2Agent), recovery) | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create](foundry-agent/create/create-hosted.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| Optimize existing Python hosted agent | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [agent-optimizer](foundry-agent/agent-optimizer/agent-optimizer.md) → scaffold/review → eval.yaml → optimize → apply candidate → deploy → invoke |\n| Deploy an agent (code already exists) | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → deploy (includes eval-suite setup) → invoke → observe (evaluate/optimize) |\n| Update/redeploy an agent after code changes | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → deploy (includes eval-suite setup) → invoke → observe (evaluate/optimize) |\n| Set up a CI/CD deployment pipeline for a hosted agent | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → cicd |\n| Invoke/test/chat with an agent | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke |\n| Schedule/event-trigger an agent, or CRUD/enable/disable/dispatch a routine | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → routine |\n| Optimize / improve agent prompt or instructions | observe (Step 4: Optimize) |\n| Evaluate and optimize agent (full loop) | observe |\n| Enable continuous evaluation monitoring | observe (Step 6: CI/CD & Monitoring) |\n| Pull agent insights / list generated issues and recommendations | [dependency check and setup](#dependency-check-and-setup) → [insights](foundry-agent/insights/insights.md) (all pages with expanded evidence; read-only) |\n| Troubleshoot an agent issue | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke → troubleshoot |\n| Fix a broken agent (troubleshoot + redeploy) | [dependency check and setup](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke → troubleshoot → apply fixes → deploy → invoke |\n\n## Agent: .foundry Workspace Standard\n\nEvery agent source folder can keep Foundry-specific cache and overlay state under `.foundry/`:\n\n```text\n<agent-root>/\n  .foundry/\n    agent-metadata.yaml\n    agent-metadata.prod.yaml\n    suites/\n    datasets/\n    evaluators/\n    results/\n```\n\n- In azd projects, derive deployment context (project endpoint, agent name/version, ACR, App Insights) from `azure.yaml` plus `azd env get-values`; do not duplicate those values in metadata when azd already provides them.\n- `agent-metadata.yaml` is the preferred local/dev overlay for non-azd values, remote Foundry suite references, local cache paths, result summaries, and explicit overrides. Optional sidecar files such as `agent-metadata.prod.yaml` can hold a single prod or CI-targeted overlay without mixing multiple environments in one file.\n- `suites/`, `datasets/`, and `evaluators/` are local cache folders. Reuse them when they are current, and ask before refreshing or overwriting them.\n- See [Agent Metadata Contract](references/agent-metadata-contract.md) for the canonical schema and workflow rules.\n\n## Agent: Setup References\n\n- [Standard Agent Setup](references/standard-agent-setup.md) — advanced setup for production workloads that need data-residency control (bring-your-own Cosmos DB / Storage / AI Search via a Foundry capability host). The default `azd ai agent` flow uses **Basic Agent Setup** and does **not** provision `capabilityHosts/agents` — do not flag its absence as a bug. For default post-provision state, see the \"Expected env-var fingerprint\" section in [foundry-agent/create/create-hosted.md](foundry-agent/create/create-hosted.md).\n\n## Agent: Common Project Context Resolution\n\nAgent skills should run this step **only when they need configuration values they don't already have**. If a value (for example, agent root, environment, project endpoint, or agent name) is already known from the user's message or a previous skill in the same session, skip resolution for that value.\n\n### Step 1: Discover Agent Roots and azd Context\n\nFirst check whether the workspace has `azure.yaml` with services using `host: azure.ai.agent`.\n\n- **One azd agent service** -> classify it from `kind`, `harness`, `modelType`, and `conversationEngine`, then use that service's `project` folder or the `azure.yaml` directory as the agent root.\n- **Multiple azd agent services** -> check whether a Voice wrapper references a `kind: hosted` service via `conversationEngine.name`:\n  - **Selecting the Hosted Voice wrapper** implies its named `kind: hosted` target as an upstream dependency (`uses: [<target>]`, `conversationEngine.name: <target>`); deploy and verification must report both services separately.\n  - **Selecting the `kind: hosted` target alone** scopes changes/debugging to the target container and does not automatically modify the wrapper.\n  - **Otherwise** -> require the user to choose the target service/folder.\n- **No azd agent service** -> search the workspace for `.foundry/` folders that contain `agent-metadata.yaml` or `agent-metadata.<env>.yaml`.\n  - **One match** -> use that agent root.\n  - **Multiple matches** -> require the user to choose the target agent folder.\n  - **No matches** -> for [insights](foundry-agent/insights/insights.md), ask only for missing remote inputs without initializing local files; for create/deploy workflows, seed a new `.foundry/` folder during setup; for other workflows, stop and ask the user which agent source folder to initialize.\n\nAfter selecting an agent root, keep all local `.foundry` cache inspection, source inspection, evaluator suggestions, dataset suggestions, and prompt-optimization context inside that folder only. Do **not** scan sibling agent folders unless the user explicitly switches roots.\n\n### Step 2: Resolve Environment and Deployment Context\n\nIf `azure.yaml` is present, resolve the azd environment first:\n\n1. Environment explicitly named by the user\n2. `AZURE_ENV_NAME` from `azd env get-values`\n3. azd default environment from `.azure/config.json`\n4. Environment already selected earlier in the session\n\nRun `azd env get-values` for the selected environment when project/deployment values are not already known. Prefer azd values for deployment context:\n\n| azd Variable | Resolves To |\n|-------------|-------------|\n| `AZURE_AI_PROJECT_ENDPOINT` or `AZURE_AIPROJECT_ENDPOINT` | Project endpoint |\n| `AGENT_<SERVICE>_NAME` | Agent name for the selected azd service |\n| `AGENT_<SERVICE>_VERSION` | Agent version for the selected azd service |\n| `AZURE_CONTAINER_REGISTRY_NAME` or `AZURE_CONTAINER_REGISTRY_ENDPOINT` | ACR registry name / image URL prefix |\n| `APPLICATIONINSIGHTS_CONNECTION_STRING` | App Insights connection string for trace workflows |\n| `AZURE_SUBSCRIPTION_ID`, `AZURE_RESOURCE_GROUP`, `AZURE_AI_ACCOUNT_NAME`, `AZURE_AI_PROJECT_NAME` | Azure resource lookup and Playground links |\n\nWhen azd supplies these values, use them as the source of truth and do not copy them into `.foundry/agent-metadata*.yaml` on metadata writes.\n\n### Step 3: Select Metadata Overlay and Resolve Environment\n\nInside the selected agent root, choose the metadata file in this order:\n1. Metadata filename or path explicitly provided by the user or workflow\n2. If an explicit environment is already known and `.foundry/agent-metadata.<env>.yaml` exists, use that file\n3. `.foundry/agent-metadata.yaml`\n4. If multiple metadata files remain and no rule above selects one, prompt the user to choose\n\nRead the selected metadata file and resolve any remaining environment choice in this order:\n1. Environment explicitly named by the user\n2. If the selected metadata file defines exactly one environment, use it\n3. Environment already selected earlier in the session\n4. `defaultEnvironment` from metadata\n\nIf the selected metadata file still contains multiple environments and none of the rules above selects one, prompt the user to choose. Keep the selected agent root, metadata file, environment, and whether context came from azd or metadata visible in every workflow summary.\n\nIf the selected environment exposes older `testSuites[]` metadata but not `evaluationSuites[]`, treat `testSuites[]` as the source for this session and normalize each entry in memory to the `evaluationSuites[]` shape before continuing. If the metadata is older still and only exposes legacy `testCases[]`, normalize that list the same way. Preserve dataset and evaluator fields, keep any existing `tags`, and map legacy `priority` to `tags.tier` only when `tags.tier` is missing: `P0` -> `smoke`, `P1` -> `regression`, `P2` -> `coverage`.\n\n### Step 4: Resolve eval.yaml Local Evaluation Intent\n\nIf `eval.yaml` exists in the selected agent root, parse it before generating new suites:\n\n- `agent.name` -> target agent candidate; verify it matches the selected azd/metadata agent before using it.\n- `dataset.local_uri` -> local seed dataset candidate; legacy `dataset_file` may be normalized in memory.\n- `dataset.name` / `dataset.version` -> registered dataset candidate.\n- `validation_dataset` -> optional validation dataset candidate.\n- `evaluators[]` -> candidate Foundry evaluator names; verify with `evaluator_catalog_get` before treating them as remote evaluators.\n- `name` -> local eval/suite candidate; verify remotely before persisting as `suiteName`.\n- `options.eval_model`, `options.optimization_model`, `options.max_candidates`, `options.optimization_config.model_search_space`, `options.pass_threshold`, `max_samples`, `trace_days`, and `generation_instruction` -> setup defaults.\n\nTreat `eval.yaml` as local evaluation intent, not proof that a Foundry suite exists. Persist synced suite/dataset/evaluator references to `.foundry` only after remote lookup or registration succeeds.\n\n### Step 5: Resolve Common Configuration\n\nLayer sources in this order:\n\n1. Explicit user input and values already selected in the session\n2. azd environment values for deployment context\n3. `.foundry/agent-metadata*.yaml` overlay values and remote suite/cache references\n4. `azure.yaml` and `eval.yaml` local source configuration\n5. User prompts for anything still missing\n\nIf azd and metadata both provide the same value and they differ, stop and ask which source is authoritative. If they match, use the azd value and avoid rewriting the duplicate on future metadata writes.\n\n| Effective Value | Preferred Source | Used By |\n|-----------------|------------------|---------|\n| Project endpoint | azd env | deploy, invoke, observe, trace, troubleshoot |\n| Agent name/version | azd agent variables, then `azure.yaml` | invoke, observe, trace, troubleshoot |\n| ACR | azd env | deploy |\n| Evaluation suites and cache paths | `.foundry/agent-metadata*.yaml` | observe, eval-datasets |\n| Local seed dataset/evaluator intent | `eval.yaml` | observe, eval-datasets |\n\n### Step 6: Write Metadata Overlay (Create/Deploy/Observe Only)\n\nOn any metadata write (deploy, auto-setup, dataset refresh, or trace-to-dataset update), persist only non-derivable overlay/cache state in the selected metadata file:\n\n- azd binding (`azd.environmentName`, `azd.service`) when useful for future resolution\n- `evaluationSuites[]` with remote suite/dataset/evaluator references and local cache paths\n- `lastEval`, result files, comparison summaries, or explicit non-azd overrides\n\nDo not copy azd-owned deployment values into metadata when azd already provides them. If the selected file is a preferred single-environment file, rewrite only that one environment block. If the selected file is a legacy multi-environment file, rewrite only the selected environment block. Never copy or merge environments across sibling metadata files automatically. If the selected environment still uses older `testSuites[]` or legacy `testCases[]`, rewrite it to `evaluationSuites[]` and remove migrated `priority` fields from the rewritten entries.\n\n### Step 7: Collect Missing Values\n\nUse the `ask_user` or `askQuestions` tool **only for values not resolved** from the user's message, session context, metadata, or azd bootstrap. Common values skills may need:\n- **Agent root** — Target azd service project folder or folder containing `.foundry/agent-metadata*.yaml`\n- **Metadata file** — `agent-metadata.yaml` for local/dev, or an explicit sidecar such as `agent-metadata.prod.yaml`\n- **Environment** — azd environment, `dev`, `prod`, or another environment key from metadata\n- **Project endpoint** — Microsoft Foundry project endpoint URL\n- **Agent name** — Name of the target agent\n\n> 💡 **Tip:** If the user already provides the agent path, environment, project endpoint, or agent name, extract it directly — do not ask again.\n\n## Agent: Agent Types\n\nAgent workflows distinguish four first-class agent types:\n\n| Type | Kind | Description |\n|------|------|-------------|\n| **Prompt** | `\"prompt\"` | LLM-based agents backed by a model deployment; managed via Foundry MCP or SDK |\n| **Hosted** | `\"hosted\"` | Container-based agents running custom code; developed and deployed via `azd` |\n| **Managed Harness Agent** | `\"prompt\"` with `harness.type: \"microsoft_copilot_preview\"` for new authoring | Prompt Agent running on the Foundry-managed Copilot harness; developed and deployed via `azd` |\n| **Voice** | `\"voice\"` | Managed real-time Voice Agent — either **Prompt Voice** (1 agent, `modelType: managed` or `self_deployed`) or **Hosted Voice** (2 agents: `kind: voice` wrapper with `conversationEngine.type: hosted_agent` + `kind: hosted` target over `invocations_ws` `1.0.0` and Voice Live Bridge `1.0`); developed and deployed via `azd` and verified over the `voice` WebSocket endpoint |\n\nClassify an `azure.yaml` service by its definition in this exact order, not by `host` alone:\n\n1. `kind: voice` -> **Voice**. For compatibility, silently classify an existing `kind: prompt-voice` service as Voice, then normalize it when editing its YAML. Classify the subtype:\n   - `conversationEngine.type: hosted_agent` -> **Hosted Voice wrapper** (paired with a named `kind: hosted` target service).\n   - `modelType: managed` or `modelType: self_deployed` -> **Prompt Voice** (Foundry infers native speech-to-speech vs cascaded STT -> LLM -> TTS from `model.id`).\n   - Having **both** `modelType`/`model` and `conversationEngine` is invalid (stop and fix `azure.yaml`); having **neither** is incomplete (do not guess). Never use obsolete `modelType: hosted_agent`, `targetAgent`, or a nested `config:` block.\n2. `kind: hosted` -> **Hosted**. When it declares `protocols: [{ protocol: invocations_ws, version: 1.0.0 }]` and `metadata.voiceLiveCompatible: \"true\"` alongside a `kind: voice` wrapper, it is a **Hosted Voice target**; otherwise treat a standalone `invocations_ws` service as a **custom Hosted real-time/audio agent**.\n3. `kind: prompt` plus `harness.type: microsoft_copilot_preview` or legacy `github_copilot_preview` -> **Managed Harness Agent**.\n4. `kind: prompt` without that harness -> ordinary **Prompt Agent**.\n\nUse `agent_get` only when the type cannot be resolved from project context. Preserve the harness discriminator already authored on an existing Managed Harness Agent; do not migrate it during ordinary edits or redeploys. Do not convert an existing Agent between Prompt, Hosted, Managed Harness Agent, and Voice types; create a new Agent instead. Before creating any **Voice Agent**, determine the model strategy first per [create-voice](foundry-agent/create/create-voice.md).\n\n## Tool Usage Conventions\n\n- Use the `ask_user` or `askQuestions` tool whenever collecting information from the user\n- Use the `task` or `runSubagent` tool to delegate long-running or independent sub-tasks (e.g., env var scanning, status polling, Dockerfile generation)\n- Prefer azd for Hosted Agents, Managed Harness Agents, and Voice Agents; prefer Foundry MCP for ordinary Prompt Agents.\n- Reference official Microsoft documentation URLs instead of embedding CLI command syntax\n\n## Azure Authentication\n\n- [Azure Authentication Best Practices](references/auth-best-practices.md)\n\n## Additional Resources\n\n- [Foundry Hosted Agents](https://learn.microsoft.com/azure/ai-foundry/agents/concepts/hosted-agents?view=foundry)\n- [Foundry Agent Runtime Components](https://learn.microsoft.com/azure/ai-foundry/agents/concepts/runtime-components?view=foundry)\n\n## Network Isolation Errors\n\nApplies to **any** call against a Foundry project or its parent Foundry account — Foundry MCP tools, `azd`, `az` CLI, `curl`, REST, or SDK.\n\nIf an error matches `Public access is disabled` / `PublicNetworkAccessDisabled` / `403 Forbidden` from a private endpoint / connection timeout / the project endpoint FQDN resolves to a public IP, this typically means the parent Foundry account has `publicNetworkAccess=Disabled` or `Enabled from selected IP addresses`, and the current shell is outside its VNet.\n\nOnly if the error is ambiguous, confirm against the Foundry account using a management-plane call (works from anywhere with reader access):\n\n```bash\naz cognitiveservices account show \\\n  --name <account> --resource-group <rg> \\\n  --query \"properties.{publicNetworkAccess:publicNetworkAccess, networkAcls:networkAcls, privateEndpointConnections:privateEndpointConnections[].properties.privateLinkServiceConnectionState.status}\"\n```\n\n`publicNetworkAccess: \"Disabled\"` — or `\"Enabled\"` together with non-empty `networkAcls.ipRules` / `virtualNetworkRules` — confirms isolation. If `publicNetworkAccess: \"Enabled\"` and `networkAcls` is empty, the failure is a caller-side network issue (e.g. Private DNS resolving the FQDN to a public IP from inside a VNet with a private endpoint), not an account-config issue.\n\nIf it's indeed a network isolation issue, supported connection options are documented in [Choose a secure connection method to Foundry](https://learn.microsoft.com/azure/foundry/how-to/configure-private-link#choose-a-secure-connection-method-to-foundry).\n\n> ℹ️ Foundry MCP tools cannot reach a VNet-isolated project even from inside the VNet.\n", "translation": "---\nname: microsoft-foundry\ndescription: \"端到端建構、部署、評估、優化、微調與管理 Microsoft Foundry 的代理、模型與資源。用於：foundry、azd ai agent、azd provision/deploy、hosted agent 建立骨架/開發/執行/部署/疑難排解、prompt agent、託管 harness 代理、Copilot harness、語音代理、建立/更新/呼叫/評估代理、為代理加入工具、代理洞察、批次/持續評估、持續監控、代理 CI/CD、優化/改進提示詞、優化代理指示、Agent Optimizer、從追蹤整理資料集、部署模型、模型微調（SFT/DPO/RFT）、Foundry 專案、RBAC、角色指派、權限、配額、容量、區域、部署失敗、AI Services、建立 Foundry 資源、知識索引、自訂部署、導入、可用性、訓練資料、評分器、蒸餾、大型檔案上傳。不要用於：Azure Functions、App Service、一般的 Azure 部署（使用 azure-deploy）、一般的 Azure 準備（使用 azure-prepare）。\"\nlicense: MIT\nmetadata:\n  author: Microsoft\n  version: \"1.2.32\"\n---\n\n# Microsoft Foundry 技能\n\n本技能協助開發者使用 Microsoft Foundry 資源，涵蓋模型探索與部署、AI 代理的完整開發生命週期、評估工作流程，以及疑難排解。\n\n## 執行前要求\n\n在開始對應的動作或工作流程之前，遵循下方每個適用的小節。\n\n### 相依檢查與設定\n\n**強制：** 本技能載入後的第一步，從本技能的根目錄執行下方的相依檢查與設定腳本，並等待它完成後再繼續。腳本會先檢查，只安裝缺少的相依項目；不會重新安裝已可用的相依項目。\n\n**在閱讀或進入任何子技能、工作流程或工作流程專屬參考之前，你「必須」完成這項檢查。**\n\n```bash\n./scripts/check-and-setup-dependencies.sh     # macOS / Linux\n./scripts/check-and-setup-dependencies.ps1    # Windows (pwsh)\n```\n\n後續動作請嚴格遵循腳本的輸出。\n\n### 工作流程指引\n\n**強制：** 在執行「任何」工作流程專屬步驟之前，你「必須」閱讀對應的子技能文件。沒有閱讀其技能文件，就不要為某個工作流程呼叫該工作流程專屬的 MCP 工具。即使你已經知道 MCP 工具的參數也適用——技能文件包含必須遵循的必要工作流程步驟、預先檢查與驗證邏輯。每當新的使用者訊息觸發不同的工作流程時，即使技能已經載入，這條規則也適用。\n\n### Foundry MCP\n\n**強制：** 在使用 Foundry MCP 操作之前，呼叫 Azure MCP 的 `foundry` 工具，檢查可用的 Foundry MCP 工具與相關參數。把這當作以 MCP 為基礎之工作流程的探索/說明步驟。\n\n### azd\n\n**強制：** 在執行「任何」azd 指令之前，你「必須」閱讀 [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md)，並嚴格遵循其中定義的共用規則，特別是 `AZURE_DEV_USER_AGENT` 的設定規則。\n\n## 子技能\n\n本技能包含針對特定工作流程的專門子技能。**當某個子技能符合任務時，嚴格遵循其工作流程：**\n\n| 子技能 | 何時使用 | 參考 |\n|--------|----------|------|\n| **deploy** | 把 hosted 代理部署到 Foundry、對部署做冒煙測試、建立或更新 prompt 代理，以及管理代理版本與多環境部署。 | [deploy](foundry-agent/deploy/deploy.md) |\n| **cicd** | 為 Foundry 代理建立 CI/CD 部署管線。 | [cicd](foundry-agent/cicd/cicd.md) |\n| **invoke** | 傳送訊息給代理，單輪或多輪對話 | [invoke](foundry-agent/invoke/invoke.md) |\n| **routine** | 用 routine 排程或以事件觸發 Foundry 代理；使用 `azd` 進行 CRUD、啟用/停用、手動派發與檢視過往執行，或在 `azure.yaml` 中定義 routine。 | [routine](foundry-agent/routine/routine.md) |\n| **invocations-ws** | 建構、部署並連線到使用開發者定義、透過 `invocations_ws` 的雙工即時或媒體串流之自訂 Hosted 代理。 | [invocations-ws](foundry-agent/invocations-ws/invocations-ws.md) |\n| **observe** | 評估代理品質、執行批次評估、分析失敗、優化提示詞、改進代理指示、比較版本、建立 CI/CD 監控，以及啟用持續的正式環境評估 | [observe](foundry-agent/observe/observe.md) |\n| **insights** | 從既有的監控中拉取已產生的代理洞察、證據與建議；唯讀擷取，而不是新的分析執行 | [insights](foundry-agent/insights/insights.md) |\n| **trace** | 查詢追蹤、分析延遲/失敗，透過 App Insights 的 `customEvents` 把評估結果關聯到特定回應 | [trace](foundry-agent/trace/trace.md) |\n| **troubleshoot** | 檢視 hosted 代理日誌、查詢遙測、診斷失敗 | [troubleshoot](foundry-agent/troubleshoot/troubleshoot.md) |\n| **validate** | 只有在使用者明確要求使用這個驗證子技能，或要求依最佳實踐驗證 Microsoft Foundry hosted 代理程式碼時才使用。絕不主動呼叫它，也不要把它加入其他工作流程。 | [validate](foundry-agent/validate/validate.md) |\n| **create（快速入門）** | 從零端到端建立新的 hosted Foundry 代理——建立骨架、佈建或使用既有的 Foundry 專案、部署並做冒煙測試。不要用於任何既有程式碼的工作。快速入門未涵蓋的任何事，使用 **create**。 | [create/quick-start-hosted.md](foundry-agent/create/quick-start-hosted.md) |\n| **create** | 當標準的端到端順利路徑（快速入門）不適用時使用。建立新的 Foundry 代理、更新既有代理的程式碼、繼續開發既有代理、在建立骨架時接好連線、使用進階設定或 A2A（Agent2Agent），或從失敗的快速入門執行中恢復。 | [create](foundry-agent/create/create-hosted.md) |\n| **create managed harness** | 建立或繼續開發明確使用 Foundry 託管 Copilot harness 的 Prompt 代理。使用 `azd` 與 `azure.yaml`，而不是一般的 Prompt 代理 MCP 工作流程。 | [create-managed-harness](foundry-agent/create/create-managed-harness.md) |\n| **create voice** | 建立、設定或擴充 Foundry 語音代理，一般請求預設為託管的 Prompt Voice，也支援自行部署的 Prompt Voice 或雙代理的 Hosted Voice。 | [create-voice](foundry-agent/create/create-voice.md) |\n| **agent-optimizer** | 讓既有的 Python hosted 代理程式碼可供優化、設定 eval.yaml、執行 Agent Optimizer 工作、在本機套用候選版本，並在審查後透過 azd 部署。 | [agent-optimizer](foundry-agent/agent-optimizer/agent-optimizer.md) |\n| **eval-datasets** | 把正式環境追蹤收集成評估資料集、管理資料集版本與分割、追蹤評估指標隨時間的變化、偵測退化，並維護從追蹤到部署的完整譜系。用於：從追蹤建立資料集、資料集版本控制、評估趨勢、退化偵測、資料集比較、評估譜系。 | [eval-datasets](foundry-agent/eval-datasets/eval-datasets.md) |\n| **project/create** | 建立新的 Microsoft Foundry 專案以託管代理與模型。在導入 Foundry 或建立新的基礎設施時使用。 | [project/create/create-foundry-project.md](project/create/create-foundry-project.md) |\n| **resource/create** | 使用 Azure CLI 建立 Azure AI Services 多服務資源（Foundry 資源）。在以細部控制手動佈建 AI Services 資源時使用。 | [resource/create/create-foundry-resource.md](resource/create/create-foundry-resource.md) |\n| **private-network** | 回答關於 Foundry 網路隔離的問題，**並**以 VNet 隔離部署 Foundry（自帶 VNet、託管 VNet、混合）。涵蓋架構概念、範本選擇、部署與部署後驗證。 | [resource/private-network/private-network.md](resource/private-network/private-network.md) |\n| **models/deploy-model** | 具智慧路由的統一模型部署。處理快速的預設部署、完全自訂的部署（版本/SKU/容量/RAI），以及跨區域的容量探索。路由到子技能：`preset`（快速部署）、`customize`（完全控制）、`capacity`（尋找可用容量）。 | [models/deploy-model/SKILL.md](models/deploy-model/SKILL.md) |\n| **quota** | 管理 Microsoft Foundry 資源的配額與容量。在檢查配額使用量、排除因配額不足導致的部署失敗、申請提高配額或規劃容量時使用。 | [quota/quota.md](quota/quota.md) |\n| **rbac** | 管理 Microsoft Foundry 資源的 RBAC 權限、角色指派、受控識別與服務主體。用於存取控制、稽核權限與 CI/CD 設定。 | [rbac/rbac.md](rbac/rbac.md) |\n| **finetuning** | 在 Microsoft Foundry 上微調模型——SFT 蒸餾、DPO 偏好優化、搭配評分器與工具呼叫的 RFT。資料集準備、評分器校準、訓練、檢查點選擇、部署、評估。用於：微調、SFT、DPO、RFT、訓練資料、評分器、蒸餾、微調後的模型、大型檔案上傳。 | [finetuning/SKILL.md](finetuning/SKILL.md) |\n| **azd-guidance** | 提供管理 Foundry 代理的共用 azd 知識與指引。任何與 azd 相關的工作流程都先讀這份。 | [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) |\n\n> 💡 **提示：** 完整的導入流程：`project/create`（公開）或 `private-network`（VNet 隔離）→ `models/deploy-model` → 代理工作流程（`create` → `deploy` → `invoke`）。\n\n> 💡 **微調：** 所有模型客製化都使用 `finetuning`——SFT 蒸餾、DPO 偏好優化，以及搭配評分器的 RFT。包含快速入門、評分器校準與訓練曲線分析。\n\n> 💡 **模型部署：** 所有部署情境都使用 `models/deploy-model`——它會在快速預設部署、完全控制的自訂部署與跨區域容量探索之間智慧路由。\n\n> 💡 **提示詞優化：** 對於「優化我的提示詞」或「改進我的代理指示」這類請求，載入 [observe](foundry-agent/observe/observe.md)，並透過那個以評估驅動的工作流程使用 `prompt_optimize` MCP 工具。\n\n## 基礎設施生命週期\n\n把使用者意圖對應到正確的基礎設施工作流程。\n\n| 使用者意圖 | 工作流程 |\n|------------|----------|\n| 「建立 Foundry」/「設定 Foundry」（模糊） | 使用 `AskUserQuestion`：(a) 只要一個 AI Services 資源，(b) 一個公開存取的專案，還是 (c) 一個有網路隔離的專案？路由：(a) → [resource/create](resource/create/create-foundry-resource.md)、(b) → [project/create](project/create/create-foundry-project.md)、(c) → [private-network](resource/private-network/private-network.md) |\n| 以 VNet 隔離設定 Foundry | [private-network](resource/private-network/private-network.md) |\n| 建立 Foundry 專案（公開） | [project/create](project/create/create-foundry-project.md) |\n| 建立單純的 Foundry 資源 | [resource/create](resource/create/create-foundry-resource.md) |\n\n## 代理開發生命週期\n\n把使用者意圖對應到正確的代理工作流程。執行前依序閱讀每個子技能。\n\n| 使用者意圖 | 工作流程（依序閱讀） |\n|------------|----------------------|\n| 建立或開發語音代理（Prompt Voice 或 Hosted Voice） | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create-voice](foundry-agent/create/create-voice.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| 建立或開發明確要求的託管 Harness 代理 / Copilot harness 代理 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create-managed-harness](foundry-agent/create/create-managed-harness.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| 端到端建立新的 hosted 代理（骨架 + 部署 + 測試） | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [quick-start-hosted](foundry-agent/create/quick-start-hosted.md)（自成一體的端到端流程） |\n| 超出標準快速入門的任何事（既有程式碼、遷移、重新託管、部署客製化、建立骨架時的連線、A2A（Agent2Agent）、恢復） | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [create](foundry-agent/create/create-hosted.md) → [deploy](foundry-agent/deploy/deploy.md) → [invoke](foundry-agent/invoke/invoke.md) |\n| 優化既有的 Python hosted 代理 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → [agent-optimizer](foundry-agent/agent-optimizer/agent-optimizer.md) → 建立骨架/審查 → eval.yaml → 優化 → 套用候選版本 → 部署 → 呼叫 |\n| 部署代理（程式碼已存在） | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → deploy（含評估套件設定）→ invoke → observe（評估/優化） |\n| 程式碼變更後更新/重新部署代理 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → deploy（含評估套件設定）→ invoke → observe（評估/優化） |\n| 為 hosted 代理建立 CI/CD 部署管線 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → cicd |\n| 呼叫/測試/與代理對話 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke |\n| 排程/以事件觸發代理，或對 routine 進行 CRUD/啟用/停用/派發 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → routine |\n| 優化 / 改進代理提示詞或指示 | observe（步驟 4：優化） |\n| 評估並優化代理（完整循環） | observe |\n| 啟用持續評估監控 | observe（步驟 6：CI/CD 與監控） |\n| 拉取代理洞察 / 列出已產生的問題與建議 | [相依檢查與設定](#dependency-check-and-setup) → [insights](foundry-agent/insights/insights.md)（所有頁面並展開證據；唯讀） |\n| 排除代理問題 | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke → troubleshoot |\n| 修復壞掉的代理（疑難排解 + 重新部署） | [相依檢查與設定](#dependency-check-and-setup) → [azd-guidance](foundry-agent/azd-guidance/azd-guidance.md) → invoke → troubleshoot → 套用修正 → deploy → invoke |\n\n## 代理：.foundry 工作區標準\n\n每個代理原始碼資料夾都可以在 `.foundry/` 下保存 Foundry 專屬的快取與覆蓋層狀態：\n\n```text\n<agent-root>/\n  .foundry/\n    agent-metadata.yaml\n    agent-metadata.prod.yaml\n    suites/\n    datasets/\n    evaluators/\n    results/\n```\n\n- 在 azd 專案中，從 `azure.yaml` 加上 `azd env get-values` 推導部署脈絡（專案端點、代理名稱/版本、ACR、App Insights）；azd 已經提供這些值時，不要在中繼資料中重複它們。\n- `agent-metadata.yaml` 是建議的本機/開發覆蓋層，用於非 azd 的值、遠端 Foundry 套件參照、本機快取路徑、結果摘要與明確的覆寫。選用的附屬檔案（例如 `agent-metadata.prod.yaml`）可以保存單一的正式環境或 CI 目標覆蓋層，而不必在一個檔案中混合多個環境。\n- `suites/`、`datasets/` 與 `evaluators/` 是本機快取資料夾。它們是最新的時候就重用，在重新整理或覆寫之前先詢問。\n- 標準 schema 與工作流程規則請見[代理中繼資料契約](references/agent-metadata-contract.md)。\n\n## 代理：設定參考\n\n- [標準代理設定](references/standard-agent-setup.md)——針對需要資料駐留控制之正式環境工作負載的進階設定（透過 Foundry capability host 自帶 Cosmos DB / Storage / AI Search）。預設的 `azd ai agent` 流程使用**基本代理設定**，**不會**佈建 `capabilityHosts/agents`——不要把它的缺少標記為 bug。預設的佈建後狀態，請見 [foundry-agent/create/create-hosted.md](foundry-agent/create/create-hosted.md) 中的「預期的環境變數特徵」一節。\n\n## 代理：通用專案脈絡解析\n\n代理技能應該**只在需要尚未取得的設定值時**才執行這個步驟。如果某個值（例如代理根目錄、環境、專案端點或代理名稱）已經從使用者的訊息或同一 session 中先前的技能得知，就略過該值的解析。\n\n### 步驟 1：探索代理根目錄與 azd 脈絡\n\n先檢查工作區是否有 `azure.yaml`，且其中有使用 `host: azure.ai.agent` 的服務。\n\n- **一個 azd 代理服務** -> 依 `kind`、`harness`、`modelType` 與 `conversationEngine` 分類它，然後以該服務的 `project` 資料夾或 `azure.yaml` 所在目錄作為代理根目錄。\n- **多個 azd 代理服務** -> 檢查是否有語音包裝器透過 `conversationEngine.name` 參照某個 `kind: hosted` 服務：\n  - **選擇 Hosted Voice 包裝器**代表其指名的 `kind: hosted` 目標是上游相依（`uses: [<target>]`、`conversationEngine.name: <target>`）；部署與驗證必須分別回報兩個服務。\n  - **只選擇 `kind: hosted` 目標**會把變更/除錯範圍限定在目標容器，不會自動修改包裝器。\n  - **否則** -> 要求使用者選擇目標服務/資料夾。\n- **沒有 azd 代理服務** -> 在工作區中搜尋含有 `agent-metadata.yaml` 或 `agent-metadata.<env>.yaml` 的 `.foundry/` 資料夾。\n  - **一個符合** -> 使用該代理根目錄。\n  - **多個符合** -> 要求使用者選擇目標代理資料夾。\n  - **沒有符合** -> 對於 [insights](foundry-agent/insights/insights.md)，只詢問缺少的遠端輸入，不初始化本機檔案；對於 create/deploy 工作流程，在設定期間建立新的 `.foundry/` 資料夾；對於其他工作流程，停下來詢問使用者要初始化哪個代理原始碼資料夾。\n\n選定代理根目錄後，所有本機 `.foundry` 快取檢查、原始碼檢查、評估器建議、資料集建議與提示詞優化脈絡，都只保留在該資料夾內。除非使用者明確切換根目錄，否則**不要**掃描相鄰的代理資料夾。\n\n### 步驟 2：解析環境與部署脈絡\n\n如果有 `azure.yaml`，先解析 azd 環境：\n\n1. 使用者明確指名的環境\n2. `azd env get-values` 中的 `AZURE_ENV_NAME`\n3. `.azure/config.json` 中的 azd 預設環境\n4. session 中先前已選定的環境\n\n當專案/部署值尚未得知時，對選定的環境執行 `azd env get-values`。部署脈絡優先使用 azd 的值：\n\n| azd 變數 | 解析為 |\n|----------|--------|\n| `AZURE_AI_PROJECT_ENDPOINT` 或 `AZURE_AIPROJECT_ENDPOINT` | 專案端點 |\n| `AGENT_<SERVICE>_NAME` | 所選 azd 服務的代理名稱 |\n| `AGENT_<SERVICE>_VERSION` | 所選 azd 服務的代理版本 |\n| `AZURE_CONTAINER_REGISTRY_NAME` 或 `AZURE_CONTAINER_REGISTRY_ENDPOINT` | ACR 登錄名稱 / 映像 URL 前綴 |\n| `APPLICATIONINSIGHTS_CONNECTION_STRING` | 追蹤工作流程用的 App Insights 連線字串 |\n| `AZURE_SUBSCRIPTION_ID`、`AZURE_RESOURCE_GROUP`、`AZURE_AI_ACCOUNT_NAME`、`AZURE_AI_PROJECT_NAME` | Azure 資源查找與 Playground 連結 |\n\n當 azd 提供這些值時，以它們作為真實來源，並且在寫入中繼資料時不要把它們複製到 `.foundry/agent-metadata*.yaml`。\n\n### 步驟 3：選擇中繼資料覆蓋層並解析環境\n\n在選定的代理根目錄內，依此順序選擇中繼資料檔：\n1. 使用者或工作流程明確提供的中繼資料檔名或路徑\n2. 如果已知明確的環境，且 `.foundry/agent-metadata.<env>.yaml` 存在，就使用該檔案\n3. `.foundry/agent-metadata.yaml`\n4. 如果仍有多個中繼資料檔，且上述規則都無法選出一個，就請使用者選擇\n\n讀取選定的中繼資料檔，並依此順序解析任何剩下的環境選擇：\n1. 使用者明確指名的環境\n2. 如果選定的中繼資料檔只定義了一個環境，就使用它\n3. session 中先前已選定的環境\n4. 中繼資料中的 `defaultEnvironment`\n\n如果選定的中繼資料檔仍包含多個環境，且上述規則都無法選出一個，就請使用者選擇。在每份工作流程摘要中，都要讓選定的代理根目錄、中繼資料檔、環境，以及脈絡來自 azd 還是中繼資料保持可見。\n\n如果選定的環境公開的是較舊的 `testSuites[]` 中繼資料而非 `evaluationSuites[]`，就把 `testSuites[]` 當作此 session 的來源，並在繼續之前於記憶體中把每個項目正規化為 `evaluationSuites[]` 的形狀。如果中繼資料更舊，只公開舊版的 `testCases[]`，就以同樣方式正規化該清單。保留資料集與評估器欄位、保留任何既有的 `tags`，並且只在 `tags.tier` 缺少時把舊版的 `priority` 對應到 `tags.tier`：`P0` -> `smoke`、`P1` -> `regression`、`P2` -> `coverage`。\n\n### 步驟 4：解析 eval.yaml 的本機評估意圖\n\n如果選定的代理根目錄中有 `eval.yaml`，在產生新套件之前先解析它：\n\n- `agent.name` -> 目標代理候選；使用前先確認它與選定的 azd/中繼資料代理相符。\n- `dataset.local_uri` -> 本機種子資料集候選；舊版的 `dataset_file` 可以在記憶體中正規化。\n- `dataset.name` / `dataset.version` -> 已註冊的資料集候選。\n- `validation_dataset` -> 選用的驗證資料集候選。\n- `evaluators[]` -> 候選的 Foundry 評估器名稱；在把它們當作遠端評估器之前，先用 `evaluator_catalog_get` 確認。\n- `name` -> 本機評估/套件候選；在以 `suiteName` 保存之前先遠端確認。\n- `options.eval_model`、`options.optimization_model`、`options.max_candidates`、`options.optimization_config.model_search_space`、`options.pass_threshold`、`max_samples`、`trace_days` 與 `generation_instruction` -> 設定預設值。\n\n把 `eval.yaml` 視為本機的評估意圖，而不是 Foundry 套件存在的證明。只有在遠端查找或註冊成功之後，才把已同步的套件/資料集/評估器參照保存到 `.foundry`。\n\n### 步驟 5：解析共用設定\n\n依此順序疊加來源：\n\n1. 使用者明確的輸入，以及 session 中已選定的值\n2. 部署脈絡的 azd 環境值\n3. `.foundry/agent-metadata*.yaml` 的覆蓋層值與遠端套件/快取參照\n4. `azure.yaml` 與 `eval.yaml` 的本機來源設定\n5. 對仍缺少的任何值詢問使用者\n\n如果 azd 與中繼資料都提供了同一個值且兩者不同，就停下來詢問哪個來源才是權威。如果相同，就使用 azd 的值，並避免在未來寫入中繼資料時重寫重複的值。\n\n| 有效值 | 優先來源 | 使用者 |\n|--------|----------|--------|\n| 專案端點 | azd env | deploy、invoke、observe、trace、troubleshoot |\n| 代理名稱/版本 | azd 代理變數，其次是 `azure.yaml` | invoke、observe、trace、troubleshoot |\n| ACR | azd env | deploy |\n| 評估套件與快取路徑 | `.foundry/agent-metadata*.yaml` | observe、eval-datasets |\n| 本機種子資料集/評估器意圖 | `eval.yaml` | observe、eval-datasets |\n\n### 步驟 6：寫入中繼資料覆蓋層（僅限 Create/Deploy/Observe）\n\n在任何中繼資料寫入時（部署、自動設定、資料集重新整理，或從追蹤到資料集的更新），只在選定的中繼資料檔中保存無法推導的覆蓋層/快取狀態：\n\n- 對未來解析有用時，保存 azd 綁定（`azd.environmentName`、`azd.service`）\n- 帶有遠端套件/資料集/評估器參照與本機快取路徑的 `evaluationSuites[]`\n- `lastEval`、結果檔、比較摘要，或明確的非 azd 覆寫\n\nazd 已經提供時，不要把 azd 擁有的部署值複製到中繼資料中。如果選定的檔案是建議的單一環境檔，只重寫那一個環境區塊。如果選定的檔案是舊版的多環境檔，只重寫選定的環境區塊。絕不自動在相鄰的中繼資料檔之間複製或合併環境。如果選定的環境仍使用較舊的 `testSuites[]` 或舊版的 `testCases[]`，就把它重寫為 `evaluationSuites[]`，並從重寫後的項目中移除已遷移的 `priority` 欄位。\n\n### 步驟 7：蒐集缺少的值\n\n**只對**無法從使用者訊息、session 脈絡、中繼資料或 azd 啟動解析出的值，使用 `ask_user` 或 `askQuestions` 工具。技能可能需要的常見值：\n- **代理根目錄**——目標 azd 服務的專案資料夾，或含有 `.foundry/agent-metadata*.yaml` 的資料夾\n- **中繼資料檔**——本機/開發用的 `agent-metadata.yaml`，或明確的附屬檔，例如 `agent-metadata.prod.yaml`\n- **環境**——azd 環境、`dev`、`prod`，或中繼資料中的其他環境鍵\n- **專案端點**——Microsoft Foundry 專案端點 URL\n- **代理名稱**——目標代理的名稱\n\n> 💡 **提示：** 如果使用者已經提供代理路徑、環境、專案端點或代理名稱，就直接擷取——不要再問一次。\n\n## 代理：代理類型\n\n代理工作流程區分四種一級代理類型：\n\n| 類型 | Kind | 說明 |\n|------|------|------|\n| **Prompt** | `\"prompt\"` | 以模型部署為後端、基於 LLM 的代理；透過 Foundry MCP 或 SDK 管理 |\n| **Hosted** | `\"hosted\"` | 執行自訂程式碼、基於容器的代理；透過 `azd` 開發與部署 |\n| **託管 Harness 代理** | 新撰寫時為 `\"prompt\"` 搭配 `harness.type: \"microsoft_copilot_preview\"` | 在 Foundry 託管的 Copilot harness 上執行的 Prompt 代理；透過 `azd` 開發與部署 |\n| **Voice** | `\"voice\"` | 託管的即時語音代理——**Prompt Voice**（1 個代理，`modelType: managed` 或 `self_deployed`）或 **Hosted Voice**（2 個代理：帶有 `conversationEngine.type: hosted_agent` 的 `kind: voice` 包裝器 + 透過 `invocations_ws` `1.0.0` 與 Voice Live Bridge `1.0` 的 `kind: hosted` 目標）；透過 `azd` 開發與部署，並透過 `voice` WebSocket 端點驗證 |\n\n依照以下確切順序、根據 `azure.yaml` 服務的定義來分類它，而不是只看 `host`：\n\n1. `kind: voice` -> **Voice**。為了相容性，把既有的 `kind: prompt-voice` 服務默默分類為 Voice，然後在編輯其 YAML 時正規化。分類子類型：\n   - `conversationEngine.type: hosted_agent` -> **Hosted Voice 包裝器**（與一個指名的 `kind: hosted` 目標服務配對）。\n   - `modelType: managed` 或 `modelType: self_deployed` -> **Prompt Voice**（Foundry 會從 `model.id` 推斷是原生語音轉語音，還是串接的 STT -> LLM -> TTS）。\n   - **同時**有 `modelType`/`model` 與 `conversationEngine` 是無效的（停下來修正 `azure.yaml`）；**兩者都沒有**則是不完整的（不要猜）。絕不使用已淘汰的 `modelType: hosted_agent`、`targetAgent` 或巢狀的 `config:` 區塊。\n2. `kind: hosted` -> **Hosted**。當它宣告 `protocols: [{ protocol: invocations_ws, version: 1.0.0 }]` 與 `metadata.voiceLiveCompatible: \"true\"`，並搭配一個 `kind: voice` 包裝器時，它是 **Hosted Voice 目標**；否則把獨立的 `invocations_ws` 服務視為**自訂的 Hosted 即時/音訊代理**。\n3. `kind: prompt` 加上 `harness.type: microsoft_copilot_preview` 或舊版的 `github_copilot_preview` -> **託管 Harness 代理**。\n4. 沒有該 harness 的 `kind: prompt` -> 一般的 **Prompt 代理**。\n\n只有在無法從專案脈絡解析類型時才使用 `agent_get`。保留既有託管 Harness 代理上已撰寫的 harness 判別值；不要在一般的編輯或重新部署中遷移它。不要把既有的代理在 Prompt、Hosted、託管 Harness 代理與 Voice 類型之間轉換；改為建立新的代理。在建立任何**語音代理**之前，先依 [create-voice](foundry-agent/create/create-voice.md) 決定模型策略。\n\n## 工具使用慣例\n\n- 每當向使用者蒐集資訊時，使用 `ask_user` 或 `askQuestions` 工具\n- 使用 `task` 或 `runSubagent` 工具委派長時間執行或獨立的子任務（例如環境變數掃描、狀態輪詢、Dockerfile 產生）\n- Hosted 代理、託管 Harness 代理與語音代理優先使用 azd；一般的 Prompt 代理優先使用 Foundry MCP。\n- 引用官方 Microsoft 文件 URL，而不是內嵌 CLI 指令語法\n\n## Azure 驗證\n\n- [Azure 驗證最佳實踐](references/auth-best-practices.md)\n\n## 其他資源\n\n- [Foundry Hosted 代理](https://learn.microsoft.com/azure/ai-foundry/agents/concepts/hosted-agents?view=foundry)\n- [Foundry 代理執行期元件](https://learn.microsoft.com/azure/ai-foundry/agents/concepts/runtime-components?view=foundry)\n\n## 網路隔離錯誤\n\n適用於對 Foundry 專案或其上層 Foundry 帳戶的**任何**呼叫——Foundry MCP 工具、`azd`、`az` CLI、`curl`、REST 或 SDK。\n\n如果錯誤符合 `Public access is disabled` / `PublicNetworkAccessDisabled` / 來自私人端點的 `403 Forbidden` / 連線逾時 / 專案端點 FQDN 解析為公用 IP，這通常代表上層 Foundry 帳戶的 `publicNetworkAccess=Disabled` 或 `Enabled from selected IP addresses`，而目前的 shell 在其 VNet 之外。\n\n只有在錯誤模稜兩可時，才用管理平面呼叫對 Foundry 帳戶進行確認（只要有讀者權限，從任何地方都可以執行）：\n\n```bash\naz cognitiveservices account show \\\n  --name <account> --resource-group <rg> \\\n  --query \"properties.{publicNetworkAccess:publicNetworkAccess, networkAcls:networkAcls, privateEndpointConnections:privateEndpointConnections[].properties.privateLinkServiceConnectionState.status}\"\n```\n\n`publicNetworkAccess: \"Disabled\"`——或 `\"Enabled\"` 搭配非空的 `networkAcls.ipRules` / `virtualNetworkRules`——即確認有隔離。如果 `publicNetworkAccess: \"Enabled\"` 且 `networkAcls` 為空，則失敗是呼叫端的網路問題（例如在有私人端點的 VNet 內，私人 DNS 把 FQDN 解析成公用 IP），而不是帳戶設定問題。\n\n如果確實是網路隔離問題，支援的連線選項記載於[選擇連線到 Foundry 的安全方式](https://learn.microsoft.com/azure/foundry/how-to/configure-private-link#choose-a-secure-connection-method-to-foundry)。\n\n> ℹ️ Foundry MCP 工具即使在 VNet 內部也無法連到 VNet 隔離的專案。"}, {"rank": 31, "slug": "azure-diagnostics", "title": "Azure 故障診斷", "category": "雲端與 DevOps", "tags": ["Azure", "故障排除", "AKS", "KQL", "Microsoft"], "summary": "Microsoft 官方技能：用 AppLens、Azure Monitor、資源健康狀態與安全的分流流程，系統化診斷 Azure 正式環境問題——App Service 高 CPU/部署失敗、Container Apps 503、Functions 遙測中斷、AKS Pod 異常、VM 無法 RDP/SSH、Service Bus/Event Hubs 連線錯誤等；也支援只根據你提供的日誌做純證據診斷。", "usage": "- 安裝：`npx skills add https://github.com/microsoft/azure-skills --skill azure-diagnostics`（建議搭配 Azure MCP Server 與 `az` CLI）\n- 說「我的 App Service CPU 飆高，幫我查原因」「AKS 的 pod 一直 CrashLoop」\n- 若不想讓代理連線 Azure，可說「只根據我貼的 log 分析」，它會改做純證據診斷並列出假設與驗證步驟", "sites": ["Skills.sh"], "repo": "microsoft/azure-skills", "path": "skills/azure-diagnostics/SKILL.md", "github_url": "https://github.com/microsoft/azure-skills/blob/main/skills/azure-diagnostics/SKILL.md", "skillssh_url": "https://skills.sh/microsoft/azure-skills/azure-diagnostics", "skillssh_rank": 82, "installs": 572729, "license": "MIT", "redistributable": true, "description_en": "Debug Azure production issues using AppLens, Azure Monitor, resource health, and safe triage, including evidence-only diagnosis without live access. WHEN: debug production issues, troubleshoot app service, app service high CPU, app service deployment failure, troubleshoot container apps, container app 503 or target port mismatch, troubleshoot functions, function telemetry missing or stopped after a config/connection-string change, troubleshoot AKS, VM RDP, Linux SSH, VM black screen, can't connect to VM, reset VM password, NSG or firewall blocking, kubectl cannot connect, kube-system/CoreDNS failures, pod pending, crashloop, node not ready, upgrade failures, analyze logs, KQL, insights, image pull failures, cold start issues, health probe failures, resource health, root cause of errors, troubleshoot event hubs, troubleshoot service bus, messaging SDK error, AMQP connection failure, message lock lost, lock renewal during long-running processing, service bus dead letter.", "description_zh": "使用 AppLens、Azure Monitor、資源健康狀態與安全的分流方式除錯 Azure 正式環境問題，包括在沒有即時存取權限下僅依證據進行診斷。時機：除錯正式環境問題、排除 App Service 問題、App Service 高 CPU、App Service 部署失敗、排除 Container Apps 問題、Container App 503 或目標埠不符、排除 Functions 問題、在設定/連線字串變更後 Function 遙測遺失或停止、排除 AKS 問題、VM RDP、Linux SSH、VM 黑畫面、無法連線到 VM、重設 VM 密碼、NSG 或防火牆封鎖、kubectl 無法連線、kube-system/CoreDNS 失敗、Pod pending、crashloop、節點未就緒、升級失敗、分析日誌、KQL、洞察、映像拉取失敗、冷啟動問題、健康探針失敗、資源健康狀態、錯誤根本原因、排除 Event Hubs 問題、排除 Service Bus 問題、訊息 SDK 錯誤、AMQP 連線失敗、訊息鎖定遺失、長時間處理期間的鎖定續約、Service Bus 死信。", "original": "---\nname: azure-diagnostics\ndescription: \"Debug Azure production issues using AppLens, Azure Monitor, resource health, and safe triage, including evidence-only diagnosis without live access. WHEN: debug production issues, troubleshoot app service, app service high CPU, app service deployment failure, troubleshoot container apps, container app 503 or target port mismatch, troubleshoot functions, function telemetry missing or stopped after a config/connection-string change, troubleshoot AKS, VM RDP, Linux SSH, VM black screen, can't connect to VM, reset VM password, NSG or firewall blocking, kubectl cannot connect, kube-system/CoreDNS failures, pod pending, crashloop, node not ready, upgrade failures, analyze logs, KQL, insights, image pull failures, cold start issues, health probe failures, resource health, root cause of errors, troubleshoot event hubs, troubleshoot service bus, messaging SDK error, AMQP connection failure, message lock lost, lock renewal during long-running processing, service bus dead letter.\"\nlicense: MIT\nmetadata:\n  author: Microsoft\n  version: \"1.2.14\"\n---\n\n# Azure Diagnostics\n\n> **AUTHORITATIVE GUIDANCE — MANDATORY COMPLIANCE**\n>\n> This document is the **official source** for debugging and troubleshooting Azure production issues. Follow these instructions to diagnose and resolve common Azure service problems systematically.\n\n## Triggers\n\nActivate this skill when user wants to:\n- Debug or troubleshoot production issues\n- Diagnose errors in Azure services\n- Analyze application logs or metrics\n- Fix image pull, cold start, or health probe issues\n- Investigate why Azure resources are failing\n- Find root cause of application errors\n- Troubleshoot App Service issues (high CPU, deployment failures, crashes, slow responses, TLS/custom domains)\n- Respond to prompts like \"troubleshoot app service\", \"app service high CPU\", or \"app service deployment failure\"\n- Troubleshoot Azure Function Apps (invocation failures, timeouts, binding errors)\n- Find the App Insights or Log Analytics workspace linked to a Function App\n- Troubleshoot AKS clusters, nodes, pods, ingress, or Kubernetes networking issues\n- Troubleshoot Azure VM connectivity issues (RDP/SSH failures, port 3389/22 timeouts, NSG or firewall blocking, credential resets)\n- Troubleshoot Azure Messaging SDK issues (Event Hubs, Service Bus connection failures, AMQP errors, message lock issues)\n- Root-cause a symptom that looks like a healthy-runtime-but-wrong-destination problem (e.g., telemetry/messages stop flowing to the expected resource after a config change) — invoke this skill for the matrix even when MCP tools could answer the surface question alone\n\n## Rules\n\n1. Start with systematic diagnosis flow\n2. Use supplied evidence first. If the user requests evidence-only analysis or prohibits live Azure access, do not query or modify Azure. Diagnose from the supplied logs, metrics, and timeline; identify assumptions and provide optional verification steps.\n3. Use AppLens (MCP) for AI-powered diagnostics when available\n4. Check resource health before deep-diving into logs\n5. Select appropriate troubleshooting guide based on service type\n6. Document findings and attempted remediation steps\n7. Prefer bundled diagnostic scripts over ad hoc calls for permitted live collection when identifiers are known. If supplied evidence suffices or live access is prohibited, don't run them; otherwise run the applicable script first.\n8. Route AKS incidents to the dedicated AKS troubleshooting document\n9. Keep baseline AKS diagnostics available even when the optional `aks-skills`\n   add-on is absent, declined, or unsupported by the host\n\n---\n\n## Quick Diagnosis Flow\n\n1. **Identify symptoms** - What's failing?\n2. **Check resource health** - Is Azure healthy?\n3. **Review logs** - What do logs show?\n4. **Analyze metrics** - Performance patterns?\n5. **Investigate recent changes** - What changed?\n\n---\n\n## Troubleshooting Guides by Service\n\n| Service | Common Issues | Reference |\n|---------|---------------|-----------|\n| **Container Apps** | Image pull failures, cold starts, health probes, port mismatches | [container-apps/](references/container-apps/README.md) |\n| **App Service** | High CPU, deployment failures, crashes, slow responses, TLS/custom domains | [app-service/](references/app-service/README.md) |\n| **Function Apps** | App details, invocation failures, timeouts, binding errors, cold starts, missing app settings | [functions/](references/functions/README.md) |\n| **AKS** | Cluster access, nodes, `kube-system`, scheduling, crash loops, ingress, DNS, upgrades | [AKS Troubleshooting](troubleshooting/aks/aks-troubleshooting.md) |\n| **Compute** | VM RDP/SSH connectivity, NSG/firewall blocks, credential resets, VM agent/tooling issues | [VM Connectivity Troubleshooting](troubleshooting/compute/vm-troubleshooting.md) |\n| **Messaging** | Event Hubs & Service Bus SDK errors, AMQP failures, message lock, connectivity | [Messaging Troubleshooting](troubleshooting/messaging/README.md) |\n\n---\n\n## Routing\n\n- Keep Container Apps and Function Apps diagnostics in this parent skill.\n- Route active AKS incidents, AKS-specific intake, evidence gathering, and remediation guidance to [AKS Troubleshooting](troubleshooting/aks/aks-troubleshooting.md).\n- Route Azure VM RDP/SSH connectivity, NSG/firewall, credential reset, and VM agent troubleshooting to [VM Connectivity Troubleshooting](troubleshooting/compute/vm-troubleshooting.md).\n- Route Azure Messaging SDK troubleshooting (Event Hubs, Service Bus) to [Messaging Troubleshooting](troubleshooting/messaging/README.md).\n\n---\n\n## Quick Reference\n\n### Common Diagnostic Commands\n\n```bash\n# Check resource health\naz resource show --ids RESOURCE_ID\n# View activity log\naz monitor activity-log list -g RG --max-events 20\n# Container Apps logs\naz containerapp logs show --name APP -g RG --follow\n# Function App logs (query App Insights traces)\naz monitor app-insights query --apps APP-INSIGHTS -g RG \\\n  --analytics-query \"traces | where timestamp > ago(1h) | order by timestamp desc | take 50\"\n```\n\n### AppLens (MCP Tools)\n\nFor AI-powered diagnostics, use:\n```\nmcp_azure_mcp_applens\n  intent: \"diagnose issues with <resource-name>\"\n  command: \"diagnose\"\n  parameters:\n    resourceId: \"<resource-id>\"\n\nProvides:\n- Automated issue detection\n- Root cause analysis\n- Remediation recommendations\n```\n\n### Azure Monitor (MCP Tools)\n\nFor querying logs and metrics:\n```\nmcp_azure_mcp_monitor\n  intent: \"query logs for <resource-name>\"\n  command: \"logs_query\"\n  parameters:\n    workspaceId: \"<workspace-id>\"\n    query: \"<KQL-query>\"\n```\n\nSee [kql-queries.md](references/kql-queries.md) for common diagnostic queries.\n\n---\n\n## Check Azure Resource Health\n\n### Using MCP\n\n```\nmcp_azure_mcp_resourcehealth\n  intent: \"check health status of <resource-name>\"\n  command: \"get\"\n  parameters:\n    resourceId: \"<resource-id>\"\n```\n\n### Using CLI\n\n```bash\n# Check specific resource health\naz resource show --ids RESOURCE_ID\n\n# Check recent activity\naz monitor activity-log list -g RG --max-events 20\n```\n\n---\n\n## References\n\n- [KQL Query Library](references/kql-queries.md)\n- [Azure Resource Graph Queries](references/azure-resource-graph.md)\n- [App Service Troubleshooting](references/app-service/README.md)\n- [Function Apps Troubleshooting](references/functions/README.md)\n- [VM Connectivity Troubleshooting](troubleshooting/compute/vm-troubleshooting.md)\n- [Messaging Troubleshooting](troubleshooting/messaging/README.md)\n", "translation": "---\nname: azure-diagnostics\ndescription: \"使用 AppLens、Azure Monitor、資源健康狀態與安全的分流方式除錯 Azure 正式環境問題，包括在沒有即時存取權限下僅依證據進行診斷。時機：除錯正式環境問題、排除 App Service 問題、App Service 高 CPU、App Service 部署失敗、排除 Container Apps 問題、Container App 503 或目標埠不符、排除 Functions 問題、在設定/連線字串變更後 Function 遙測遺失或停止、排除 AKS 問題、VM RDP、Linux SSH、VM 黑畫面、無法連線到 VM、重設 VM 密碼、NSG 或防火牆封鎖、kubectl 無法連線、kube-system/CoreDNS 失敗、Pod pending、crashloop、節點未就緒、升級失敗、分析日誌、KQL、洞察、映像拉取失敗、冷啟動問題、健康探針失敗、資源健康狀態、錯誤根本原因、排除 Event Hubs 問題、排除 Service Bus 問題、訊息 SDK 錯誤、AMQP 連線失敗、訊息鎖定遺失、長時間處理期間的鎖定續約、Service Bus 死信。\"\nlicense: MIT\nmetadata:\n  author: Microsoft\n  version: \"1.2.14\"\n---\n\n# Azure 診斷\n\n> **權威指引——必須遵守**\n>\n> 本文件是除錯與排除 Azure 正式環境問題的**官方來源**。請依照這些說明，系統化地診斷並解決常見的 Azure 服務問題。\n\n## 觸發條件\n\n當使用者想要以下事項時啟用本技能：\n- 除錯或排除正式環境問題\n- 診斷 Azure 服務中的錯誤\n- 分析應用程式日誌或指標\n- 修正映像拉取、冷啟動或健康探針問題\n- 調查 Azure 資源為何失敗\n- 找出應用程式錯誤的根本原因\n- 排除 App Service 問題（高 CPU、部署失敗、當機、回應緩慢、TLS/自訂網域）\n- 回應像是「排除 app service 問題」「app service 高 CPU」或「app service 部署失敗」這樣的提示\n- 排除 Azure Function Apps 問題（呼叫失敗、逾時、繫結錯誤）\n- 找出與 Function App 連結的 App Insights 或 Log Analytics 工作區\n- 排除 AKS 叢集、節點、Pod、ingress 或 Kubernetes 網路問題\n- 排除 Azure VM 連線問題（RDP/SSH 失敗、3389/22 埠逾時、NSG 或防火牆封鎖、憑證重設）\n- 排除 Azure 訊息 SDK 問題（Event Hubs、Service Bus 連線失敗、AMQP 錯誤、訊息鎖定問題）\n- 找出某個看似「執行環境健康但目的地錯誤」之症狀的根本原因（例如設定變更後遙測/訊息不再流向預期的資源）——即使 MCP 工具單獨就能回答表面問題，也要為了對照矩陣而呼叫本技能\n\n## 規則\n\n1. 從系統化的診斷流程開始\n2. 先使用已提供的證據。如果使用者要求僅依證據分析，或禁止即時存取 Azure，就不要查詢或修改 Azure。從提供的日誌、指標與時間軸進行診斷；指出假設並提供選擇性的驗證步驟。\n3. 可用時，使用 AppLens（MCP）進行 AI 驅動的診斷\n4. 在深入日誌之前，先檢查資源健康狀態\n5. 依服務類型選擇適當的疑難排解指南\n6. 記錄發現與嘗試過的修復步驟\n7. 在允許即時蒐集且已知識別碼時，優先使用內附的診斷腳本，而非臨時呼叫。如果已提供的證據足夠或禁止即時存取，就不要執行它們；否則先執行適用的腳本。\n8. 把 AKS 事件導向專門的 AKS 疑難排解文件\n9. 即使選用的 `aks-skills` 附加元件不存在、被拒絕或主機不支援，也要保持基本的 AKS 診斷可用\n\n---\n\n## 快速診斷流程\n\n1. **辨識症狀**——什麼東西失敗了？\n2. **檢查資源健康狀態**——Azure 本身健康嗎？\n3. **檢閱日誌**——日誌顯示什麼？\n4. **分析指標**——有什麼效能模式？\n5. **調查近期變更**——改了什麼？\n\n---\n\n## 依服務分類的疑難排解指南\n\n| 服務 | 常見問題 | 參考 |\n|------|----------|------|\n| **Container Apps** | 映像拉取失敗、冷啟動、健康探針、埠不符 | [container-apps/](references/container-apps/README.md) |\n| **App Service** | 高 CPU、部署失敗、當機、回應緩慢、TLS/自訂網域 | [app-service/](references/app-service/README.md) |\n| **Function Apps** | 應用程式詳細資訊、呼叫失敗、逾時、繫結錯誤、冷啟動、缺少應用程式設定 | [functions/](references/functions/README.md) |\n| **AKS** | 叢集存取、節點、`kube-system`、排程、crash loop、ingress、DNS、升級 | [AKS 疑難排解](troubleshooting/aks/aks-troubleshooting.md) |\n| **運算** | VM RDP/SSH 連線、NSG/防火牆封鎖、憑證重設、VM 代理程式/工具問題 | [VM 連線疑難排解](troubleshooting/compute/vm-troubleshooting.md) |\n| **訊息** | Event Hubs 與 Service Bus SDK 錯誤、AMQP 失

irectly to identify selectors\n    │         ├─ Success → Write Playwright script using selectors\n    │         └─ Fails/Incomplete → Treat as dynamic (below)\n    │\n    └─ No (dynamic webapp) → Is the server already running?\n        ├─ No → Run: python scripts/with_server.py --help\n        │        Then use the helper + write simplified Playwright script\n        │\n        └─ Yes → Reconnaissance-then-action:\n            1. Navigate and wait for networkidle\n            2. Take screenshot or inspect DOM\n            3. Identify selectors from rendered state\n            4. Execute actions with discovered selectors\n```\n\n## 範例：使用 with_server.py\n\n要啟動伺服器，先執行 `--help`，再使用輔助腳本：\n\n**單一伺服器：**\n```bash\npython scripts/with_server.py --server \"npm run dev\" --port 5173 -- python your_automation.py\n```\n\n**多個伺服器（例如後端＋前端）：**\n```bash\npython scripts/with_server.py \\\n  --server \"cd backend && python server.py\" --port 3000 \\\n  --server \"cd frontend && npm run dev\" --port 5173 \\\n  -- python your_automation.py\n```\n\n建立自動化腳本時，只需包含 Playwright 邏輯（伺服器會自動管理）：\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True) # Always launch chromium in headless mode\n    page = browser.new_page()\n    page.goto('http://localhost:5173') # Server already running and ready\n    page.wait_for_load_state('networkidle') # CRITICAL: Wait for JS to execute\n    # ... your automation logic\n    browser.close()\n```\n\n## 先偵察、再行動的模式\n\n1. **檢查渲染後的 DOM**：\n   ```python\n   page.screenshot(path='/tmp/inspect.png', full_page=True)\n   content = page.content()\n   page.locator('button').all()\n   ```\n\n2. 從檢查結果中**找出選擇器**\n\n3. 使用找到的選擇器**執行動作**\n\n## 常見陷阱\n\n❌ **不要**在動態應用程式上，還沒等到 `networkidle` 就檢查 DOM\n✅ **要**先等待 `page.wait_for_load_state('networkidle')` 再檢查\n\n## 最佳實踐\n\n- **把內附腳本當黑盒使用** — 要完成任務時，先考慮 `scripts/` 中是否有腳本可以幫忙。這些腳本能可靠地處理常見的複雜流程，又不會塞滿上下文視窗。用 `--help` 查看用法，然後直接呼叫。\n- 同步腳本使用 `sync_playwright()`\n- 完成後一律關閉瀏覽器\n- 使用具描述性的選擇器：`text=`、`role=`、CSS 選擇器或 ID\n- 加入適當的等待：`page.wait_for_selector()` 或 `page.wait_for_timeout()`\n\n## 參考檔案\n\n- **examples/** — 展示常見模式的範例：\n  - `element_discovery.py` — 找出頁面上的按鈕、連結與輸入框\n  - `static_html_automation.py` — 對本機 HTML 使用 file:// URL\n  - `console_logging.py` — 在自動化過程中擷取 console 日誌"}, {"rank": 39, "slug": "canvas-design", "title": "畫布藝術設計", "category": "前端與設計", "tags": ["海報設計", "視覺藝術", "PDF", "PNG", "Anthropic 官方"], "summary": "Anthropic 官方技能：先寫出一份「設計哲學」宣言（.md），再把它以博物館等級的工藝表現在畫布上，輸出 .png 或 .pdf 的海報、藝術作品或靜態視覺設計；強調 90% 視覺、10% 文字，且必為原創、不抄襲現有藝術家。", "usage": "- 安裝：`npx skills add https://github.com/anthropics/skills --skill canvas-design`，或 Claude Code `/plugin marketplace add anthropics/skills`\n- 說「幫我做一張爵士音樂節的海報」「做一幅以城市節奏為主題的抽象作品」\n- 產出兩個檔：設計哲學 .md ＋ 成品 .pdf/.png；內附 `canvas-fonts/` 字型庫\n- 想要多頁可說「做成 5 頁的畫冊」", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/canvas-design/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/canvas-design/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/canvas-design", "skillssh_rank": 378, "installs": 123688, "license": "Apache-2.0", "redistributable": true, "description_en": "Create beautiful visual art in .png and .pdf documents using design philosophy. You should use this skill when the user asks to create a poster, piece of art, design, or other static piece. Create original visual designs, never copying existing artists' work to avoid copyright violations.", "description_zh": "運用設計哲學，以 .png 與 .pdf 文件創作美麗的視覺藝術。當使用者要求製作海報、藝術作品、設計或其他靜態作品時，應使用本技能。創作原創的視覺設計，絕不抄襲現有藝術家的作品，以避免侵犯著作權。", "original": "---\nname: canvas-design\ndescription: Create beautiful visual art in .png and .pdf documents using design philosophy. You should use this skill when the user asks to create a poster, piece of art, design, or other static piece. Create original visual designs, never copying existing artists' work to avoid copyright violations.\nlicense: Complete terms in LICENSE.txt\n---\n\nThese are instructions for creating design philosophies - aesthetic movements that are then EXPRESSED VISUALLY. Output only .md files, .pdf files, and .png files.\n\nComplete this in two steps:\n1. Design Philosophy Creation (.md file)\n2. Express by creating it on a canvas (.pdf file or .png file)\n\nFirst, undertake this task:\n\n## DESIGN PHILOSOPHY CREATION\n\nTo begin, create a VISUAL PHILOSOPHY (not layouts or templates) that will be interpreted through:\n- Form, space, color, composition\n- Images, graphics, shapes, patterns\n- Minimal text as visual accent\n\n### THE CRITICAL UNDERSTANDING\n- What is received: Some subtle input or instructions by the user that should be taken into account, but used as a foundation; it should not constrain creative freedom.\n- What is created: A design philosophy/aesthetic movement.\n- What happens next: Then, the same version receives the philosophy and EXPRESSES IT VISUALLY - creating artifacts that are 90% visual design, 10% essential text.\n\nConsider this approach:\n- Write a manifesto for an art movement\n- The next phase involves making the artwork\n\nThe philosophy must emphasize: Visual expression. Spatial communication. Artistic interpretation. Minimal words.\n\n### HOW TO GENERATE A VISUAL PHILOSOPHY\n\n**Name the movement** (1-2 words): \"Brutalist Joy\" / \"Chromatic Silence\" / \"Metabolist Dreams\"\n\n**Articulate the philosophy** (4-6 paragraphs - concise but complete):\n\nTo capture the VISUAL essence, express how the philosophy manifests through:\n- Space and form\n- Color and material\n- Scale and rhythm\n- Composition and balance\n- Visual hierarchy\n\n**CRITICAL GUIDELINES:**\n- **Avoid redundancy**: Each design aspect should be mentioned once. Avoid repeating points about color theory, spatial relationships, or typographic principles unless adding new depth.\n- **Emphasize craftsmanship REPEATEDLY**: The philosophy MUST stress multiple times that the final work should appear as though it took countless hours to create, was labored over with care, and comes from someone at the absolute top of their field. This framing is essential - repeat phrases like \"meticulously crafted,\" \"the product of deep expertise,\" \"painstaking attention,\" \"master-level execution.\"\n- **Leave creative space**: Remain specific about the aesthetic direction, but concise enough that the next Claude has room to make interpretive choices also at a extremely high level of craftmanship.\n\nThe philosophy must guide the next version to express ideas VISUALLY, not through text. Information lives in design, not paragraphs.\n\n### PHILOSOPHY EXAMPLES\n\n**\"Concrete Poetry\"**\nPhilosophy: Communication through monumental form and bold geometry.\nVisual expression: Massive color blocks, sculptural typography (huge single words, tiny labels), Brutalist spatial divisions, Polish poster energy meets Le Corbusier. Ideas expressed through visual weight and spatial tension, not explanation. Text as rare, powerful gesture - never paragraphs, only essential words integrated into the visual architecture. Every element placed with the precision of a master craftsman.\n\n**\"Chromatic Language\"**\nPhilosophy: Color as the primary information system.\nVisual expression: Geometric precision where color zones create meaning. Typography minimal - small sans-serif labels letting chromatic fields communicate. Think Josef Albers' interaction meets data visualization. Information encoded spatially and chromatically. Words only to anchor what color already shows. The result of painstaking chromatic calibration.\n\n**\"Analog Meditation\"**\nPhilosophy: Quiet visual contemplation through texture and breathing room.\nVisual expression: Paper grain, ink bleeds, vast negative space. Photography and illustration dominate. Typography whispered (small, restrained, serving the visual). Japanese photobook aesthetic. Images breathe across pages. Text appears sparingly - short phrases, never explanatory blocks. Each composition balanced with the care of a meditation practice.\n\n**\"Organic Systems\"**\nPhilosophy: Natural clustering and modular growth patterns.\nVisual expression: Rounded forms, organic arrangements, color from nature through architecture. Information shown through visual diagrams, spatial relationships, iconography. Text only for key labels floating in space. The composition tells the story through expert spatial orchestration.\n\n**\"Geometric Silence\"**\nPhilosophy: Pure order and restraint.\nVisual expression: Grid-based precision, bold photography or stark graphics, dramatic negative space. Typography precise but minimal - small essential text, large quiet zones. Swiss formalism meets Brutalist material honesty. Structure communicates, not words. Every alignment the work of countless refinements.\n\n*These are condensed examples. The actual design philosophy should be 4-6 substantial paragraphs.*\n\n### ESSENTIAL PRINCIPLES\n- **VISUAL PHILOSOPHY**: Create an aesthetic worldview to be expressed through design\n- **MINIMAL TEXT**: Always emphasize that text is sparse, essential-only, integrated as visual element - never lengthy\n- **SPATIAL EXPRESSION**: Ideas communicate through space, form, color, composition - not paragraphs\n- **ARTISTIC FREEDOM**: The next Claude interprets the philosophy visually - provide creative room\n- **PURE DESIGN**: This is about making ART OBJECTS, not documents with decoration\n- **EXPERT CRAFTSMANSHIP**: Repeatedly emphasize the final work must look meticulously crafted, labored over with care, the product of countless hours by someone at the top of their field\n\n**The design philosophy should be 4-6 paragraphs long.** Fill it with poetic design philosophy that brings together the core vision. Avoid repeating the same points. Keep the design philosophy generic without mentioning the intention of the art, as if it can be used wherever. Output the design philosophy as a .md file.\n\n---\n\n## DEDUCING THE SUBTLE REFERENCE\n\n**CRITICAL STEP**: Before creating the canvas, identify the subtle conceptual thread from the original request.\n\n**THE ESSENTIAL PRINCIPLE**:\nThe topic is a **subtle, niche reference embedded within the art itself** - not always literal, always sophisticated. Someone familiar with the subject should feel it intuitively, while others simply experience a masterful abstract composition. The design philosophy provides the aesthetic language. The deduced topic provides the soul - the quiet conceptual DNA woven invisibly into form, color, and composition.\n\nThis is **VERY IMPORTANT**: The reference must be refined so it enhances the work's depth without announcing itself. Think like a jazz musician quoting another song - only those who know will catch it, but everyone appreciates the music.\n\n---\n\n## CANVAS CREATION\n\nWith both the philosophy and the conceptual framework established, express it on a canvas. Take a moment to gather thoughts and clear the mind. Use the design philosophy created and the instructions below to craft a masterpiece, embodying all aspects of the philosophy with expert craftsmanship.\n\n**IMPORTANT**: For any type of content, even if the user requests something for a movie/game/book, the approach should still be sophisticated. Never lose sight of the idea that this should be art, not something that's cartoony or amateur.\n\nTo create museum or magazine quality work, use the design philosophy as the foundation. Create one single page, highly visual, design-forward PDF or PNG output (unless asked for more pages). Generally use repeating patterns and perfect shapes. Treat the abstract philosophical design as if it were a scientific bible, borrowing the visual language of systematic observation—dense accumulation of marks, repeated elements, or layered patterns that build meaning through patient repetition and reward sustained viewing. Add sparse, clinical typography and systematic reference markers that suggest this could be a diagram from an imaginary discipline, treating the invisible subject with the same reverence typically reserved for documenting observable phenomena. Anchor the piece with simple phrase(s) or details positioned subtly, using a limited color palette that feels intentional and cohesive. Embrace the paradox of using analytical visual language to express ideas about human experience: the result should feel like an artifact that proves something ephemeral can be studied, mapped, and understood through careful attention. This is true art. \n\n**Text as a contextual element**: Text is always minimal and visual-first, but let context guide whether that means whisper-quiet labels or bold typographic gestures. A punk venue poster might have larger, more aggressive type than a minimalist ceramics studio identity. Most of the time, font should be thin. All use of fonts must be design-forward and prioritize visual communication. Regardless of text scale, nothing falls off the page and nothing overlaps. Every element must be contained within the canvas boundaries with proper margins. Check carefully that all text, graphics, and visual elements have breathing room and clear separation. This is non-negotiable for professional execution. **IMPORTANT: Use different fonts if writing text. Search the `./canvas-fonts` directory. Regardless of approach, sophistication is non-negotiable.**\n\nDownload and use whatever fonts are needed to make this a reality. Get creative by making the typography actually part of the art itself -- if the art is abstract, bring the font onto the canvas, not typeset digitally.\n\nTo push boundaries, follow design instinct/intuition while using the philosophy as a guiding principle. Embrace ultimate design freedom and choice. Push aesthetics and design to the frontier. \n\n**CRITICAL**: To achieve human-crafted quality (not AI-generated), create work that looks like it took countless hours. Make it appear as though someone at the absolute top of their field labored over every detail with painstaking care. Ensure the composition, spacing, color choices, typography - everything screams expert-level craftsmanship. Double-check that nothing overlaps, formatting is flawless, every detail perfect. Create something that could be shown to people to prove expertise and rank as undeniably impressive.\n\nOutput the final result as a single, downloadable .pdf or .png file, alongside the design philosophy used as a .md file.\n\n---\n\n## FINAL STEP\n\n**IMPORTANT**: The user ALREADY said \"It isn't perfect enough. It must be pristine, a masterpiece if craftsmanship, as if it were about to be displayed in a museum.\"\n\n**CRITICAL**: To refine the work, avoid adding more graphics; instead refine what has been created and make it extremely crisp, respecting the design philosophy and the principles of minimalism entirely. Rather than adding a fun filter or refactoring a font, consider how to make the existing composition more cohesive with the art. If the instinct is to call a new function or draw a new shape, STOP and instead ask: \"How can I make what's already here more of a piece of art?\"\n\nTake a second pass. Go back to the code and refine/polish further to make this a philosophically designed masterpiece.\n\n## MULTI-PAGE OPTION\n\nTo create additional pages when requested, create more creative pages along the same lines as the design philosophy but distinctly different as well. Bundle those pages in the same .pdf or many .pngs. Treat the first page as just a single page in a whole coffee table book waiting to be filled. Make the next pages unique twists and memories of the original. Have them almost tell a story in a very tasteful way. Exercise full creative freedom.", "translation": "---\nname: canvas-design\ndescription: 運用設計哲學，以 .png 與 .pdf 文件創作美麗的視覺藝術。當使用者要求製作海報、藝術作品、設計或其他靜態作品時，應使用本技能。創作原創的視覺設計，絕不抄襲現有藝術家的作品，以避免侵犯著作權。\nlicense: 完整條款見 LICENSE.txt\n---\n\n以下是創作設計哲學的說明——設計哲學是一種美學運動，之後會被「以視覺表達」出來。只輸出 .md、.pdf 與 .png 檔。\n\n分兩個步驟完成：\n1. 創作設計哲學（.md 檔）\n2. 在畫布上將它表現出來（.pdf 或 .png 檔）\n\n首先，進行這項任務：\n\n## 創作設計哲學\n\n一開始，先創作一份「視覺哲學」（不是版面或模板），它將透過以下方式被詮釋：\n- 形式、空間、色彩、構圖\n- 影像、圖形、形狀、圖樣\n- 作為視覺點綴的極少量文字\n\n### 關鍵認知\n- 收到的是：使用者某些細微的輸入或指示，應該納入考量，但只作為基礎；它不應限制創作自由。\n- 創作的是：一份設計哲學／美學運動。\n- 接下來發生的是：同一個版本接收這份哲學並「以視覺表達」——創作出 90% 視覺設計、10% 必要文字的作品。\n\n考慮這種做法：\n- 為一場藝術運動撰寫宣言\n- 下一階段則是製作藝術作品\n\n這份哲學必須強調：視覺表達。空間溝通。藝術詮釋。極少的文字。\n\n### 如何產生視覺哲學\n\n**為運動命名**（1–2 個詞）：「粗獷的喜悅」／「色彩的寂靜」／「代謝派之夢」\n\n**闡述這份哲學**（4–6 段——精簡但完整）：\n\n為了捕捉「視覺」本質，表達這份哲學如何透過以下方面展現：\n- 空間與形式\n- 色彩與材質\n- 尺度與節奏\n- 構圖與平衡\n- 視覺層級\n\n**關鍵準則：**\n- **避免冗餘**：每個設計面向只提一次。除非能增加新的深度，否則避免重複關於色彩理論、空間關係或字體排印原則的論點。\n- **「反覆」強調工藝**：這份哲學「必須」多次強調，最終作品應該看起來像是耗費無數小時創作、用心琢磨、出自該領域頂尖人物之手。這種框架至關重要——重複使用「精雕細琢」「深厚專業的結晶」「一絲不苟的專注」「大師級的執行」等詞語。\n- **保留創作空間**：對美學方向保持具體，但要夠精簡，讓下一個 Claude 有空間做出同樣具極高工藝水準的詮釋選擇。\n\n這份哲學必須引導下一個版本以「視覺」而非文字來表達想法。資訊存在於設計之中，而不是段落之中。\n\n### 哲學範例\n\n**「具象詩」**\n哲學：透過紀念碑式的形式與大膽的幾何來溝通。\n視覺表達：巨大的色塊、雕塑般的字體（巨大的單字、極小的標籤）、粗獷主義的空間分割，波蘭海報的能量遇上柯比意。想法透過視覺重量與空間張力來表達，而不是解釋。文字是罕見而有力的姿態——絕不成段，只有融入視覺建築的必要字詞。每個元素都以大師工匠的精準度擺放。\n\n**「色彩語言」**\n哲學：色彩作為主要的資訊系統。\n視覺表達：以幾何精準度讓色彩區塊創造意義。字體極簡——小小的無襯線標籤，讓色域來溝通。想像 Josef Albers 的色彩互動遇上資料視覺化。資訊以空間與色彩編碼。文字只用來錨定色彩已經表現的東西。這是一絲不苟的色彩校準的結果。\n\n**「類比冥想」**\n哲學：透過質感與呼吸空間進行安靜的視覺沉思。\n視覺表達：紙張紋理、墨水暈染、廣闊的負空間。攝影與插畫主導。字體如耳語（小、克制、服務於視覺）。日本攝影集美學。影像跨頁呼吸。文字稀疏出現——短語，絕不是說明性的文字塊。每個構圖都以冥想修行般的用心取得平衡。\n\n**「有機系統」**\n哲學：自然的聚集與模組化的生長模式。\n視覺表達：圓潤的形體、有機的排列、從自然到建築的色彩。資訊透過視覺圖表、空間關係、圖像符號呈現。文字只用於漂浮在空間中的關鍵標籤。構圖透過專家級的空間編排來講述故事。\n\n**「幾何的寂靜」**\n哲學：純粹的秩序與克制。\n視覺表達：基於網格的精準、大膽的攝影或鮮明的圖形、戲劇性的負空間。字體精準但極簡——小而必要的文字、大片安靜的區域。瑞士形式主義遇上粗獷主義的材質誠實。是結構在溝通，而不是文字。每一個對齊都是無數次精修的成果。\n\n*以上是濃縮的範例。實際的設計哲學應該是 4–6 段扎實的段落。*\n\n### 核心原則\n- **視覺哲學**：創造一種將透過設計表達的美學世界觀\n- **極少文字**：永遠強調文字稀疏、只保留必要、作為視覺元素融入——絕不冗長\n- **空間表達**：想法透過空間、形式、色彩、構圖溝通——而不是段落\n- **藝術自由**：下一個 Claude 會以視覺詮釋這份哲學——提供創作空間\n- **純粹設計**：這是在製作「藝術品」，而不是加了裝飾的文件\n- **專家工藝**：反覆強調最終作品必須看起來精雕細琢、用心琢磨，是頂尖人物耗費無數小時的成果\n\n**設計哲學應為 4–6 段。** 用詩意的設計哲學填滿它，匯聚核心願景。避免重複相同的論點。讓設計哲學保持通用，不提及作品的意圖，彷彿它可以用在任何地方。將設計哲學輸出為 .md 檔。\n\n---\n\n## 推敲細微的指涉\n\n**關鍵步驟**：在創作畫布之前，從原始請求中辨識出那條細微的概念線索。\n\n**核心原則**：\n主題是一個**嵌入在藝術本身之中、細微而小眾的指涉**——不一定是字面上的，但永遠是精緻的。熟悉該主題的人應該能直覺感受到，而其他人則單純體驗到一幅大師級的抽象構圖。設計哲學提供美學語言。推敲出的主題提供靈魂——安靜的概念 DNA，無形地編織進形式、色彩與構圖之中。\n\n這**非常重要**：指涉必須細緻，能增加作品的深度而不張揚。像爵士樂手引用另一首歌那樣思考——只有懂的人會聽出來，但每個人都能欣賞這段音樂。\n\n---\n\n## 創作畫布\n\n在哲學與概念框架都確立之後，把它表現在畫布上。花點時間整理思緒、清空心靈。運用所創作的設計哲學與以下說明，打造一件傑作，以專家級的工藝體現這份哲學的所有面向。\n\n**重要**：無論是什麼類型的內容，即使使用者要求的是電影/遊戲/書籍相關的東西，做法仍應精緻。永遠不要忘記這應該是藝術，而不是卡通化或業餘的東西。\n\n要創作博物館或雜誌等級的作品，以設計哲學為基礎。創作單一頁面、高度視覺化、以設計為先的 PDF 或 PNG 輸出（除非被要求更多頁）。通常使用重複的圖樣與完美的形狀。把抽象的哲學設計當作一本科學聖經來對待，借用系統性觀察的視覺語言——密集累積的記號、重複的元素，或層層疊加的圖樣，透過耐心的重複建立意義，並回報持續的凝視。加入稀疏、冷靜的字體排印與系統性的參照標記，暗示這可能是某個想像學科的圖表，以通常保留給記錄可觀察現象的那種敬意來對待這個無形的主題。用簡單的短語或細微擺放的細節來錨定作品，使用感覺刻意而凝聚的有限色票。擁抱用分析性視覺語言表達人類經驗之想法的悖論：結果應該感覺像一件證明短暫之物也能透過細心關注而被研究、繪製與理解的人造物。這才是真正的藝術。\n\n**文字作為脈絡元素**：文字永遠極簡且以視覺為先，但讓脈絡決定那意味著輕聲細語的標籤，還是大膽的字體姿態。龐克表演場地的海報，字體可能比極簡陶藝工作室的識別更大、更具攻擊性。大多數時候，字體應該是細的。所有字體的使用都必須以設計為先，優先考慮視覺溝通。無論文字大小，沒有東西會跑出頁面，也沒有東西會重疊。每個元素都必須在畫布邊界內並留有適當邊距。仔細檢查所有文字、圖形與視覺元素都有呼吸空間與清楚的分隔。這對專業執行而言毫無商量餘地。**重要：寫文字時使用不同的字體。搜尋 `./canvas-fonts` 目錄。無論採取何種做法，精緻都毫無商量餘地。**\n\n下載並使用任何需要的字型來實現它。發揮創意，讓字體排印真正成為藝術本身的一部分——如果作品是抽象的，就把字體帶到畫布上，而不是以數位方式排版。\n\n要突破界限，就在以哲學為指導原則的同時，追隨設計本能/直覺。擁抱終極的設計自由與選擇。把美學與設計推向前沿。\n\n**關鍵**：要達到人類手工打造的品質（而非 AI 生成），創作出看起來耗費無數小時的作品。讓它看起來像是某位頂尖人物以一絲不苟的用心琢磨每一個細節。確保構圖、間距、色彩選擇、字體排印——一切都彰顯專家級的工藝。再三檢查沒有任何重疊、格式完美無瑕、每個細節都完美。創作出一件可以拿給人看、證明專業、並被評為無可否認令人驚豔的作品。\n\n將最終結果輸出為單一可下載的 .pdf 或 .png 檔，並附上所使用的設計哲學 .md 檔。\n\n---\n\n## 最後一步\n\n**重要**：使用者「已經」說了：「這還不夠完美。它必須無瑕，是一件工藝的傑作，彷彿即將在博物館中展出。」\n\n**關鍵**：要精修作品，避免加入更多圖形；而是精修已經創作的部分，讓它極度俐落，完全尊重設計哲學與極簡主義原則。與其加一個有趣的濾鏡或重做字型，不如思考如何讓既有構圖與藝術更加凝聚。如果你的直覺是呼叫一個新函式或畫一個新形狀，「停下來」，改問自己：「我要如何讓已經在這裡的東西更像一件藝術品？」\n\n再做一輪。回到程式碼，進一步精修/打磨，讓它成為一件以哲學設計的傑作。\n\n## 多頁選項\n\n當被要求製作額外頁面時，沿著設計哲學的同一脈絡創作更多富有創意的頁面，但也要明顯不同。把這些頁面打包在同一個 .pdf 或多張 .png 中。把第一頁當作一整本等待被填滿的咖啡桌畫冊中的其中一頁。讓接下來的頁面成為原作獨特的變奏與回憶。讓它們以非常有品味的方式幾乎在講述一個故事。充分發揮創作自由。"}, {"rank": 40, "slug": "gh-fix-ci", "title": "修復 PR 的 CI 失敗", "category": "雲端與 DevOps", "tags": ["GitHub Actions", "CI/CD", "gh CLI", "除錯", "OpenAI Codex"], "summary": "用 gh CLI 找出 PR 中失敗的 GitHub Actions 檢查，抓取日誌、摘要失敗片段、擬定修復計畫，經你明確核准後才動手修改。", "usage": "- Codex：`$skill-installer gh-fix-ci`；其他代理複製 skill 資料夾即可\n- 先 `gh auth login`（需 repo + workflow 權限）\n- 說「幫我看這個 PR 為什麼 CI 掛了」，或直接執行 `python scripts/inspect_pr_checks.py --repo . --pr 123`\n- Buildkite 等外部 CI 不處理，只回報連結", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/gh-fix-ci/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/gh-fix-ci/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Use when a user asks to debug or fix failing GitHub PR checks that run in GitHub Actions; use `gh` to inspect checks and logs, summarize failure context, draft a fix plan, and implement only after explicit approval. Treat external providers (for example Buildkite) as out of scope and report only the details URL.", "description_zh": "當使用者要求除錯或修復在 GitHub Actions 中執行、失敗的 GitHub PR 檢查時使用；用 `gh` 檢視檢查與日誌、摘要失敗脈絡、擬定修復計畫，並且只在明確核准後才實作。把外部供應商（例如 Buildkite）視為範圍外，只回報其詳細資訊 URL。", "original": "---\nname: \"gh-fix-ci\"\ndescription: \"Use when a user asks to debug or fix failing GitHub PR checks that run in GitHub Actions; use `gh` to inspect checks and logs, summarize failure context, draft a fix plan, and implement only after explicit approval. Treat external providers (for example Buildkite) as out of scope and report only the details URL.\"\n---\n\n\n# Gh Pr Checks Plan Fix\n\n## Overview\n\nUse gh to locate failing PR checks, fetch GitHub Actions logs for actionable failures, summarize the failure snippet, then propose a fix plan and implement after explicit approval.\n- If a plan-oriented skill (for example `create-plan`) is available, use it; otherwise draft a concise plan inline and request approval before implementing.\n\nPrereq: authenticate with the standard GitHub CLI once (for example, run `gh auth login`), then confirm with `gh auth status` (repo + workflow scopes are typically required).\n\n## Inputs\n\n- `repo`: path inside the repo (default `.`)\n- `pr`: PR number or URL (optional; defaults to current branch PR)\n- `gh` authentication for the repo host\n\n## Quick start\n\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"<number-or-url>\"`\n- Add `--json` if you want machine-friendly output for summarization.\n\n## Workflow\n\n1. Verify gh authentication.\n   - Run `gh auth status` in the repo.\n   - If unauthenticated, ask the user to run `gh auth login` (ensuring repo + workflow scopes) before proceeding.\n2. Resolve the PR.\n   - Prefer the current branch PR: `gh pr view --json number,url`.\n   - If the user provides a PR number or URL, use that directly.\n3. Inspect failing checks (GitHub Actions only).\n   - Preferred: run the bundled script (handles gh field drift and job-log fallbacks):\n     - `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"<number-or-url>\"`\n     - Add `--json` for machine-friendly output.\n   - Manual fallback:\n     - `gh pr checks <pr> --json name,state,bucket,link,startedAt,completedAt,workflow`\n       - If a field is rejected, rerun with the available fields reported by `gh`.\n     - For each failing check, extract the run id from `detailsUrl` and run:\n       - `gh run view <run_id> --json name,workflowName,conclusion,status,url,event,headBranch,headSha`\n       - `gh run view <run_id> --log`\n     - If the run log says it is still in progress, fetch job logs directly:\n       - `gh api \"/repos/<owner>/<repo>/actions/jobs/<job_id>/logs\" > \"<path>\"`\n4. Scope non-GitHub Actions checks.\n   - If `detailsUrl` is not a GitHub Actions run, label it as external and only report the URL.\n   - Do not attempt Buildkite or other providers; keep the workflow lean.\n5. Summarize failures for the user.\n   - Provide the failing check name, run URL (if any), and a concise log snippet.\n   - Call out missing logs explicitly.\n6. Create a plan.\n   - Use the `create-plan` skill to draft a concise plan and request approval.\n7. Implement after approval.\n   - Apply the approved plan, summarize diffs/tests, and ask about opening a PR.\n8. Recheck status.\n   - After changes, suggest re-running the relevant tests and `gh pr checks` to confirm.\n\n## Bundled Resources\n\n### scripts/inspect_pr_checks.py\n\nFetch failing PR checks, pull GitHub Actions logs, and extract a failure snippet. Exits non-zero when failures remain so it can be used in automation.\n\nUsage examples:\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"123\"`\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"https://github.com/org/repo/pull/123\" --json`\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --max-lines 200 --context 40`\n", "translation": "---\nname: \"gh-fix-ci\"\ndescription: \"當使用者要求除錯或修復在 GitHub Actions 中執行、失敗的 GitHub PR 檢查時使用；用 `gh` 檢視檢查與日誌、摘要失敗脈絡、擬定修復計畫，並且只在明確核准後才實作。把外部供應商（例如 Buildkite）視為範圍外，只回報其詳細資訊 URL。\"\n---\n\n\n# Gh PR 檢查：規劃與修復\n\n## 概述\n\n用 gh 找出失敗的 PR 檢查，針對可處理的失敗抓取 GitHub Actions 日誌，摘要失敗片段，然後提出修復計畫，並在明確核准後實作。\n- 如果有以規劃為主的技能（例如 `create-plan`）可用就使用它；否則直接擬定簡潔的計畫，並在實作前請求核准。\n\n前置條件：用標準 GitHub CLI 驗證一次（例如執行 `gh auth login`），再用 `gh auth status` 確認（通常需要 repo + workflow 權限範圍）。\n\n## 輸入\n\n- `repo`：repo 內的路徑（預設 `.`）\n- `pr`：PR 編號或 URL（選填；預設為目前分支的 PR）\n- 該 repo 主機的 `gh` 驗證\n\n## 快速開始\n\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"<number-or-url>\"`\n- 如果想要方便機器摘要的輸出，加上 `--json`。\n\n## 工作流程\n\n1. 驗證 gh 是否已登入。\n   - 在 repo 中執行 `gh auth status`。\n   - 如果未驗證，先請使用者執行 `gh auth login`（確保有 repo + workflow 權限）再繼續。\n2. 確定 PR。\n   - 優先使用目前分支的 PR：`gh pr view --json number,url`。\n   - 如果使用者提供了 PR 編號或 URL，就直接使用。\n3. 檢查失敗的檢查（僅限 GitHub Actions）。\n   - 建議做法：執行內附的腳本（會處理 gh 欄位變動與 job 日誌的備援）：\n     - `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"<number-or-url>\"`\n     - 加上 `--json` 取得方便機器處理的輸出。\n   - 手動備援：\n     - `gh pr checks <pr> --json name,state,bucket,link,startedAt,completedAt,workflow`\n       - 如果某個欄位被拒絕，就改用 `gh` 回報的可用欄位重新執行。\n     - 對每個失敗的檢查，從 `detailsUrl` 取出 run id 並執行：\n       - `gh run view <run_id> --json name,workflowName,conclusion,status,url,event,headBranch,headSha`\n       - `gh run view <run_id> --log`\n     - 如果 run 日誌顯示仍在執行中，就直接抓取 job 日誌：\n       - `gh api \"/repos/<owner>/<repo>/actions/jobs/<job_id>/logs\" > \"<path>\"`\n4. 界定非 GitHub Actions 的檢查。\n   - 如果 `detailsUrl` 不是 GitHub Actions 的 run，就標記為外部並只回報 URL。\n   - 不要嘗試處理 Buildkite 或其他供應商；保持流程精簡。\n5. 向使用者摘要失敗情形。\n   - 提供失敗檢查的名稱、run URL（如果有）以及精簡的日誌片段。\n   - 明確指出缺少日誌的情況。\n6. 建立計畫。\n   - 使用 `create-plan` 技能擬定簡潔的計畫並請求核准。\n7. 核准後實作。\n   - 套用核准的計畫，摘要 diff 與測試，並詢問是否要開 PR。\n8. 重新檢查狀態。\n   - 修改後，建議重新執行相關測試與 `gh pr checks` 以確認。\n\n## 內附資源\n\n### scripts/inspect_pr_checks.py\n\n抓取失敗的 PR 檢查、拉取 GitHub Actions 日誌，並擷取失敗片段。仍有失敗時會以非零狀態碼結束，因此可用於自動化。\n\n使用範例：\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"123\"`\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --pr \"https://github.com/org/repo/pull/123\" --json`\n- `python \"<path-to-skill>/scripts/inspect_pr_checks.py\" --repo \".\" --max-lines 200 --context 40`"}, {"rank": 41, "slug": "gh-address-comments", "title": "處理 PR 審查意見", "category": "雲端與 DevOps", "tags": ["GitHub", "Code Review", "gh CLI", "OpenAI Codex"], "summary": "找出目前分支對應的 GitHub PR，列出所有審查意見與討論串並編號摘要，讓你挑選要處理哪幾則，再由代理動手修正。", "usage": "- Codex：`$skill-installer gh-address-comments` 安裝；其他代理可直接複製 skill 資料夾\n- 先 `gh auth login` 完成登入\n- 在 PR 分支上對代理說「幫我處理這個 PR 的 review comments」\n- 代理會列出編號清單 → 你回覆要處理的編號 → 代理套用修正", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/gh-address-comments/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/gh-address-comments/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Help address review/issue comments on the open GitHub PR for the current branch using gh CLI; verify gh auth first and prompt the user to authenticate if not logged in.", "description_zh": "使用 gh CLI 協助處理目前分支所對應的開啟中 GitHub PR 上的審查/issue 意見；先驗證 gh 是否已登入，若未登入則提示使用者進行驗證。", "original": "---\nname: gh-address-comments\ndescription: Help address review/issue comments on the open GitHub PR for the current branch using gh CLI; verify gh auth first and prompt the user to authenticate if not logged in.\nmetadata:\n  short-description: Address comments in a GitHub PR review\n---\n\n# PR Comment Handler\n\nGuide to find the open PR for the current branch and address its comments with gh CLI. Run all `gh` commands with elevated network access.\n\nPrereq: ensure `gh` is authenticated (for example, run `gh auth login` once), then run `gh auth status` with escalated permissions (include workflow/repo scopes) so `gh` commands succeed. If sandboxing blocks `gh auth status`, rerun it with `sandbox_permissions=require_escalated`.\n\n## 1) Inspect comments needing attention\n- Run scripts/fetch_comments.py which will print out all the comments and review threads on the PR\n\n## 2) Ask the user for clarification\n- Number all the review threads and comments and provide a short summary of what would be required to apply a fix for it\n- Ask the user which numbered comments should be addressed\n\n## 3) If user chooses comments\n- Apply fixes for the selected comments\n\nNotes:\n- If gh hits auth/rate issues mid-run, prompt the user to re-authenticate with `gh auth login`, then retry.\n", "translation": "---\nname: gh-address-comments\ndescription: 使用 gh CLI 協助處理目前分支所對應的開啟中 GitHub PR 上的審查/issue 意見；先驗證 gh 是否已登入，若未登入則提示使用者進行驗證。\nmetadata:\n  short-description: 處理 GitHub PR 審查中的意見\n---\n\n# PR 意見處理器\n\n指引如何找到目前分支的開啟中 PR，並用 gh CLI 處理其中的意見。所有 `gh` 指令都要以提升的網路權限執行。\n\n前置條件：確認 `gh` 已驗證（例如執行一次 `gh auth login`），然後以提升的權限執行 `gh auth status`（包含 workflow/repo 範圍），讓 `gh` 指令能成功執行。如果沙箱阻擋了 `gh auth status`，就以 `sandbox_permissions=require_escalated` 重新執行。\n\n## 1) 檢查需要處理的意見\n- 執行 scripts/fetch_comments.py，它會列出 PR 上所有的意見與審查討論串\n\n## 2) 向使用者確認\n- 為所有審查討論串與意見編號，並簡短摘要每一則需要做什麼修正\n- 詢問使用者要處理哪幾個編號的意見\n\n## 3) 如果使用者選了意見\n- 對選定的意見套用修正\n\n注意：\n- 如果 gh 在執行途中遇到驗證或速率限制問題，提示使用者用 `gh auth login` 重新驗證，然後重試。"}, {"rank": 42, "slug": "playwright", "title": "Playwright 瀏覽器操控", "category": "瀏覽器與測試自動化", "tags": ["Playwright", "瀏覽器自動化", "截圖", "爬蟲", "OpenAI Codex"], "summary": "OpenAI Codex 官方技能：透過 `playwright-cli` 從終端機操控真實瀏覽器——導航、填表、快照、截圖、擷取資料、用 trace 除錯 UI 流程。以 CLI 操作為主，而不是寫測試檔。", "usage": "- Codex：`$skill-installer playwright`\n- 需要 Node.js / npx；內附包裝腳本，不必全域安裝 playwright-cli\n- 說「打開這個網站填好表單並截圖」\n- 核心循環：open → snapshot 取得元素參照（如 e12）→ 用參照互動 → 頁面變動後重新 snapshot", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/playwright/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/playwright/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Use when the task requires automating a real browser from the terminal (navigation, form filling, snapshots, screenshots, data extraction, UI-flow debugging) via `playwright-cli` or the bundled wrapper script.", "description_zh": "當任務需要從終端機透過 `playwright-cli` 或內附的包裝腳本自動化真實瀏覽器時使用（導航、填寫表單、快照、截圖、資料擷取、UI 流程除錯）。", "original": "---\nname: \"playwright\"\ndescription: \"Use when the task requires automating a real browser from the terminal (navigation, form filling, snapshots, screenshots, data extraction, UI-flow debugging) via `playwright-cli` or the bundled wrapper script.\"\n---\n\n\n# Playwright CLI Skill\n\nDrive a real browser from the terminal using `playwright-cli`. Prefer the bundled wrapper script so the CLI works even when it is not globally installed.\nTreat this skill as CLI-first automation. Do not pivot to `@playwright/test` unless the user explicitly asks for test files.\n\n## Prerequisite check (required)\n\nBefore proposing commands, check whether `npx` is available (the wrapper depends on it):\n\n```bash\ncommand -v npx >/dev/null 2>&1\n```\n\nIf it is not available, pause and ask the user to install Node.js/npm (which provides `npx`). Provide these steps verbatim:\n\n```bash\n# Verify Node/npm are installed\nnode --version\nnpm --version\n\n# If missing, install Node.js/npm, then:\nnpm install -g @playwright/cli@latest\nplaywright-cli --help\n```\n\nOnce `npx` is present, proceed with the wrapper script. A global install of `playwright-cli` is optional.\n\n## Skill path (set once)\n\n```bash\nexport CODEX_HOME=\"${CODEX_HOME:-$HOME/.codex}\"\nexport PWCLI=\"$CODEX_HOME/skills/playwright/scripts/playwright_cli.sh\"\n```\n\nUser-scoped skills install under `$CODEX_HOME/skills` (default: `~/.codex/skills`).\n\n## Quick start\n\nUse the wrapper script:\n\n```bash\n\"$PWCLI\" open https://playwright.dev --headed\n\"$PWCLI\" snapshot\n\"$PWCLI\" click e15\n\"$PWCLI\" type \"Playwright\"\n\"$PWCLI\" press Enter\n\"$PWCLI\" screenshot\n```\n\nIf the user prefers a global install, this is also valid:\n\n```bash\nnpm install -g @playwright/cli@latest\nplaywright-cli --help\n```\n\n## Core workflow\n\n1. Open the page.\n2. Snapshot to get stable element refs.\n3. Interact using refs from the latest snapshot.\n4. Re-snapshot after navigation or significant DOM changes.\n5. Capture artifacts (screenshot, pdf, traces) when useful.\n\nMinimal loop:\n\n```bash\n\"$PWCLI\" open https://example.com\n\"$PWCLI\" snapshot\n\"$PWCLI\" click e3\n\"$PWCLI\" snapshot\n```\n\n## When to snapshot again\n\nSnapshot again after:\n\n- navigation\n- clicking elements that change the UI substantially\n- opening/closing modals or menus\n- tab switches\n\nRefs can go stale. When a command fails due to a missing ref, snapshot again.\n\n## Recommended patterns\n\n### Form fill and submit\n\n```bash\n\"$PWCLI\" open https://example.com/form\n\"$PWCLI\" snapshot\n\"$PWCLI\" fill e1 \"user@example.com\"\n\"$PWCLI\" fill e2 \"password123\"\n\"$PWCLI\" click e3\n\"$PWCLI\" snapshot\n```\n\n### Debug a UI flow with traces\n\n```bash\n\"$PWCLI\" open https://example.com --headed\n\"$PWCLI\" tracing-start\n# ...interactions...\n\"$PWCLI\" tracing-stop\n```\n\n### Multi-tab work\n\n```bash\n\"$PWCLI\" tab-new https://example.com\n\"$PWCLI\" tab-list\n\"$PWCLI\" tab-select 0\n\"$PWCLI\" snapshot\n```\n\n## Wrapper script\n\nThe wrapper script uses `npx --package @playwright/cli playwright-cli` so the CLI can run without a global install:\n\n```bash\n\"$PWCLI\" --help\n```\n\nPrefer the wrapper unless the repository already standardizes on a global install.\n\n## References\n\nOpen only what you need:\n\n- CLI command reference: `references/cli.md`\n- Practical workflows and troubleshooting: `references/workflows.md`\n\n## Guardrails\n\n- Always snapshot before referencing element ids like `e12`.\n- Re-snapshot when refs seem stale.\n- Prefer explicit commands over `eval` and `run-code` unless needed.\n- When you do not have a fresh snapshot, use placeholder refs like `eX` and say why; do not bypass refs with `run-code`.\n- Use `--headed` when a visual check will help.\n- When capturing artifacts in this repo, use `output/playwright/` and avoid introducing new top-level artifact folders.\n- Default to CLI commands and workflows, not Playwright test specs.\n", "translation": "---\nname: \"playwright\"\ndescription: \"當任務需要從終端機透過 `playwright-cli` 或內附的包裝腳本自動化真實瀏覽器時使用（導航、填寫表單、快照、截圖、資料擷取、UI 流程除錯）。\"\n---\n\n\n# Playwright CLI 技能\n\n使用 `playwright-cli` 從終端機驅動真實瀏覽器。優先使用內附的包裝腳本，這樣即使 CLI 沒有全域安裝也能運作。\n把本技能當作以 CLI 為主的自動化。除非使用者明確要求測試檔，否則不要轉向 `@playwright/test`。\n\n## 前置檢查（必要）\n\n在提出指令之前，先檢查 `npx` 是否可用（包裝腳本依賴它）：\n\n```bash\ncommand -v npx >/dev/null 2>&1\n```\n\n如果不可用，就暫停並請使用者安裝 Node.js/npm（會提供 `npx`）。逐字提供以下步驟：\n\n```bash\n# Verify Node/npm are installed\nnode --version\nnpm --version\n\n# If missing, install Node.js/npm, then:\nnpm install -g @playwright/cli@latest\nplaywright-cli --help\n```\n\n一旦有了 `npx`，就使用包裝腳本繼續。全域安裝 `playwright-cli` 是選擇性的。\n\n## 技能路徑（設定一次）\n\n```bash\nexport CODEX_HOME=\"${CODEX_HOME:-$HOME/.codex}\"\nexport PWCLI=\"$CODEX_HOME/skills/playwright/scripts/playwright_cli.sh\"\n```\n\n使用者範圍的技能安裝在 `$CODEX_HOME/skills` 之下（預設：`~/.codex/skills`）。\n\n## 快速開始\n\n使用包裝腳本：\n\n```bash\n\"$PWCLI\" open https://playwright.dev --headed\n\"$PWCLI\" snapshot\n\"$PWCLI\" click e15\n\"$PWCLI\" type \"Playwright\"\n\"$PWCLI\" press Enter\n\"$PWCLI\" screenshot\n```\n\n如果使用者偏好全域安裝，這樣也可以：\n\n```bash\nnpm install -g @playwright/cli@latest\nplaywright-cli --help\n```\n\n## 核心流程\n\n1. 開啟頁面。\n2. 取得快照以獲得穩定的元素參照。\n3. 使用最新快照中的參照進行互動。\n4. 導航或 DOM 大幅變動後重新快照。\n5. 有用時擷取產出物（截圖、pdf、trace）。\n\n最小循環：\n\n```bash\n\"$PWCLI\" open https://example.com\n\"$PWCLI\" snapshot\n\"$PWCLI\" click e3\n\"$PWCLI\" snapshot\n```\n\n## 何時重新快照\n\n在以下情況後重新快照：\n\n- 導航\n- 點擊會大幅改變 UI 的元素\n- 開啟/關閉對話框或選單\n- 切換分頁\n\n參照可能會過期。當指令因為找不到參照而失敗時，重新快照。\n\n## 建議模式\n\n### 填寫並送出表單\n\n```bash\n\"$PWCLI\" open https://example.com/form\n\"$PWCLI\" snapshot\n\"$PWCLI\" fill e1 \"user@example.com\"\n\"$PWCLI\" fill e2 \"password123\"\n\"$PWCLI\" click e3\n\"$PWCLI\" snapshot\n```\n\n### 用 trace 除錯 UI 流程\n\n```bash\n\"$PWCLI\" open https://example.com --headed\n\"$PWCLI\" tracing-start\n# ...interactions...\n\"$PWCLI\" tracing-stop\n```\n\n### 多分頁作業\n\n```bash\n\"$PWCLI\" tab-new https://example.com\n\"$PWCLI\" tab-list\n\"$PWCLI\" tab-select 0\n\"$PWCLI\" snapshot\n```\n\n## 包裝腳本\n\n包裝腳本使用 `npx --package @playwright/cli playwright-cli`，讓 CLI 不需全域安裝也能執行：\n\n```bash\n\"$PWCLI\" --help\n```\n\n除非 repo 已經統一採用全域安裝，否則優先使用包裝腳本。\n\n## 參考資料\n\n只開啟你需要的：\n\n- CLI 指令參考：`references/cli.md`\n- 實用流程與疑難排解：`references/workflows.md`\n\n## 防護規則\n\n- 在引用像 `e12` 這樣的元素 id 之前，一律先快照。\n- 參照似乎過期時重新快照。\n- 除非必要，優先使用明確的指令，而非 `eval` 與 `run-code`。\n- 沒有新的快照時，使用像 `eX` 這樣的占位參照並說明原因；不要用 `run-code` 繞過參照。\n- 視覺檢查有幫助時使用 `--headed`。\n- 在這個 repo 中擷取產出物時，使用 `output/playwright/`，避免新增頂層的產出物資料夾。\n- 預設使用 CLI 指令與流程，而非 Playwright 測試規格。"}, {"rank": 43, "slug": "security-threat-model", "title": "資安威脅建模", "category": "資訊安全", "tags": ["威脅建模", "AppSec", "資安審查", "OpenAI Codex"], "summary": "OpenAI Codex 官方技能：以實際程式碼為依據，列舉信任邊界、資產、攻擊者能力、濫用路徑與緩解措施，產出一份精簡、可執行的 Markdown 威脅模型報告。", "usage": "- Codex：`$skill-installer security-threat-model`\n- 只在你明確要求時觸發：「幫這個 repo 做威脅建模」「列出 src/api 的攻擊路徑」\n- 代理會先提出關鍵假設與 1–3 個問題（部署方式、是否對外、資料敏感度），等你回覆後才產出最終報告 `<repo>-threat-model.md`", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/security-threat-model/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/security-threat-model/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Repository-grounded threat modeling that enumerates trust boundaries, assets, attacker capabilities, abuse paths, and mitigations, and writes a concise Markdown threat model. Trigger only when the user explicitly asks to threat model a codebase or path, enumerate threats/abuse paths, or perform AppSec threat modeling. Do not trigger for general architecture summaries, code review, or non-security design work.", "description_zh": "以 repo 為依據的威脅建模，列舉信任邊界、資產、攻擊者能力、濫用路徑與緩解措施，並寫出一份精簡的 Markdown 威脅模型。只有在使用者明確要求對程式碼庫或路徑進行威脅建模、列舉威脅/濫用路徑，或執行 AppSec 威脅建模時才觸發。一般的架構摘要、程式碼審查或非資安的設計工作不要觸發。", "original": "---\nname: \"security-threat-model\"\ndescription: \"Repository-grounded threat modeling that enumerates trust boundaries, assets, attacker capabilities, abuse paths, and mitigations, and writes a concise Markdown threat model. Trigger only when the user explicitly asks to threat model a codebase or path, enumerate threats/abuse paths, or perform AppSec threat modeling. Do not trigger for general architecture summaries, code review, or non-security design work.\"\n---\n\n# Threat Model Source Code Repo\n\nDeliver an actionable AppSec-grade threat model that is specific to the repository or a project path, not a generic checklist. Anchor every architectural claim to evidence in the repo and keep assumptions explicit. Prioritizing realistic attacker goals and concrete impacts over generic checklists.\n\n## Quick start\n\n1) Collect (or infer) inputs:\n- Repo root path and any in-scope paths.\n- Intended usage, deployment model, internet exposure, and auth expectations (if known).\n- Any existing repository summary or architecture spec.\n- Use prompts in `references/prompt-template.md` to generate a repository summary.\n- Follow the required output contract in `references/prompt-template.md`. Use it verbatim when possible.\n\n## Workflow\n\n### 1) Scope and extract the system model\n- Identify primary components, data stores, and external integrations from the repo summary.\n- Identify how the system runs (server, CLI, library, worker) and its entrypoints.\n- Separate runtime behavior from CI/build/dev tooling and from tests/examples.\n- Map the in-scope locations to those components and exclude out-of-scope items explicitly.\n- Do not claim components, flows, or controls without evidence.\n\n### 2) Derive boundaries, assets, and entry points\n- Enumerate trust boundaries as concrete edges between components, noting protocol, auth, encryption, validation, and rate limiting.\n- List assets that drive risk (data, credentials, models, config, compute resources, audit logs).\n- Identify entry points (endpoints, upload surfaces, parsers/decoders, job triggers, admin tooling, logging/error sinks).\n\n### 3) Calibrate assets and attacker capabilities\n- List the assets that drive risk (credentials, PII, integrity-critical state, availability-critical components, build artifacts).\n- Describe realistic attacker capabilities based on exposure and intended usage.\n- Explicitly note non-capabilities to avoid inflated severity.\n\n\n### 4) Enumerate threats as abuse paths\n- Prefer attacker goals that map to assets and boundaries (exfiltration, privilege escalation, integrity compromise, denial of service).\n- Classify each threat and tie it to impacted assets.\n- Keep the number of threats small but high quality.\n\n### 5) Prioritize with explicit likelihood and impact reasoning\n- Use qualitative likelihood and impact (low/medium/high) with short justifications.\n- Set overall priority (critical/high/medium/low) using likelihood x impact, adjusted for existing controls.\n- State which assumptions most influence the ranking.\n\n### 6) Validate service context and assumptions with the user\n- Summarize key assumptions that materially affect threat ranking or scope, then ask the user to confirm or correct them.\n- Ask 1–3 targeted questions to resolve missing context (service owner and environment, scale/users, deployment model, authn/authz, internet exposure, data sensitivity, multi-tenancy).\n- Pause and wait for user feedback before producing the final report.\n- If the user declines or can’t answer, state which assumptions remain and how they influence priority.\n\n### 7) Recommend mitigations and focus paths\n- Distinguish existing mitigations (with evidence) from recommended mitigations.\n- Tie mitigations to concrete locations (component, boundary, or entry point) and control types (authZ checks, input validation, schema enforcement, sandboxing, rate limits, secrets isolation, audit logging).\n- Prefer specific implementation hints over generic advice (e.g., \"enforce schema at gateway for upload payloads\" vs \"validate inputs\").\n- Base recommendations on validated user context; if assumptions remain unresolved, mark recommendations as conditional.\n\n### 8) Run a quality check before finalizing\n- Confirm all discovered entrypoints are covered.\n- Confirm each trust boundary is represented in threats.\n- Confirm runtime vs CI/dev separation.\n- Confirm user clarifications (or explicit non-responses) are reflected.\n- Confirm assumptions and open questions are explicit.\n- Confirm that the format of the report matches closely the required output format defined in prompt template: `references/prompt-template.md`\n- Write the final Markdown to a file named `<repo-or-dir-name>-threat-model.md` (use the basename of the repo root, or the in-scope directory if you were asked to model a subpath).\n\n\n## Risk prioritization guidance (illustrative, not exhaustive)\n- High: pre-auth RCE, auth bypass, cross-tenant access, sensitive data exfiltration, key or token theft, model or config integrity compromise, sandbox escape.\n- Medium: targeted DoS of critical components, partial data exposure, rate-limit bypass with measurable impact, log/metrics poisoning that affects detection.\n- Low: low-sensitivity info leaks, noisy DoS with easy mitigation, issues requiring unlikely preconditions.\n\n## References\n\n- Output contract and full prompt template: `references/prompt-template.md`\n- Optional controls/asset list: `references/security-controls-and-assets.md`\n\nOnly load the reference files you need. Keep the final result concise, grounded, and reviewable.\n", "translation": "---\nname: \"security-threat-model\"\ndescription: \"以 repo 為依據的威脅建模，列舉信任邊界、資產、攻擊者能力、濫用路徑與緩解措施，並寫出一份精簡的 Markdown 威脅模型。只有在使用者明確要求對程式碼庫或路徑進行威脅建模、列舉威脅/濫用路徑，或執行 AppSec 威脅建模時才觸發。一般的架構摘要、程式碼審查或非資安的設計工作不要觸發。\"\n---\n\n# 原始碼 Repo 威脅建模\n\n交付一份可執行、AppSec 等級、專屬於該 repo 或專案路徑的威脅模型，而不是通用檢查清單。每一項架構主張都要錨定在 repo 中的證據上，並明確寫出假設。優先考量真實的攻擊者目標與具體影響，而非通用檢查清單。\n\n## 快速開始\n\n1) 收集（或推斷）輸入：\n- Repo 根目錄路徑與任何範圍內的路徑。\n- 預期用途、部署模型、網際網路暴露程度，以及驗證預期（如果已知）。\n- 任何既有的 repo 摘要或架構規格。\n- 使用 `references/prompt-template.md` 中的提示詞產生 repo 摘要。\n- 遵循 `references/prompt-template.md` 中規定的輸出契約。可能的話逐字使用。\n\n## 工作流程\n\n### 1) 界定範圍並萃取系統模型\n- 從 repo 摘要中辨識主要元件、資料儲存與外部整合。\n- 辨識系統如何執行（伺服器、CLI、函式庫、worker）及其進入點。\n- 把執行期行為與 CI/建置/開發工具，以及測試/範例區分開來。\n- 把範圍內的位置對應到這些元件，並明確排除範圍外的項目。\n- 沒有證據就不要宣稱存在某些元件、流程或控制措施。\n\n### 2) 推導邊界、資產與進入點\n- 把信任邊界列舉為元件之間具體的邊，並註明協定、驗證、加密、驗證輸入與速率限制。\n- 列出驅動風險的資產（資料、憑證、模型、設定、運算資源、稽核日誌）。\n- 辨識進入點（端點、上傳介面、解析器/解碼器、工作觸發器、管理工具、日誌/錯誤接收端）。\n\n### 3) 校準資產與攻擊者能力\n- 列出驅動風險的資產（憑證、個資、完整性關鍵狀態、可用性關鍵元件、建置產出物）。\n- 根據暴露程度與預期用途，描述真實的攻擊者能力。\n- 明確註明攻擊者「不具備」的能力，避免誇大嚴重性。\n\n\n### 4) 把威脅列舉為濫用路徑\n- 優先考慮能對應到資產與邊界的攻擊者目標（資料外洩、權限提升、完整性破壞、阻斷服務）。\n- 為每個威脅分類，並連結到受影響的資產。\n- 威脅數量保持少而精。\n\n### 5) 以明確的可能性與影響推理排定優先順序\n- 使用定性的可能性與影響（低/中/高），並附上簡短理由。\n- 用「可能性 × 影響」設定整體優先順序（嚴重/高/中/低），並依既有控制措施調整。\n- 說明哪些假設最影響排序。\n\n### 6) 與使用者確認服務脈絡與假設\n- 摘要會實質影響威脅排序或範圍的關鍵假設，然後請使用者確認或更正。\n- 提出 1–3 個針對性問題來補足缺少的脈絡（服務負責人與環境、規模/使用者、部署模型、身分驗證/授權、網際網路暴露、資料敏感度、多租戶）。\n- 在產出最終報告之前暫停，等待使用者回饋。\n- 如果使用者拒絕或無法回答，說明哪些假設仍然存在，以及它們如何影響優先順序。\n\n### 7) 建議緩解措施與聚焦路徑\n- 區分既有的緩解措施（附證據）與建議的緩解措施。\n- 把緩解措施連結到具體位置（元件、邊界或進入點）與控制類型（授權檢查、輸入驗證、schema 強制、沙箱、速率限制、機密隔離、稽核日誌）。\n- 優先提供具體的實作提示，而非通用建議（例如「在 gateway 對上傳內容強制 schema」而非「驗證輸入」）。\n- 建議要基於已確認的使用者脈絡；如果假設仍未解決，就把建議標示為有條件的。\n\n### 8) 定稿前進行品質檢查\n- 確認所有發現的進入點都已涵蓋。\n- 確認每個信任邊界都在威脅中有所呈現。\n- 確認執行期與 CI/開發已區分。\n- 確認使用者的釐清（或明確的未回應）已反映在內。\n- 確認假設與待解問題都已明確寫出。\n- 確認報告格式與提示詞模板 `references/prompt-template.md` 中定義的必要輸出格式高度一致。\n- 把最終 Markdown 寫入名為 `<repo-or-dir-name>-threat-model.md` 的檔案（使用 repo 根目錄的基本名稱，若被要求建模子路徑則使用範圍內目錄的名稱）。\n\n\n## 風險優先順序指引（舉例說明，非窮舉）\n- 高：驗證前的遠端程式碼執行（RCE）、驗證繞過、跨租戶存取、敏感資料外洩、金鑰或 token 竊取、模型或設定完整性遭破壞、沙箱逃逸。\n- 中：針對關鍵元件的定向 DoS、部分資料暴露、具可衡量影響的速率限制繞過、影響偵測能力的日誌/指標汙染。\n- 低：低敏感度資訊洩漏、容易緩解的雜訊型 DoS、需要不太可能成立之前提條件的問題。\n\n## 參考資料\n\n- 輸出契約與完整提示詞模板：`references/prompt-template.md`\n- 選用的控制措施/資產清單：`references/security-controls-and-assets.md`\n\n只載入你需要的參考檔案。讓最終結果精簡、有依據且可供審查。"}, {"rank": 44, "slug": "figma-implement-design", "title": "Figma 設計轉程式碼", "category": "前端與設計", "tags": ["Figma", "設計轉程式", "Design Token", "MCP", "OpenAI Codex"], "summary": "OpenAI Codex 官方技能：透過 Figma MCP 伺服器，把 Figma 設計以 1:1 視覺還原度轉成可上線的程式碼——取得設計脈絡與截圖、下載素材、轉換成專案慣例與設計系統 token，最後對照截圖逐項驗證。", "usage": "- Codex：`$skill-installer figma-implement-design`；需先連接 Figma MCP Server（遠端或 figma-desktop）\n- 貼上 Figma 連結並說「實作這個元件」：`https://figma.com/design/<fileKey>/...?node-id=42-15`\n- 使用 figma-desktop MCP 時，直接在 Figma 桌面版選取節點即可，不必貼網址\n- 會優先重用專案既有元件與 token，而非照抄 Figma 輸出的 Tailwind", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/figma-implement-design/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/figma-implement-design/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Translates Figma designs into production-ready application code with 1:1 visual fidelity. Use when implementing UI code from Figma files, when user mentions \"implement design\", \"generate code\", \"implement component\", provides Figma URLs, or asks to build components matching Figma specs. For Figma canvas writes via `use_figma`, use `figma-use`.", "description_zh": "把 Figma 設計以 1:1 的視覺還原度轉換成可上線的應用程式碼。在從 Figma 檔案實作 UI 程式碼、使用者提到「implement design」「generate code」「implement component」、提供 Figma URL，或要求建立符合 Figma 規格的元件時使用。若要透過 `use_figma` 寫入 Figma 畫布，請使用 `figma-use`。", "original": "---\nname: figma-implement-design\ndescription: Translates Figma designs into production-ready application code with 1:1 visual fidelity. Use when implementing UI code from Figma files, when user mentions \"implement design\", \"generate code\", \"implement component\", provides Figma URLs, or asks to build components matching Figma specs. For Figma canvas writes via `use_figma`, use `figma-use`.\n---\n\n# Implement Design\n\n## Overview\n\nThis skill provides a structured workflow for translating Figma designs into production-ready code with pixel-perfect accuracy. It ensures consistent integration with the Figma MCP server, proper use of design tokens, and 1:1 visual parity with designs.\n\n## Skill Boundaries\n\n- Use this skill when the deliverable is code in the user's repository.\n- If the user asks to create/edit/delete nodes inside Figma itself, switch to [figma-use](../figma-use/SKILL.md).\n- If the user asks to build or update a full-page screen in Figma from code or a description, switch to [figma-generate-design](../figma-generate-design/SKILL.md).\n- If the user asks only for Code Connect mappings, switch to [figma-code-connect-components](../figma-code-connect-components/SKILL.md).\n- If the user asks to author reusable agent rules (`CLAUDE.md`/`AGENTS.md`), switch to [figma-create-design-system-rules](../figma-create-design-system-rules/SKILL.md).\n\n## Prerequisites\n\n- Figma MCP server must be connected and accessible\n- User must provide a Figma URL in the format: `https://figma.com/design/:fileKey/:fileName?node-id=1-2`\n  - `:fileKey` is the file key\n  - `1-2` is the node ID (the specific component or frame to implement)\n- **OR** when using `figma-desktop` MCP: User can select a node directly in the Figma desktop app (no URL required)\n- Project should have an established design system or component library (preferred)\n\n## Required Workflow\n\n**Follow these steps in order. Do not skip steps.**\n\n### Step 1: Get Node ID\n\n#### Option A: Parse from Figma URL\n\nWhen the user provides a Figma URL, extract the file key and node ID to pass as arguments to MCP tools.\n\n**URL format:** `https://figma.com/design/:fileKey/:fileName?node-id=1-2`\n\n**Extract:**\n\n- **File key:** `:fileKey` (the segment after `/design/`)\n- **Node ID:** `1-2` (the value of the `node-id` query parameter)\n\n**Note:** When using the local desktop MCP (`figma-desktop`), `fileKey` is not passed as a parameter to tool calls. The server automatically uses the currently open file, so only `nodeId` is needed.\n\n**Example:**\n\n- URL: `https://figma.com/design/kL9xQn2VwM8pYrTb4ZcHjF/DesignSystem?node-id=42-15`\n- File key: `kL9xQn2VwM8pYrTb4ZcHjF`\n- Node ID: `42-15`\n\n#### Option B: Use Current Selection from Figma Desktop App (figma-desktop MCP only)\n\nWhen using the `figma-desktop` MCP and the user has NOT provided a URL, the tools automatically use the currently selected node from the open Figma file in the desktop app.\n\n**Note:** Selection-based prompting only works with the `figma-desktop` MCP server. The remote server requires a link to a frame or layer to extract context. The user must have the Figma desktop app open with a node selected.\n\n### Step 2: Fetch Design Context\n\nRun `get_design_context` with the extracted file key and node ID.\n\n```\nget_design_context(fileKey=\":fileKey\", nodeId=\"1-2\")\n```\n\nThis provides the structured data including:\n\n- Layout properties (Auto Layout, constraints, sizing)\n- Typography specifications\n- Color values and design tokens\n- Component structure and variants\n- Spacing and padding values\n\n**If the response is too large or truncated:**\n\n1. Run `get_metadata(fileKey=\":fileKey\", nodeId=\"1-2\")` to get the high-level node map\n2. Identify the specific child nodes needed from the metadata\n3. Fetch individual child nodes with `get_design_context(fileKey=\":fileKey\", nodeId=\":childNodeId\")`\n\n### Step 3: Capture Visual Reference\n\nRun `get_screenshot` with the same file key and node ID for a visual reference.\n\n```\nget_screenshot(fileKey=\":fileKey\", nodeId=\"1-2\")\n```\n\nThis screenshot serves as the source of truth for visual validation. Keep it accessible throughout implementation.\n\n### Step 4: Download Required Assets\n\nDownload any assets (images, icons, SVGs) returned by the Figma MCP server.\n\n**IMPORTANT:** Follow these asset rules:\n\n- If the Figma MCP server returns a `localhost` source for an image or SVG, use that source directly\n- DO NOT import or add new icon packages - all assets should come from the Figma payload\n- DO NOT use or create placeholders if a `localhost` source is provided\n- Assets are served through the Figma MCP server's built-in assets endpoint\n\n### Step 5: Translate to Project Conventions\n\nTranslate the Figma output into this project's framework, styles, and conventions.\n\n**Key principles:**\n\n- Treat the Figma MCP output (typically React + Tailwind) as a representation of design and behavior, not as final code style\n- Replace Tailwind utility classes with the project's preferred utilities or design system tokens\n- Reuse existing components (buttons, inputs, typography, icon wrappers) instead of duplicating functionality\n- Use the project's color system, typography scale, and spacing tokens consistently\n- Respect existing routing, state management, and data-fetch patterns\n\n### Step 6: Achieve 1:1 Visual Parity\n\nStrive for pixel-perfect visual parity with the Figma design.\n\n**Guidelines:**\n\n- Prioritize Figma fidelity to match designs exactly\n- Avoid hardcoded values - use design tokens from Figma where available\n- When conflicts arise between design system tokens and Figma specs, prefer design system tokens but adjust spacing or sizes minimally to match visuals\n- Follow WCAG requirements for accessibility\n- Add component documentation as needed\n\n### Step 7: Validate Against Figma\n\nBefore marking complete, validate the final UI against the Figma screenshot.\n\n**Validation checklist:**\n\n- [ ] Layout matches (spacing, alignment, sizing)\n- [ ] Typography matches (font, size, weight, line height)\n- [ ] Colors match exactly\n- [ ] Interactive states work as designed (hover, active, disabled)\n- [ ] Responsive behavior follows Figma constraints\n- [ ] Assets render correctly\n- [ ] Accessibility standards met\n\n## Implementation Rules\n\n### Component Organization\n\n- Place UI components in the project's designated design system directory\n- Follow the project's component naming conventions\n- Avoid inline styles unless truly necessary for dynamic values\n\n### Design System Integration\n\n- ALWAYS use components from the project's design system when possible\n- Map Figma design tokens to project design tokens\n- When a matching component exists, extend it rather than creating a new one\n- Document any new components added to the design system\n\n### Code Quality\n\n- Avoid hardcoded values - extract to constants or design tokens\n- Keep components composable and reusable\n- Add TypeScript types for component props\n- Include JSDoc comments for exported components\n\n## Examples\n\n### Example 1: Implementing a Button Component\n\nUser says: \"Implement this Figma button component: https://figma.com/design/kL9xQn2VwM8pYrTb4ZcHjF/DesignSystem?node-id=42-15\"\n\n**Actions:**\n\n1. Parse URL to extract fileKey=`kL9xQn2VwM8pYrTb4ZcHjF` and nodeId=`42-15`\n2. Run `get_design_context(fileKey=\"kL9xQn2VwM8pYrTb4ZcHjF\", nodeId=\"42-15\")`\n3. Run `get_screenshot(fileKey=\"kL9xQn2VwM8pYrTb4ZcHjF\", nodeId=\"42-15\")` for visual reference\n4. Download any button icons from the assets endpoint\n5. Check if project has existing button component\n6. If yes, extend it with new variant; if no, create new component using project conventions\n7. Map Figma colors to project design tokens (e.g., `primary-500`, `primary-hover`)\n8. Validate against screenshot for padding, border radius, typography\n\n**Result:** Button component matching Figma design, integrated with project design system.\n\n### Example 2: Building a Dashboard Layout\n\nUser says: \"Build this dashboard: https://figma.com/design/pR8mNv5KqXzGwY2JtCfL4D/Dashboard?node-id=10-5\"\n\n**Actions:**\n\n1. Parse URL to extract fileKey=`pR8mNv5KqXzGwY2JtCfL4D` and nodeId=`10-5`\n2. Run `get_metadata(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\"10-5\")` to understand the page structure\n3. Identify main sections from metadata (header, sidebar, content area, cards) and their child node IDs\n4. Run `get_design_context(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\":childNodeId\")` for each major section\n5. Run `get_screenshot(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\"10-5\")` for the full page\n6. Download all assets (logos, icons, charts)\n7. Build layout using project's layout primitives\n8. Implement each section using existing components where possible\n9. Validate responsive behavior against Figma constraints\n\n**Result:** Complete dashboard matching Figma design with responsive layout.\n\n## Best Practices\n\n### Always Start with Context\n\nNever implement based on assumptions. Always fetch `get_design_context` and `get_screenshot` first.\n\n### Incremental Validation\n\nValidate frequently during implementation, not just at the end. This catches issues early.\n\n### Document Deviations\n\nIf you must deviate from the Figma design (e.g., for accessibility or technical constraints), document why in code comments.\n\n### Reuse Over Recreation\n\nAlways check for existing components before creating new ones. Consistency across the codebase is more important than exact Figma replication.\n\n### Design System First\n\nWhen in doubt, prefer the project's design system patterns over literal Figma translation.\n\n## Common Issues and Solutions\n\n### Issue: Figma output is truncated\n\n**Cause:** The design is too complex or has too many nested layers to return in a single response.\n**Solution:** Use `get_metadata` to get the node structure, then fetch specific nodes individually with `get_design_context`.\n\n### Issue: Design doesn't match after implementation\n\n**Cause:** Visual discrepancies between the implemented code and the original Figma design.\n**Solution:** Compare side-by-side with the screenshot from Step 3. Check spacing, colors, and typography values in the design context data.\n\n### Issue: Assets not loading\n\n**Cause:** The Figma MCP server's assets endpoint is not accessible or the URLs are being modified.\n**Solution:** Verify the Figma MCP server's assets endpoint is accessible. The server serves assets at `localhost` URLs. Use these directly without modification.\n\n### Issue: Design token values differ from Figma\n\n**Cause:** The project's design system tokens have different values than those specified in the Figma design.\n**Solution:** When project tokens differ from Figma values, prefer project tokens for consistency but adjust spacing/sizing to maintain visual fidelity.\n\n## Understanding Design Implementation\n\nThe Figma implementation workflow establishes a reliable process for translating designs to code:\n\n**For designers:** Confidence that implementations will match their designs with pixel-perfect accuracy.\n**For developers:** A structured approach that eliminates guesswork and reduces back-and-forth revisions.\n**For teams:** Consistent, high-quality implementations that maintain design system integrity.\n\nBy following this workflow, you ensure that every Figma design is implemented with the same level of care and attention to detail.\n\n## Additional Resources\n\n- [Figma MCP Server Documentation](https://developers.figma.com/docs/figma-mcp-server/)\n- [Figma MCP Server Tools and Prompts](https://developers.figma.com/docs/figma-mcp-server/tools-and-prompts/)\n- [Figma Variables and Design Tokens](https://help.figma.com/hc/en-us/articles/15339657135383-Guide-to-variables-in-Figma)\n", "translation": "---\nname: figma-implement-design\ndescription: 把 Figma 設計以 1:1 的視覺還原度轉換成可上線的應用程式碼。在從 Figma 檔案實作 UI 程式碼、使用者提到「implement design」「generate code」「implement component」、提供 Figma URL，或要求建立符合 Figma 規格的元件時使用。若要透過 `use_figma` 寫入 Figma 畫布，請使用 `figma-use`。\n---\n\n# 實作設計\n\n## 概述\n\n本技能提供一套結構化的工作流程，以像素級的精準度把 Figma 設計轉換成可上線的程式碼。它確保與 Figma MCP 伺服器的整合一致、正確使用設計 token，並與設計達到 1:1 的視覺一致。\n\n## 技能邊界\n\n- 當交付成果是使用者 repo 中的程式碼時，使用本技能。\n- 如果使用者要求在 Figma 本身內部建立/編輯/刪除節點，改用 [figma-use](../figma-use/SKILL.md)。\n- 如果使用者要求從程式碼或描述在 Figma 中建立或更新整頁畫面，改用 [figma-generate-design](../figma-generate-design/SKILL.md)。\n- 如果使用者只要求 Code Connect 對應，改用 [figma-code-connect-components](../figma-code-connect-components/SKILL.md)。\n- 如果使用者要求撰寫可重用的代理規則（`CLAUDE.md`/`AGENTS.md`），改用 [figma-create-design-system-rules](../figma-create-design-system-rules/SKILL.md)。\n\n## 前置條件\n\n- Figma MCP 伺服器必須已連線且可存取\n- 使用者必須提供以下格式的 Figma URL：`https://figma.com/design/:fileKey/:fileName?node-id=1-2`\n  - `:fileKey` 是檔案金鑰\n  - `1-2` 是節點 ID（要實作的特定元件或框架）\n- **或者**使用 `figma-desktop` MCP 時：使用者可以直接在 Figma 桌面應用程式中選取節點（不需要 URL）\n- 專案應有既定的設計系統或元件庫（建議）\n\n## 必要工作流程\n\n**依序遵循這些步驟。不要略過步驟。**\n\n### 步驟 1：取得節點 ID\n\n#### 選項 A：從 Figma URL 解析\n\n當使用者提供 Figma URL 時，擷取檔案金鑰與節點 ID，作為參數傳給 MCP 工具。\n\n**URL 格式：** `https://figma.com/design/:fileKey/:fileName?node-id=1-2`\n\n**擷取：**\n\n- **檔案金鑰：** `:fileKey`（`/design/` 之後的那一段）\n- **節點 ID：** `1-2`（`node-id` 查詢參數的值）\n\n**注意：** 使用本機桌面版 MCP（`figma-desktop`）時，`fileKey` 不會作為參數傳給工具呼叫。伺服器會自動使用目前開啟的檔案，所以只需要 `nodeId`。\n\n**範例：**\n\n- URL：`https://figma.com/design/kL9xQn2VwM8pYrTb4ZcHjF/DesignSystem?node-id=42-15`\n- 檔案金鑰：`kL9xQn2VwM8pYrTb4ZcHjF`\n- 節點 ID：`42-15`\n\n#### 選項 B：使用 Figma 桌面應用程式的目前選取（僅限 figma-desktop MCP）\n\n使用 `figma-desktop` MCP 且使用者「沒有」提供 URL 時，工具會自動使用桌面應用程式中已開啟的 Figma 檔案裡目前選取的節點。\n\n**注意：** 以選取為基礎的提示只適用於 `figma-desktop` MCP 伺服器。遠端伺服器需要框架或圖層的連結才能擷取脈絡。使用者必須開著 Figma 桌面應用程式並選取一個節點。\n\n### 步驟 2：取得設計脈絡\n\n以擷取到的檔案金鑰與節點 ID 執行 `get_design_context`。\n\n```\nget_design_context(fileKey=\":fileKey\", nodeId=\"1-2\")\n```\n\n這會提供結構化資料，包括：\n\n- 版面屬性（Auto Layout、約束、尺寸）\n- 字體排印規格\n- 色彩值與設計 token\n- 元件結構與變體\n- 間距與內距值\n\n**如果回應太大或被截斷：**\n\n1. 執行 `get_metadata(fileKey=\":fileKey\", nodeId=\"1-2\")` 取得高層的節點地圖\n2. 從中繼資料中找出需要的特定子節點\n3. 以 `get_design_context(fileKey=\":fileKey\", nodeId=\":childNodeId\")` 個別抓取子節點\n\n### 步驟 3：擷取視覺參考\n\n以相同的檔案金鑰與節點 ID 執行 `get_screenshot` 取得視覺參考。\n\n```\nget_screenshot(fileKey=\":fileKey\", nodeId=\"1-2\")\n```\n\n這張截圖是視覺驗證的真實依據。在整個實作過程中都要保持可取用。\n\n### 步驟 4：下載所需素材\n\n下載 Figma MCP 伺服器回傳的所有素材（圖片、圖示、SVG）。\n\n**重要：** 遵循以下素材規則：\n\n- 如果 Figma MCP 伺服器為圖片或 SVG 回傳 `localhost` 來源，就直接使用該來源\n- **不要**匯入或新增圖示套件——所有素材都應來自 Figma 的回傳內容\n- 如果提供了 `localhost` 來源，**不要**使用或建立占位符\n- 素材透過 Figma MCP 伺服器內建的素材端點提供\n\n### 步驟 5：轉換成專案慣例\n\n把 Figma 輸出轉換成此專案的框架、樣式與慣例。\n\n**關鍵原則：**\n\n- 把 Figma MCP 輸出（通常是 React + Tailwind）視為設計與行為的表示，而不是最終的程式碼風格\n- 把 Tailwind 工具類別換成專案偏好的工具類別或設計系統 token\n- 重用既有元件（按鈕、輸入框、文字、圖示包裝），而不是重複實作功能\n- 一致地使用專案的色彩系統、字級階層與間距 token\n- 尊重既有的路由、狀態管理與資料抓取模式\n\n### 步驟 6：達到 1:1 視覺一致\n\n力求與 Figma 設計達到像素級的視覺一致。\n\n**準則：**\n\n- 優先考慮 Figma 還原度，精確符合設計\n- 避免寫死的值——盡可能使用 Figma 中的設計 token\n- 當設計系統 token 與 Figma 規格衝突時，優先使用設計系統 token，但以最小幅度調整間距或尺寸以符合視覺\n- 遵循 WCAG 無障礙要求\n- 視需要加入元件文件\n\n### 步驟 7：對照 Figma 驗證\n\n在標記完成之前，對照 Figma 截圖驗證最終 UI。\n\n**驗證清單：**\n\n- [ ] 版面相符（間距、對齊、尺寸）\n- [ ] 字體排印相符（字型、大小、字重、行高）\n- [ ] 色彩完全相符\n- [ ] 互動狀態依設計運作（hover、active、disabled）\n- [ ] 響應式行為遵循 Figma 約束\n- [ ] 素材正確渲染\n- [ ] 符合無障礙標準\n\n## 實作規則\n\n### 元件組織\n\n- 把 UI 元件放在專案指定的設計系統目錄中\n- 遵循專案的元件命名慣例\n- 除非動態值確實需要，否則避免內嵌樣式\n\n### 設計系統整合\n\n- 可能的話「一律」使用專案設計系統中的元件\n- 把 Figma 設計 token 對應到專案設計 token\n- 當已有相符的元件時，擴充它，而不是建立新的\n- 記錄任何新加入設計系統的元件\n\n### 程式碼品質\n\n- 避免寫死的值——抽成常數或設計 token\n- 讓元件保持可組合、可重用\n- 為元件 props 加上 TypeScript 型別\n- 為匯出的元件加上 JSDoc 註解\n\n## 範例\n\n### 範例 1：實作按鈕元件\n\n使用者說：「實作這個 Figma 按鈕元件：https://figma.com/design/kL9xQn2VwM8pYrTb4ZcHjF/DesignSystem?node-id=42-15」\n\n**動作：**\n\n1. 解析 URL，擷取 fileKey=`kL9xQn2VwM8pYrTb4ZcHjF` 與 nodeId=`42-15`\n2. 執行 `get_design_context(fileKey=\"kL9xQn2VwM8pYrTb4ZcHjF\", nodeId=\"42-15\")`\n3. 執行 `get_screenshot(fileKey=\"kL9xQn2VwM8pYrTb4ZcHjF\", nodeId=\"42-15\")` 取得視覺參考\n4. 從素材端點下載任何按鈕圖示\n5. 檢查專案是否已有按鈕元件\n6. 如果有，用新的變體擴充它；如果沒有，依專案慣例建立新元件\n7. 把 Figma 色彩對應到專案設計 token（例如 `primary-500`、`primary-hover`）\n8. 對照截圖驗證內距、圓角、字體排印\n\n**結果：** 符合 Figma 設計、並整合進專案設計系統的按鈕元件。\n\n### 範例 2：建立儀表板版面\n\n使用者說：「做出這個儀表板：https://figma.com/design/pR8mNv5KqXzGwY2JtCfL4D/Dashboard?node-id=10-5」\n\n**動作：**\n\n1. 解析 URL，擷取 fileKey=`pR8mNv5KqXzGwY2JtCfL4D` 與 nodeId=`10-5`\n2. 執行 `get_metadata(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\"10-5\")` 了解頁面結構\n3. 從中繼資料中找出主要區塊（頁首、側邊欄、內容區、卡片）及其子節點 ID\n4. 對每個主要區塊執行 `get_design_context(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\":childNodeId\")`\n5. 對整頁執行 `get_screenshot(fileKey=\"pR8mNv5KqXzGwY2JtCfL4D\", nodeId=\"10-5\")`\n6. 下載所有素材（Logo、圖示、圖表）\n7. 使用專案的版面基本元件建立版面\n8. 盡可能使用既有元件實作每個區塊\n9. 對照 Figma 約束驗證響應式行為\n\n**結果：** 符合 Figma 設計、具響應式版面的完整儀表板。\n\n## 最佳實踐\n\n### 永遠從脈絡開始\n\n絕不基於假設來實作。一律先抓取 `get_design_context` 與 `get_screenshot`。\n\n### 漸進式驗證\n\n在實作過程中頻繁驗證，而不只是在最後。這能及早發現問題。\n\n### 記錄偏離之處\n\n如果必須偏離 Figma 設計（例如因為無障礙或技術限制），在程式碼註解中說明原因。\n\n### 重用優於重建\n\n建立新元件之前，一律先檢查既有元件。整個程式碼庫的一致性，比精確複製 Figma 更重要。\n\n### 設計系統優先\n\n拿不定主意時，優先採用專案的設計系統模式，而不是逐字翻譯 Figma。\n\n## 常見問題與解法\n\n### 問題：Figma 輸出被截斷\n\n**原因：** 設計太複雜，或巢狀圖層太多，無法在單一回應中回傳。\n**解法：** 用 `get_metadata` 取得節點結構，再用 `get_design_context` 個別抓取特定節點。\n\n### 問題：實作後設計不相符\n\n**原因：** 實作的程式碼與原始 Figma 設計之間有視覺差異。\n**解法：** 與步驟 3 的截圖並排比較。檢查設計脈絡資料中的間距、色彩與字體排印值。\n\n### 問題：素材無法載入\n\n**原因：** Figma MCP 伺服器的素材端點無法存取，或 URL 被修改了。\n**解法：** 確認 Figma MCP 伺服器的素材端點可以存取。伺服器在 `localhost` URL 提供素材。直接使用，不要修改。\n\n### 問題：設計 token 的值與 Figma 不同\n\n**原因：** 專案設計系統 token 的值與 Figma 設計中指定的不同。\n**解法：** 當專案 token 與 Figma 值不同時，為了一致性優先使用專案 token，但調整間距/尺寸以維持視覺還原度。\n\n## 理解設計實作\n\nFigma 實作工作流程建立了一套把設計轉換成程式碼的可靠流程：\n\n**對設計師：** 有信心實作結果會以像素級的精準度符合他們的設計。\n**對開發者：** 一種消除猜測、減少來回修改的結構化做法。\n**對團隊：** 一致、高品質、能維持設計系統完整性的實作。\n\n遵循這個工作流程，你就能確保每一份 Figma 設計都以同樣的用心與對細節的關注被實作出來。\n\n## 其他資源\n\n- [Figma MCP 伺服器文件](https://developers.figma.com/docs/figma-mcp-server/)\n- [Figma MCP 伺服器工具與提示詞](https://developers.figma.com/docs/figma-mcp-server/tools-and-prompts/)\n- [Figma 變數與設計 Token](https://help.figma.com/hc/en-us/articles/15339657135383-Guide-to-variables-in-Figma)"}, {"rank": 45, "slug": "jupyter-notebook", "title": "Jupyter 筆記本產生器", "category": "文件與辦公", "tags": ["Jupyter", "資料分析", "教學", "Python", "OpenAI Codex"], "summary": "OpenAI Codex 官方技能：建立或重構乾淨、可重現的 Jupyter 筆記本（.ipynb），分為「實驗探索」與「教學導覽」兩種模板，用內附腳本產生骨架，避免手寫 JSON 出錯。", "usage": "- Codex：`$skill-installer jupyter-notebook`\n- 說「幫我建一個比較不同 temperature 效果的實驗筆記本」或「把這支腳本改寫成教學 notebook」\n- 腳本：`python new_notebook.py --kind experiment --title \"...\" --out output/jupyter-notebook/xxx.ipynb`\n- 完成後會盡量從頭到尾執行一次驗證", "sites": ["OpenAI Codex"], "repo": "openai/skills", "path": "skills/.curated/jupyter-notebook/SKILL.md", "github_url": "https://github.com/openai/skills/blob/main/skills/.curated/jupyter-notebook/SKILL.md", "skillssh_url": "", "skillssh_rank": null, "installs": null, "license": "Apache-2.0", "redistributable": true, "description_en": "Use when the user asks to create, scaffold, or edit Jupyter notebooks (`.ipynb`) for experiments, explorations, or tutorials; prefer the bundled templates and run the helper script `new_notebook.py` to generate a clean starting notebook.", "description_zh": "當使用者要求為實驗、探索或教學建立、搭建骨架或編輯 Jupyter 筆記本（`.ipynb`）時使用；優先使用內附模板，並執行輔助腳本 `new_notebook.py` 產生乾淨的起始筆記本。", "original": "---\nname: \"jupyter-notebook\"\ndescription: \"Use when the user asks to create, scaffold, or edit Jupyter notebooks (`.ipynb`) for experiments, explorations, or tutorials; prefer the bundled templates and run the helper script `new_notebook.py` to generate a clean starting notebook.\"\n---\n\n\n# Jupyter Notebook Skill\n\nCreate clean, reproducible Jupyter notebooks for two primary modes:\n\n- Experiments and exploratory analysis\n- Tutorials and teaching-oriented walkthroughs\n\nPrefer the bundled templates and the helper script for consistent structure and fewer JSON mistakes.\n\n## When to use\n- Create a new `.ipynb` notebook from scratch.\n- Convert rough notes or scripts into a structured notebook.\n- Refactor an existing notebook to be more reproducible and skimmable.\n- Build experiments or tutorials that will be read or re-run by other people.\n\n## Decision tree\n- If the request is exploratory, analytical, or hypothesis-driven, choose `experiment`.\n- If the request is instructional, step-by-step, or audience-specific, choose `tutorial`.\n- If editing an existing notebook, treat it as a refactor: preserve intent and improve structure.\n\n## Skill path (set once)\n\n```bash\nexport CODEX_HOME=\"${CODEX_HOME:-$HOME/.codex}\"\nexport JUPYTER_NOTEBOOK_CLI=\"$CODEX_HOME/skills/jupyter-notebook/scripts/new_notebook.py\"\n```\n\nUser-scoped skills install under `$CODEX_HOME/skills` (default: `~/.codex/skills`).\n\n## Workflow\n1. Lock the intent.\nIdentify the notebook kind: `experiment` or `tutorial`.\nCapture the objective, audience, and what \"done\" looks like.\n\n2. Scaffold from the template.\nUse the helper script to avoid hand-authoring raw notebook JSON.\n\n```bash\nuv run --python 3.12 python \"$JUPYTER_NOTEBOOK_CLI\" \\\n  --kind experiment \\\n  --title \"Compare prompt variants\" \\\n  --out output/jupyter-notebook/compare-prompt-variants.ipynb\n```\n\n```bash\nuv run --python 3.12 python \"$JUPYTER_NOTEBOOK_CLI\" \\\n  --kind tutorial \\\n  --title \"Intro to embeddings\" \\\n  --out output/jupyter-notebook/intro-to-embeddings.ipynb\n```\n\n3. Fill the notebook with small, runnable steps.\nKeep each code cell focused on one step.\nAdd short markdown cells that explain the purpose and expected result.\nAvoid large, noisy outputs when a short summary works.\n\n4. Apply the right pattern.\nFor experiments, follow `references/experiment-patterns.md`.\nFor tutorials, follow `references/tutorial-patterns.md`.\n\n5. Edit safely when working with existing notebooks.\nPreserve the notebook structure; avoid reordering cells unless it improves the top-to-bottom story.\nPrefer targeted edits over full rewrites.\nIf you must edit raw JSON, review `references/notebook-structure.md` first.\n\n6. Validate the result.\nRun the notebook top-to-bottom when the environment allows.\nIf execution is not possible, say so explicitly and call out how to validate locally.\nUse the final pass checklist in `references/quality-checklist.md`.\n\n## Templates and helper script\n- Templates live in `assets/experiment-template.ipynb` and `assets/tutorial-template.ipynb`.\n- The helper script loads a template, updates the title cell, and writes a notebook.\n\nScript path:\n- `$JUPYTER_NOTEBOOK_CLI` (installed default: `$CODEX_HOME/skills/jupyter-notebook/scripts/new_notebook.py`)\n\n## Temp and output conventions\n- Use `tmp/jupyter-notebook/` for intermediate files; delete when done.\n- Write final artifacts under `output/jupyter-notebook/` when working in this repo.\n- Use stable, descriptive filenames (for example, `ablation-temperature.ipynb`).\n\n## Dependencies (install only when needed)\nPrefer `uv` for dependency management.\n\nOptional Python packages for local notebook execution:\n\n```bash\nuv pip install jupyterlab ipykernel\n```\n\nThe bundled scaffold script uses only the Python standard library and does not require extra dependencies.\n\n## Environment\nNo required environment variables.\n\n## Reference map\n- `references/experiment-patterns.md`: experiment structure and heuristics.\n- `references/tutorial-patterns.md`: tutorial structure and teaching flow.\n- `references/notebook-structure.md`: notebook JSON shape and safe editing rules.\n- `references/quality-checklist.md`: final validation checklist.\n", "translation": "---\nname: \"jupyter-notebook\"\ndescription: \"當使用者要求為實驗、探索或教學建立、搭建骨架或編輯 Jupyter 筆記本（`.ipynb`）時使用；優先使用內附模板，並執行輔助腳本 `new_notebook.py` 產生乾淨的起始筆記本。\"\n---\n\n\n# Jupyter 筆記本技能\n\n為兩種主要模式建立乾淨、可重現的 Jupyter 筆記本：\n\n- 實驗與探索式分析\n- 教學與以教學為導向的導覽\n\n優先使用內附的模板與輔助腳本，讓結構一致並減少 JSON 錯誤。\n\n## 何時使用\n- 從零建立新的 `.ipynb` 筆記本。\n- 把粗略的筆記或腳本轉換成有結構的筆記本。\n- 重構既有筆記本，使其更可重現、更容易快速瀏覽。\n- 建立會被其他人閱讀或重新執行的實驗或教學。\n\n## 決策樹\n- 如果請求是探索性、分析性或假設驅動的，選擇 `experiment`。\n- 如果請求是教學性、逐步的或針對特定受眾，選擇 `tutorial`。\n- 如果是編輯既有筆記本，就當作重構：保留原意並改善結構。\n\n## 技能路徑（設定一次）\n\n```bash\nexport CODEX_HOME=\"${CODEX_HOME:-$HOME/.codex}\"\nexport JUPYTER_NOTEBOOK_CLI=\"$CODEX_HOME/skills/jupyter-notebook/scripts/new_notebook.py\"\n```\n\n使用者範圍的技能安裝在 `$CODEX_HOME/skills` 之下（預設：`~/.codex/skills`）。\n\n## 工作流程\n1. 鎖定意圖。\n辨識筆記本類型：`experiment` 或 `tutorial`。\n記錄目標、受眾，以及「完成」的樣子。\n\n2. 從模板搭建骨架。\n使用輔助腳本，避免手寫原始的筆記本 JSON。\n\n```bash\nuv run --python 3.12 python \"$JUPYTER_NOTEBOOK_CLI\" \\\n  --kind experiment \\\n  --title \"Compare prompt variants\" \\\n  --out output/jupyter-notebook/compare-prompt-variants.ipynb\n```\n\n```bash\nuv run --python 3.12 python \"$JUPYTER_NOTEBOOK_CLI\" \\\n  --kind tutorial \\\n  --title \"Intro to embeddings\" \\\n  --out output/jupyter-notebook/intro-to-embeddings.ipynb\n```\n\n3. 用小而可執行的步驟填充筆記本。\n每個程式碼儲存格聚焦在一個步驟。\n加入簡短的 markdown 儲存格說明目的與預期結果。\n簡短摘要就夠時，避免冗長、雜亂的輸出。\n\n4. 套用正確的模式。\n實驗請遵循 `references/experiment-patterns.md`。\n教學請遵循 `references/tutorial-patterns.md`。\n\n5. 處理既有筆記本時安全地編輯。\n保留筆記本結構；除非能改善由上到下的敘事，否則避免重新排序儲存格。\n優先做針對性的修改，而非整份重寫。\n如果必須編輯原始 JSON，先閱讀 `references/notebook-structure.md`。\n\n6. 驗證結果。\n環境允許時，從頭到尾執行筆記本。\n如果無法執行，要明確說明，並指出如何在本機驗證。\n使用 `references/quality-checklist.md` 中的最終檢查清單。\n\n## 模板與輔助腳本\n- 模板位於 `assets/experiment-template.ipynb` 與 `assets/tutorial-template.ipynb`。\n- 輔助腳本會載入模板、更新標題儲存格，並寫出筆記本。\n\n腳本路徑：\n- `$JUPYTER_NOTEBOOK_CLI`（安裝後預設：`$CODEX_HOME/skills/jupyter-notebook/scripts/new_notebook.py`）\n\n## 暫存與輸出慣例\n- 中間檔案使用 `tmp/jupyter-notebook/`；完成後刪除。\n- 在這個 repo 中工作時，最終產出物寫在 `output/jupyter-notebook/` 之下。\n- 使用穩定、具描述性的檔名（例如 `ablation-temperature.ipynb`）。\n\n## 相依套件（只在需要時安裝）\n優先使用 `uv` 管理相依套件。\n\n本機執行筆記本的選用 Python 套件：\n\n```bash\nuv pip install jupyterlab ipykernel\n```\n\n內附的骨架腳本只使用 Python 標準函式庫，不需要額外的相依套件。\n\n## 環境\n沒有必要的環境變數。\n\n## 參考對照\n- `references/experiment-patterns.md`：實驗結構與經驗法則。\n- `references/tutorial-patterns.md`：教學結構與教學流程。\n- `references/notebook-structure.md`：筆記本 JSON 形狀與安全編輯規則。\n- `references/quality-checklist.md`：最終驗證檢查清單。"}, {"rank": 46, "slug": "brainstorming", "title": "腦力激盪與設計釐清", "category": "需求與規劃", "tags": ["需求訪談", "設計文件", "蘇格拉底式提問", "Superpowers"], "summary": "任何創造性工作（做新功能、元件、改行為，甚至演講、生意、裝修）動手前必用：先搞清楚你真正想要什麼與為什麼——逐題提問、即時複述確認、列出 2–3 種做法讓你選，寫成設計文件並經你核准後，才進入撰寫實作計畫。", "usage": "- Claude Code：`/plugin marketplace add obra/superpowers-marketplace` 安裝 superpowers\n- 或 `npx skills add https://github.com/obra/superpowers --skill brainstorming`\n- 直接說「我想做一個麵包店的網站」，代理會先問一個最關鍵的問題；不想被問可說「直接開始做」\n- 設計文件存到 `docs/superpowers/specs/`；涉及畫面時可開瀏覽器分頁展示 mockup", "sites": ["Skills.sh", "Awesome Claude"], "repo": "obra/superpowers", "path": "skills/brainstorming/SKILL.md", "github_url": "https://github.com/obra/superpowers/blob/main/skills/brainstorming/SKILL.md", "skillssh_url": "https://skills.sh/obra/superpowers/brainstorming", "skillssh_rank": 193, "installs": 409738, "license": "MIT", "redistributable": true, "description_en": "You MUST use this before any creative work - creating features, building components, adding functionality, modifying behavior, or planning anything new, in software or out of it (a talk, a business, a renovation).", "description_zh": "在任何創造性工作之前你「必須」使用這個——建立功能、打造元件、新增功能性、修改行為，或規劃任何新東西，無論是在軟體之內或之外（一場演講、一門生意、一次裝修）。", "original": "---\nname: brainstorming\ndescription: \"You MUST use this before any creative work - creating features, building components, adding functionality, modifying behavior, or planning anything new, in software or out of it (a talk, a business, a renovation).\"\n---\n\n# Brainstorming\n\nYou are very good at building. You build what you believe your human\npartner wants, and that belief is usually thinner than it feels. This\nskill is for finding out what they actually want, and why, before\nanything gets built.\n\nPeople often haven't finished working out what they want. Good questions\nhelp them think it through. When you understand the why, you make the\nhundred decisions they never mention the way they would have made them.\n\n## First: What Do You Actually Know?\n\nBefore you reply, ask yourself: what do I know about what they want, and\nwhy?\n\n- **Everything that matters is in the request** (\"make the icon cornflower\n  blue\"). This is a quick, clear task. Do it, and say what you did.\n- **Something non-trivial is missing.** Start the conversation.\n\nBefore you start implementing, you must, in order:\n\n1. Lay out the approaches in a message of their own, and have your\n   human partner pick one (see Lay out the approaches).\n2. Write the design doc, short or full (see Size the Work).\n3. Get their approval of that doc.\n4. Invoke the superpowers:writing-plans skill.\n\nTwo things aren't implementing: a spike they said yes to (see Spike to\nfeel things out), and doing what they asked once they've opted out of\nthe questions.\n\n## Look Before You Ask\n\nIn an existing project, or when they've given you context (a spec, a plan,\na handoff, files they pointed at, earlier conversation), dig in before your\nfirst message. Read what they referred to and the code or material it\nconnects to, and keep reading until you can explain how the relevant\nparts work today and what this change would touch. Never ask what the\nproject or their context already answers.\n\n## Your First Message\n\nMove the work forward, with one of these:\n\n- **They've already said what they want** (a spec, a plan, a detailed\n  request): aim for about 200 words for the whole message. Echo their\n  request back in your own words, so they can see whether you've got its\n  shape: what they want, who it's for, and why, as far as they've said.\n  Add what you found that bears on it: how the relevant parts work today\n  and what the change would touch. If you found something they may not\n  have considered that would change what they're asking for or how it\n  has to be built, like a constraint, a conflict, or a cheaper path, say\n  so plainly. How to build it comes later, once you understand what they\n  want (see Lay out the approaches). End with one line inviting\n  corrections, then one question about what they want: the thing their\n  request leaves open whose answer would most change what gets built.\n  Specs are often incomplete, so confirm before you build on one.\n- **They haven't:** one open question, in their own terms, about the\n  biggest thing their request leaves unsettled. Say why you're asking:\n  what the answer would change about what you build. For \"a website for\n  my bakery\": \"If it's mostly for people deciding whether to stop by,\n  I'd lead with hours and what's in the case today; taking orders is a\n  different site. What do you want someone to do when they land on it?\"\n\nHow the message ends depends on whether their message asked for\nbrainstorming:\n\n- **They asked for it** (by name, by invoking it, or by asking for a\n  design discussion): end with your question. They want this\n  conversation.\n- **They didn't:** they may not want a conversation at

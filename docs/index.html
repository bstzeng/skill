敗、訊息鎖定、連線 | [訊息疑難排解](troubleshooting/messaging/README.md) |\n\n---\n\n## 路由\n\n- Container Apps 與 Function Apps 的診斷保留在這個父技能中。\n- 把進行中的 AKS 事件、AKS 專屬的受理、證據蒐集與修復指引導向 [AKS 疑難排解](troubleshooting/aks/aks-troubleshooting.md)。\n- 把 Azure VM 的 RDP/SSH 連線、NSG/防火牆、憑證重設與 VM 代理程式疑難排解導向 [VM 連線疑難排解](troubleshooting/compute/vm-troubleshooting.md)。\n- 把 Azure 訊息 SDK 疑難排解（Event Hubs、Service Bus）導向 [訊息疑難排解](troubleshooting/messaging/README.md)。\n\n---\n\n## 快速參考\n\n### 常用診斷指令\n\n```bash\n# Check resource health\naz resource show --ids RESOURCE_ID\n# View activity log\naz monitor activity-log list -g RG --max-events 20\n# Container Apps logs\naz containerapp logs show --name APP -g RG --follow\n# Function App logs (query App Insights traces)\naz monitor app-insights query --apps APP-INSIGHTS -g RG \\\n  --analytics-query \"traces | where timestamp > ago(1h) | order by timestamp desc | take 50\"\n```\n\n### AppLens（MCP 工具）\n\n進行 AI 驅動的診斷時使用：\n```\nmcp_azure_mcp_applens\n  intent: \"diagnose issues with <resource-name>\"\n  command: \"diagnose\"\n  parameters:\n    resourceId: \"<resource-id>\"\n\nProvides:\n- Automated issue detection\n- Root cause analysis\n- Remediation recommendations\n```\n\n### Azure Monitor（MCP 工具）\n\n查詢日誌與指標：\n```\nmcp_azure_mcp_monitor\n  intent: \"query logs for <resource-name>\"\n  command: \"logs_query\"\n  parameters:\n    workspaceId: \"<workspace-id>\"\n    query: \"<KQL-query>\"\n```\n\n常用的診斷查詢請見 [kql-queries.md](references/kql-queries.md)。\n\n---\n\n## 檢查 Azure 資源健康狀態\n\n### 使用 MCP\n\n```\nmcp_azure_mcp_resourcehealth\n  intent: \"check health status of <resource-name>\"\n  command: \"get\"\n  parameters:\n    resourceId: \"<resource-id>\"\n```\n\n### 使用 CLI\n\n```bash\n# Check specific resource health\naz resource show --ids RESOURCE_ID\n\n# Check recent activity\naz monitor activity-log list -g RG --max-events 20\n```\n\n---\n\n## 參考資料\n\n- [KQL 查詢庫](references/kql-queries.md)\n- [Azure Resource Graph 查詢](references/azure-resource-graph.md)\n- [App Service 疑難排解](references/app-service/README.md)\n- [Function Apps 疑難排解](references/functions/README.md)\n- [VM 連線疑難排解](troubleshooting/compute/vm-troubleshooting.md)\n- [訊息疑難排解](troubleshooting/messaging/README.md)"}, {"rank": 32, "slug": "skill-creator", "title": "技能製作器", "category": "技能管理", "tags": ["建立 Skill", "評估測試", "Benchmark", "描述優化", "Anthropic 官方"], "summary": "Anthropic 官方技能：從零建立新 skill、修改改進既有 skill，並量化評估其表現。完整循環：釐清意圖 → 撰寫 SKILL.md 草稿 → 設計測試提示 → 平行跑「有 skill / 無 skill」對照 → 用瀏覽器檢視器讓你審閱並給回饋 → 改寫 → 重複；最後還能自動優化 description 提升觸發準確率並打包成 .skill 檔。", "usage": "- 安裝：`npx skills add https://github.com/anthropics/skills --skill skill-creator`，或 Claude Code `/plugin marketplace add anthropics/skills`\n- 說「幫我把剛剛這套流程做成一個 skill」「我想做一個自動寫週報的 skill」「幫我優化這個 skill 的 description」\n- 測試結果放在 `<skill名>-workspace/iteration-N/`，用 `eval-viewer/generate_review.py` 開啟審閱介面\n- 在 Claude.ai 上沒有子代理，會改為逐一手動測試、在對話中直接請你回饋", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/skill-creator/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/skill-creator", "skillssh_rank": 184, "installs": 418037, "license": "Apache-2.0", "redistributable": true, "description_en": "Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.", "description_zh": "建立新技能、修改與改進既有技能，並衡量技能表現。當使用者想從零建立技能、編輯或優化既有技能、執行評估來測試技能、以變異數分析評測技能表現，或優化技能的描述以提升觸發準確率時使用。", "original": "---\nname: skill-creator\ndescription: Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.\n---\n\n# Skill Creator\n\nA skill for creating new skills and iteratively improving them.\n\nAt a high level, the process of creating a skill goes like this:\n\n- Decide what you want the skill to do and roughly how it should do it\n- Write a draft of the skill\n- Create a few test prompts and run claude-with-access-to-the-skill on them\n- Help the user evaluate the results both qualitatively and quantitatively\n  - While the runs happen in the background, draft some quantitative evals if there aren't any (if there are some, you can either use as is or modify if you feel something needs to change about them). Then explain them to the user (or if they already existed, explain the ones that already exist)\n  - Use the `eval-viewer/generate_review.py` script to show the user the results for them to look at, and also let them look at the quantitative metrics\n- Rewrite the skill based on feedback from the user's evaluation of the results (and also if there are any glaring flaws that become apparent from the quantitative benchmarks)\n- Repeat until you're satisfied\n- Expand the test set and try again at larger scale\n\nYour job when using this skill is to figure out where the user is in this process and then jump in and help them progress through these stages. So for instance, maybe they're like \"I want to make a skill for X\". You can help narrow down what they mean, write a draft, write the test cases, figure out how they want to evaluate, run all the prompts, and repeat.\n\nOn the other hand, maybe they already have a draft of the skill. In this case you can go straight to the eval/iterate part of the loop.\n\nOf course, you should always be flexible and if the user is like \"I don't need to run a bunch of evaluations, just vibe with me\", you can do that instead.\n\nThen after the skill is done (but again, the order is flexible), you can also run the skill description improver, which we have a whole separate script for, to optimize the triggering of the skill.\n\nCool? Cool.\n\n## Communicating with the user\n\nThe skill creator is liable to be used by people across a wide range of familiarity with coding jargon. If you haven't heard (and how could you, it's only very recently that it started), there's a trend now where the power of Claude is inspiring plumbers to open up their terminals, parents and grandparents to google \"how to install npm\". On the other hand, the bulk of users are probably fairly computer-literate.\n\nSo please pay attention to context cues to understand how to phrase your communication! In the default case, just to give you some idea:\n\n- \"evaluation\" and \"benchmark\" are borderline, but OK\n- for \"JSON\" and \"assertion\" you want to see serious cues from the user that they know what those things are before using them without explaining them\n\nIt's OK to briefly explain terms if you're in doubt, and feel free to clarify terms with a short definition if you're unsure if the user will get it.\n\n---\n\n## Creating a skill\n\n### Capture Intent\n\nStart by understanding the user's intent. The current conversation might already contain a workflow the user wants to capture (e.g., they say \"turn this into a skill\"). If so, extract answers from the conversation history first — the tools used, the sequence of steps, corrections the user made, input/output formats observed. The user may need to fill the gaps, and should confirm before proceeding to the next step.\n\n1. What should this skill enable Claude to do?\n2. When should this skill trigger? (what user phrases/contexts)\n3. What's the expected output format?\n4. Should we set up test cases to verify the skill works? Skills with objectively verifiable outputs (file transforms, data extraction, code generation, fixed workflow steps) benefit from test cases. Skills with subjective outputs (writing style, art) often don't need them. Suggest the appropriate default based on the skill type, but let the user decide.\n\n### Interview and Research\n\nProactively ask questions about edge cases, input/output formats, example files, success criteria, and dependencies. Wait to write test prompts until you've got this part ironed out.\n\nCheck available MCPs - if useful for research (searching docs, finding similar skills, looking up best practices), research in parallel via subagents if available, otherwise inline. Come prepared with context to reduce burden on the user.\n\n### Write the SKILL.md\n\nBased on the user interview, fill in these components:\n\n- **name**: Skill identifier\n- **description**: When to trigger, what it does. This is the primary triggering mechanism - include both what the skill does AND specific contexts for when to use it. All \"when to use\" info goes here, not in the body. Note: currently Claude has a tendency to \"undertrigger\" skills -- to not use them when they'd be useful. To combat this, please make the skill descriptions a little bit \"pushy\". So for instance, instead of \"How to build a simple fast dashboard to display internal Anthropic data.\", you might write \"How to build a simple fast dashboard to display internal Anthropic data. Make sure to use this skill whenever the user mentions dashboards, data visualization, internal metrics, or wants to display any kind of company data, even if they don't explicitly ask for a 'dashboard.'\"\n- **compatibility**: Required tools, dependencies (optional, rarely needed)\n- **the rest of the skill :)**\n\n### Skill Writing Guide\n\n#### Anatomy of a Skill\n\n```\nskill-name/\n├── SKILL.md (required)\n│   ├── YAML frontmatter (name, description required)\n│   └── Markdown instructions\n└── Bundled Resources (optional)\n    ├── scripts/    - Executable code for deterministic/repetitive tasks\n    ├── references/ - Docs loaded into context as needed\n    └── assets/     - Files used in output (templates, icons, fonts)\n```\n\n#### Progressive Disclosure\n\nSkills use a three-level loading system:\n1. **Metadata** (name + description) - Always in context (~100 words)\n2. **SKILL.md body** - In context whenever skill triggers (<500 lines ideal)\n3. **Bundled resources** - As needed (unlimited, scripts can execute without loading)\n\nThese word counts are approximate and you can feel free to go longer if needed.\n\n**Key patterns:**\n- Keep SKILL.md under 500 lines; if you're approaching this limit, add an additional layer of hierarchy along with clear pointers about where the model using the skill should go next to follow up.\n- Reference files clearly from SKILL.md with guidance on when to read them\n- For large reference files (>300 lines), include a table of contents\n\n**Domain organization**: When a skill supports multiple domains/frameworks, organize by variant:\n```\ncloud-deploy/\n├── SKILL.md (workflow + selection)\n└── references/\n    ├── aws.md\n    ├── gcp.md\n    └── azure.md\n```\nClaude reads only the relevant reference file.\n\n#### Principle of Lack of Surprise\n\nThis goes without saying, but skills must not contain malware, exploit code, or any content that could compromise system security. A skill's contents should not surprise the user in their intent if described. Don't go along with requests to create misleading skills or skills designed to facilitate unauthorized access, data exfiltration, or other malicious activities. Things like a \"roleplay as an XYZ\" are OK though.\n\n#### Writing Patterns\n\nPrefer using the imperative form in instructions.\n\n**Defining output formats** - You can do it like this:\n```markdown\n## Report structure\nALWAYS use this exact template:\n# [Title]\n## Executive summary\n## Key findings\n## Recommendations\n```\n\n**Examples pattern** - It's useful to include examples. You can format them like this (but if \"Input\" and \"Output\" are in the examples you might want to deviate a little):\n```markdown\n## Commit message format\n**Example 1:**\nInput: Added user authentication with JWT tokens\nOutput: feat(auth): implement JWT-based authentication\n```\n\n### Writing Style\n\nTry to explain to the model why things are important in lieu of heavy-handed musty MUSTs. Use theory of mind and try to make the skill general and not super-narrow to specific examples. Start by writing a draft and then look at it with fresh eyes and improve it.\n\n### Test Cases\n\nAfter writing the skill draft, come up with 2-3 realistic test prompts — the kind of thing a real user would actually say. Share them with the user: [you don't have to use this exact language] \"Here are a few test cases I'd like to try. Do these look right, or do you want to add more?\" Then run them.\n\nSave test cases to `evals/evals.json`. Don't write assertions yet — just the prompts. You'll draft assertions in the next step while the runs are in progress.\n\n```json\n{\n  \"skill_name\": \"example-skill\",\n  \"evals\": [\n    {\n      \"id\": 1,\n      \"prompt\": \"User's task prompt\",\n      \"expected_output\": \"Description of expected result\",\n      \"files\": []\n    }\n  ]\n}\n```\n\nSee `references/schemas.md` for the full schema (including the `assertions` field, which you'll add later).\n\n## Running and evaluating test cases\n\nThis section is one continuous sequence — don't stop partway through. Do NOT use `/skill-test` or any other testing skill.\n\nPut results in `<skill-name>-workspace/` as a sibling to the skill directory. Within the workspace, organize results by iteration (`iteration-1/`, `iteration-2/`, etc.) and within that, each test case gets a directory (`eval-0/`, `eval-1/`, etc.). Don't create all of this upfront — just create directories as you go.\n\n### Step 1: Spawn all runs (with-skill AND baseline) in the same turn\n\nFor each test case, spawn two subagents in the same turn — one with the skill, one without. This is important: don't spawn the with-skill runs first and then come back for baselines later. Launch everything at once so it all finishes around the same time.\n\n**With-skill run:**\n\n```\nExecute this task:\n- Skill path: <path-to-skill>\n- Task: <eval prompt>\n- Input files: <eval files if any, or \"none\">\n- Save outputs to: <workspace>/iteration-<N>/eval-<ID>/with_skill/outputs/\n- Outputs to save: <what the user cares about — e.g., \"the .docx file\", \"the final CSV\">\n```\n\n**Baseline run** (same prompt, but the baseline depends on context):\n- **Creating a new skill**: no skill at all. Same prompt, no skill path, save to `without_skill/outputs/`.\n- **Improving an existing skill**: the old version. Before editing, snapshot the skill (`cp -r <skill-path> <workspace>/skill-snapshot/`), then point the baseline subagent at the snapshot. Save to `old_skill/outputs/`.\n\nWrite an `eval_metadata.json` for each test case (assertions can be empty for now). Give each eval a descriptive name based on what it's testing — not just \"eval-0\". Use this name for the directory too. If this iteration uses new or modified eval prompts, create these files for each new eval directory — don't assume they carry over from previous iterations.\n\n```json\n{\n  \"eval_id\": 0,\n  \"eval_name\": \"descriptive-name-here\",\n  \"prompt\": \"The user's task prompt\",\n  \"assertions\": []\n}\n```\n\n### Step 2: While runs are in progress, draft assertions\n\nDon't just wait for the runs to finish — you can use this time productively. Draft quantitative assertions for each test case and explain them to the user. If assertions already exist in `evals/evals.json`, review them and explain what they check.\n\nGood assertions are objectively verifiable and have descriptive names — they should read clearly in the benchmark viewer so someone glancing at the results immediately understands what each one checks. Subjective skills (writing style, design quality) are better evaluated qualitatively — don't force assertions onto things that need human judgment.\n\nUpdate the `eval_metadata.json` files and `evals/evals.json` with the assertions once drafted. Also explain to the user what they'll see in the viewer — both the qualitative outputs and the quantitative benchmark.\n\n### Step 3: As runs complete, capture timing data\n\nWhen each subagent task completes, you receive a notification containing `total_tokens` and `duration_ms`. Save this data immediately to `timing.json` in the run directory:\n\n```json\n{\n  \"total_tokens\": 84852,\n  \"duration_ms\": 23332,\n  \"total_duration_seconds\": 23.3\n}\n```\n\nThis is the only opportunity to capture this data — it comes through the task notification and isn't persisted elsewhere. Process each notification as it arrives rather than trying to batch them.\n\n### Step 4: Grade, aggregate, and launch the viewer\n\nOnce all runs are done:\n\n1. **Grade each run** — spawn a grader subagent (or grade inline) that reads `agents/grader.md` and evaluates each assertion against the outputs. Save results to `grading.json` in each run directory. The grading.json expectations array must use the fields `text`, `passed`, and `evidence` (not `name`/`met`/`details` or other variants) — the viewer depends on these exact field names. For assertions that can be checked programmatically, write and run a script rather than eyeballing it — scripts are faster, more reliable, and can be reused across iterations.\n\n2. **Aggregate into benchmark** — run the aggregation script from the skill-creator directory:\n   ```bash\n   python -m scripts.aggregate_benchmark <workspace>/iteration-N --skill-name <name>\n   ```\n   This produces `benchmark.json` and `benchmark.md` with pass_rate, time, and tokens for each configuration, with mean ± stddev and the delta. If generating benchmark.json manually, see `references/schemas.md` for the exact schema the viewer expects.\nPut each with_skill version before its baseline counterpart.\n\n3. **Do an analyst pass** — read the benchmark data and surface patterns the aggregate stats might hide. See `agents/analyzer.md` (the \"Analyzing Benchmark Results\" section) for what to look for — things like assertions that always pass regardless of skill (non-discriminating), high-variance evals (possibly flaky), and time/token tradeoffs.\n\n4. **Launch the viewer** with both qualitative outputs and quantitative data:\n   ```bash\n   nohup python <skill-creator-path>/eval-viewer/generate_review.py \\\n     <workspace>/iteration-N \\\n     --skill-name \"my-skill\" \\\n     --benchmark <workspace>/iteration-N/benchmark.json \\\n     > /dev/null 2>&1 &\n   VIEWER_PID=$!\n   ```\n   For iteration 2+, also pass `--previous-workspace <workspace>/iteration-<N-1>`.\n\n   **Cowork / headless environments:** If `webbrowser.open()` is not available or the environment has no display, use `--static <output_path>` to write a standalone HTML file instead of starting a server. Feedback will be downloaded as a `feedback.json` file when the user clicks \"Submit All Reviews\". After download, copy `feedback.json` into the workspace directory for the next iteration to pick up.\n\nNote: please use generate_review.py to create the viewer; there's no need to write custom HTML.\n\n5. **Tell the user** something like: \"I've opened the results in your browser. There are two tabs — 'Outputs' lets you click through each test case and leave feedback, 'Benchmark' shows the quantitative comparison. When you're done, come back here and let me know.\"\n\n### What the user sees in the viewer\n\nThe \"Outputs\" tab shows one test case at a time:\n- **Prompt**: the task that was given\n- **Output**: the files the skill produced, rendered inline where possible\n- **Previous Output** (iteration 2+): collapsed section showing last iteration's output\n- **Formal Grades** (if grading was run): collapsed section showing assertion pass/fail\n- **Feedback**: a textbox that auto-saves as they type\n- **Previous Feedback** (iteration 2+): their comments from last time, shown below the textbox\n\nThe \"Benchmark\" tab shows the stats summary: pass rates, timing, and token usage for each configuration, with per-eval breakdowns and analyst observations.\n\nNavigation is via prev/next buttons or arrow keys. When done, they click \"Submit All Reviews\" which saves all feedback to `feedback.json`.\n\n### Step 5: Read the feedback\n\nWhen the user tells you they're done, read `feedback.json`:\n\n```json\n{\n  \"reviews\": [\n    {\"run_id\": \"eval-0-with_skill\", \"feedback\": \"the chart is missing axis labels\", \"timestamp\": \"...\"},\n    {\"run_id\": \"eval-1-with_skill\", \"feedback\": \"\", \"timestamp\": \"...\"},\n    {\"run_id\": \"eval-2-with_skill\", \"feedback\": \"perfect, love this\", \"timestamp\": \"...\"}\n  ],\n  \"status\": \"complete\"\n}\n```\n\nEmpty feedback means the user thought it was fine. Focus your improvements on the test cases where the user had specific complaints.\n\nKill the viewer server when you're done with it:\n\n```bash\nkill $VIEWER_PID 2>/dev/null\n```\n\n---\n\n## Improving the skill\n\nThis is the heart of the loop. You've run the test cases, the user has reviewed the results, and now you need to make the skill better based on their feedback.\n\n### How to think about improvements\n\n1. **Generalize from the feedback.** The big picture thing that's happening here is that we're trying to create skills that can be used a million times (maybe literally, maybe even more who knows) across many different prompts. Here you and the user are iterating on only a few examples over and over again because it helps move faster. The user knows these examples in and out and it's quick for them to assess new outputs. But if the skill you and the user are codeveloping works only for those examples, it's useless. Rather than put in fiddly overfitty changes, or oppressively constrictive MUSTs, if there's some stubborn issue, you might try branching out and using different metaphors, or recommending different patterns of working. It's relatively cheap to try and maybe you'll land on something great.\n\n2. **Keep the prompt lean.** Remove things that aren't pulling their weight. Make sure to read the transcripts, not just the final outputs — if it looks like the skill is making the model waste a bunch of time doing things that are unproductive, you can try getting rid of the parts of the skill that are making it do that and seeing what happens.\n\n3. **Explain the why.** Try hard to explain the **why** behind everything you're asking the model to do. Today's LLMs are *smart*. They have good theory of mind and when given a good harness can go beyond rote instructions and really make things happen. Even if the feedback from the user is terse or frustrated, try to actually understand the task and why the user is writing what they wrote, and what they actually wrote, and then transmit this understanding into the instructions. If you find yourself writing ALWAYS or NEVER in all caps, or using super rigid structures, that's a yellow flag — if possible, reframe and explain the reasoning so that the model understands why the thing you're asking for is important. That's a more humane, powerful, and effective approach.\n\n4. **Look for repeated work across test cases.** Read the transcripts from the test runs and notice if the subagents all independently wrote similar helper scripts or took the same multi-step approach to something. If all 3 test cases resulted in the subagent writing a `create_docx.py` or a `build_chart.py`, that's a strong signal the skill should bundle that script. Write it once, put it in `scripts/`, and tell the skill to use it. This saves every future invocation from reinventing the wheel.\n\nThis task is pretty important (we are trying to create billions a year in economic value here!) and your thinking time is not the blocker; take your time and really mull things over. I'd suggest writing a draft revision and then looking at it anew and making improvements. Really do your best to get into the head of the user and understand what they want and need.\n\n### The iteration loop\n\nAfter improving the skill:\n\n1. Apply your improvements to the skill\n2. Rerun all test cases into a new `iteration-<N+1>/` directory, including baseline runs. If you're creating a new skill, the baseline is always `without_skill` (no skill) — that stays the same across iterations. If you're improving an existing skill, use your judgment on what makes sense as the baseline: the original version the user came in with, or the previous iteration.\n3. Launch the reviewer with `--previous-workspace` pointing at the previous iteration\n4. Wait for the user to review and tell you they're done\n5. Read the new feedback, improve again, repeat\n\nKeep going until:\n- The user says they're happy\n- The feedback is all empty (everything looks good)\n- You're not making meaningful progress\n\n---\n\n## Advanced: Blind comparison\n\nFor situations where you want a more rigorous comparison between two versions of a skill (e.g., the user asks \"is the new version actually better?\"), there's a blind comparison system. Read `agents/comparator.md` and `agents/analyzer.md` for the details. The basic idea is: give two outputs to an independent agent without telling it which is which, and let it judge quality. Then analyze why the winner won.\n\nThis is optional, requires subagents, and most users won't need it. The human review loop is usually sufficient.\n\n---\n\n## Description Optimization\n\nThe description field in SKILL.md frontmatter is the primary mechanism that determines whether Claude invokes a skill. After creating or improving a skill, offer to optimize the description for better triggering accuracy.\n\n### Step 1: Generate trigger eval queries\n\nCreate 20 eval queries — a mix of should-trigger and should-not-trigger. Save as JSON:\n\n```json\n[\n  {\"query\": \"the user prompt\", \"should_trigger\": true},\n  {\"query\": \"another prompt\", \"should_trigger\": false}\n]\n```\n\nThe queries must be realistic and something a Claude Code or Claude.ai user would actually type. Not abstract requests, but requests that are concrete and specific and have a good amount of detail. For instance, file paths, personal context about the user's job or situation, column names and values, company names, URLs. A little bit of backstory. Some might be in lowercase or contain abbreviations or typos or casual speech. Use a mix of different lengths, and focus on edge cases rather than making them clear-cut (the user will get a chance to sign off on them).\n\nBad: `\"Format this data\"`, `\"Extract text from PDF\"`, `\"Create a chart\"`\n\nGood: `\"ok so my boss just sent me this xlsx file (its in my downloads, called something like 'Q4 sales final FINAL v2.xlsx') and she wants me to add a column that shows the profit margin as a percentage. The revenue is in column C and costs are in column D i think\"`\n\nFor the **should-trigger** queries (8-10), think about coverage. You want different phrasings of the same intent — some formal, some casual. Include cases where the user doesn't explicitly name the skill or file type but clearly needs it. Throw in some uncommon use cases and cases where this skill competes with another but should win.\n\nFor the **should-not-trigger** queries (8-10), the most valuable ones are the near-misses — queries that share keywords or concepts with the skill but actually need something different. Think adjacent domains, ambiguous phrasing where a naive keyword match would trigger but shouldn't, and cases where the query touches on something the skill does but in a context where another tool is more appropriate.\n\nThe key thing to avoid: don't make should-not-trigger queries obviously irrelevant. \"Write a fibonacci function\" as a negative test for a PDF skill is too easy — it doesn't test anything. The negative cases should be genuinely tricky.\n\n### Step 2: Review with user\n\nPresent the eval set to the user for review using the HTML template:\n\n1. Read the template from `assets/eval_review.html`\n2. Replace the placeholders:\n   - `__EVAL_DATA_PLACEHOLDER__` → the JSON array of eval items (no quotes around it — it's a JS variable assignment)\n   - `__SKILL_NAME_PLACEHOLDER__` → the skill's name\n   - `__SKILL_DESCRIPTION_PLACEHOLDER__` → the skill's current description\n3. Write to a temp file (e.g., `/tmp/eval_review_<skill-name>.html`) and open it: `open /tmp/eval_review_<skill-name>.html`\n4. The user can edit queries, toggle should-trigger, add/remove entries, then click \"Export Eval Set\"\n5. The file downloads to `~/Downloads/eval_set.json` — check the Downloads folder for the most recent version in case there are multiple (e.g., `eval_set (1).json`)\n\nThis step matters — bad eval queries lead to bad descriptions.\n\n### Step 3: Run the optimization loop\n\nTell the user: \"This will take some time — I'll run the optimization loop in the background and check on it periodically.\"\n\nSave the eval set to the workspace, then run in the background:\n\n```bash\npython -m scripts.run_loop \\\n  --eval-set <path-to-trigger-eval.json> \\\n  --skill-path <path-to-skill> \\\n  --model <model-id-powering-this-session> \\\n  --max-iterations 5 \\\n  --verbose\n```\n\nUse the model ID from your system prompt (the one powering the current session) so the triggering test matches what the user actually experiences.\n\nWhile it runs, periodically tail the output to give the user updates on which iteration it's on and what the scores look like.\n\nThis handles the full optimization loop automatically. It splits the eval set into 60% train and 40% held-out test, evaluates the current description (running each query 3 times to get a reliable trigger rate), then calls Claude to propose improvements based on what failed. It re-evaluates each new description on both train and test, iterating up to 5 times. When it's done, it opens an HTML report in the browser showing the results per iteration and returns JSON with `best_description` — selected by test score rather than train score to avoid overfitting.\n\n### How skill triggering works\n\nUnderstanding the triggering mechanism helps design better eval queries. Skills appear in Claude's `available_skills` list with their name + description, and Claude decides whether to consult a skill based on that description. The important thing to know is that Claude only consults skills for tasks it can't easily handle on its own — simple, one-step queries like \"read this PDF\" may not trigger a skill even if the description matches perfectly, because Claude can handle them directly with basic tools. Complex, multi-step, or specialized queries reliably trigger skills when the description matches.\n\nThis means your eval queries should be substantive enough that Claude would actually benefit from consulting a skill. Simple queries like \"read file X\" are poor test cases — they won't trigger skills regardless of description quality.\n\n### Step 4: Apply the result\n\nTake `best_description` from the JSON output and update the skill's SKILL.md frontmatter. Show the user before/after and report the scores.\n\n---\n\n### Package and Present (only if `present_files` tool is available)\n\nCheck whether you have access to the `present_files` tool. If you don't, skip this step. If you do, package the skill and present the .skill file to the user:\n\n```bash\npython -m scripts.package_skill <path/to/skill-folder>\n```\n\nAfter packaging, direct the user to the resulting `.skill` file path so they can install it.\n\n---\n\n## Claude.ai-specific instructions\n\nIn Claude.ai, the core workflow is the same (draft → test → review → improve → repeat), but because Claude.ai doesn't have subagents, some mechanics change. Here's what to adapt:\n\n**Running test cases**: No subagents means no parallel execution. For each test case, read the skill's SKILL.md, then follow its instructions to accomplish the test prompt yourself. Do them one at a time. This is less rigorous than independent subagents (you wrote the skill and you're also running it, so you have full context), but it's a useful sanity check — and the human review step compensates. Skip the baseline runs — just use the skill to complete the task as requested.\n\n**Reviewing results**: If you can't open a browser (e.g., Claude.ai's VM has no display, or you're on a remote server), skip the browser reviewer entirely. Instead, present results directly in the conversation. For each test case, show the prompt and the output. If the output is a file the user needs to see (like a .docx or .xlsx), save it to the filesystem and tell them where it is so they can download and inspect it. Ask for feedback inline: \"How does this look? Anything you'd change?\"\n\n**Benchmarking**: Skip the quantitative benchmarking — it relies on baseline comparisons which aren't meaningful without subagents. Focus on qualitative feedback from the user.\n\n**The iteration loop**: Same as before — improve the skill, rerun the test cases, ask for feedback — just without the browser reviewer in the middle. You can still organize results into iteration directories on the filesystem if you have one.\n\n**Description optimization**: This section requires the `claude` CLI tool (specifically `claude -p`) which is only available in Claude Code. Skip it if you're on Claude.ai.\n\n**Blind comparison**: Requires subagents. Skip it.\n\n**Packaging**: The `package_skill.py` script works anywhere with Python and a filesystem. On Claude.ai, you can run it and the user can download the resulting `.skill` file.\n\n**Updating an existing skill**: The user might be asking you to update an existing skill, not create a new one. In this case:\n- **Preserve the original name.** Note the skill's directory name and `name` frontmatter field -- use them unchanged. E.g., if the installed skill is `research-helper`, output `research-helper.skill` (not `research-helper-v2`).\n- **Copy to a writeable location before editing.** The installed skill path may be read-only. Copy to `/tmp/skill-name/`, edit there, and package from the copy.\n- **If packaging manually, stage in `/tmp/` first**, then copy to the output directory -- direct writes may fail due to permissions.\n\n---\n\n## Cowork-Specific Instructions\n\nIf you're in Cowork, the main things to know are:\n\n- You have subagents, so the main workflow (spawn test cases in parallel, run baselines, grade, etc.) all works. (However, if you run into severe problems with timeouts, it's OK to run the test prompts in series rather than parallel.)\n- You don't have a browser or display, so when generating the eval viewer, use `--static <output_path>` to write a standalone HTML file instead of starting a server. Then proffer a link that the user can click to open the HTML in their browser.\n- For whatever reason, the Cowork setup seems to disincline Claude from generating the eval viewer after running the tests, so just to reiterate: whether you're in Cowork or in Claude Code, after running tests, you should always generate the eval viewer for the human to look at examples before revising the skill yourself and trying to make corrections, using `generate_review.py` (not writing your own boutique html code). Sorry in advance but I'm gonna go all caps here: GENERATE THE EVAL VIEWER *BEFORE* evaluating inputs yourself. You want to get them in front of the human ASAP!\n- Feedback works differently: since there's no running server, the viewer's \"Submit All Reviews\" button will download `feedback.json` as a file. You can then read it from there (you may have to request access first).\n- Packaging works — `package_skill.py` just needs Python and a filesystem.\n- Description optimization (`run_loop.py` / `run_eval.py`) should work in Cowork just fine since it uses `claude -p` via subprocess, not a browser, but please save it until you've fully finished making the skill and the user agrees it's in good shape.\n- **Updating an existing skill**: The user might be asking you to update an existing skill, not create a new one. Follow the update guidance in the claude.ai section above.\n\n---\n\n## Reference files\n\nThe agents/ directory contains instructions for specialized subagents. Read them when you need to spawn the relevant subagent.\n\n- `agents/grader.md` — How to evaluate assertions against outputs\n- `agents/comparator.md` — How to do blind A/B comparison between two outputs\n- `agents/analyzer.md` — How to analyze why one version beat another\n\nThe references/ directory has additional documentation:\n- `references/schemas.md` — JSON structures for evals.json, grading.json, etc.\n\n---\n\nRepeating one more time the core loop here for emphasis:\n\n- Figure out what the skill is about\n- Draft or edit the skill\n- Run claude-with-access-to-the-skill on test prompts\n- With the user, evaluate the outputs:\n  - Create benchmark.json and run `eval-viewer/generate_review.py` to help the user review them\n  - Run quantitative evals\n- Repeat until you and the user are satisfied\n- Package the final skill and return it to the user.\n\nPlease add steps to your TodoList, if you have such a thing, to make sure you don't forget. If you're in Cowork, please specifically put \"Create evals JSON and run `eval-viewer/generate_review.py` so human can review test cases\" in your TodoList to make sure it happens.\n\nGood luck!\n", "translation": "---\nname: skill-creator\ndescription: 建立新技能、修改與改進既有技能，並衡量技能表現。當使用者想從零建立技能、編輯或優化既有技能、執行評估來測試技能、以變異數分析評測技能表現，或優化技能的描述以提升觸發準確率時使用。\n---\n\n# 技能製作器（Skill Creator）\n\n一個用來建立新技能、並反覆改進它們的技能。\n\n從高層來看，建立技能的流程是這樣的：\n\n- 決定你想讓技能做什麼，以及大致上要怎麼做\n- 撰寫技能的草稿\n- 設計幾個測試提示，並在其上執行「可使用該技能的 Claude」\n- 協助使用者以定性與定量方式評估結果\n  - 在執行於背景進行的同時，如果還沒有定量評估就先草擬一些（如果已經有，你可以照用，或在你覺得需要時修改）。然後向使用者解釋它們（如果原本就有，就解釋現有的那些）\n  - 使用 `eval-viewer/generate_review.py` 腳本把結果呈現給使用者看，也讓他們查看定量指標\n- 根據使用者對結果的評估回饋改寫技能（以及若定量評測中出現任何明顯缺陷時）\n- 重複直到滿意為止\n- 擴大測試集，以更大規模再試一次\n\n使用本技能時，你的工作是判斷使用者處在這個流程的哪個位置，然後介入協助他們推進各階段。例如，他們可能會說「我想做一個做 X 的技能」。你可以幫忙縮小他們的意思、撰寫草稿、撰寫測試案例、了解他們想怎麼評估、執行所有提示，然後重複。\n\n另一方面，他們可能已經有技能的草稿了。這種情況下，你可以直接進入循環中的評估/迭代部分。\n\n當然，你應該永遠保持彈性，如果使用者說「我不需要跑一堆評估，就跟著感覺走吧」，你也可以照做。\n\n然後在技能完成之後（但順序同樣是有彈性的），你還可以執行技能描述改進器——我們有一個獨立的腳本專門做這件事——來優化技能的觸發。\n\n懂了嗎？懂了。\n\n## 與使用者溝通\n\n使用技能製作器的人，對程式術語的熟悉程度差異很大。如果你還沒聽說（你怎麼可能聽說，這是最近才開始的），現在有一股趨勢：Claude 的能力正激勵水電工打開他們的終端機，父母和祖父母上網搜尋「如何安裝 npm」。另一方面，大部分使用者可能都相當熟悉電腦。\n\n所以請留意脈絡線索，了解該如何措辭！在預設情況下，給你一點概念：\n\n- 「評估（evaluation）」與「評測（benchmark）」處於邊緣，但還可以\n- 對於「JSON」與「斷言（assertion）」，在未加解釋就使用之前，你需要看到使用者明確知道這些是什麼的線索\n\n如果有疑慮，簡短解釋術語是可以的；如果你不確定使用者是否懂，可以隨時附上簡短的定義來說明術語。\n\n---\n\n## 建立技能\n\n### 捕捉意圖\n\n從理解使用者的意圖開始。目前的對話可能已經包含使用者想要捕捉的工作流程（例如他們說「把這個變成一個技能」）。如果是這樣，先從對話歷史中擷取答案——使用的工具、步驟順序、使用者做過的修正、觀察到的輸入/輸出格式。使用者可能需要補足缺口，並應在進入下一步之前確認。\n\n1. 這個技能應該讓 Claude 能做什麼？\n2. 這個技能應該在什麼時候觸發？（使用者的哪些說法/情境）\n3. 預期的輸出格式是什麼？\n4. 我們應該建立測試案例來驗證技能有效嗎？輸出可客觀驗證的技能（檔案轉換、資料擷取、程式碼生成、固定的工作流程步驟）能從測試案例中受益。輸出主觀的技能（寫作風格、藝術）通常不需要。依技能類型建議適當的預設做法，但讓使用者決定。\n\n### 訪談與研究\n\n主動詢問關於邊界情況、輸入/輸出格式、範例檔案、成功標準與相依項目的問題。在這部分釐清之前，先不要撰寫測試提示。\n\n檢查可用的 MCP——如果對研究有用（搜尋文件、尋找類似技能、查詢最佳實踐），在有子代理時透過子代理平行研究，否則直接進行。帶著脈絡準備好，減少使用者的負擔。\n\n### 撰寫 SKILL.md\n\n根據使用者訪談，填入這些組成部分：\n\n- **name**：技能識別名稱\n- **description**：何時觸發、做什麼。這是主要的觸發機制——要同時包含技能做什麼「以及」何時使用的具體情境。所有「何時使用」的資訊都放在這裡，而不是內文中。注意：目前 Claude 有「觸發不足」的傾向——在技能有用時卻不使用它們。為了對抗這點，請把技能描述寫得稍微「強勢」一點。例如，與其寫「如何建立一個簡單快速的儀表板來顯示 Anthropic 內部資料」，你可以寫「如何建立一個簡單快速的儀表板來顯示 Anthropic 內部資料。只要使用者提到儀表板、資料視覺化、內部指標，或想顯示任何種類的公司資料，即使他們沒有明確要求『儀表板』，也務必使用這個技能。」\n- **compatibility**：必要的工具、相依項目（選填，很少需要）\n- **技能的其餘部分 :)**\n\n### 技能撰寫指南\n\n#### 技能的構造\n\n```\nskill-name/\n├── SKILL.md (required)\n│   ├── YAML frontmatter (name, description required)\n│   └── Markdown instructions\n└── Bundled Resources (optional)\n    ├── scripts/    - Executable code for deterministic/repetitive tasks\n    ├── references/ - Docs loaded into context as needed\n    └── assets/     - Files used in output (templates, icons, fonts)\n```\n\n#### 漸進式揭露\n\n技能使用三層載入系統：\n1. **中繼資料**（name + description）——永遠在上下文中（約 100 字）\n2. **SKILL.md 內文**——技能觸發時就在上下文中（理想上少於 500 行）\n3. **內附資源**——視需要載入（無上限，腳本可在不載入的情況下執行）\n\n這些字數只是大概，需要的話可以寫得更長。\n\n**關鍵模式：**\n- 讓 SKILL.md 保持在 500 行以內；如果接近這個上限，就加入額外一層階層，並清楚指出使用該技能的模型接下來應該去哪裡繼續。\n- 在 SKILL.md 中清楚引用參考檔案，並說明何時該閱讀它們\n- 對於大型參考檔案（超過 300 行），加入目錄\n\n**依領域組織**：當技能支援多個領域/框架時，依變體組織：\n```\ncloud-deploy/\n├── SKILL.md (workflow + selection)\n└── references/\n    ├── aws.md\n    ├── gcp.md\n    └── azure.md\n```\nClaude 只會閱讀相關的參考檔案。\n\n#### 不令人意外原則\n\n這不用多說，但技能絕不能包含惡意軟體、漏洞利用程式碼，或任何可能危及系統安全的內容。技能的內容若被描述出來，其意圖不應令使用者感到意外。不要配合建立具誤導性的技能，或旨在協助未授權存取、資料外洩或其他惡意活動的技能。不過像「扮演某某角色」這類是可以的。\n\n#### 撰寫模式\n\n指示中優先使用祈使語氣。\n\n**定義輸出格式**——你可以這樣做：\n```markdown\n## Report structure\nALWAYS use this exact template:\n# [Title]\n## Executive summary\n## Key findings\n## Recommendations\n```\n\n**範例模式**——加入範例很有用。你可以這樣排版（但如果範例中有「Input」與「Output」，你可能需要稍作變化）：\n```markdown\n## Commit message format\n**Example 1:**\nInput: Added user authentication with JWT tokens\nOutput: feat(auth): implement JWT-based authentication\n```\n\n### 寫作風格\n\n試著向模型解釋為什麼某些事很重要，而不是用沉重陳腐的「必須」。運用心智理論，試著讓技能具通用性，而不是極度狹隘地只適用於特定範例。先寫出草稿，然後以全新的眼光審視並改進它。\n\n### 測試案例\n\n寫完技能草稿後，想出 2–3 個真實的測試提示——真正的使用者實際會說的那種話。與使用者分享：[不必用完全一樣的措辭]「這是我想試的幾個測試案例。看起來對嗎，還是你想再加一些？」然後執行它們。\n\n把測試案例存到 `evals/evals.json`。先不要寫斷言——只寫提示。你會在執行進行時於下一步草擬斷言。\n\n```json\n{\n  \"skill_name\": \"example-skill\",\n  \"evals\": [\n    {\n      \"id\": 1,\n      \"prompt\": \"User's task prompt\",\n      \"expected_output\": \"Description of expected result\",\n      \"files\": []\n    }\n  ]\n}\n```\n\n完整的 schema（包括你稍後會加入的 `assertions` 欄位）請見 `references/schemas.md`。\n\n## 執行與評估測試案例\n\n本節是一個連續的流程——不要中途停下。**不要**使用 `/skill-test` 或任何其他測試技能。\n\n把結果放在與技能目錄同層的 `<skill-name>-workspace/` 中。在工作區內，依迭代組織結果（`iteration-1/`、`iteration-2/` 等），其中每個測試案例各有一個目錄（`eval-0/`、`eval-1/` 等）。不要一開始就建立全部——邊進行邊建立目錄即可。\n\n### 步驟 1：在同一輪中產生所有執行（有技能「與」基準）\n\n對每個測試案例，在同一輪中產生兩個子代理——一個有技能，一個沒有。這很重要：不要先產生有技能的執行，之後再回來做基準。一次全部啟動，讓它們差不多同時完成。\n\n**有技能的執行：**\n\n```\nExecute this task:\n- Skill path: <path-to-skill>\n- Task: <eval prompt>\n- Input files: <eval files if any, or \"none\">\n- Save outputs to: <workspace>/iteration-<N>/eval-<ID>/with_skill/outputs/\n- Outputs to save: <what the user cares about — e.g., \"the .docx file\", \"the final CSV\">\n```\n\n**基準執行**（相同的提示，但基準取決於情境）：\n- **建立新技能**：完全沒有技能。相同提示、不提供技能路徑，存到 `without_skill/outputs/`。\n- **改進既有技能**：舊版本。編輯之前先為技能建立快照（`cp -r <skill-path> <workspace>/skill-snapshot/`），然後讓基準子代理指向該快照。存到 `old_skill/outputs/`。\n\n為每個測試案例撰寫一個 `eval_metadata.json`（斷言目前可以是空的）。依每個評估所測試的內容給它一個具描述性的名稱——而不只是「eval-0」。目錄也使用這個名稱。如果這次迭代使用新的或修改過的評估提示，就為每個新的評估目錄建立這些檔案——不要假設它們會從先前的迭代延續下來。\n\n```json\n{\n  \"eval_id\": 0,\n  \"eval_name\": \"descriptive-name-here\",\n  \"prompt\": \"The user's task prompt\",\n  \"assertions\": []\n}\n```\n\n### 步驟 2：在執行進行時草擬斷言\n\n不要只是等執行完成——你可以有效利用這段時間。為每個測試案例草擬定量斷言，並向使用者解釋。如果 `evals/evals.json` 中已有斷言，就檢閱它們並解釋它們檢查什麼。\n\n好的斷言可客觀驗證，並有具描述性的名稱——它們在評測檢視器中應該清楚易讀，讓快速瀏覽結果的人立刻理解每個斷言檢查什麼。主觀的技能（寫作風格、設計品質）較適合定性評估——不要把斷言硬套在需要人類判斷的事物上。\n\n草擬完成後，用斷言更新 `eval_metadata.json` 檔與 `evals/evals.json`。也要向使用者解釋他們將在檢視器中看到什麼——定性輸出與定量評測都要。\n\n### 步驟 3：執行完成時，記錄時間資料\n\n每個子代理任務完成時，你會收到一則包含 `total_tokens` 與 `duration_ms` 的通知。立即把這些資料存到該執行目錄中的 `timing.json`：\n\n```json\n{\n  \"total_tokens\": 84852,\n  \"duration_ms\": 23332,\n  \"total_duration_seconds\": 23.3\n}\n```\n\n這是唯一能記錄這些資料的機會——它透過任務通知傳來，不會保存在其他地方。在每則通知到達時就處理，而不是試圖批次處理。\n\n### 步驟 4：評分、彙整並啟動檢視器\n\n所有執行都完成後：\n\n1. **為每個執行評分**——產生一個評分子代理（或直接評分），讓它閱讀 `agents/grader.md` 並根據輸出評估每個斷言。把結果存到每個執行目錄中的 `grading.json`。grading.json 的 expectations 陣列必須使用 `text`、`passed` 與 `evidence` 欄位（而不是 `name`/`met`/`details` 或其他變體）——檢視器依賴這些確切的欄位名稱。對於可以用程式檢查的斷言，撰寫並執行腳本，而不是用肉眼看——腳本更快、更可靠，而且可以跨迭代重用。\n\n2. **彙整成評測**——從 skill-creator 目錄執行彙整腳本：\n   ```bash\n   python -m scripts.aggregate_benchmark <workspace>/iteration-N --skill-name <name>\n   ```\n   這會產生 `benchmark.json` 與 `benchmark.md`，包含每種設定的通過率、時間與 token 數，附平均值 ± 標準差以及差值。如果手動產生 benchmark.json，檢視器預期的確切 schema 請見 `references/schemas.md`。\n把每個 with_skill 版本放在其基準對照之前。\n\n3. **進行分析** ——閱讀評測資料，找出彙整統計可能隱藏的模式。要注意什麼請見 `agents/analyzer.md`（「Analyzing Benchmark Results」一節）——例如不論有沒有技能都一定通過的斷言（無鑑別力）、高變異的評估（可能不穩定），以及時間/token 的取捨。\n\n4. **啟動檢視器**，同時呈現定性輸出與定量資料：\n   ```bash\n   nohup python <skill-creator-path>/eval-viewer/generate_review.py \\\n     <workspace>/iteration-N \\\n     --skill-name \"my-skill\" \\\n     --benchmark <workspace>/iteration-N/benchmark.json \\\n     > /dev/null 2>&1 &\n   VIEWER_PID=$!\n   ```\n   第 2 次以後的迭代，還要傳入 `--previous-workspace <workspace>/iteration-<N-1>`。\n\n   **Cowork / 無頭環境：** 如果無法使用 `webbrowser.open()`，或環境沒有顯示器，就使用 `--static <output_path>` 寫出一個獨立的 HTML 檔，而不是啟動伺服器。當使用者點擊「Submit All Reviews」時，回饋會下載成 `feedback.json` 檔。下載後，把 `feedback.json` 複製到工作區目錄，供下一次迭代讀取。\n\n注意：請使用 generate_review.py 建立檢視器；不需要自己寫客製的 HTML。\n\n5. **告訴使用者**類似這樣的話：「我已經在你的瀏覽器中開啟結果。有兩個分頁——『Outputs』讓你逐一點閱每個測試案例並留下回饋，『Benchmark』顯示定量比較。看完後回到這裡告訴我。」\n\n### 使用者在檢視器中看到什麼\n\n「Outputs」分頁一次顯示一個測試案例：\n- **Prompt**：所給的任務\n- **Output**：技能產出的檔案，盡可能直接渲染\n- **Previous Output**（第 2 次以後的迭代）：摺疊區塊，顯示上一次迭代的輸出\n- **Formal Grades**（如果有執行評分）：摺疊區塊，顯示斷言通過/失敗\n- **Feedback**：一個會在輸入時自動儲存的文字框\n- **Previous Feedback**（第 2 次以後的迭代）：他們上次的意見，顯示在文字框下方\n\n「Benchmark」分頁顯示統計摘要：每種設定的通過率、時間與 token 用量，以及每個評估的細目與分析觀察。\n\n透過上一個/下一個按鈕或方向鍵瀏覽。完成時，他們點擊「Submit All Reviews」，把所有回饋存到 `feedback.json`。\n\n### 步驟 5：閱讀回饋\n\n當使用者告訴你他們看完了，閱讀 `feedback.json`：\n\n```json\n{\n  \"reviews\": [\n    {\"run_id\": \"eval-0-with_skill\", \"feedback\": \"the chart is missing axis labels\", \"timestamp\": \"...\"},\n    {\"run_id\": \"eval-1-with_skill\", \"feedback\": \"\", \"timestamp\": \"...\"},\n    {\"run_id\": \"eval-2-with_skill\", \"feedback\": \"perfect, love this\", \"timestamp\": \"...\"}\n  ],\n  \"status\": \"complete\"\n}\n```\n\n空白的回饋代表使用者覺得沒問題。把改進重點放在使用者有具體抱怨的測試案例上。\n\n用完檢視器伺服器後把它關掉：\n\n```bash\nkill $VIEWER_PID 2>/dev/null\n```\n\n---\n\n## 改進技能\n\n這是循環的核心。你已經執行了測試案例，使用者也審閱了結果，現在你需要根據他們的回饋讓技能變得更好。\n\n### 如何思考改進\n\n1. **從回饋中歸納。** 這裡發生的大局是：我們試著建立能被使用上百萬次（也許字面上就是，也許更多，誰知道）、跨越許多不同提示的技能。你和使用者在這裡只反覆迭代少數幾個範例，是因為這樣能推進得更快。使用者對這些範例瞭若指掌，評估新輸出很快。但如果你和使用者共同開發的技能只對那些範例有效，它就毫無用處。與其加入瑣碎的過度擬合修改，或令人窒息的嚴格「必須」，如果有某個頑固的問題，你可以試著擴展思路、使用不同的比喻，或建議不同的工作模式。嘗試的成本相對低，也許你會找到很棒的東西。\n\n2. **讓提示保持精簡。** 移除沒有發揮作用的東西。務必閱讀逐字紀錄，而不只是最終輸出——如果看起來技能讓模型浪費大量時間做沒有生產力的事，你可以試著拿掉造成這種行為的技能部分，看看會發生什麼。\n\n3. **解釋為什麼。** 努力解釋你要求模型做的每件事背後的**原因**。今天的 LLM 很*聰明*。它們有良好的心智理論，在好的架構下能超越死板的指示，真正把事情做成。即使使用者的回饋很簡短或帶著挫折，也要試著真正理解任務、使用者為什麼這樣寫、以及他們實際寫了什麼，然後把這份理解傳達到指示中。如果你發現自己在用全大寫寫 ALWAYS 或 NEVER，或使用超級死板的結構，那是一個黃色警訊——可能的話，換個框架並解釋理由，讓模型理解你要求的事為什麼重要。那是更人性、更有力、也更有效的做法。\n\n4. **找出測試案例間的重複工作。** 閱讀測試執行的逐字紀錄，注意子代理是否都各自寫了類似的輔助腳本，或對某件事採取了同樣的多步驟做法。如果 3 個測試案例都讓子代理寫了一個 `create_docx.py` 或 `build_chart.py`，這就是技能應該內附該腳本的強烈訊號。寫一次，放進 `scripts/`，並告訴技能使用它。這能讓未來的每次呼叫都不必重新發明輪子。\n\n這項任務相當重要（我們在這裡試圖每年創造數十億美元的經濟價值！），而你的思考時間不是瓶頸；慢慢來，好好反覆思量。我建議先寫出修訂草稿，再以全新的眼光審視並改進。真心盡力進入使用者的腦袋，理解他們想要與需要什麼。\n\n### 迭代循環\n\n改進技能之後：\n\n1. 把你的改進套用到技能上\n2. 把所有測試案例重新執行到新的 `iteration-<N+1>/` 目錄中，包括基準執行。如果你在建立新技能，基準永遠是 `without_skill`（沒有技能）——它在各次迭代中保持不變。如果你在改進既有技能，就自行判斷什麼適合作為基準：使用者帶來的原始版本，或上一次迭代。\n3. 以指向上一次迭代的 `--previous-workspace` 啟動審閱器\n4. 等待使用者審閱並告訴你他們完成了\n5. 閱讀新的回饋、再次改進、重複\n\n持續進行，直到：\n- 使用者說他們滿意了\n- 回饋全都是空的（一切看起來都很好）\n- 你沒有取得有意義的進展\n\n---\n\n## 進階：盲測比較\n\n當你想對技能的兩個版本做更嚴謹的比較時（例如使用者問「新版本真的比較好嗎？」），有一套盲測比較系統。細節請閱讀 `agents/comparator.md` 與 `agents/analyzer.md`。基本概念是：把兩個輸出交給一個獨立的代理，不告訴它哪個是哪個，讓它判斷品質。然後分析勝出者為什麼勝出。\n\n這是選用的，需要子代理，大多數使用者用不到。人工審閱循環通常就足夠了。\n\n---\n\n## 描述優化\n\nSKILL.md 前置資料中的 description 欄位，是決定 Claude 是否呼叫技能的主要機制。建立或改進技能之後，主動提議優化描述以提升觸發準確率。\n\n### 步驟 1：產生觸發評估查詢\n\n建立 20 個評估查詢——混合「應觸發」與「不應觸發」的情況。存成 JSON：\n\n```json\n[\n  {\"query\": \"the user prompt\", \"should_trigger\": true},\n  {\"query\": \"another prompt\", \"should_trigger\": false}\n]\n```\n\n查詢必須真實，是 Claude Code 或 Claude.ai 使用者真正會輸入的內容。不是抽象的請求，而是具體、明確、有相當細節的請求。例如檔案路徑、關於使用者工作或處境的個人脈絡、欄位名稱與值、公司名稱、URL。一點點背景故事。有些可能是小寫，或包含縮寫、錯字或口語。混合使用不同長度，並聚焦在邊界案例，而不是讓它們涇渭分明（使用者會有機會確認它們）。\n\n不好：`\"Format this data\"`、`\"Extract text from PDF\"`、`\"Create a chart\"`\n\n好：`\"ok so my boss just sent me this xlsx file (its in my downloads, called something like 'Q4 sales final FINAL v2.xlsx') and she wants me to add a column that shows the profit margin as a percentage. The revenue is in column C and costs are in column D i think\"`（「好，我老闆剛寄給我這個 xlsx 檔（在我的下載資料夾，檔名大概是 'Q4 sales final FINAL v2.xlsx'），她要我加一欄顯示利潤率百分比。營收應該在 C 欄、成本在 D 欄吧」）\n\n對於**應觸發**的查詢（8–10 個），考慮涵蓋範圍。你需要同一意圖的不同說法——有些正式、有些隨意。包含使用者沒有明確點名技能或檔案類型、但顯然需要它的情況。加入一些不常見的使用情境，以及這個技能與其他技能競爭但應該勝出的情況。\n\n對於**不應觸發**的查詢（8–10 個），最有價值的是差一點就命中的那些——與技能共享關鍵字或概念、但其實需要不同東西的查詢。想想相鄰的領域、天真的關鍵字比對會觸發但不應該觸發的模糊措辭，以及查詢觸及技能能做的事、但在那個情境下其他工具更合適的情況。\n\n要避免的關鍵：不要讓不應觸發的查詢明顯無關。拿「寫一個費氏數列函式」當 PDF 技能的負面測試太簡單了——它什麼都沒測到。負面案例應該真的有難度。\n\n### 步驟 2：與使用者一起審閱\n\n使用 HTML 模板把評估集呈現給使用者審閱：\n\n1. 從 `assets/eval_review.html` 讀取模板\n2. 替換占位符：\n   - `__EVAL_DATA_PLACEHOLDER__` → 評估項目的 JSON 陣列（外面不加引號——這是 JS 變數指定）\n   - `__SKILL_NAME_PLACEHOLDER__` → 技能的名稱\n   - `__SKILL_DESCRIPTION_PLACEHOLDER__` → 技能目前的描述\n3. 寫入暫存檔（例如 `/tmp/eval_review_<skill-name>.html`）並開啟：`open /tmp/eval_review_<skill-name>.html`\n4. 使用者可以編輯查詢、切換是否應觸發、新增/移除項目，然後點擊「Export Eval Set」\n5. 檔案會下載到 `~/Downloads/eval_set.json`——如果有多個（例如 `eval_set (1).json`），檢查下載資料夾中最新的版本\n\n這一步很重要——不好的評估查詢會產生不好的描述。\n\n### 步驟 3：執行優化循環\n\n告訴使用者：「這會花一些時間——我會在背景執行優化循環，並定期查看進度。」\n\n把評估集存到工作區，然後在背景執行：\n\n```bash\npython -m scripts.run_loop \\\n  --eval-set <path-to-trigger-eval.json> \\\n  --skill-path <path-to-skill> \\\n  --model <model-id-powering-this-session> \\\n  --max-iterations 5 \\\n  --verbose\n```\n\n使用你系統提示中的模型 ID（目前驅動這個 session 的那個），讓觸發測試符合使用者實際的體驗。\n\n在執行期間，定期查看輸出的結尾，向使用者更新目前是第幾次迭代、分數如何。\n\n這會自動處理完整的優化循環。它把評估集分成 60% 訓練集與 40% 保留測試集，評估目前的描述（每個查詢執行 3 次以取得可靠的觸發率），然後呼叫 Claude 根據失敗之處提出改進。它在訓練集與測試集上重新評估每個新描述，最多迭代 5 次。完成後，它會在瀏覽器中開啟一份 HTML 報告，顯示每次迭代的結果，並回傳包含 `best_description` 的 JSON——依測試分數而非訓練分數選出，以避免過度擬合。\n\n### 技能觸發如何運作\n\n理解觸發機制有助於設計更好的評估查詢。技能以名稱＋描述出現在 Claude 的 `available_skills` 清單中，Claude 根據該描述決定是否參考某個技能。重要的是要知道：Claude 只會在它無法輕易自行處理的任務上參考技能——像「讀這個 PDF」這樣簡單、單一步驟的查詢，即使描述完美相符也可能不會觸發技能，因為 Claude 可以直接用基本工具處理。複雜、多步驟或專門的查詢，在描述相符時會可靠地觸發技能。\n\n這代表你的評估查詢應該夠有分量，讓 Claude 真的能從參考技能中受益。像「讀檔案 X」這樣的簡單查詢是糟糕的測試案例——無論描述品質如何，它們都不會觸發技能。\n\n### 步驟 4：套用結果\n\n從 JSON 輸出中取出 `best_description`，更新技能的 SKILL.md 前置資料。向使用者展示修改前後並回報分數。\n\n---\n\n### 打包與呈現（僅在有 `present_files` 工具時）\n\n檢查你是否能使用 `present_files` 工具。如果不能，略過這一步。如果可以，就打包技能並把 .skill 檔呈現給使用者：\n\n```bash\npython -m scripts.package_skill <path/to/skill-folder>\n```\n\n打包後，引導使用者到產出的 `.skill` 檔案路徑，讓他們可以安裝。\n\n---\n\n## Claude.ai 專屬說明\n\n在 Claude.ai 中，核心工作流程相同（草稿 → 測試 → 審閱 → 改進 → 重複），但因為 Claude.ai 沒有子代理，有些機制會改變。以下是需要調整之處：\n\n**執行測試案例**：沒有子代理代表沒有平行執行。對每個測試案例，閱讀技能的 SKILL.md，然後依照其指示自己完成測試提示。一次做一個。這比獨立的子代理不嚴謹（技能是你寫的，也是你在執行，所以你有完整的脈絡），但它是一個有用的合理性檢查——而人工審閱步驟能彌補這一點。略過基準執行——只要用技能完成所要求的任務即可。\n\n**審閱結果**：如果你無法開啟瀏覽器（例如 Claude.ai 的虛擬機沒有顯示器，或你在遠端伺服器上），就完全略過瀏覽器審閱器。改為直接在對話中呈現結果。對每個測試案例，展示提示與輸出。如果輸出是使用者需要查看的檔案（像 .docx 或 .xlsx），把它存到檔案系統並告訴他們在哪裡，讓他們可以下載檢查。直接在對話中詢問回饋：「看起來如何？有什麼想改的嗎？」\n\n**評測**：略過定量評測——它依賴基準比較，而沒有子代理時這種比較沒有意義。專注於使用者的定性回饋。\n\n**迭代循環**：與先前相同——改進技能、重新執行測試案例、詢問回饋——只是中間沒有瀏覽器審閱器。如果你有檔案系統，仍然可以把結果組織到迭代目錄中。\n\n**描述優化**：本節需要 `claude` CLI 工具（特別是 `claude -p`），只有 Claude Code 才有。如果你在 Claude.ai 上就略過。\n\n**盲測比較**：需要子代理。略過。\n\n**打包**：`package_skill.py` 腳本在任何有 Python 與檔案系統的地方都能運作。在 Claude.ai 上，你可以執行它，讓使用者下載產出的 `.skill` 檔。\n\n**更新既有技能**：使用者可能是要求你更新既有的技能，而不是建立新的。這種情況下：\n- **保留原本的名稱。** 記下技能的目錄名稱與 `name` 前置資料欄位——原封不動地使用它們。例如，如果已安裝的技能是 `research-helper`，就輸出 `research-helper.skill`（而不是 `research-helper-v2`）。\n- **編輯前先複製到可寫入的位置。** 已安裝的技能路徑可能是唯讀的。複製到 `/tmp/skill-name/`，在那裡編輯，並從副本打包。\n- **如果手動打包，先在 `/tmp/` 中準備**，然後再複製到輸出目錄——直接寫入可能因權限而失敗。\n\n---\n\n## Cowork 專屬說明\n\n如果你在 Cowork 中，主要需要知道的是：\n\n- 你有子代理，所以主要工作流程（平行產生測試案例、執行基準、評分等）都能運作。（不過，如果你遇到嚴重的逾時問題，改成依序而非平行執行測試提示也是可以的。）\n- 你沒有瀏覽器或顯示器，所以產生評估檢視器時，使用 `--static <output_path>` 寫出獨立的 HTML 檔，而不是啟動伺服器。然後提供一個連結，讓使用者點擊在他們的瀏覽器中開啟 HTML。\n- 不知為何，Cowork 的設定似乎讓 Claude 不太傾向在執行測試後產生評估檢視器，所以再強調一次：無論你在 Cowork 還是 Claude Code 中，執行測試後，你都應該先產生評估檢視器讓人類查看範例，然後才自己修訂技能並嘗試修正，而且要使用 `generate_review.py`（而不是自己寫精品 HTML 程式碼）。先說聲抱歉，但我要用全大寫了：在自己評估輸入「之前」先產生評估檢視器！你要盡快把它們呈現在人類面前！\n- 回饋的運作方式不同：因為沒有執行中的伺服器，檢視器的「Submit All Reviews」按鈕會把 `feedback.json` 下載成檔案。然後你可以從那裡讀取它（你可能需要先請求存取權）。\n- 打包可以運作——`package_skill.py` 只需要 Python 與檔案系統。\n- 描述優化（`run_loop.py` / `run_eval.py`）在 Cowork 中應該也能正常運作，因為它是透過子程序使用 `claude -p`，而不是瀏覽器；但請把它留到你完全完成技能、且使用者同意技能狀態良好之後再做。\n- **更新既有技能**：使用者可能是要求你更新既有的技能，而不是建立新的。請遵循上方 claude.ai 一節中的更新指引。\n\n---\n\n## 參考檔案\n\nagents/ 目錄包含專門子代理的指示。需要產生相關子代理時閱讀它們。\n\n- `agents/grader.md` — 如何根據輸出評估斷言\n- `agents/comparator.md` — 如何對兩個輸出進行盲測 A/B 比較\n- `agents/analyzer.md` — 如何分析為什麼一個版本勝過另一個\n\nreferences/ 目錄有額外的文件：\n- `references/schemas.md` — evals.json、grading.json 等的 JSON 結構\n\n---\n\n為了強調，再重複一次這裡的核心循環：\n\n- 弄清楚技能是關於什麼的\n- 草擬或編輯技能\n- 在測試提示上執行可使用該技能的 Claude\n- 與使用者一起評估輸出：\n  - 建立 benchmark.json 並執行 `eval-viewer/generate_review.py` 幫助使用者審閱\n  - 執行定量評估\n- 重複直到你和使用者都滿意\n- 打包最終的技能並交還給使用者。\n\n如果你有待辦清單之類的東西，請把步驟加進去，確保你不會忘記。如果你在 Cowork 中，請特別在你的待辦清單中加入「建立 evals JSON 並執行 `eval-viewer/generate_review.py`，讓人類可以審閱測試案例」，確保它會被執行。\n\n祝你好運！"}, {"rank": 33, "slug": "docx", "title": "Word 文件處理", "category": "文件與辦公", "tags": ["Word", "docx", "文件產生", "追蹤修訂", "Anthropic 官方"], "summary": "Anthropic 官方文件技能：建立、讀取、編輯 Word 文件（.docx）與範本（.dotx）——目錄、標題、頁碼、信頭等專業排版，插入/替換圖片、尋找取代、處理追蹤修訂與註解。新文件用 docx（npm）腳本產生；修改既有文件則解壓縮後直接編輯 XML。", "usage": "- Claude.ai / Claude 桌面版：設定 → Capabilities 開啟 Skills 即內建可用\n- Claude Code：`/plugin marketplace add anthropics/skills` 後安裝 document-skills\n- 說「幫我做一份含目錄與頁碼的季度報告 Word 檔」「把這份合約裡的甲方名稱全部換掉並保留追蹤修訂」\n- ⚠️ 此技能為 Anthropic 專有授權（Proprietary），本站僅提供中文介紹，原文請至來源連結閱讀", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/docx/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/docx/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/docx", "skillssh_rank": 311, "installs": 209002, "license": "Anthropic 專有授權", "redistributable": false, "description_en": "", "description_zh": "", "original": "", "translation": ""}, {"rank": 34, "slug": "pdf", "title": "PDF 處理", "category": "文件與辦公", " y": "文件與辦公", "tags": ["Excel", "xlsx", "資料清理", "財務模型", "Anthropic 官方"], "summary": "Anthropic 官方文件技能：試算表為主要輸入或輸出時使用——開啟、編輯、修正 .xlsx/.xlsm/.csv/.tsv，加欄位、寫公式、格式化、做圖表、清理雜亂資料，或從零建立新試算表。要求一律用公式而非寫死數值、零公式錯誤（以 recalc.py 驗證），並嚴格照使用者指定的分頁與欄位名稱。", "usage": "- Claude.ai / Claude 桌面版：設定 → Capabilities 開啟 Skills 即內建可用\n- Claude Code：`/plugin marketplace add anthropics/skills` 後安裝 document-skills\n- 說「幫我把下載資料夾那份 xlsx 的重複資料清掉並加上小計公式」「做一個三年期的營收預測財務模型」\n- ⚠️ 此技能為 Anthropic 專有授權（Proprietary），本站僅提供中文介紹，原文請至來源連結閱讀", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/xlsx/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/xlsx/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/xlsx", "skillssh_rank": 328, "installs": 189651, "license": "Anthropic 專有授權", "redistributable": false, "description_en": "", "description_zh": "", "original": "", "translation": ""}, {"rank": 37, "slug": "mcp-builder", "title": "MCP 伺服器建構", "category": "AI 整合與開發工具", "tags": ["MCP", "API 整合", "TypeScript", "Python", "Anthropic 官方"], "summary": "Anthropic 官方技能：引導你打造高品質的 MCP（Model Context Protocol）伺服器，讓 LLM 透過設計良好的工具串接外部 API 或服務。分四階段：深入研究與規劃 → 實作（TypeScript SDK v2 或 Python FastMCP）→ 審查與測試 → 建立 10 題評估集。", "usage": "- 安裝：`npx skills add https://github.com/anthropics/skills --skill mcp-builder`，或 Claude Code `/plugin marketplace add anthropics/skills`\n- 說「幫我做一個串接 Notion API 的 MCP server」\n- 推薦組合：TypeScript ＋ Streamable HTTP（遠端）/ stdio（本機）\n- 完成後用 `npx @modelcontextprotocol/inspector` 測試，並產出 XML 評估題組驗證 LLM 是否真的會用", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/mcp-builder/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/mcp-builder/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/mcp-builder", "skillssh_rank": 364, "installs": 133372, "license": "Apache-2.0", "redistributable": true, "description_en": "Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).", "description_zh": "建立高品質 MCP（Model Context Protocol）伺服器的指南，讓 LLM 能透過設計良好的工具與外部服務互動。在建構 MCP 伺服器以整合外部 API 或服務時使用，無論是 Python（FastMCP）或 Node/TypeScript（MCP SDK）。", "original": "---\nname: mcp-builder\ndescription: Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).\nlicense: Complete terms in LICENSE.txt\n---\n\n# MCP Server Development Guide\n\n## Overview\n\nCreate MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. The quality of an MCP server is measured by how well it enables LLMs to accomplish real-world tasks.\n\n---\n\n# Process\n\n## 🚀 High-Level Workflow\n\nCreating a high-quality MCP server involves four main phases:\n\n### Phase 1: Deep Research and Planning\n\n#### 1.1 Understand Modern MCP Design\n\n**API Coverage vs. Workflow Tools:**\nBalance comprehensive API endpoint coverage with specialized workflow tools. Workflow tools can be more convenient for specific tasks, while comprehensive coverage gives agents flexibility to compose operations. Performance varies by client—some clients benefit from code execution that combines basic tools, while others work better with higher-level workflows. When uncertain, prioritize comprehensive API coverage.\n\n**Tool Naming and Discoverability:**\nClear, descriptive tool names help agents find the right tools quickly. Use consistent prefixes (e.g., `github_create_issue`, `github_list_repos`) and action-oriented naming.\n\n**Context Management:**\nAgents benefit from concise tool descriptions and the ability to filter/paginate results. Design tools that return focused, relevant data. Some clients support code execution which can help agents filter and process data efficiently.\n\n**Actionable Error Messages:**\nError messages should guide agents toward solutions with specific suggestions and next steps.\n\n#### 1.2 Study MCP Protocol Documentation\n\n**Navigate the MCP specification:**\n\nStart with the sitemap to find relevant pages: `https://modelcontextprotocol.io/sitemap.xml`\n\nThen fetch specific pages with `.md` suffix for markdown format (e.g., `https://modelcontextprotocol.io/specification/draft.md`).\n\nKey pages to review:\n- Specification overview and architecture\n- Transport mechanisms (streamable HTTP, stdio)\n- Tool, resource, and prompt definitions\n\n#### 1.3 Study Framework Documentation\n\n**Recommended stack:**\n- **Language**: TypeScript (high-quality SDK support and good compatibility in many execution environments e.g. MCPB. Plus AI models are good at generating TypeScript code, benefiting from its broad usage, static typing and good linting tools)\n- **Transport**: Streamable HTTP for remote servers, using stateless JSON (simpler to scale and maintain, as opposed to stateful sessions and streaming responses). stdio for local servers.\n\n**Load framework documentation:**\n\n- **MCP Best Practices**: [📋 View Best Practices](./reference/mcp_best_practices.md) - Core guidelines\n\n**For TypeScript (recommended):**\n\nThe TypeScript SDK has two major versions. Pick one before writing code:\n- **v2** (`@modelcontextprotocol/server`): the current stable release. Use it for new servers.\n- **v1** (`@modelcontextprotocol/sdk`): receives bug and security fixes only. Use it only when the project's `package.json` already depends on `@modelcontextprotocol/sdk`, or migrate that project with `npx @modelcontextprotocol/codemod@latest v1-to-v2 .`\n\nIf the project already uses v1, tell the user once, in a sentence or two, that v2 (`@modelcontextprotocol/server`) is the current stable release, that v1 receives only bug and security fixes, and that `npx @modelcontextprotocol/codemod@latest v1-to-v2 .` migrates the project. Then continue with v1 unless the user asks to migrate.\n\nDon't mix the two in one project: v1 code samples (imports from `@modelcontextprotocol/sdk/...`) don't apply to v2.\n\n- **TypeScript SDK (v2)**: Use WebFetch to load `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md`; the full docs index is `https://ts.sdk.modelcontextprotocol.io/v2/llms.txt`\n- [⚡ TypeScript Guide (v2)](./reference/node_mcp_server_v2.md) - TypeScript patterns and examples\n- For v1 projects only: `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/v1.x/README.md` and the [TypeScript Guide (v1)](./reference/node_mcp_server.md)\n\n**For Python:**\n- **Python SDK**: Use WebFetch to load `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md`\n- [🐍 Python Guide](./reference/python_mcp_server.md) - Python patterns and examples\n\n#### 1.4 Plan Your Implementation\n\n**Understand the API:**\nReview the service's API documentation to identify key endpoints, authentication requirements, and data models. Use web search and WebFetch as needed.\n\n**Tool Selection:**\nPrioritize comprehensive API coverage. List endpoints to implement, starting with the most common operations.\n\n---\n\n### Phase 2: Implementation\n\n#### 2.1 Set Up Project Structure\n\nSee language-specific guides for project setup:\n- [⚡ TypeScript Guide (v2)](./reference/node_mcp_server_v2.md) - Project structure, package.json, tsconfig.json ([v1](./reference/node_mcp_server.md) for existing v1 projects)\n- [🐍 Python Guide](./reference/python_mcp_server.md) - Module organization, dependencies\n\n#### 2.2 Implement Core Infrastructure\n\nCreate shared utilities:\n- API client with authentication\n- Error handling helpers\n- Response formatting (JSON/Markdown)\n- Pagination support\n\n#### 2.3 Implement Tools\n\nFor each tool:\n\n**Input Schema:**\n- Use Zod (TypeScript) or Pydantic (Python)\n- Include constraints and clear descriptions\n- Add examples in field descriptions\n\n**Output Schema:**\n- Define `outputSchema` where possible for structured data\n- Use `structuredContent` in tool responses (TypeScript SDK feature)\n- Helps clients understand and process tool outputs\n\n**Tool Description:**\n- Concise summary of functionality\n- Parameter descriptions\n- Return type schema\n\n**Implementation:**\n- Async/await for I/O operations\n- Proper error handling with actionable messages\n- Support pagination where applicable\n- Return both text content and structured data when using modern SDKs\n\n**Annotations:**\n- `readOnlyHint`: true/false\n- `destructiveHint`: true/false\n- `idempotentHint`: true/false\n- `openWorldHint`: true/false\n\n---\n\n### Phase 3: Review and Test\n\n#### 3.1 Code Quality\n\nReview for:\n- No duplicated code (DRY principle)\n- Consistent error handling\n- Full type coverage\n- Clear tool descriptions\n\n#### 3.2 Build and Test\n\n**TypeScript:**\n- Run `npm run build` to verify compilation\n- v2 projects: run the self-check script from the [v2 guide](./reference/node_mcp_server_v2.md#verify-your-server) against the built server\n- Test with MCP Inspector: `npx @modelcontextprotocol/inspector`\n\n**Python:**\n- Verify syntax: `python -m py_compile your_server.py`\n- Test with MCP Inspector\n\nSee language-specific guides for detailed testing approaches and quality checklists.\n\n---\n\n### Phase 4: Create Evaluations\n\nAfter implementing your MCP server, create comprehensive evaluations to test its effectiveness.\n\n**Load [✅ Evaluation Guide](./reference/evaluation.md) for complete evaluation guidelines.**\n\n#### 4.1 Understand Evaluation Purpose\n\nUse evaluations to test whether LLMs can effectively use your MCP server to answer realistic, complex questions.\n\n#### 4.2 Create 10 Evaluation Questions\n\nTo create effective evaluations, follow the process outlined in the evaluation guide:\n\n1. **Tool Inspection**: List available tools and understand their capabilities\n2. **Content Exploration**: Use READ-ONLY operations to explore available data\n3. **Question Generation**: Create 10 complex, realistic questions\n4. **Answer Verification**: Solve each question yourself to verify answers\n\n#### 4.3 Evaluation Requirements\n\nEnsure each question is:\n- **Independent**: Not dependent on other questions\n- **Read-only**: Only non-destructive operations required\n- **Complex**: Requiring multiple tool calls and deep exploration\n- **Realistic**: Based on real use cases humans would care about\n- **Verifiable**: Single, clear answer that can be verified by string comparison\n- **Stable**: Answer won't change over time\n\n#### 4.4 Output Format\n\nCreate an XML file with this structure:\n\n```xml\n<evaluation>\n  <qa_pair>\n    <question>Find discussions about AI model launches with animal codenames. One model needed a specific safety designation that uses the format ASL-X. What number X was being determined for the model named after a spotted wild cat?<\/question>\n    <answer>3<\/answer>\n  <\/qa_pair>\n<!-- More qa_pairs... -->\n<\/evaluation>\n```\n\n---\n\n# Reference Files\n\n## 📚 Documentation Library\n\nLoad these resources as needed during development:\n\n### Core MCP Documentation (Load First)\n- **MCP Protocol**: Start with sitemap at `https://modelcontextprotocol.io/sitemap.xml`, then fetch specific pages with `.md` suffix\n- [📋 MCP Best Practices](./reference/mcp_best_practices.md) - Universal MCP guidelines including:\n  - Server and tool naming conventions\n  - Response format guidelines (JSON vs Markdown)\n  - Pagination best practices\n  - Transport selection (streamable HTTP vs stdio)\n  - Security and error handling standards\n\n### SDK Documentation (Load During Phase 1/2)\n- **Python SDK**: Fetch from `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md`\n- **TypeScript SDK (v2)**: Fetch from `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md`; full docs index at `https://ts.sdk.modelcontextprotocol.io/v2/llms.txt`\n- **TypeScript SDK (v1, existing v1 projects only)**: Fetch from `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/v1.x/README.md`\n\n### Language-Specific Implementation Guides (Load During Phase 2)\n- [🐍 Python Implementation Guide](./reference/python_mcp_server.md) - Complete Python/FastMCP guide with:\n  - Server initialization patterns\n  - Pydantic model examples\n  - Tool registration with `@mcp.tool`\n  - Complete working examples\n  - Quality checklist\n\n- [⚡ TypeScript Implementation Guide (SDK v2)](./reference/node_mcp_server_v2.md) - Complete TypeScript guide for `@modelcontextprotocol/server` with:\n  - Project setup and the server factory\n  - Tool design: Zod 4 schemas, output formats, pagination, errors\n  - A complete example serving stdio and Streamable HTTP, plus bearer auth\n  - Resources, prompts, and notifications\n  - A self-check script to verify the built server\n  - Links to SDK examples for advanced features\n  - A v1 → v2 translation table, migration steps, and a quality checklist\n\n- [⚡ TypeScript Implementation Guide (SDK v1)](./reference/node_mcp_server.md) - The equivalent guide for existing `@modelcontextprotocol/sdk` projects\n\n### Evaluation Guide (Load During Phase 4)\n- [✅ Evaluation Guide](./reference/evaluation.md) - Complete evaluation creation guide with:\n  - Question creation guidelines\n  - Answer verification strategies\n  - XML format specifications\n  - Example questions and answers\n  - Running an evaluation with the provided scripts\n", "translation": "---\nname: mcp-builder\ndescription: 建立高品質 MCP（Model Context Protocol）伺服器的指南，讓 LLM 能透過設計良好的工具與外部服務互動。在建構 MCP 伺服器以整合外部 API 或服務時使用，無論是 Python（FastMCP）或 Node/TypeScript（MCP SDK）。\nlicense: 完整條款見 LICENSE.txt\n---\n\n# MCP 伺服器開發指南\n\n## 概述\n\n建立 MCP（Model Context Protocol）伺服器，讓 LLM 能透過設計良好的工具與外部服務互動。MCP 伺服器的品質，取決於它能讓 LLM 多好地完成真實世界的任務。\n\n---\n\n# 流程\n\n## 🚀 高層工作流程\n\n建立高品質的 MCP 伺服器包含四個主要階段：\n\n### 第一階段：深入研究與規劃\n\n#### 1.1 了解現代 MCP 設計\n\n**API 覆蓋 vs. 工作流程工具：**\n在全面的 API 端點覆蓋與專門的工作流程工具之間取得平衡。工作流程工具對特定任務可能更方便，而全面覆蓋則讓代理有彈性組合操作。效能因客戶端而異——有些客戶端能從結合基本工具的程式碼執行中獲益，有些則與較高層的工作流程配合得更好。不確定時，優先考慮全面的 API 覆蓋。\n\n**工具命名與可發現性：**\n清楚、具描述性的工具名稱能幫助代理快速找到正確的工具。使用一致的前綴（例如 `github_create_issue`、`github_list_repos`）以及以動作為導向的命名。\n\n**上下文管理：**\n代理受益於精簡的工具描述，以及篩選/分頁結果的能力。設計能回傳聚焦、相關資料的工具。有些客戶端支援程式碼執行，能幫助代理有效率地篩選與處理資料。\n\n**可執行的錯誤訊息：**\n錯誤訊息應以具體的建議與下一步引導代理走向解決方案。\n\n#### 1.2 研讀 MCP 協定文件\n\n**瀏覽 MCP 規格：**\n\n從網站地圖開始找到相關頁面：`https://modelcontextprotocol.io/sitemap.xml`\n\n然後加上 `.md` 後綴抓取特定頁面以取得 markdown 格式（例如 `https://modelcontextprotocol.io/specification/draft.md`）。\n\n要檢閱的關鍵頁面：\n- 規格總覽與架構\n- 傳輸機制（streamable HTTP、stdio）\n- 工具、資源與提示詞的定義\n\n#### 1.3 研讀框架文件\n\n**推薦技術組合：**\n- **語言**：TypeScript（高品質的 SDK 支援，在許多執行環境中相容性良好，例如 MCPB。而且 AI 模型擅長產生 TypeScript 程式碼，受益於其廣泛使用、靜態型別與良好的 lint 工具）\n- **傳輸**：遠端伺服器使用 Streamable HTTP 搭配無狀態 JSON（相較於有狀態的 session 與串流回應，更容易擴展與維護）。本機伺服器使用 stdio。\n\n**載入框架文件：**\n\n- **MCP 最佳實踐**：[📋 查看最佳實踐](./reference/mcp_best_practices.md) - 核心準則\n\n**TypeScript（推薦）：**\n\nTypeScript SDK 有兩個主要版本。寫程式前先選一個：\n- **v2**（`@modelcontextprotocol/server`）：目前的穩定版。新伺服器請用它。\n- **v1**（`@modelcontextprotocol/sdk`）：只接收 bug 與安全性修正。只有在專案的 `package.json` 已經依賴 `@modelcontextprotocol/sdk` 時才使用，或用 `npx @modelcontextprotocol/codemod@latest v1-to-v2 .` 遷移該專案。\n\n如果專案已在使用 v1，用一兩句話告訴使用者一次：v2（`@modelcontextprotocol/server`）是目前的穩定版、v1 只接收 bug 與安全性修正，以及 `npx @modelcontextprotocol/codemod@latest v1-to-v2 .` 可以遷移專案。然後除非使用者要求遷移，否則繼續使用 v1。\n\n不要在同一個專案中混用兩者：v1 的程式碼範例（從 `@modelcontextprotocol/sdk/...` 匯入）不適用於 v2。\n\n- **TypeScript SDK（v2）**：用 WebFetch 載入 `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md`；完整文件索引在 `https://ts.sdk.modelcontextprotocol.io/v2/llms.txt`\n- [⚡ TypeScript 指南（v2）](./reference/node_mcp_server_v2.md) - TypeScript 模式與範例\n- 僅限 v1 專案：`https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/v1.x/README.md` 以及 [TypeScript 指南（v1）](./reference/node_mcp_server.md)\n\n**Python：**\n- **Python SDK**：用 WebFetch 載入 `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md`\n- [🐍 Python 指南](./reference/python_mcp_server.md) - Python 模式與範例\n\n#### 1.4 規劃你的實作\n\n**了解 API：**\n檢閱該服務的 API 文件，找出關鍵端點、驗證需求與資料模型。視需要使用網路搜尋與 WebFetch。\n\n**工具選擇：**\n優先考慮全面的 API 覆蓋。列出要實作的端點，從最常用的操作開始。\n\n---\n\n### 第二階段：實作\n\n#### 2.1 設定專案結構\n\n專案設定請見各語言指南：\n- [⚡ TypeScript 指南（v2）](./reference/node_mcp_server_v2.md) - 專案結構、package.json、tsconfig.json（既有 v1 專案請見 [v1](./reference/node_mcp_server.md)）\n- [🐍 Python 指南](./reference/python_mcp_server.md) - 模組組織、相依套件\n\n#### 2.2 實作核心基礎設施\n\n建立共用工具：\n- 帶驗證的 API 客戶端\n- 錯誤處理輔助函式\n- 回應格式化（JSON/Markdown）\n- 分頁支援\n\n#### 2.3 實作工具\n\n對每個工具：\n\n**輸入 Schema：**\n- 使用 Zod（TypeScript）或 Pydantic（Python）\n- 包含限制條件與清楚的描述\n- 在欄位描述中加入範例\n\n**輸出 Schema：**\n- 盡可能為結構化資料定義 `outputSchema`\n- 在工具回應中使用 `structuredContent`（TypeScript SDK 功能）\n- 幫助客戶端理解與處理工具輸出\n\n**工具描述：**\n- 功能的精簡摘要\n- 參數描述\n- 回傳型別 schema\n\n**實作：**\n- I/O 操作使用 async/await\n- 適當的錯誤處理並提供可執行的訊息\n- 適用時支援分頁\n- 使用現代 SDK 時同時回傳文字內容與結構化資料\n\n**註記（Annotations）：**\n- `readOnlyHint`：true/false\n- `destructiveHint`：true/false\n- `idempotentHint`：true/false\n- `openWorldHint`：true/false\n\n---\n\n### 第三階段：審查與測試\n\n#### 3.1 程式碼品質\n\n檢查：\n- 沒有重複的程式碼（DRY 原則）\n- 一致的錯誤處理\n- 完整的型別覆蓋\n- 清楚的工具描述\n\n#### 3.2 建置與測試\n\n**TypeScript：**\n- 執行 `npm run build` 驗證編譯\n- v2 專案：對建置好的伺服器執行 [v2 指南](./reference/node_mcp_server_v2.md#verify-your-server)中的自我檢查腳本\n- 用 MCP Inspector 測試：`npx @modelcontextprotocol/inspector`\n\n**Python：**\n- 驗證語法：`python -m py_compile your_server.py`\n- 用 MCP Inspector 測試\n\n詳細的測試方法與品質檢查清單請見各語言指南。\n\n---\n\n### 第四階段：建立評估\n\n實作完 MCP 伺服器後，建立完整的評估來測試其成效。\n\n**載入 [✅ 評估指南](./reference/evaluation.md) 取得完整的評估準則。**\n\n#### 4.1 了解評估的目的\n\n用評估來測試 LLM 是否能有效使用你的 MCP 伺服器來回答真實、複雜的問題。\n\n#### 4.2 建立 10 道評估題目\n\n要建立有效的評估，請遵循評估指南中概述的流程：\n\n1. **檢查工具**：列出可用的工具並了解其能力\n2. **探索內容**：使用「唯讀」操作探索可用的資料\n3. **產生題目**：建立 10 道複雜、真實的題目\n4. **驗證答案**：自己解出每一題以驗證答案\n\n#### 4.3 評估要求\n\n確保每道題目：\n- **獨立**：不依賴其他題目\n- **唯讀**：只需要非破壞性的操作\n- **複雜**：需要多次工具呼叫與深入探索\n- **真實**：基於人類會在意的真實使用情境\n- **可驗證**：單一、清楚、可用字串比對驗證的答案\n- **穩定**：答案不會隨時間改變\n\n#### 4.4 輸出格式\n\n建立一個具有以下結構的 XML 檔：\n\n```xml\n<evaluation>\n  <qa_pair>\n    <question>Find discussions about AI model launches with animal codenames. One model needed a specific safety designation that uses the format ASL-X. What number X was being determined for the model named after a spotted wild cat?<\/question>\n    <answer>3<\/answer>\n  <\/qa_pair>\n<!-- More qa_pairs... -->\n<\/evaluation>\n```\n\n---\n\n# 參考檔案\n\n## 📚 文件庫\n\n在開發過程中視需要載入這些資源：\n\n### 核心 MCP 文件（最先載入）\n- **MCP 協定**：從 `https://modelcontextprotocol.io/sitemap.xml` 網站地圖開始，然後加上 `.md` 後綴抓取特定頁面\n- [📋 MCP 最佳實踐](./reference/mcp_best_practices.md) - 通用 MCP 準則，包括：\n  - 伺服器與工具的命名慣例\n  - 回應格式準則（JSON vs Markdown）\n  - 分頁最佳實踐\n  - 傳輸選擇（streamable HTTP vs stdio）\n  - 安全性與錯誤處理標準\n\n### SDK 文件（在第一/二階段載入）\n- **Python SDK**：從 `https://raw.githubusercontent.com/modelcontextprotocol/python-sdk/main/README.md` 抓取\n- **TypeScript SDK（v2）**：從 `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/main/README.md` 抓取；完整文件索引在 `https://ts.sdk.modelcontextprotocol.io/v2/llms.txt`\n- **TypeScript SDK（v1，僅限既有 v1 專案）**：從 `https://raw.githubusercontent.com/modelcontextprotocol/typescript-sdk/v1.x/README.md` 抓取\n\n### 各語言實作指南（在第二階段載入）\n- [🐍 Python 實作指南](./reference/python_mcp_server.md) - 完整的 Python/FastMCP 指南，包含：\n  - 伺服器初始化模式\n  - Pydantic 模型範例\n  - 以 `@mcp.tool` 註冊工具\n  - 完整可運作的範例\n  - 品質檢查清單\n\n- [⚡ TypeScript 實作指南（SDK v2）](./reference/node_mcp_server_v2.md) - 針對 `@modelcontextprotocol/server` 的完整 TypeScript 指南，包含：\n  - 專案設定與伺服器工廠\n  - 工具設計：Zod 4 schema、輸出格式、分頁、錯誤\n  - 同時提供 stdio 與 Streamable HTTP 的完整範例，以及 bearer 驗證\n  - 資源、提示詞與通知\n  - 驗證建置後伺服器的自我檢查腳本\n  - 進階功能的 SDK 範例連結\n  - v1 → v2 對照表、遷移步驟與品質檢查清單\n\n- [⚡ TypeScript 實作指南（SDK v1）](./reference/node_mcp_server.md) - 針對既有 `@modelcontextprotocol/sdk` 專案的對應指南\n\n### 評估指南（在第四階段載入）\n- [✅ 評估指南](./reference/evaluation.md) - 完整的評估建立指南，包含：\n  - 題目建立準則\n  - 答案驗證策略\n  - XML 格式規格\n  - 範例題目與答案\n  - 使用提供的腳本執行評估"}, {"rank": 38, "slug": "webapp-testing", "title": "Web 應用測試", "category": "瀏覽器與測試自動化", "tags": ["Playwright", "E2E 測試", "Python", "截圖", "Anthropic 官方"], "summary": "Anthropic 官方技能：用 Python Playwright 腳本測試本機網頁應用，內附可同時啟動前後端伺服器的輔助腳本，支援驗證前端功能、除錯 UI、截圖與讀取瀏覽器 console 日誌。", "usage": "- Claude Code：`/plugin marketplace add anthropics/skills` 後安裝 example-skills\n- 或 `npx skills add https://github.com/anthropics/skills --skill webapp-testing`\n- 說「幫我測試 localhost:5173 的登入流程並截圖」\n- 代理會先用 `with_server.py --help` 了解用法，以「先偵察 DOM、再執行動作」的模式撰寫腳本", "sites": ["Skills.sh", "Anthropic 官方", "Awesome Claude"], "repo": "anthropics/skills", "path": "skills/webapp-testing/SKILL.md", "github_url": "https://github.com/anthropics/skills/blob/main/skills/webapp-testing/SKILL.md", "skillssh_url": "https://skills.sh/anthropics/skills/webapp-testing", "skillssh_rank": 327, "installs": 191306, "license": "Apache-2.0", "redistributable": true, "description_en": "Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.", "description_zh": "使用 Playwright 與本機網頁應用程式互動並進行測試的工具組。支援驗證前端功能、除錯 UI 行為、擷取瀏覽器截圖，以及檢視瀏覽器日誌。", "original": "---\nname: webapp-testing\ndescription: Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.\nlicense: Complete terms in LICENSE.txt\n---\n\n# Web Application Testing\n\nTo test local web applications, write native Python Playwright scripts.\n\n**Helper Scripts Available**:\n- `scripts/with_server.py` - Manages server lifecycle (supports multiple servers)\n\n**Always run scripts with `--help` first** to see usage. DO NOT read the source until you try running the script first and find that a customized solution is abslutely necessary. These scripts can be very large and thus pollute your context window. They exist to be called directly as black-box scripts rather than ingested into your context window.\n\n## Decision Tree: Choosing Your Approach\n\n```\nUser task → Is it static HTML?\n    ├─ Yes → Read HTML file directly to identify selectors\n    │         ├─ Success → Write Playwright script using selectors\n    │         └─ Fails/Incomplete → Treat as dynamic (below)\n    │\n    └─ No (dynamic webapp) → Is the server already running?\n        ├─ No → Run: python scripts/with_server.py --help\n        │        Then use the helper + write simplified Playwright script\n        │\n        └─ Yes → Reconnaissance-then-action:\n            1. Navigate and wait for networkidle\n            2. Take screenshot or inspect DOM\n            3. Identify selectors from rendered state\n            4. Execute actions with discovered selectors\n```\n\n## Example: Using with_server.py\n\nTo start a server, run `--help` first, then use the helper:\n\n**Single server:**\n```bash\npython scripts/with_server.py --server \"npm run dev\" --port 5173 -- python your_automation.py\n```\n\n**Multiple servers (e.g., backend + frontend):**\n```bash\npython scripts/with_server.py \\\n  --server \"cd backend && python server.py\" --port 3000 \\\n  --server \"cd frontend && npm run dev\" --port 5173 \\\n  -- python your_automation.py\n```\n\nTo create an automation script, include only Playwright logic (servers are managed automatically):\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True) # Always launch chromium in headless mode\n    page = browser.new_page()\n    page.goto('http://localhost:5173') # Server already running and ready\n    page.wait_for_load_state('networkidle') # CRITICAL: Wait for JS to execute\n    # ... your automation logic\n    browser.close()\n```\n\n## Reconnaissance-Then-Action Pattern\n\n1. **Inspect rendered DOM**:\n   ```python\n   page.screenshot(path='/tmp/inspect.png', full_page=True)\n   content = page.content()\n   page.locator('button').all()\n   ```\n\n2. **Identify selectors** from inspection results\n\n3. **Execute actions** using discovered selectors\n\n## Common Pitfall\n\n❌ **Don't** inspect the DOM before waiting for `networkidle` on dynamic apps\n✅ **Do** wait for `page.wait_for_load_state('networkidle')` before inspection\n\n## Best Practices\n\n- **Use bundled scripts as black boxes** - To accomplish a task, consider whether one of the scripts available in `scripts/` can help. These scripts handle common, complex workflows reliably without cluttering the context window. Use `--help` to see usage, then invoke directly. \n- Use `sync_playwright()` for synchronous scripts\n- Always close the browser when done\n- Use descriptive selectors: `text=`, `role=`, CSS selectors, or IDs\n- Add appropriate waits: `page.wait_for_selector()` or `page.wait_for_timeout()`\n\n## Reference Files\n\n- **examples/** - Examples showing common patterns:\n  - `element_discovery.py` - Discovering buttons, links, and inputs on a page\n  - `static_html_automation.py` - Using file:// URLs for local HTML\n  - `console_logging.py` - Capturing console logs during automation", "translation": "---\nname: webapp-testing\ndescription: 使用 Playwright 與本機網頁應用程式互動並進行測試的工具組。支援驗證前端功能、除錯 UI 行為、擷取瀏覽器截圖，以及檢視瀏覽器日誌。\nlicense: 完整條款見 LICENSE.txt\n---\n\n# 網頁應用程式測試\n\n要測試本機網頁應用程式，請撰寫原生的 Python Playwright 腳本。\n\n**可用的輔助腳本**：\n- `scripts/with_server.py` — 管理伺服器生命週期（支援多個伺服器）\n\n**一律先以 `--help` 執行腳本**查看用法。在你先試著執行腳本、並發現確實絕對需要客製化方案之前，**不要**閱讀原始碼。這些腳本可能非常大，會汙染你的上下文視窗。它們的存在是為了被當成黑盒腳本直接呼叫，而不是被讀進你的上下文視窗。\n\n## 決策樹：選擇你的做法\n\n```\nUser task → Is it static HTML?\n    ├─ Yes → Read HTML file d
